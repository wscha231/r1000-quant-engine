# Tiered core tracking universe for recurring cross-sectional comparison.
#
# Purpose:
#   Preserve the user-defined 22-name comparison cohort across AI physical
#   infrastructure, defense, cyber resilience, power, semiconductors, and
#   diversifying healthcare/industrial businesses. Membership means "evaluate"
#   rather than "buy" and never bypasses normal data, liquidity, valuation,
#   relative-strength, regime, scoring, or risk gates.
#
# Tier semantics:
#   1 = weekly expectation-model competition
#   2 = conditional promotion candidates
#   3 = valuation/quality benchmarks and replacement candidates
#
# PIT safety:
#   Rows that enter only through this current curated overlay are latest-only.
#   They must not be projected backward into historical OOS months.

