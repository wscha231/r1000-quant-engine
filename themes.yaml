# themes.yaml — Cross-industry theme taxonomy (draft 2026-04-23)
#
# Themes are finer than GICS sector and cross-cut GICS industry boundaries.
# Each theme lists its member R1000 tickers. A ticker CAN belong to multiple
# themes (e.g. NVDA in both "ai_infrastructure" and "semi_design").
#
# Usage (future):
# - Engine computes theme-level momentum, breadth, RS, acceleration, drawdown
# - Theme exit signal when: breadth < 0.30 AND acceleration < 0
# - Per-ticker theme_leadership flag (is this the top-mom_6m name in the theme?)
# - Per-ticker theme_phase label (early / maturing / peaking / ending)
#
# Update this file manually as new themes emerge or members change.

