# cycle_play_universe.yaml — Curated small-mid cap cycle plays (NYSE/NASDAQ).
#
# Why a separate file (not in adr_universe.yaml):
#   - adr_universe.yaml is foreign-issuer ADR overlay (TSM, BABA, NVO, etc.)
#   - cycle_play_universe.yaml captures DOMESTIC small-mid cap cycle / disruption
#     plays that fall below the R1000 size threshold but have catalyst potential
#     (BE / PLUG / RIVN / ENPH / FCEL / etc.).
#
# Inclusion criteria (2026-04-29 v1):
#   - Listed on NYSE/NASDAQ (no OTC, no foreign)
#   - Daily dollar volume >= $30M (liquidity for paper-trading exits)
#   - Market cap range: $0.3B - $30B (excluded if already in R1000)
#   - Listed history >= 3 years (small-cap relax from R1000's 5y standard)
#   - Theme: clean energy / EV / AI mid-cap / memory-semi small / biotech /
#            fintech disruption / robotics
#
# Auto-refresh: tools/refresh_cycle_play_universe.py runs monthly via the
# .github/workflows/cycle_play_refresh.yml workflow. Names that grow into
# R1000 (mcap > $30B) auto-removed; new IPOs matching theme keywords auto-
# added; delisted names auto-removed. Manual edits to this file are
# preserved across refreshes via the `manual_pin: true` flag (per-entry).
#
# Data path expectation:
#   - Alpaca daily bars            ✅ all listed names
#   - Finnhub fundamentals          ⚠️  partial — small caps often miss EPS_TTM
#   - SEC EDGAR companyfacts        ⚠️  partial — newer companies may have
#                                       sparse history
#   - yfinance .info                ✅ fallback for forward_pe / pegRatio /
#                                       trailingEps via D1 multi-source cascade
#
# Universe modes (full_rebuild_manual.yml):
#   - r1000              R1000 only (production)
#   - r1000+adr          R1000 + 26 ADR (current research)
#   - r1000+adr+cycle    R1000 + 26 ADR + 36 cycle plays (Phase 15-D research)
#   - global_alpha_universe  Same as r1000+adr+cycle (alias)

