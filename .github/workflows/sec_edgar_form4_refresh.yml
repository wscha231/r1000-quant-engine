name: SEC EDGAR Form 4 Refresh

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated ticker watchlist for Form 4 polling'
        type: string
        default: 'SNDK,MU,AMD,ARM,ASML,INTC,WDC,STX,LITE,CIEN,NVDA,IONQ,RGTI,QBTS,ACHR,ASTS,RKLB,OKLO,SMR'
      max_tickers:
        description: 'Maximum tickers to poll. Use 0 with all_sec_tickers=true for a full SEC ticker-map shard.'
        type: string
        default: '80'
      lookback_years:
        description: 'Form 4 filing lookback years for PIT backfill'
        type: string
        default: '8'
      include_archive_files:
        description: 'Fetch older SEC submissions file shards for true multi-year backfill'
        type: boolean
        default: true
      all_sec_tickers:
        description: 'Ignore tickers input and poll the full SEC ticker map, usually with shard_count > 1'
        type: boolean
        default: false
      shard_index:
        description: 'Zero-based shard index for full SEC ticker-map backfills'
        type: string
        default: '0'
      shard_count:
        description: 'Total shard count for full SEC ticker-map backfills'
        type: string
        default: '1'
      required:
        description: 'Fail the workflow if EDGAR refresh fails'
        type: boolean
        default: false
  schedule:
    # Weekdays after US close with enough delay for EDGAR acceptance metadata.
    - cron: '30 22 * * 1-5'

permissions:
  contents: read

jobs:
  sec_form4_refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs data_raw/sec data_pit/sec manifests/sec_edgar
          if [ -z "$RCLONE_CONFIG_GDRIVE" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "[sec-edgar] no Google Drive auth configured; refresh will run local-only"
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -qo /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore SEC evidence lake from Google Drive
        env:
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          rclone copy "${BASE}data_raw/sec/" data_raw/sec/ --drive-acknowledge-abuse || true
          rclone copy "${BASE}data_pit/sec/" data_pit/sec/ --drive-acknowledge-abuse || true
          rclone copy "${BASE}manifests/sec_edgar/" manifests/sec_edgar/ || true

      - name: Collect and parse Form 4 filings
        env:
          SEC_USER_AGENT: "R1000InstitutionalBot (contact: andrewcha231@gmail.com)"
        run: |
          set -euo pipefail
          REQUIRED="${{ github.event.inputs.required || 'false' }}"
          START_DATE="$(python - <<'PY'
          from datetime import date
          years = int("${{ github.event.inputs.lookback_years || '8' }}")
          today = date.today()
          try:
              start = today.replace(year=today.year - years)
          except ValueError:
              start = today.replace(year=today.year - years, day=28)
          print(start.isoformat())
          PY
          )"
          ARCHIVE_FLAG=""
          if [ "${{ github.event.inputs.include_archive_files || 'true' }}" = "true" ]; then
            ARCHIVE_FLAG="--include-archive-files"
          fi
          ALL_FLAG=""
          TICKERS_ARG=(--tickers "${{ github.event.inputs.tickers || 'SNDK,MU,AMD,ARM,ASML,INTC,WDC,STX,LITE,CIEN,NVDA,IONQ,RGTI,QBTS,ACHR,ASTS,RKLB,OKLO,SMR' }}")
          if [ "${{ github.event.inputs.all_sec_tickers || 'false' }}" = "true" ]; then
            ALL_FLAG="--all-sec-tickers"
            TICKERS_ARG=(--tickers "")
          fi
          echo "[sec-edgar] start_date=$START_DATE include_archive_files=${{ github.event.inputs.include_archive_files || 'true' }} all_sec_tickers=${{ github.event.inputs.all_sec_tickers || 'false' }} shard=${{ github.event.inputs.shard_index || '0' }}/${{ github.event.inputs.shard_count || '1' }}"
          set +e
          python tools/run_sec_submissions_collector.py \
            "${TICKERS_ARG[@]}" \
            --max-tickers "${{ github.event.inputs.max_tickers || '80' }}" \
            --forms 4,4/A \
            --raw-root data_raw/sec \
            --pit-root data_pit/sec \
            --sec-user-agent "$SEC_USER_AGENT" \
            --start-date "$START_DATE" \
            --append-existing \
            --shard-index "${{ github.event.inputs.shard_index || '0' }}" \
            --shard-count "${{ github.event.inputs.shard_count || '1' }}" \
            $ARCHIVE_FLAG \
            $ALL_FLAG \
            2>&1 | tee outputs/full_rebuild_logs/sec_submissions_collector.log
          COLLECT_RC=${PIPESTATUS[0]}
          python tools/run_sec_form4_parser.py \
            --filings-index data_pit/sec/sec_filings_index.parquet \
            --raw-root data_raw/sec \
            --output data_pit/sec/form4_transactions.parquet \
            --sec-user-agent "$SEC_USER_AGENT" \
            --append-existing \
            --skip-existing-accessions \
            2>&1 | tee outputs/full_rebuild_logs/sec_form4_parser.log
          PARSE_RC=${PIPESTATUS[0]}
          python tools/run_sec_ownership_signals.py \
            --transactions data_pit/sec/form4_transactions.parquet \
            --pit-output data_pit/sec/sec_ownership_signals.parquet \
            --output-dir outputs/sec_ownership_signals \
            2>&1 | tee outputs/full_rebuild_logs/sec_ownership_signals.log
          SIGNAL_RC=${PIPESTATUS[0]}
          set -e
          if [ "$REQUIRED" = "true" ] && { [ "$COLLECT_RC" -ne 0 ] || [ "$PARSE_RC" -ne 0 ] || [ "$SIGNAL_RC" -ne 0 ]; }; then
            echo "[sec-edgar] required refresh failed collect=$COLLECT_RC parse=$PARSE_RC signal=$SIGNAL_RC"
            exit 1
          fi

      - name: Write SEC evidence manifest
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          paths = {
              "filings_index": Path("data_pit/sec/sec_filings_index.parquet"),
              "form4_transactions": Path("data_pit/sec/form4_transactions.parquet"),
              "sec_ownership_signals": Path("data_pit/sec/sec_ownership_signals.parquet"),
              "form4_latest": Path("outputs/sec_ownership_signals/form4_latest.csv"),
          }
          payload = {
              "schema_version": "sec-edgar-form4-refresh-v1",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": "${{ github.run_id }}",
              "head_sha": "${{ github.sha }}",
              "tickers": "${{ github.event.inputs.tickers || 'SNDK,MU,AMD,ARM,ASML,INTC,WDC,STX,LITE,CIEN,NVDA,IONQ,RGTI,QBTS,ACHR,ASTS,RKLB,OKLO,SMR' }}",
              "outputs": {name: {"path": str(path), "exists": path.exists(), "size_bytes": path.stat().st_size if path.exists() else 0} for name, path in paths.items()},
          }
          Path("manifests/sec_edgar").mkdir(parents=True, exist_ok=True)
          Path("manifests/sec_edgar/latest_form4_manifest.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Sync SEC evidence lake to Google Drive
        if: always()
        env:
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            echo "[sec-edgar] no Drive auth; skipping sync"
            exit 0
          fi
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          rclone copy data_raw/sec "${BASE}data_raw/sec/" --drive-acknowledge-abuse
          rclone copy data_pit/sec "${BASE}data_pit/sec/" --drive-acknowledge-abuse
          rclone copy manifests/sec_edgar "${BASE}manifests/sec_edgar/"
          rclone copy outputs/sec_ownership_signals "${BASE}research_runs/sec_edgar_form4/${GITHUB_RUN_ID}/sec_ownership_signals/"
          rclone copy outputs/full_rebuild_logs "${BASE}research_runs/sec_edgar_form4/${GITHUB_RUN_ID}/full_rebuild_logs/"

      - name: Upload SEC Form 4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-edgar-form4-refresh-${{ github.run_id }}
          path: |
            data_pit/sec/sec_filings_index.parquet
            data_pit/sec/form4_transactions.parquet
            data_pit/sec/sec_ownership_signals.parquet
            outputs/sec_ownership_signals/
            manifests/sec_edgar/latest_form4_manifest.json
            outputs/full_rebuild_logs/sec_*.log
          retention-days: 90
