name: Alpha Selector Challenger (Manual / Focused)

# Focused artifact-only challenger loop for CAGR/MDD research. This workflow is
# intentionally narrower than alphaops_replay_sidecars_manual.yml: it downloads
# a completed full rebuild artifact, refreshes the replay price cache for
# historical candidates, runs only alpha-selector/dynamic/shadow account-ledger
# challengers, and ranks them through the official goal-search/account
# evaluation reports. It does not run collector, model rebuild, or the broader
# operational reporting suite.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed full_rebuild_manual run id to replay from'
        type: string
        required: true
      cost_bps:
        description: 'Per-side transaction cost for broker ledger challengers'
        type: string
        default: '25'
      max_fill_lag_days:
        description: 'Max trading-day lag for next-close fills'
        type: string
        default: '7'
      candidate_max_total:
        description: 'Max unique historical candidate tickers to refresh'
        type: string
        default: '600'

permissions:
  contents: read
  actions: read

jobs:
  alpha_selector_challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: |
            cache_prices
            aggressive/cache/bars
          key: alpha-selector-price-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            replay-price-cache-${{ runner.os }}-
            collector-cache--${{ runner.os }}-
            collector-cache-${{ runner.os }}-

      - name: Download source full rebuild artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MAX_TOTAL: ${{ inputs.candidate_max_total }}
        run: |
          set -e
          for tool in tools/build_replay_price_cache.py tools/run_alpha_selector_broker_grid.py tools/run_alpha_selector_dynamic_regime_grid.py tools/run_alpha_selector_shadow_drawdown_grid.py tools/run_portfolio_goal_search.py tools/run_account_evaluation.py; do
            if [ ! -f "$tool" ]; then
              echo "[alpha-selector] ERROR: missing $tool. Run this workflow from a branch that contains the focused challenger tools."
              exit 4
            fi
          done
          mkdir -p source_artifacts outputs/full_rebuild_logs
          gh run download "${{ inputs.source_run_id }}" --repo "$GITHUB_REPOSITORY" --dir source_artifacts
          SRC="$(find source_artifacts -type f -name backtest_metrics.json -print -quit | xargs -r dirname)"
          if [ -z "$SRC" ]; then
            echo "[alpha-selector] ERROR: could not locate backtest_metrics.json in source artifacts"
            find source_artifacts -maxdepth 3 -type f | head -100
            exit 2
          fi
          echo "[alpha-selector] source=$SRC"
          cp -R "$SRC"/. outputs/
          test -s outputs/reports/candidate_replay_book.csv
          python tools/build_replay_price_cache.py \
            --books outputs/reports/main_monthly_weights.csv outputs/reports/concentrated_strategy_holdings.csv \
            --scored outputs/scored_latest.csv \
            --candidate-books outputs/reports/candidate_replay_book.csv \
            --candidate-max-per-date 20 \
            --candidate-max-total "$CANDIDATE_MAX_TOTAL" \
            --extra-tickers QQQ SPY '^IXIC' '^GSPC' \
            --max-scored 250 \
            --output-dir cache_prices \
            --batch-size 40 \
            --refresh-stale-days 2

      - name: Run focused alpha selector challengers
        env:
          COST_BPS: ${{ inputs.cost_bps }}
          MAX_FILL_LAG_DAYS: ${{ inputs.max_fill_lag_days }}
        run: |
          set -e
          set -o pipefail
          python tools/run_alpha_selector_broker_grid.py --candidate-book outputs/reports/candidate_replay_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/alpha_selector_broker_grid/main --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" --target-ns 2,3,5 --single-name-caps 0.25,0.50 --styles rs_heavy,monster_heavy --max-variants 12 2>&1 | tee outputs/full_rebuild_logs/alpha_selector_broker_grid_main.log
          python tools/run_alpha_selector_broker_grid.py --candidate-book outputs/reports/candidate_replay_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/alpha_selector_broker_grid/concentrated --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" --target-ns 2,3,5 --single-name-caps 0.25,0.50 --styles rs_heavy,monster_heavy --max-variants 12 2>&1 | tee outputs/full_rebuild_logs/alpha_selector_broker_grid_concentrated.log
          python tools/run_alpha_selector_dynamic_regime_grid.py --candidate-book outputs/reports/candidate_replay_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/alpha_selector_dynamic_regime_grid/main --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" --max-variants 12 2>&1 | tee outputs/full_rebuild_logs/alpha_selector_dynamic_regime_grid_main.log || true
          python tools/run_alpha_selector_dynamic_regime_grid.py --candidate-book outputs/reports/candidate_replay_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/alpha_selector_dynamic_regime_grid/concentrated --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" --max-variants 12 2>&1 | tee outputs/full_rebuild_logs/alpha_selector_dynamic_regime_grid_concentrated.log || true
          python tools/run_alpha_selector_shadow_drawdown_grid.py --alpha-selector-dir outputs/alpha_selector_broker_grid/main --price-cache cache_prices --portfolio-kind main --output-dir outputs/alpha_selector_shadow_drawdown_grid/main --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" --top-variants 1 2>&1 | tee outputs/full_rebuild_logs/alpha_selector_shadow_drawdown_grid_main.log || true
          python tools/run_alpha_selector_shadow_drawdown_grid.py --alpha-selector-dir outputs/alpha_selector_broker_grid/concentrated --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/alpha_selector_shadow_drawdown_grid/concentrated --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" --top-variants 1 2>&1 | tee outputs/full_rebuild_logs/alpha_selector_shadow_drawdown_grid_concentrated.log || true
          python tools/run_portfolio_goal_search.py --latest-run outputs 2>&1 | tee outputs/full_rebuild_logs/portfolio_goal_search.log
          python tools/run_account_evaluation.py --latest-run outputs --output-dir outputs/account_evaluation 2>&1 | tee outputs/full_rebuild_logs/account_evaluation.log

      - name: Upload focused alpha selector artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-selector-challenger-${{ inputs.source_run_id }}-${{ github.run_id }}
          path: |
            cache_prices/replay_price_cache_manifest.json
            outputs/reports/candidate_replay_book.csv
            outputs/alpha_selector_broker_grid/
            outputs/alpha_selector_dynamic_regime_grid/
            outputs/alpha_selector_shadow_drawdown_grid/
            outputs/portfolio_goal_search/
            outputs/account_evaluation/
            outputs/full_rebuild_logs/
          retention-days: 14

      - name: Sync focused outputs to Google Drive
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          set -e
          if [ -z "$RCLONE_CONFIG_GDRIVE" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "[gdrive-sync] no rclone auth configured; skipping"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -qo /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          BRANCH_NAME="${GITHUB_REF_NAME:-manual}"
          SAFE_BRANCH="$(printf '%s' "$BRANCH_NAME" | tr '/ ' '__')"
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            DEST="gdrive:research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/alpha_selector_challenger"
          else
            DEST="gdrive:${GDRIVE_FOLDER_NAME}/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/alpha_selector_challenger"
          fi
          for d in alpha_selector_broker_grid alpha_selector_dynamic_regime_grid alpha_selector_shadow_drawdown_grid portfolio_goal_search account_evaluation full_rebuild_logs; do
            if [ -d "outputs/$d" ]; then
              rclone copy "outputs/$d" "$DEST/$d/"
            fi
          done
          cat > outputs/alpha_selector_challenger_gdrive_manifest.json <<EOF
          {"source_run_id":"${{ inputs.source_run_id }}","dest":"$DEST","branch":"$BRANCH_NAME","run_id":"$GITHUB_RUN_ID"}
          EOF
          rclone copy outputs/alpha_selector_challenger_gdrive_manifest.json "$DEST/"
          echo "[gdrive-sync] focused alpha selector outputs copied to $DEST"
