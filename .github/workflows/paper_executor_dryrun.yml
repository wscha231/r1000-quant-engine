name: Paper Executor (Dry-Run / Execute)

# Runs r1000_paper_executor.py on the chosen advisor with full Layer 3
# regime pre-flight. Default DRY-RUN; --execute requires explicit
# workflow_dispatch input.
#
# Schedules (KST):
#   Mon-Fri 23:30 KST = weekday 14:30 UTC — daily dry-run after US close
#                                            (4:00pm EST = 21:00 UTC; 90min
#                                            buffer for data settle)
#   Sat 15:00 KST     = Saturday  06:00 UTC — weekend review run
#
# All schedule runs are DRY-RUN. To go LIVE, manual workflow_dispatch with
# execute=true. Daily dry-run lets user review regime + plan via Telegram
# alert + artifact each weekday morning, then decide whether to fire --execute.
#
# Manual trigger: GitHub UI -> Actions -> Paper Executor -> Run workflow
#   advisor:  v1 / v3 / v4 / concentrated / core   (default v3)
#   execute:  false (default) / true               (live paper trade)
#   override_regime_halt: false / true             (bypass VIX>=30 gate)

on:
  schedule:
    - cron: '30 14 * * 1-5'  # Mon-Fri 14:30 UTC = 23:30 KST (after US close)
    - cron: '0 6 * * 6'      # Saturday 06:00 UTC = 15:00 KST (weekend review)
  workflow_dispatch:
    inputs:
      advisor:
        description: 'advisor to use (concentrated = recommended, 33% CAGR validated)'
        type: choice
        options:
          - v3
          - concentrated
          - core
          - v1
          - v4
        default: v3
      execute:
        description: 'place LIVE paper orders (default: dry-run only)'
        type: boolean
        default: false
      override_regime_halt:
        description: 'bypass Layer 3 HALT_NEW (VIX>=30) when --execute'
        type: boolean
        default: false

permissions:
  contents: write   # commit run summary to cloud_results/

jobs:
  paper_executor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore Alpaca bar cache
        uses: actions/cache@v4
        with:
          path: aggressive/cache/bars
          key: alpaca-bars-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpaca-bars-${{ runner.os }}-

      - name: Smoke test (regression guard)
        run: |
          python tests/smoke_test.py

      - name: Audit feature leakage (no-runtime)
        run: |
          python tests/audit_features.py --no-runtime

      - name: Show regime snapshot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python r1000_regime_data.py --no-cache | tee outputs/regime_snapshot.txt

      - name: Run paper executor
        id: run_paper
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          # Build CLI flags from inputs (workflow_dispatch) or defaults (schedule)
          ADVISOR="${{ github.event.inputs.advisor }}"
          ADVISOR="${ADVISOR:-v3}"
          EXECUTE_FLAG=""
          if [ "${{ github.event.inputs.execute }}" = "true" ]; then
            EXECUTE_FLAG="--execute --confirm"
          fi
          OVERRIDE_FLAG=""
          if [ "${{ github.event.inputs.override_regime_halt }}" = "true" ]; then
            OVERRIDE_FLAG="--override-regime-halt"
          fi
          DEPRECATED_FLAG=""
          if [ "$ADVISOR" = "v4" ]; then
            DEPRECATED_FLAG="--allow-deprecated-v4"
          fi

          mkdir -p outputs/paper_runs
          OUT="outputs/paper_runs/$(date +%Y%m%d_%H%M%S)_${ADVISOR}.log"
          echo "Running: advisor=$ADVISOR execute=${{ github.event.inputs.execute }} override=${{ github.event.inputs.override_regime_halt }}"

          set +e
          python r1000_paper_executor.py \
            --advisor "$ADVISOR" \
            $EXECUTE_FLAG \
            $OVERRIDE_FLAG \
            $DEPRECATED_FLAG \
            2>&1 | tee "$OUT"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "advisor=$ADVISOR" >> $GITHUB_OUTPUT
          echo "log_path=$OUT" >> $GITHUB_OUTPUT
          echo "exit_status=$STATUS" >> $GITHUB_OUTPUT
          exit $STATUS

      - name: Layer 4 swap suggestions (informational)
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          # Only run if scored_unified.csv is in repo (committed by user)
          if [ -f outputs/scored_unified.csv ] && [ -f outputs/portfolio_latest.csv ]; then
            python r1000_layer4_swap.py \
              --portfolio outputs/portfolio_latest.csv \
              --scored-csv outputs/scored_unified.csv \
              | tee outputs/paper_runs/layer4_$(date +%Y%m%d_%H%M%S).log
          else
            echo "[layer4] skipped — needs outputs/scored_unified.csv + outputs/portfolio_latest.csv in repo"
          fi

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-run-${{ github.run_id }}
          path: |
            outputs/paper_runs/
            outputs/regime_snapshot.txt
          retention-days: 90

      - name: Telegram alert
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "[telegram] secrets not set, skipping"
            exit 0
          fi
          STATUS="${{ job.status }}"
          ADVISOR="${{ github.event.inputs.advisor }}"
          ADVISOR="${ADVISOR:-v3}"
          MODE="DRY-RUN"
          if [ "${{ github.event.inputs.execute }}" = "true" ]; then
            MODE="LIVE"
          fi
          MSG="r1000 paper_executor [${MODE}] advisor=${ADVISOR} status=${STATUS}%0A"
          MSG+="run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "disable_web_page_preview=true" \
            > /dev/null || echo "[telegram] notification failed"

      - name: Commit run summary
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          mkdir -p cloud_results/paper_runs
          # Copy latest run log into permanent record
          if ls outputs/paper_runs/*.log 2>/dev/null | grep -q .; then
            cp -r outputs/paper_runs/* cloud_results/paper_runs/ 2>/dev/null || true
          fi
          if [ -f outputs/regime_snapshot.txt ]; then
            cp outputs/regime_snapshot.txt cloud_results/paper_runs/latest_regime.txt
          fi
          git add cloud_results/paper_runs/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): paper run $(date +%Y-%m-%d_%H%M) [skip ci]"
          git push || true
