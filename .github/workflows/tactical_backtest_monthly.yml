name: Tactical Sleeve Backtest (Monthly)

# Phase 17 v3 Layer 15 (2026-04-29) — monthly verification that the
# weekly tactical 5-name strategy still produces alpha vs SPY.
#
# Runs r1000_tactical_backtest.py against the latest scored_history
# parquet (downloaded from cloud_results/ if present) and posts the
# CAGR / Sharpe / MaxDD / hit_rate metrics. Telegram alerts on
# regression so the sleeve gets ungated immediately if alpha decays.

on:
  schedule:
    # 16th of each month, 03:00 UTC = 12:00 KST (right after monthly cycle settle)
    - cron: '0 3 16 * *'
  workflow_dispatch:
    inputs:
      top_n:
        description: 'top-N picks per week'
        type: string
        default: '5'
      start:
        description: 'backtest start date (YYYY-MM-DD)'
        type: string
        default: ''
      history_path:
        description: 'override path to scored_history parquet'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Smoke pre-flight
        run: python tests/smoke_test.py --quick

      - name: Locate scored_history
        id: locate
        run: |
          OVERRIDE="${{ github.event.inputs.history_path }}"
          if [ -n "$OVERRIDE" ] && [ -f "$OVERRIDE" ]; then
            echo "path=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for p in \
            outputs/scored_history.parquet \
            cloud_results/scored_history.parquet \
            cloud_results/quick/scored_history.parquet \
            cloud_results/full/scored_history.parquet
          do
            if [ -f "$p" ]; then
              echo "[locate] found $p"
              echo "path=$p" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "[locate] no scored_history found — backtest will report rc=2"
          echo "path=" >> "$GITHUB_OUTPUT"

      - name: Run tactical backtest
        id: backtest
        if: steps.locate.outputs.path != ''
        run: |
          mkdir -p outputs/tactical_backtest
          ARGS="--top-n ${{ github.event.inputs.top_n || '5' }} --history ${{ steps.locate.outputs.path }}"
          START="${{ github.event.inputs.start }}"
          if [ -n "$START" ]; then
            ARGS="$ARGS --start $START"
          fi
          python r1000_tactical_backtest.py $ARGS

      - name: Telegram regression alert
        if: steps.backtest.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, pathlib
          p = pathlib.Path("outputs/tactical_backtest/metrics.json")
          if not p.exists():
              print("no metrics.json; skipping alert")
              raise SystemExit(0)
          m = json.loads(p.read_text())
          tok = os.getenv("TELEGRAM_BOT_TOKEN")
          chat = os.getenv("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              print("no telegram creds; skipping")
              raise SystemExit(0)
          regress = (m.get("cagr") or 0) < 0 or (m.get("beat_spy_rate") or 0) < 0.45
          tag = "REGRESS" if regress else "OK"
          msg = (
              f"[tactical-bt {tag}]\n"
              f"periods: {m.get('n_periods')} ({m.get('cadence')})\n"
              f"CAGR: {m.get('cagr')}\n"
              f"Sharpe: {m.get('sharpe')}\n"
              f"MaxDD: {m.get('max_dd')}\n"
              f"hit_rate: {m.get('hit_rate')}\n"
              f"beat_spy_rate: {m.get('beat_spy_rate')}\n"
          )
          url = f"https://api.telegram.org/bot{tok}/sendMessage"
          data = urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=15).read()
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactical-bt-${{ github.run_id }}
          path: outputs/tactical_backtest/
          retention-days: 365

      - name: Stage snapshot for commit
        if: always()
        run: |
          mkdir -p cloud_results/tactical_backtest
          cp -v outputs/tactical_backtest/metrics.json cloud_results/tactical_backtest/ 2>/dev/null || true
          cp -v outputs/tactical_backtest/weekly_returns.csv cloud_results/tactical_backtest/ 2>/dev/null || true

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          git add cloud_results/tactical_backtest/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): tactical backtest $(date +%Y-%m) [skip ci]"
          for i in 1 2 3 4; do
            if git push; then
              break
            fi
            sleep $((2 ** i))
          done
