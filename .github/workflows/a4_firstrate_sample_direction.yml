name: A4 FirstRate Sample Direction

on:
  schedule:
    # Tue-Sat UTC corresponds to the preceding Mon-Fri US session.
    - cron: '47 8 * * 2-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a4-firstrate-sample-direction
  cancel-in-progress: false

jobs:
  direction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install A4 dependencies
        run: python -m pip install -r requirements_github.txt
      - name: Evaluate the public sample pair
        env:
          RUN_EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [ "$RUN_EVENT" = schedule ]; then args+=(--scheduled); fi
          python -B -m tools.a4_firstrate_sample_direction "${args[@]}"
