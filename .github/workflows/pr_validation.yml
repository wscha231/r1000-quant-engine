name: PR Validation (Fast)

# Tier 1 validator: complete registered code-level smoke test inventory.
# Runs automatically on pull requests (and manual dispatch) so code
# changes get rapid feedback without waiting on a
# manual full rebuild (Tier 3, 2-6 h).
#
# Covers:
#   * Syntax / import errors via individual smoke-test imports.
#   * Test topology regressions (regression.workflow_topology_consolidated
#     and the other guards inside tests/smoke_test.py).
#   * Broker-ledger replay smoke (ledger correctness, position risk,
#     execution policy, crisis reentry).
#   * Target book builders (operating, event, weekly leader).
#   * Portfolio system guard and operating event backtest smokes.
#   * Auto-learning evidence + v2 smokes.
#   * Static leakage audit (tests/audit_features.py --no-runtime).
#   * Workflow artifact wiring smoke.
#
# Does NOT cover:
#   * Real-data sidecar metric verification — use
#     alphaops_replay_sidecars_manual.yml (Tier 2, ~10-30 min) with a
#     completed full_rebuild source_run_id.
#   * 84-month broker-ledger metric regeneration — use
#     full_rebuild_manual.yml (Tier 3, ~2-6 h).
#
# Every registered program runs once across four isolated checkouts. Keep a
# 90-minute fail-safe per shard and require every shard in the validate gate.
# Runtime includes sparse checkout and dependency setup. Add new
# critical smoke tests to tools/run_pr_validation.py's DEFAULT_TESTS so
# both this workflow and the local runner stay in sync.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation_shards:
    name: validate-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The next step deepens commit/tree history until every frozen P0-4
          # audit commit is connected. Historical blobs remain filtered out.
          fetch-depth: 1
          # Historical/runtime artifacts are not Tier-1 inputs. The small
          # checksum-locked fixture under tests/ is the canonical baseline.
          sparse-checkout: |
            .github
            aggressive
            auto_learning_v2
            backtest_results
            data_static
            docs
            outputs
            outputs_advisor
            outputs_advisor_v2
            outputs_advisor_v3
            outputs_advisor_v4
            reports
            research
            tests
            tools
          sparse-checkout-cone-mode: true

      - name: Connect frozen audit lineage without historical blobs
        shell: bash
        run: |
          set -euo pipefail
          frozen=(
            0f34de9a2747059b7bb808cb070a86261e119f95
            bf3e643efdc083ea5f43047aac04664e0a555f6b
            f7fadfa4e7814c6453bf96ebf3a1ff4d39eadfae
          )
          while true; do
            connected=yes
            for commit in "${frozen[@]}"; do
              if ! git merge-base --is-ancestor "$commit" HEAD 2>/dev/null; then
                connected=no
              fi
            done
            # On pull_request events HEAD is a synthetic merge commit. The
            # baseline may be reachable through its base parent while the
            # publication is reachable only through the PR parent, without
            # their direct ancestry being present in a shallow clone.
            if ! git merge-base --is-ancestor "${frozen[0]}" "${frozen[2]}" 2>/dev/null; then
              connected=no
            fi
            [ "$connected" = yes ] && break
            if [ "$(git rev-parse --is-shallow-repository)" != "true" ]; then
              echo "frozen P0-4 audit lineage is not an ancestor of HEAD" >&2
              exit 1
            fi
            git fetch --no-tags --filter=blob:none --deepen=64 origin "$GITHUB_REF"
          done

      - name: Fetch P0-3 frozen audit commit
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 916a02ac0612d64d41f71690cf667a90dfd0531a
          git cat-file -e '916a02ac0612d64d41f71690cf667a90dfd0531a^{commit}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Fetch U0 historical PR evidence refs
        shell: bash
        run: |
          base_refspec="$(
            python tools/audit_run287_u0_experiment_inventory.py \
              --print-base-refspec
          )"
          test -n "$base_refspec"
          git fetch --no-tags --depth=500 origin "$base_refspec"
          mapfile -t refspecs < <(
            python tools/audit_run287_u0_experiment_inventory.py \
              --print-fetch-refspecs
          )
          test "${#refspecs[@]}" -gt 0
          git fetch --no-tags --depth=1 origin "${refspecs[@]}"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt
          pip install -r docs/run287_p0_3_authority_census/requirements.txt

      - name: Reject new large or dated runtime artifacts
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python tests/pr_artifact_scope_smoke.py
          base_sha="$(python tools/resolve_pr_merge_base.py --event-base "$EVENT_BASE_SHA" --event-head "$EVENT_HEAD_SHA")"
          python tools/check_run287_artifact_hygiene.py --base-ref "$base_sha"

      - name: Run Tier-1 PR validation
        run: python tools/run_pr_validation.py --shard-index ${{ matrix.shard }} --shard-count 4

  # Preserve the required check name. A skipped/cancelled/failed shard must
  # never become a successful required check through a skipped dependency.
  validate:
    if: ${{ always() }}
    needs: [validation_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation shard
        env:
          SHARD_RESULT: ${{ needs.validation_shards.result }}
        run: test "$SHARD_RESULT" = success
