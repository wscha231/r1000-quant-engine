name: PR Validation (Fast)

# Tier 1 validator: ~2-3 minute code-level smoke test runner.
# Runs automatically on pull requests (and manual dispatch) so code
# changes get rapid feedback without waiting on a
# manual full rebuild (Tier 3, 2-6 h).
#
# Covers:
#   * Syntax / import errors via individual smoke-test imports.
#   * Test topology regressions (regression.workflow_topology_consolidated
#     and the other guards inside tests/smoke_test.py).
#   * Broker-ledger replay smoke (ledger correctness, position risk,
#     execution policy, crisis reentry).
#   * Target book builders (operating, event, weekly leader).
#   * Portfolio system guard and operating event backtest smokes.
#   * Auto-learning evidence + v2 smokes.
#   * Static leakage audit (tests/audit_features.py --no-runtime).
#   * Workflow artifact wiring smoke.
#
# Does NOT cover:
#   * Real-data sidecar metric verification — use
#     alphaops_replay_sidecars_manual.yml (Tier 2, ~10-30 min) with a
#     completed full_rebuild source_run_id.
#   * 84-month broker-ledger metric regeneration — use
#     full_rebuild_manual.yml (Tier 3, ~2-6 h).
#
# Runtime target: < 85 minutes on the free GitHub runner. The complete
# authority-graph suite runs in parallel with the remaining Tier-1 tests, and
# the final validate job requires both lanes to succeed.
# Add new critical smoke tests to tools/run_pr_validation.py's DEFAULT_TESTS so
# both this workflow and the local runner stay in sync.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Historical/runtime artifacts are not Tier-1 inputs. The small
          # checksum-locked fixture under tests/ is the canonical baseline.
          sparse-checkout: |
            .github
            aggressive
            auto_learning_v2
            backtest_results
            data_static
            docs
            outputs
            outputs_advisor
            outputs_advisor_v2
            outputs_advisor_v3
            outputs_advisor_v4
            reports
            research
            tests
            tools
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Fetch U0 historical PR evidence refs
        shell: bash
        run: |
          base_refspec="$(
            python tools/audit_run287_u0_experiment_inventory.py \
              --print-base-refspec
          )"
          test -n "$base_refspec"
          git fetch --no-tags --depth=500 origin "$base_refspec"
          mapfile -t refspecs < <(
            python tools/audit_run287_u0_experiment_inventory.py \
              --print-fetch-refspecs
          )
          test "${#refspecs[@]}" -gt 0
          git fetch --no-tags --depth=1 origin "${refspecs[@]}"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Reject new large or dated runtime artifacts
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          python tools/check_run287_artifact_hygiene.py --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Run Tier-1 PR validation
        run: >-
          python tools/run_pr_validation.py
          --exclude run287_dynamic_portfolio_call_path_smoke

  authority_validate_0:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install authority-audit dependency
        run: pip install 'pyyaml>=6.0'

      - name: Run authority-graph regression shard
        env:
          RUN287_AUTHORITY_SHARD_INDEX: '0'
          RUN287_AUTHORITY_SHARD_COUNT: '8'
        run: >-
          python tools/run_pr_validation.py
          --only run287_dynamic_portfolio_call_path_smoke

  authority_validate_1:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authority-audit dependency
        run: pip install 'pyyaml>=6.0'
      - name: Run authority-graph regression shard
        env:
          RUN287_AUTHORITY_SHARD_INDEX: '1'
          RUN287_AUTHORITY_SHARD_COUNT: '8'
        run: >-
          python tools/run_pr_validation.py
          --only run287_dynamic_portfolio_call_path_smoke

  authority_validate_2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authority-audit dependency
        run: pip install 'pyyaml>=6.0'
      - name: Run authority-graph regression shard
        env:
          RUN287_AUTHORITY_SHARD_INDEX: '2'
          RUN287_AUTHORITY_SHARD_COUNT: '8'
        run: >-
          python tools/run_pr_validation.py
          --only run287_dynamic_portfolio_call_path_smoke

  authority_validate_3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authority-audit dependency
        run: pip install 'pyyaml>=6.0'
      - name: Run authority-graph regression shard
        env:
          RUN287_AUTHORITY_SHARD_INDEX: '3'
          RUN287_AUTHORITY_SHARD_COUNT: '8'
        run: >-
          python tools/run_pr_validation.py
          --only run287_dynamic_portfolio_call_path_smoke

  authority_validate_4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authority-audit dependency
        run: pip install 'pyyaml>=6.0'
      - name: Run authority-graph regression shard
        env:
          RUN287_AUTHORITY_SHARD_INDEX: '4'
          RUN287_AUTHORITY_SHARD_COUNT: '8'
        run: >-
          python tools/run_pr_validation.py
          --only run287_dynamic_portfolio_call_path_smoke

  authority_validate_5:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authority-audit dependency
        run: pip install 'pyyaml>=6.0'
      - name: Run authority-graph regression shard
        env:
          RUN287_AUTHORITY_SHARD_INDEX: '5'
          RUN287_AUTHORITY_SHARD_COUNT: '8'
        run: >-
          python tools/run_pr_validation.py
          --only run287_dynamic_portfolio_call_path_smoke

  authority_validate_6:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authority-audit dependency
        run: pip install 'pyyaml>=6.0'
      - name: Run authority-graph regression shard
        env:
          RUN287_AUTHORITY_SHARD_INDEX: '6'
          RUN287_AUTHORITY_SHARD_COUNT: '8'
        run: >-
          python tools/run_pr_validation.py
          --only run287_dynamic_portfolio_call_path_smoke

  authority_validate_7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authority-audit dependency
        run: pip install 'pyyaml>=6.0'
      - name: Run authority-graph regression shard
        env:
          RUN287_AUTHORITY_SHARD_INDEX: '7'
          RUN287_AUTHORITY_SHARD_COUNT: '8'
        run: >-
          python tools/run_pr_validation.py
          --only run287_dynamic_portfolio_call_path_smoke

  validate:
    if: ${{ always() }}
    needs:
      - fast_validate
      - authority_validate_0
      - authority_validate_1
      - authority_validate_2
      - authority_validate_3
      - authority_validate_4
      - authority_validate_5
      - authority_validate_6
      - authority_validate_7
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both validation lanes
        env:
          FAST_RESULT: ${{ needs.fast_validate.result }}
          AUTHORITY_0_RESULT: ${{ needs.authority_validate_0.result }}
          AUTHORITY_1_RESULT: ${{ needs.authority_validate_1.result }}
          AUTHORITY_2_RESULT: ${{ needs.authority_validate_2.result }}
          AUTHORITY_3_RESULT: ${{ needs.authority_validate_3.result }}
          AUTHORITY_4_RESULT: ${{ needs.authority_validate_4.result }}
          AUTHORITY_5_RESULT: ${{ needs.authority_validate_5.result }}
          AUTHORITY_6_RESULT: ${{ needs.authority_validate_6.result }}
          AUTHORITY_7_RESULT: ${{ needs.authority_validate_7.result }}
        run: |
          test "$FAST_RESULT" = "success"
          test "$AUTHORITY_0_RESULT" = "success"
          test "$AUTHORITY_1_RESULT" = "success"
          test "$AUTHORITY_2_RESULT" = "success"
          test "$AUTHORITY_3_RESULT" = "success"
          test "$AUTHORITY_4_RESULT" = "success"
          test "$AUTHORITY_5_RESULT" = "success"
          test "$AUTHORITY_6_RESULT" = "success"
          test "$AUTHORITY_7_RESULT" = "success"
