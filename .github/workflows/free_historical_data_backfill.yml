name: Free Historical Data Backfill

on:
  workflow_dispatch:
    inputs:
      listing_status:
        description: 'Collect Alpha Vantage active/delisted listing lifecycle reference data'
        type: boolean
        default: true
      fmp_earnings_calendar:
        description: 'Collect FMP earnings calendar history as vendor snapshot, not PIT revision history'
        type: boolean
        default: true
      fmp_earnings_start:
        description: 'Start date for FMP earnings calendar history'
        type: string
        default: '2016-01-01'
      fmp_earnings_end:
        description: 'End date for FMP earnings calendar history; blank = today'
        type: string
        default: ''
      fmp_max_chunks:
        description: 'Safety cap for FMP calendar chunks; 0 = all'
        type: string
        default: '0'
      universe_file:
        description: 'Optional ticker CSV for per-ticker coverage audit'
        type: string
        default: ''
      latest_run:
        description: 'Optional latest run mirror for per-ticker coverage audit'
        type: string
        default: cloud_results/full_rebuild/latest_global_alpha_universe
      sync_to_gdrive:
        description: 'Restore/sync durable data paths with Google Drive when auth is configured'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: free-historical-data-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore GitHub cache
        uses: actions/cache@v4
        with:
          path: |
            data_raw/free
            data_pit/free
            data_pit/events
            data
          key: free-historical-data-backfill-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            free-historical-data-backfill-${{ runner.os }}-
            free-data-daily-${{ runner.os }}-
            earnings-estimates-daily-${{ runner.os }}-

      - name: Configure rclone
        if: ${{ inputs.sync_to_gdrive }}
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[gdrive] no auth configured; continuing cache/artifact only"
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore durable free history from Google Drive
        if: ${{ inputs.sync_to_gdrive }}
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          for d in data_raw/free data_pit/free data_pit/events data manifests/free_data; do
            mkdir -p "$d"
            if rclone lsf "$BASE$d" >/dev/null 2>&1; then
              rclone copy "$BASE$d" "$d/"
            fi
          done

      - name: Run historical free-data collectors
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p outputs/free_historical_data_backfill data_raw/free data_pit/free data_pit/events
          if [ "${{ inputs.listing_status }}" = "true" ]; then
            python tools/collect_alphavantage_listing_status.py \
              --raw-dir data_raw/free/alpha_vantage/listing_status \
              --output data_pit/free/av_listing_status.parquet \
              --summary outputs/free_historical_data_backfill/listing_status_summary.json
          fi
          if [ "${{ inputs.fmp_earnings_calendar }}" = "true" ]; then
            ARGS=(--start "${{ inputs.fmp_earnings_start }}" --max-chunks "${{ inputs.fmp_max_chunks }}")
            if [ -n "${{ inputs.fmp_earnings_end }}" ]; then
              ARGS+=(--end "${{ inputs.fmp_earnings_end }}")
            fi
            python tools/collect_fmp_earnings_calendar_history.py \
              "${ARGS[@]}" \
              --raw-dir data_raw/free/fmp/earnings_calendar \
              --output data_pit/events/earnings_calendar_history.parquet \
              --summary outputs/free_historical_data_backfill/fmp_earnings_calendar_summary.json
          fi

      - name: Catalog and audit coverage
        if: always()
        run: |
          set -euo pipefail
          python tools/build_data_catalog.py --output data/catalog.json --print-summary
          ARGS=(--latest-run "${{ inputs.latest_run }}" --output-dir outputs/free_historical_data_coverage)
          if [ -n "${{ inputs.universe_file }}" ]; then
            ARGS+=(--universe-file "${{ inputs.universe_file }}")
          fi
          python tools/audit_free_historical_data_coverage.py "${ARGS[@]}"

      - name: Upload historical backfill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-historical-data-backfill-${{ github.run_id }}
          path: |
            outputs/free_historical_data_backfill/
            outputs/free_historical_data_coverage/
            data/catalog.json
            data_pit/free/av_listing_status.parquet
            data_pit/events/earnings_calendar_history.parquet
          retention-days: 90

      - name: Sync historical backfill to Google Drive
        if: ${{ always() && inputs.sync_to_gdrive }}
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-manual}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          for d in data_raw/free data_pit/free data_pit/events data; do
            if [ -e "$d" ]; then
              rclone copy "$d" "$BASE$d/"
            fi
          done
          rclone copy outputs/free_historical_data_backfill "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/free_historical_data_backfill/"
          rclone copy outputs/free_historical_data_coverage "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/free_historical_data_coverage/"
