name: Aggressive Lab (Manual / Report-Only)

on:
  workflow_dispatch:
    inputs:
      experiment_ids:
        description: 'Comma-separated experiment IDs. Stage 1 supports E0_baseline_latest.'
        type: string
        default: 'E0_baseline_latest'
      baseline_run:
        description: 'Baseline artifact directory to normalize.'
        type: string
        default: 'cloud_results/full_rebuild/latest_global_alpha_universe'
      run_regression_attribution:
        description: 'Generate 20260430 vs latest attribution report.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  aggressive_lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0"

      - name: Regression attribution
        if: ${{ inputs.run_regression_attribution }}
        run: |
          python tools/regression_attribution.py

      - name: Run aggressive lab experiments
        run: |
          IFS=',' read -ra IDS <<< "${{ inputs.experiment_ids }}"
          ARGS=()
          for raw in "${IDS[@]}"; do
            id="$(echo "$raw" | xargs)"
            if [ -n "$id" ]; then
              ARGS+=(--experiment-id "$id")
            fi
          done
          python tools/run_aggressive_lab.py \
            --baseline-run "${{ inputs.baseline_run }}" \
            "${ARGS[@]}"

      - name: Upload aggressive lab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aggressive-lab-${{ github.run_id }}
          path: |
            outputs/experiments/
            reports/regression_attribution_20260430_vs_latest.md
            reports/regression_attribution_20260430_vs_latest.json
