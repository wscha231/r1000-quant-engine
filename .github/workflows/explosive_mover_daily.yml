name: Explosive Mover Daily Scan

# Phase 17 v3 Layer 9 (2026-04-30) -- daily scan of L11 explosion scores
# against the latest scored_latest.csv. Surfaces FRESH candidates (24h
# dedupe) that meet entry/net/exit thresholds + mcap floor + regime
# gate. Posts a Telegram digest.

on:
  schedule:
    # Weekday 22:30 UTC = 17:30 ET (30min after close, post-settle)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      scored_path:
        description: 'override scored_latest.csv path'
        type: string
        default: ''
      top_n:
        description: 'max fresh alerts per day'
        type: string
        default: '10'
      entry_threshold:
        description: 'min explosion_entry_score'
        type: string
        default: '0.65'
      reset_seen:
        description: 'clear 24h dedup state before scanning'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run explosive mover scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--telegram --top-n ${{ github.event.inputs.top_n || '10' }}"
          ARGS="$ARGS --entry-threshold ${{ github.event.inputs.entry_threshold || '0.65' }}"
          OVERRIDE="${{ github.event.inputs.scored_path }}"
          if [ -n "$OVERRIDE" ]; then ARGS="$ARGS --scored $OVERRIDE"; fi
          if [ "${{ github.event.inputs.reset_seen }}" = "true" ]; then ARGS="$ARGS --reset-seen"; fi
          python tools/explosive_mover_scan_daily.py $ARGS

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          git add cloud_results/explosive_movers/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): explosive mover scan $(date +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do
            if git push; then
              break
            fi
            sleep $((2 ** i))
          done
