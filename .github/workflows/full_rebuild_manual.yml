          # last valid analysis baseline.
          if [ "$RUN_ARTIFACT_VALID" = "yes" ]; then
            rm -rf "cloud_results/full_rebuild/latest_${{ inputs.universe_mode }}"
            cp -r "$DEST" "cloud_results/full_rebuild/latest_${{ inputs.universe_mode }}"
          else
            echo "[push] latest_${{ inputs.universe_mode }} preserved because RUN_ARTIFACT_VALID=$RUN_ARTIFACT_VALID"
          fi
          git add -f cloud_results/ 2>/dev/null || true
          if [ "${{ inputs.auto_learning_promote_live }}" = "true" ] && [ -f research/auto_feature_gates.yaml ]; then
            git add research/auto_feature_gates.yaml 2>/dev/null || true
          fi
          git diff --cached --quiet || \
            git commit -m "chore(bot): full rebuild [${{ inputs.universe_mode }}] $(date +%Y-%m-%d) [skip ci]"

          # Push with rebase-on-conflict (race condition guard). Use the
          # dispatch branch, not master, so branch test runs do not replay
          # master-only commits and conflict after a long rebuild.
          PUSHED="no"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$RESULT_BRANCH" 2>&1; then
              echo "[push] attempt $attempt: success"
              PUSHED="yes"
              break
            fi
            echo "[push] attempt $attempt: failed — fetch+rebase and retry"
            if fetch_result_branch && git rev-parse --verify "origin/${RESULT_BRANCH}" >/dev/null 2>&1; then
              git rebase --autostash "origin/${RESULT_BRANCH}" 2>&1 || git rebase --abort 2>&1 || true
            fi
            sleep $((attempt * 2))
          done
          if [ "$PUSHED" != "yes" ]; then
            echo "[push] WARN: result commit was not pushed after retries."
          fi
