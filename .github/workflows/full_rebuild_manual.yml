      - name: Sync outputs to user's Google Drive (OAuth preferred, Service Account fallback)
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          # Auth method selection
          AUTH=""
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            AUTH="oauth"
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            AUTH="service_account"
          else
            echo "[gdrive-sync] No auth secret set (need GOOGLE_SERVICE_ACCOUNT_KEY or RCLONE_CONFIG_GDRIVE)"
            echo "[gdrive-sync] Mobile-only setup: see GDRIVE_MOBILE_SETUP.md"
            exit 0
          fi
          echo "[gdrive-sync] auth=$AUTH"

          # Install rclone (~5MB, ~3s)
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone

          mkdir -p ~/.config/rclone

          if [ "$AUTH" = "service_account" ]; then
            # Mobile-friendly path: service account JSON in secret
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > ~/.config/rclone/rclone.conf
          else
            # OAuth fallback (legacy, PC-required setup)
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          fi

          # Sync FULL rebuild outputs. Only master may update canonical
          # GDrive outputs/. Branch experiments are isolated under
          # research_runs/<branch>/<run_id>/ so research cannot overwrite the
          # production operating view.
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-unknown}}"
          SAFE_BRANCH=$(printf '%s' "$BRANCH_NAME" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')
          if [ -z "$SAFE_BRANCH" ]; then
            SAFE_BRANCH="unknown"
          fi
          GDRIVE_SCOPE="research"
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            if [ "$BRANCH_NAME" = "master" ]; then
              GDRIVE_SCOPE="production"
              DEST="gdrive:outputs"
              LOG_DEST="gdrive:full_rebuild_logs"
            else
              DEST="gdrive:research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/outputs"
              LOG_DEST="gdrive:research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/full_rebuild_logs"
            fi
          else
            if [ "$BRANCH_NAME" = "master" ]; then
              GDRIVE_SCOPE="production"
              DEST="gdrive:${GDRIVE_FOLDER_NAME}/outputs"
              LOG_DEST="gdrive:${GDRIVE_FOLDER_NAME}/full_rebuild_logs"
            else
              DEST="gdrive:${GDRIVE_FOLDER_NAME}/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/outputs"
              LOG_DEST="gdrive:${GDRIVE_FOLDER_NAME}/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/full_rebuild_logs"
            fi
          fi
          GUARD_HARD_ERRORS="999"
          if [ -s outputs/portfolio_system_guard/error_check.json ]; then
            GUARD_HARD_ERRORS="$(python -c 'import json; from pathlib import Path; p=Path("outputs/portfolio_system_guard/error_check.json"); print(int(json.loads(p.read_text()).get("hard_error_count", 999))) if p.exists() else print(999)' 2>/dev/null || echo 999)"
          else
            echo "[gdrive-sync] WARN: portfolio_system_guard/error_check.json missing; preserving canonical outputs."
          fi
          VALID_PRIMARY_OUTPUTS="no"
          if [ -s outputs/backtest_metrics.json ] && [ -s outputs/concentrated_backtest_metrics.json ] && [ "$GUARD_HARD_ERRORS" = "0" ]; then
            VALID_PRIMARY_OUTPUTS="yes"
          else
            echo "[gdrive-sync] WARN: core metrics missing or system guard hard errors=$GUARD_HARD_ERRORS; preserving canonical outputs and syncing this run under failed_runs/${GITHUB_RUN_ID}/"
            if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
              if [ "$BRANCH_NAME" = "master" ]; then
                DEST="gdrive:failed_runs/${GITHUB_RUN_ID}/outputs"
                LOG_DEST="gdrive:failed_runs/${GITHUB_RUN_ID}/full_rebuild_logs"
              else
                DEST="gdrive:research_runs/${SAFE_BRANCH}/failed_runs/${GITHUB_RUN_ID}/outputs"
                LOG_DEST="gdrive:research_runs/${SAFE_BRANCH}/failed_runs/${GITHUB_RUN_ID}/full_rebuild_logs"
              fi
            else
