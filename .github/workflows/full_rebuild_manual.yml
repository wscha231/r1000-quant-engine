      - name: Telegram alert + zip results (mobile-friendly)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNIVERSE_MODE: ${{ inputs.universe_mode }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "[telegram] secrets unset, skipping"
            exit 0
          fi
          STATUS="${{ job.status }}"

          # Phase A automation: rich verdict via auto_verdict_summary.py
          # Includes ΔCAGR/ΔSharpe/ΔMaxDD vs CURRENT_BASELINE, sleeve composition,
          # top 5 holdings, concentrated portfolio, and recommended action.
          set +e
          SUMMARY=$(python3 tools/auto_verdict_summary.py --mode "$UNIVERSE_MODE" 2>&1)
          set -e

          # Build Telegram message: [status header] + [rich summary] + [run URL]
          MSG_HEADER="🔁 FULL rebuild status: ${STATUS}"
          # URL-encode (one-liner — multiline heredoc with indent caused IndentationError)
          ENCODED_SUMMARY=$(printf '%s' "$SUMMARY" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
          ENCODED_HEADER=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$MSG_HEADER'))")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="${ENCODED_HEADER}%0A%0A${ENCODED_SUMMARY}%0A%0Arun:%20${RUN_URL}"

          # Telegram message limit = 4096 chars. Truncate if too long.
          MSG_LEN=${#MSG}
          if [ "$MSG_LEN" -gt 3900 ]; then
            MSG="${MSG:0:3900}%0A%0A...truncated"
          fi

          curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "disable_web_page_preview=true" > /dev/null \
            || echo "[telegram] rich notification failed (length=$MSG_LEN)"

          # Mobile-friendly: send a small curated set of result files as
          # individual Telegram documents. The previous full-output ZIP
          # bundle frequently exceeded Telegram's 50MB sendDocument
          # limit (run 25713620719 produced a 54.4MB bundle). Sending
          # individual high-signal files avoids the size ceiling and
          # gives the operator the most useful numbers on phone. A
          # richer bundling story can be revisited later.
          TG_FILES=(
            "outputs/broker_replay/main/metrics.json"
            "outputs/broker_replay/concentrated/metrics.json"
            "outputs/weekly_leader_broker_replay/main/metrics.json"
            "outputs/weekly_leader_broker_replay/concentrated/metrics.json"
            "outputs/cost_sensitivity/main/summary.json"
            "outputs/cost_sensitivity/concentrated/summary.json"
            "outputs/portfolio_latest.csv"
            "outputs/concentrated_portfolio_latest.csv"
          )
          MAX_TG_FILE_BYTES=5000000
          for FILE in "${TG_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "[telegram] skip missing: $FILE"
              continue
            fi
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -gt "$MAX_TG_FILE_BYTES" ]; then
              echo "[telegram] skip oversized $FILE ($FILE_SIZE bytes > $MAX_TG_FILE_BYTES)"
              continue
            fi
            CAPTION_TG="r1000 ${{ inputs.universe_mode }} ${STATUS} :: $FILE"
            if curl -sf -F "document=@${FILE}" \
                 -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "caption=${CAPTION_TG}" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                 > /dev/null 2>&1; then
              echo "[telegram] sent $FILE ($FILE_SIZE bytes)"
            else
              echo "[telegram] failed to send $FILE ($FILE_SIZE bytes)"
            fi
          done

      - name: Commit verdict + portfolio CSVs (always — diagnostics on fail)
        if: always()    # ← changed from success() to capture fail-state logs
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          RESULT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$RESULT_BRANCH" ] || [ "$RESULT_BRANCH" = "HEAD" ]; then
            RESULT_BRANCH="${{ github.ref_name }}"
          fi
          echo "[push] result branch: $RESULT_BRANCH"
          fetch_result_branch() {
            git fetch --prune --depth=100 origin "+refs/heads/${RESULT_BRANCH}:refs/remotes/origin/${RESULT_BRANCH}" 2>&1
          }
          if fetch_result_branch && git rev-parse --verify "origin/${RESULT_BRANCH}" >/dev/null 2>&1; then
            if ! git rebase --autostash "origin/${RESULT_BRANCH}" 2>&1; then
              git rebase --abort 2>&1 || true
              echo "[push] pre-stage rebase failed; artifacts and GDrive sync are already preserved, skipping cloud_results commit."
              exit 0
            fi
          else
            echo "[push] WARN: could not fetch origin/${RESULT_BRANCH}; continuing without pre-stage rebase."
          fi
          mkdir -p cloud_results/full_rebuild
          GUARD_HARD_ERRORS="999"
          if [ -s outputs/portfolio_system_guard/error_check.json ]; then
            GUARD_HARD_ERRORS="$(python -c 'import json; from pathlib import Path; p=Path("outputs/portfolio_system_guard/error_check.json"); print(int(json.loads(p.read_text()).get("hard_error_count", 999))) if p.exists() else print(999)' 2>/dev/null || echo 999)"
          else
            echo "[push] WARN: portfolio_system_guard/error_check.json missing; preserving latest pointer."
          fi
          RUN_ARTIFACT_VALID="no"
          if [ -s outputs/backtest_metrics.json ] && [ -s outputs/concentrated_backtest_metrics.json ] && [ "$GUARD_HARD_ERRORS" = "0" ]; then
            RUN_ARTIFACT_VALID="yes"
            DEST="cloud_results/full_rebuild/$(date +%Y%m%d)_${{ inputs.universe_mode }}"
          else
            DEST="cloud_results/full_rebuild/failed_runs/${GITHUB_RUN_ID}_${{ inputs.universe_mode }}"
            echo "[push] WARN: core metrics missing or system guard hard errors=$GUARD_HARD_ERRORS; writing diagnostics to $DEST and preserving latest_${{ inputs.universe_mode }}."
          fi
          mkdir -p "$DEST"
          copy_dir_clean() {
            local src="$1"
            local dst="$2"
            if [ -d "$src" ]; then
              rm -rf "$dst"
              mkdir -p "$dst"
              cp -R "$src"/. "$dst"/ 2>/dev/null || true
            fi
          }
          # Capture run log tail (last 300 lines) for diagnostics regardless of outcome
          if ls outputs/full_rebuild_logs/*_${{ inputs.universe_mode }}.log 1>/dev/null 2>&1; then
            LATEST_LOG=$(ls -t outputs/full_rebuild_logs/*_${{ inputs.universe_mode }}.log | head -1)
            tail -300 "$LATEST_LOG" > "$DEST/run_log_tail.txt"
            echo "Captured tail of: $LATEST_LOG ($(wc -l < $LATEST_LOG) total lines)" >> "$DEST/run_log_tail.txt"
          fi
          # Job status indicator
