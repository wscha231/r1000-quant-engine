              fi
            fi
          fi
          echo "[gdrive-sync] branch=$BRANCH_NAME safe_branch=$SAFE_BRANCH scope=$GDRIVE_SCOPE valid_primary_outputs=$VALID_PRIMARY_OUTPUTS"
          echo "[gdrive-sync] copying outputs/ to $DEST/"
          copy_if_exists() {
            local src="$1"
            local dst="$2"
            if [ -e "$src" ]; then
              rclone copy "$src" "$dst/"
            else
              echo "[gdrive-sync] skip missing: $src"
            fi
          }
          verify_if_exists() {
            local src="$1"
            local dst="$2"
            local name="${3:-$(basename "$src")}"
            if [ -e "$src" ]; then
              echo "[gdrive-sync] verifying $dst/$name"
              rclone lsf "$dst" --files-only | grep -Fx "$name" >/dev/null
