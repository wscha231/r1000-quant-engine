name: Full Rebuild (Manual / Long-Run)

# FULL pipeline rebuild (collector + universe + feature_store + walk-forward
# + backtest). Required when ENGINE_REUSE_VERSION bumps OR when feature_store
# schema changes (new PHASE_X_COLUMNS additions like Phase 14 hybrid alpha).
#
# Estimated runtime: ~3-5 hours (within GHA 6h timeout). Can use up to ~50%
# of free-tier monthly minutes (2000) PER run, so trigger judiciously.
#
# Schedule: NONE (manual trigger only via workflow_dispatch).
# Reason: A FULL rebuild is a deliberate decision. Auto-triggering would
# burn the entire monthly free tier in 1-2 runs.

on:
  workflow_dispatch:
    inputs:
      universe_mode:
        description: 'r1000 baseline | r1000+adr | global_alpha_universe (R1000+ADR+cycle play) | r1000+cycle | r1000+adr_phase14_off control'
        type: choice
        options:
          - global_alpha_universe
          - r1000
          - r1000+adr
          - r1000+cycle
          - r1000+adr_phase14_off
        default: global_alpha_universe
      backtest_years:
        description: 'official out-of-sample backtest window years (8 = current SHIP standard; 10 remains research/partial until full coverage)'
        type: choice
        options:
          - '8'
          - '10'
        default: '8'
      skip_collector:
        description: 'skip data collection (use cached prices/SEC/macro). Saves ~1-2h.'
        type: boolean
        default: true
      fast_mode:
        description: 'fast_mode=True (5 backtests, 2-3h total) vs False (FULL, 5-6h, may timeout)'
        type: boolean
        default: true
      leader_rescue_mode:
        description: 'leader rescue validation: latest_only=PIT-safe default, full_proxy=research/survivorship proxy, off=control'
        type: choice
        options:
          - latest_only
          - full_proxy
          - off
        default: latest_only
      cache_key_suffix:
        description: 'optional cache key suffix (e.g. "phase14-baseline" to keep separate caches)'
        type: string
        default: ''
      auto_learning_promote_live:
        description: 'guarded: if candidate gates pass promotion checks, commit research/auto_feature_gates.yaml for the next run'
        type: boolean
        default: false

permissions:
  contents: write   # commit final scored CSVs + verdict to cloud_results/

jobs:
  full_rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 5h 50m (just under 6h GHA hard limit)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt
          # Heavy ML deps for full rebuild (not in requirements_github.txt by default)
          pip install "catboost>=1.2" "lightgbm>=4.0" "xgboost>=2.0" "scikit-learn>=1.4"

      # Cache collector outputs (price bars, SEC EDGAR XBRL, macro CSVs)
      # These are slow to fetch (rate limits) and rarely change.
      # `outputs/companyfacts.zip` is the SEC bulk archive — refreshed by the
      # next step. Caching keeps it across runs so we only re-download when
      # older than --max-age-days.
      - name: Restore collector cache
        uses: actions/cache@v4
        with:
          path: |
            cache_prices
            cache_fsds
            cache_macro
            cache_sec_actual
            cache_misc
            cache_live_fund
            aggressive/cache/bars
            aggressive/cache/finnhub
            aggressive/state/finnhub
            outputs/sec_companyfacts
            outputs/macro
            outputs/companyfacts.zip
          key: collector-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            collector-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-
            collector-cache-${{ runner.os }}-

      # Refresh SEC companyfacts.zip bulk archive if missing or older than 7d.
      # Without this, the pipeline silently falls back to per-CIK API calls
      # which respect companyfacts_refresh_days, but with --no-collector that
      # path never executes either — fundamentals lane goes stale →
      # fundamental_coverage_ok=False → portfolio_latest.csv blocked.
      # 7-day threshold = weekly refresh. Runs less than 7 days apart reuse
      # cache; longer gaps trigger re-download (~1GB once).
      - name: Refresh SEC companyfacts bulk archive
        env:
          SEC_USER_AGENT: "R1000InstitutionalBot (contact: andrewcha231@gmail.com)"
        run: |
          mkdir -p outputs
          python tools/refresh_companyfacts_bulk.py \
            --base-dir "$(pwd)/outputs" \
            --max-age-days 7 \
            --required

      # Cache feature_store + scored outputs (large files, prior FULL rebuild result)
      - name: Restore engine cache
        uses: actions/cache@v4
        with:
          path: |
            outputs/feature_store_*.parquet
            outputs/scored_*.csv
            outputs/walk_forward
          key: engine-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            engine-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-
            engine-cache-${{ runner.os }}-

      - name: Smoke test pre-flight
        run: |
          python tests/smoke_test.py
          python tests/audit_features.py --no-runtime

      - name: Phase 15-D data preflight
        run: |
          python - <<'PY'
          from pathlib import Path

          import pandas as pd

          from aggressive.universe import load_cycle_play_universe
          from r1000_helpers import px_cache_name

          cycle_tickers, _ = load_cycle_play_universe()
          missing_prices = [
              t for t in sorted(cycle_tickers)
              if not (Path("cache_prices") / px_cache_name(t)).exists()
          ]
          print(
              "[cycle] active=%d missing_price_cache_before_collector=%d"
              % (len(cycle_tickers), len(missing_prices))
          )
          if missing_prices:
              print("[cycle] missing sample: " + ", ".join(missing_prices[:30]))

          p = Path("aggressive/state/finnhub/r1000_features.parquet")
          if p.exists():
              df = pd.read_parquet(p)
              print(
                  "[finnhub] fallback parquet present rows=%d cols=%d"
                  % (len(df), len(df.columns))
              )
          else:
              print("[finnhub] WARN fallback parquet missing; Phase 15-D fallback will degrade")
          PY

      - name: Run FULL rebuild
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          # Per Phase 14 wiring + Phase 1 backtest validation
          UNIVERSE_MODE: ${{ inputs.universe_mode }}
          BACKTEST_YEARS: ${{ inputs.backtest_years }}
          LEADER_RESCUE_MODE: ${{ inputs.leader_rescue_mode }}
          PHASE_PHASE14_HYBRID_ALPHA_ENABLED: ${{ inputs.universe_mode == 'r1000+adr_phase14_off' && '0' || 'auto' }}
        run: |
          set -e
          set -o pipefail   # ← critical: catch python failures through tee pipe
          mkdir -p outputs/full_rebuild_logs
          LOG="outputs/full_rebuild_logs/$(date +%Y%m%d_%H%M%S)_${{ inputs.universe_mode }}.log"

          # Auto-detect: skip_collector=true is unsafe on FIRST run (no cache).
          # Check for collector cache markers; if absent, force collector run
          # even when user requested skip. Prevents the "1-min crash" bug from
          # reuse_existing_artifacts=True hitting empty parquet/csv paths.
          SKIP_COLLECTOR=""
          CACHE_PRESENT="no"
          has_cache_files() {
            [ -d "$1" ] && [ -n "$(find "$1" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]
          }
          if has_cache_files cache_prices; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_sec_actual; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_fsds; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_macro; then
            CACHE_PRESENT="yes"
          fi
          if [ -d aggressive/cache/finnhub ] && [ -n "$(ls -A aggressive/cache/finnhub 2>/dev/null)" ]; then
            CACHE_PRESENT="yes"
          fi
          if [ -d aggressive/cache/bars ] && [ -n "$(ls -A aggressive/cache/bars 2>/dev/null)" ]; then
            CACHE_PRESENT="yes"
          fi
          if ls outputs/feature_store_*.parquet 1>/dev/null 2>&1; then
            CACHE_PRESENT="yes"
          fi

          if [ "${{ inputs.skip_collector }}" = "true" ]; then
            if [ "$CACHE_PRESENT" = "yes" ]; then
              SKIP_COLLECTOR="--no-collector"
              echo "[skip_collector] cache present, skipping data collection"
            else
              echo "[skip_collector] WARN: requested but NO cache found in this runner."
              echo "[skip_collector]       Running collector anyway (first cloud run; will populate cache for future runs)."
            fi
          fi

          # fast_mode: true = 5 backtests + 6m retrain (~2-3h total, fits in 6h GHA limit)
          # fast_mode: false = full walk-forward (~5-6h, may TIMEOUT on first cloud run)
          # Previous run (24950857695) was cancelled at 7h+ — fast_mode now exposed.
          FAST_MODE_FLAG="${{ inputs.fast_mode }}"

          echo "=========================================="
          echo "FULL REBUILD START"
          echo "  universe_mode:    $UNIVERSE_MODE"
          echo "  skip_collector:   ${{ inputs.skip_collector }} (effective: $([ -n "$SKIP_COLLECTOR" ] && echo SKIP || echo RUN))"
          echo "  cache_present:    $CACHE_PRESENT"
          echo "  fast_mode:        $FAST_MODE_FLAG"
          echo "  backtest_years:   $BACKTEST_YEARS"
          echo "  leader_rescue:    $LEADER_RESCUE_MODE"
          echo "  ENGINE_REUSE_VERSION: $(python -c 'from r1000_config import ENGINE_REUSE_VERSION; print(ENGINE_REUSE_VERSION)')"
          echo "=========================================="

          # Use --base-dir to override Drive path with repo-local outputs/
          # --fast-mode passed as CLI flag (run_local.py:162 supports it natively)
          python run_local.py --full --fast-mode "$FAST_MODE_FLAG" --backtest-years "$BACKTEST_YEARS" --leader-rescue-mode "$LEADER_RESCUE_MODE" $SKIP_COLLECTOR --base-dir "$(pwd)" 2>&1 | tee "$LOG"

      - name: Verdict (Cell E equivalent)
        if: always()
        run: |
          python run_local.py --verdict-only --base-dir "$(pwd)" 2>&1 | tee outputs/full_rebuild_logs/verdict.log || true

      - name: Auto-learning diagnostics (sidecar)
        if: always()
        run: |
          mkdir -p outputs/auto_learning
          CANDIDATE_GATES="outputs/auto_learning/auto_feature_gates_candidate.yaml"
          rm -f "$CANDIDATE_GATES"
          python tools/build_concentrated_trade_journal.py --latest-run outputs --output-dir outputs/concentrated_trade_journal 2>&1 | tee outputs/auto_learning/concentrated_trade_journal.log || true
          EXTRA_TRADES=""
          if [ -f outputs/concentrated_trade_journal/trades.csv ]; then
            EXTRA_TRADES="--extra-trades outputs/concentrated_trade_journal/trades.csv"
          fi
          python tools/trade_insights.py --no-shap $EXTRA_TRADES 2>&1 | tee outputs/auto_learning/trade_insights.log || true
          python tools/feature_gate_proposal.py --gates-out "$CANDIDATE_GATES" 2>&1 | tee outputs/auto_learning/feature_gate_proposal.log || true
          if [ "${{ inputs.auto_learning_promote_live }}" = "true" ]; then
            python tools/auto_learning_promote.py --candidate-gates "$CANDIDATE_GATES" --active-gates research/auto_feature_gates.yaml 2>&1 | tee outputs/auto_learning/promotion_decision.log || true
          else
            python tools/auto_learning_promote.py --dry-run --candidate-gates "$CANDIDATE_GATES" --active-gates research/auto_feature_gates.yaml 2>&1 | tee outputs/auto_learning/promotion_decision.log || true
          fi
          python tools/auto_policy_proposal.py --latest-run outputs --candidate-out outputs/auto_learning/auto_learning_policy_candidate.yaml --diff-out outputs/auto_learning/policy_proposal_diff.md --evidence-out outputs/auto_learning/evidence_snapshot.json --summary-out outputs/auto_learning/policy_candidate_summary.md 2>&1 | tee outputs/auto_learning/auto_policy_proposal.log || true
          python tools/auto_policy_challenger.py --policy outputs/auto_learning/auto_learning_policy_candidate.yaml --latest-run outputs --out-dir outputs/auto_learning/challenger 2>&1 | tee outputs/auto_learning/auto_policy_challenger.log || true
          python tools/auto_policy_promote.py --candidate-policy outputs/auto_learning/auto_learning_policy_candidate.yaml --challenger-decision outputs/auto_learning/challenger/challenger_decision.json --out-dir outputs/auto_learning/promotion 2>&1 | tee outputs/auto_learning/auto_policy_promotion.log || true

      - name: Portfolio target replay + goal search (sidecar)
        if: always()
        run: |
          python tools/run_main_v2_backtest.py --latest-run outputs --output-dir outputs/main_v2_backtest 2>&1 | tee outputs/full_rebuild_logs/main_v2_backtest.log || true
          python tools/run_concentrated_policy_replay.py --latest-run outputs --output-dir outputs/concentrated_policy_replay 2>&1 | tee outputs/full_rebuild_logs/concentrated_policy_replay.log || true
          python tools/run_concentrated_position_risk_replay.py --latest-run outputs --output-dir outputs/concentrated_position_risk_replay 2>&1 | tee outputs/full_rebuild_logs/concentrated_position_risk_replay.log || true
          python tools/run_alpha_sprint_backtest.py --latest-run outputs --output-dir outputs/alpha_sprint_backtest 2>&1 | tee outputs/full_rebuild_logs/alpha_sprint_backtest.log || true
          python tools/run_position_aware_risk_replay.py --holdings outputs/main_v2_backtest/monthly_holdings.csv --output-dir outputs/position_aware_risk_replay 2>&1 | tee outputs/full_rebuild_logs/position_aware_risk_replay.log || true
          python tools/run_monster_lifecycle_replay.py --latest-run outputs --policy concentrated --output-dir outputs/monster_lifecycle_replay 2>&1 | tee outputs/full_rebuild_logs/monster_lifecycle_replay.log || true
          python tools/run_lifecycle_review_overlay.py --latest-run outputs --policy lifecycle_review_main --output-dir outputs/lifecycle_review_overlay_main 2>&1 | tee outputs/full_rebuild_logs/lifecycle_review_overlay_main.log || true
          python tools/run_monster_lifecycle_replay.py --latest-run outputs --policy lifecycle_review_main --output-dir outputs/monster_lifecycle_review_main 2>&1 | tee outputs/full_rebuild_logs/monster_lifecycle_review_main.log || true
          python tools/run_monster_lifecycle_replay.py --latest-run outputs --policy lifecycle_review_concentrated --output-dir outputs/monster_lifecycle_review_concentrated 2>&1 | tee outputs/full_rebuild_logs/monster_lifecycle_review_concentrated.log || true
          python tools/run_orchestrator_replay.py --latest-run outputs 2>&1 | tee outputs/full_rebuild_logs/orchestrator_replay.log || true
          python tools/run_leader_drop_diagnostics_sidecar.py --latest-run outputs --output-dir outputs/reports 2>&1 | tee outputs/full_rebuild_logs/leader_drop_diagnostics_sidecar.log || true
          python tools/run_governance_catalyst_report.py --latest-run outputs --output-dir outputs/governance_catalyst 2>&1 | tee outputs/full_rebuild_logs/governance_catalyst_report.log || true
          python tools/run_style_regime_report.py --latest-run outputs --output-dir outputs/style_regime_report 2>&1 | tee outputs/full_rebuild_logs/style_regime_report.log || true
          python tools/run_macro_policy_engine.py --latest-run outputs --output-dir outputs/macro_policy_engine 2>&1 | tee outputs/full_rebuild_logs/macro_policy_engine.log || true
          python tools/run_portfolio_goal_search.py --latest-run outputs 2>&1 | tee outputs/full_rebuild_logs/portfolio_goal_search.log || true
          python tools/run_historical_trade_journey.py --latest-run outputs --output-dir outputs/historical_trade_journey 2>&1 | tee outputs/full_rebuild_logs/historical_trade_journey.log || true
          python tools/run_dataset_coverage_audit.py --latest-run outputs --output-dir outputs/reports 2>&1 | tee outputs/full_rebuild_logs/dataset_coverage_audit.log || true

      - name: Upload artifact (logs + scored CSVs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-rebuild-${{ inputs.universe_mode }}-${{ github.run_id }}
          path: |
            outputs/full_rebuild_logs/
            outputs/scored_*.csv
            outputs/backtest_metrics.json
            outputs/concentrated_backtest_metrics.json
            outputs/equity_curve.csv
            outputs/portfolio_latest.csv
            outputs/concentrated_portfolio_latest.csv
            outputs/run_summary.json
            outputs/orchestrator/
            outputs/reports/baseline_registry.*
            outputs/reports/config_audit.*
            outputs/reports/backtest_window_comparison.csv
            outputs/reports/global_alpha_sleeve_audit_*.csv
            outputs/reports/concentrated_strategy_*.csv
            outputs/reports/main_monthly_weights.csv
            outputs/reports/tactical_monthly_weights.csv
            outputs/reports/alpha_sprint_monthly_weights.csv
            outputs/reports/regime_by_month.csv
            outputs/reports/sleeve_returns_by_month.csv
            outputs/reports/candidate_replay_book.csv
            outputs/reports/leader_drop_diagnostics_*.csv
            outputs/reports/leader_drop_diagnostics_summary.json
            outputs/reports/leader_drop_diagnostics_report.md
            outputs/reports/leader_rescue_backtest_filter_summary.json
            outputs/reports/dataset_coverage_audit.*
            outputs/trade_journal/
            outputs/concentrated_trade_journal/
            outputs/auto_learning/
            outputs/orchestrator_replay/
            outputs/portfolio_goal_search/
            outputs/main_v2_backtest/
            outputs/concentrated_policy_replay/
            outputs/concentrated_position_risk_replay/
            outputs/alpha_sprint_backtest/
            outputs/position_aware_risk_replay/
            outputs/governance_catalyst/
            outputs/style_regime_report/
            outputs/macro_policy_engine/
            outputs/monster_lifecycle_replay/
            outputs/lifecycle_review_overlay_main/
            outputs/monster_lifecycle_review_main/
            outputs/monster_lifecycle_review_concentrated/
            outputs/historical_trade_journey/
          retention-days: 365   # FULL rebuild is expensive — keep 1 year

      - name: Sync outputs to user's Google Drive (OAuth preferred, Service Account fallback)
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          # Auth method selection
          AUTH=""
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            AUTH="oauth"
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            AUTH="service_account"
          else
            echo "[gdrive-sync] No auth secret set (need GOOGLE_SERVICE_ACCOUNT_KEY or RCLONE_CONFIG_GDRIVE)"
            echo "[gdrive-sync] Mobile-only setup: see GDRIVE_MOBILE_SETUP.md"
            exit 0
          fi
          echo "[gdrive-sync] auth=$AUTH"

          # Install rclone (~5MB, ~3s)
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone

          mkdir -p ~/.config/rclone

          if [ "$AUTH" = "service_account" ]; then
            # Mobile-friendly path: service account JSON in secret
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > ~/.config/rclone/rclone.conf
          else
            # OAuth fallback (legacy, PC-required setup)
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          fi

          # Sync FULL rebuild outputs to gdrive r1000_top30_institutional/outputs/
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            DEST="gdrive:outputs"
            LOG_DEST="gdrive:full_rebuild_logs"
          else
            DEST="gdrive:${GDRIVE_FOLDER_NAME}/outputs"
            LOG_DEST="gdrive:${GDRIVE_FOLDER_NAME}/full_rebuild_logs"
          fi
          echo "[gdrive-sync] copying outputs/ to $DEST/"
          copy_if_exists() {
            local src="$1"
            local dst="$2"
            if [ -e "$src" ]; then
              rclone copy "$src" "$dst/"
            else
              echo "[gdrive-sync] skip missing: $src"
            fi
          }
          verify_if_exists() {
            local src="$1"
            local dst="$2"
            local name="${3:-$(basename "$src")}"
            if [ -e "$src" ]; then
              echo "[gdrive-sync] verifying $dst/$name"
              rclone lsf "$dst" --files-only | grep -Fx "$name" >/dev/null
            fi
          }
          copy_if_exists outputs/scored_latest.csv "$DEST"
          copy_if_exists outputs/scored_unified.csv "$DEST"
          copy_if_exists outputs/portfolio_latest.csv "$DEST"
          copy_if_exists outputs/concentrated_portfolio_latest.csv "$DEST"
          copy_if_exists outputs/backtest_metrics.json "$DEST"
          copy_if_exists outputs/concentrated_backtest_metrics.json "$DEST"
          copy_if_exists outputs/equity_curve.csv "$DEST"
          if [ -d outputs/orchestrator ]; then
            rclone copy outputs/orchestrator "$DEST/orchestrator/"
          else
            echo "[gdrive-sync] skip missing: outputs/orchestrator"
          fi
          copy_if_exists outputs/reports/baseline_registry.json "$DEST/reports"
          copy_if_exists outputs/reports/baseline_registry.md "$DEST/reports"
          copy_if_exists outputs/reports/config_audit.json "$DEST/reports"
          copy_if_exists outputs/reports/config_audit.md "$DEST/reports"
          # Phase 15-A fix (2026-04-28): include the SEC bulk archive so user
          # gdrive reflects the freshly downloaded companyfacts.zip. Previously
          # the file refreshed inside the GHA runner cache but never reached
          # gdrive — user could only see "stale" file from a manual upload.
          copy_if_exists outputs/companyfacts.zip "$DEST"
          copy_if_exists outputs/reports/global_alpha_sleeve_audit_by_month.csv "$DEST/reports"
          copy_if_exists outputs/reports/global_alpha_sleeve_audit_summary.csv "$DEST/reports"
          copy_if_exists outputs/reports/backtest_window_comparison.csv "$DEST/reports"
          copy_if_exists outputs/reports/concentrated_strategy_comparison.csv "$DEST/reports"
          copy_if_exists outputs/reports/concentrated_strategy_monthly.csv "$DEST/reports"
          copy_if_exists outputs/reports/concentrated_strategy_holdings.csv "$DEST/reports"
          copy_if_exists outputs/reports/main_monthly_weights.csv "$DEST/reports"
          copy_if_exists outputs/reports/tactical_monthly_weights.csv "$DEST/reports"
          copy_if_exists outputs/reports/alpha_sprint_monthly_weights.csv "$DEST/reports"
          copy_if_exists outputs/reports/regime_by_month.csv "$DEST/reports"
          copy_if_exists outputs/reports/sleeve_returns_by_month.csv "$DEST/reports"
          copy_if_exists outputs/reports/candidate_replay_book.csv "$DEST/reports"
          copy_if_exists outputs/reports/dataset_coverage_audit.json "$DEST/reports"
          copy_if_exists outputs/reports/dataset_coverage_audit.md "$DEST/reports"
          copy_if_exists outputs/reports/dataset_coverage_audit_coverage.csv "$DEST/reports"
          copy_if_exists outputs/reports/dataset_coverage_audit_watchlist.csv "$DEST/reports"
          copy_if_exists outputs/reports/dataset_coverage_audit_distributions.csv "$DEST/reports"
          if [ -d outputs/trade_journal ]; then
            rclone copy outputs/trade_journal "$DEST/trade_journal/"
          else
            echo "[gdrive-sync] skip missing: outputs/trade_journal"
          fi
          if [ -d outputs/concentrated_trade_journal ]; then
            rclone copy outputs/concentrated_trade_journal "$DEST/concentrated_trade_journal/"
          else
            echo "[gdrive-sync] skip missing: outputs/concentrated_trade_journal"
          fi
          if [ -d outputs/auto_learning ]; then
            rclone copy outputs/auto_learning "$DEST/auto_learning/"
          else
            echo "[gdrive-sync] skip missing: outputs/auto_learning"
          fi
          if [ -d outputs/orchestrator_replay ]; then
            rclone copy outputs/orchestrator_replay "$DEST/orchestrator_replay/"
          else
            echo "[gdrive-sync] skip missing: outputs/orchestrator_replay"
          fi
          if [ -d outputs/portfolio_goal_search ]; then
            rclone copy outputs/portfolio_goal_search "$DEST/portfolio_goal_search/"
          else
            echo "[gdrive-sync] skip missing: outputs/portfolio_goal_search"
          fi
          for d in main_v2_backtest concentrated_policy_replay concentrated_position_risk_replay alpha_sprint_backtest position_aware_risk_replay governance_catalyst style_regime_report macro_policy_engine monster_lifecycle_replay lifecycle_review_overlay_main monster_lifecycle_review_main monster_lifecycle_review_concentrated historical_trade_journey; do
            if [ -d "outputs/$d" ]; then
              rclone copy "outputs/$d" "$DEST/$d/"
            else
              echo "[gdrive-sync] skip missing: outputs/$d"
            fi
          done

          # Also sync log + verdict for diagnostic visibility
          rclone copy outputs/full_rebuild_logs/ "$LOG_DEST/"

          cat > outputs/gdrive_sync_manifest.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "head_sha": "${GITHUB_SHA}",
            "auth": "${AUTH}",
            "dest": "${DEST}",
            "log_dest": "${LOG_DEST}",
            "synced_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          rclone copy outputs/gdrive_sync_manifest.json "$DEST/"

          verify_if_exists outputs/gdrive_sync_manifest.json "$DEST"
          verify_if_exists outputs/scored_latest.csv "$DEST"
          verify_if_exists outputs/portfolio_latest.csv "$DEST"
          verify_if_exists outputs/backtest_metrics.json "$DEST"
          verify_if_exists outputs/concentrated_backtest_metrics.json "$DEST"
          verify_if_exists outputs/reports/baseline_registry.json "$DEST/reports"
          verify_if_exists outputs/reports/concentrated_strategy_monthly.csv "$DEST/reports"
          verify_if_exists outputs/reports/main_monthly_weights.csv "$DEST/reports"
          verify_if_exists outputs/reports/sleeve_returns_by_month.csv "$DEST/reports"
          verify_if_exists outputs/reports/candidate_replay_book.csv "$DEST/reports"
          verify_if_exists outputs/reports/dataset_coverage_audit.json "$DEST/reports"

          # Cleanup secret file
          rm -f /tmp/sa.json

          echo "[gdrive-sync] done — check Google Drive r1000_top30_institutional/outputs/"

      - name: Telegram alert + zip results (mobile-friendly)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNIVERSE_MODE: ${{ inputs.universe_mode }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "[telegram] secrets unset, skipping"
            exit 0
          fi
          STATUS="${{ job.status }}"

          # Phase A automation: rich verdict via auto_verdict_summary.py
          # Includes ΔCAGR/ΔSharpe/ΔMaxDD vs CURRENT_BASELINE, sleeve composition,
          # top 5 holdings, concentrated portfolio, and recommended action.
          set +e
          SUMMARY=$(python3 tools/auto_verdict_summary.py --mode "$UNIVERSE_MODE" 2>&1)
          set -e

          # Build Telegram message: [status header] + [rich summary] + [run URL]
          MSG_HEADER="🔁 FULL rebuild status: ${STATUS}"
          # URL-encode (one-liner — multiline heredoc with indent caused IndentationError)
          ENCODED_SUMMARY=$(printf '%s' "$SUMMARY" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
          ENCODED_HEADER=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$MSG_HEADER'))")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="${ENCODED_HEADER}%0A%0A${ENCODED_SUMMARY}%0A%0Arun:%20${RUN_URL}"

          # Telegram message limit = 4096 chars. Truncate if too long.
          MSG_LEN=${#MSG}
          if [ "$MSG_LEN" -gt 3900 ]; then
            MSG="${MSG:0:3900}%0A%0A...truncated"
          fi

          curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "disable_web_page_preview=true" > /dev/null \
            || echo "[telegram] rich notification failed (length=$MSG_LEN)"

          # Mobile-friendly: bundle key results into a zip and send as Telegram
          # document so user can download directly on phone (no PC sync needed).
          # Telegram document limit = 50MB.
          BUNDLE="/tmp/full_rebuild_${{ inputs.universe_mode }}_$(date +%Y%m%d_%H%M).zip"
          mkdir -p /tmp/bundle
          copy_dir_clean() {
            local src="$1"
            local dst="$2"
            if [ -d "$src" ]; then
              rm -rf "$dst"
              mkdir -p "$dst"
              cp -R "$src"/. "$dst"/ 2>/dev/null || true
            fi
          }
          cp outputs/scored_latest.csv /tmp/bundle/ 2>/dev/null || true
          cp outputs/scored_unified.csv /tmp/bundle/ 2>/dev/null || true
          cp outputs/portfolio_latest.csv /tmp/bundle/ 2>/dev/null || true
          cp outputs/concentrated_portfolio_latest.csv /tmp/bundle/ 2>/dev/null || true
          cp outputs/backtest_metrics.json /tmp/bundle/ 2>/dev/null || true
          cp outputs/concentrated_backtest_metrics.json /tmp/bundle/ 2>/dev/null || true
          cp outputs/equity_curve.csv /tmp/bundle/ 2>/dev/null || true
          copy_dir_clean outputs/orchestrator /tmp/bundle/orchestrator
          mkdir -p /tmp/bundle/reports
          cp outputs/reports/baseline_registry.* /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/config_audit.* /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/global_alpha_sleeve_audit_by_month.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/global_alpha_sleeve_audit_summary.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/backtest_window_comparison.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/concentrated_strategy_comparison.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/concentrated_strategy_monthly.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/concentrated_strategy_holdings.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/main_monthly_weights.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/tactical_monthly_weights.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/alpha_sprint_monthly_weights.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/regime_by_month.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/sleeve_returns_by_month.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/candidate_replay_book.csv /tmp/bundle/reports/ 2>/dev/null || true
          cp outputs/reports/dataset_coverage_audit.* /tmp/bundle/reports/ 2>/dev/null || true
          copy_dir_clean outputs/full_rebuild_logs /tmp/bundle/logs
          copy_dir_clean outputs/trade_journal /tmp/bundle/trade_journal
          copy_dir_clean outputs/concentrated_trade_journal /tmp/bundle/concentrated_trade_journal
          copy_dir_clean outputs/auto_learning /tmp/bundle/auto_learning
          copy_dir_clean outputs/orchestrator_replay /tmp/bundle/orchestrator_replay
          copy_dir_clean outputs/portfolio_goal_search /tmp/bundle/portfolio_goal_search
          copy_dir_clean outputs/main_v2_backtest /tmp/bundle/main_v2_backtest
          copy_dir_clean outputs/concentrated_policy_replay /tmp/bundle/concentrated_policy_replay
          copy_dir_clean outputs/concentrated_position_risk_replay /tmp/bundle/concentrated_position_risk_replay
          copy_dir_clean outputs/alpha_sprint_backtest /tmp/bundle/alpha_sprint_backtest
          copy_dir_clean outputs/position_aware_risk_replay /tmp/bundle/position_aware_risk_replay
          copy_dir_clean outputs/governance_catalyst /tmp/bundle/governance_catalyst
          copy_dir_clean outputs/macro_policy_engine /tmp/bundle/macro_policy_engine
          copy_dir_clean outputs/monster_lifecycle_replay /tmp/bundle/monster_lifecycle_replay
          copy_dir_clean outputs/lifecycle_review_overlay_main /tmp/bundle/lifecycle_review_overlay_main
          copy_dir_clean outputs/monster_lifecycle_review_main /tmp/bundle/monster_lifecycle_review_main
          copy_dir_clean outputs/monster_lifecycle_review_concentrated /tmp/bundle/monster_lifecycle_review_concentrated
          copy_dir_clean outputs/historical_trade_journey /tmp/bundle/historical_trade_journey
          if [ "$(ls -A /tmp/bundle 2>/dev/null)" ]; then
            (cd /tmp/bundle && zip -qr "$BUNDLE" .)
            BUNDLE_SIZE=$(stat -c%s "$BUNDLE" 2>/dev/null || echo 0)
            echo "[telegram] bundle size: $BUNDLE_SIZE bytes"
            if [ "$BUNDLE_SIZE" -lt 49000000 ] && [ "$BUNDLE_SIZE" -gt 0 ]; then
              CAPTION="📊 r1000 [${{ inputs.universe_mode }}] ${STATUS}%0A${VERDICT}"
              curl -sf -F "document=@${BUNDLE}" \
                   -F "chat_id=${TELEGRAM_CHAT_ID}" \
                   -F "caption=${CAPTION}" \
                   "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                   > /dev/null \
                || echo "[telegram] document send failed (size $BUNDLE_SIZE)"
              echo "[telegram] sent zip to mobile ($((BUNDLE_SIZE/1024)) KB)"
            else
              echo "[telegram] bundle too large or empty ($BUNDLE_SIZE), skipping document send"
            fi
          else
            echo "[telegram] no output files to bundle"
          fi

      - name: Commit verdict + portfolio CSVs (always — diagnostics on fail)
        if: always()    # ← changed from success() to capture fail-state logs
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          RESULT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$RESULT_BRANCH" ] || [ "$RESULT_BRANCH" = "HEAD" ]; then
            RESULT_BRANCH="${{ github.ref_name }}"
          fi
          echo "[push] result branch: $RESULT_BRANCH"
          fetch_result_branch() {
            git fetch --prune --depth=100 origin "+refs/heads/${RESULT_BRANCH}:refs/remotes/origin/${RESULT_BRANCH}" 2>&1
          }
          if fetch_result_branch && git rev-parse --verify "origin/${RESULT_BRANCH}" >/dev/null 2>&1; then
            if ! git rebase --autostash "origin/${RESULT_BRANCH}" 2>&1; then
              git rebase --abort 2>&1 || true
              echo "[push] pre-stage rebase failed; artifacts and GDrive sync are already preserved, skipping cloud_results commit."
              exit 0
            fi
          else
            echo "[push] WARN: could not fetch origin/${RESULT_BRANCH}; continuing without pre-stage rebase."
          fi
          mkdir -p cloud_results/full_rebuild
          DEST="cloud_results/full_rebuild/$(date +%Y%m%d)_${{ inputs.universe_mode }}"
          mkdir -p "$DEST"
          copy_dir_clean() {
            local src="$1"
            local dst="$2"
            if [ -d "$src" ]; then
              rm -rf "$dst"
              mkdir -p "$dst"
              cp -R "$src"/. "$dst"/ 2>/dev/null || true
            fi
          }
          # Capture run log tail (last 300 lines) for diagnostics regardless of outcome
          if ls outputs/full_rebuild_logs/*_${{ inputs.universe_mode }}.log 1>/dev/null 2>&1; then
            LATEST_LOG=$(ls -t outputs/full_rebuild_logs/*_${{ inputs.universe_mode }}.log | head -1)
            tail -300 "$LATEST_LOG" > "$DEST/run_log_tail.txt"
            echo "Captured tail of: $LATEST_LOG ($(wc -l < $LATEST_LOG) total lines)" >> "$DEST/run_log_tail.txt"
          fi
          # Job status indicator
          echo "job_status: ${{ job.status }}" > "$DEST/job_status.txt"
          # Score + universe outputs
          cp outputs/scored_latest.csv "$DEST/" 2>/dev/null || true
          cp outputs/scored_unified.csv "$DEST/" 2>/dev/null || true
          # Portfolio outputs (production main + concentrated 3-name)
          cp outputs/portfolio_latest.csv "$DEST/" 2>/dev/null || true
          cp outputs/concentrated_portfolio_latest.csv "$DEST/" 2>/dev/null || true
          # Backtest metrics
          cp outputs/backtest_metrics.json "$DEST/" 2>/dev/null || true
          cp outputs/concentrated_backtest_metrics.json "$DEST/" 2>/dev/null || true
          cp outputs/equity_curve.csv "$DEST/" 2>/dev/null || true
          copy_dir_clean outputs/orchestrator "$DEST/orchestrator"
          # Diagnostic reports for post-run analysis
          mkdir -p "$DEST/reports"
          cp outputs/reports/baseline_registry.* "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/config_audit.* "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/global_alpha_sleeve_audit_by_month.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/global_alpha_sleeve_audit_summary.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/backtest_window_comparison.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/concentrated_strategy_comparison.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/concentrated_strategy_monthly.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/concentrated_strategy_holdings.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/main_monthly_weights.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/tactical_monthly_weights.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/alpha_sprint_monthly_weights.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/regime_by_month.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/sleeve_returns_by_month.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/candidate_replay_book.csv "$DEST/reports/" 2>/dev/null || true
          cp outputs/reports/dataset_coverage_audit.* "$DEST/reports/" 2>/dev/null || true
          copy_dir_clean outputs/trade_journal "$DEST/trade_journal"
          copy_dir_clean outputs/concentrated_trade_journal "$DEST/concentrated_trade_journal"
          copy_dir_clean outputs/auto_learning "$DEST/auto_learning"
          copy_dir_clean outputs/orchestrator_replay "$DEST/orchestrator_replay"
          copy_dir_clean outputs/portfolio_goal_search "$DEST/portfolio_goal_search"
          copy_dir_clean outputs/main_v2_backtest "$DEST/main_v2_backtest"
          copy_dir_clean outputs/concentrated_policy_replay "$DEST/concentrated_policy_replay"
          copy_dir_clean outputs/concentrated_position_risk_replay "$DEST/concentrated_position_risk_replay"
          copy_dir_clean outputs/alpha_sprint_backtest "$DEST/alpha_sprint_backtest"
          copy_dir_clean outputs/position_aware_risk_replay "$DEST/position_aware_risk_replay"
          copy_dir_clean outputs/governance_catalyst "$DEST/governance_catalyst"
          copy_dir_clean outputs/style_regime_report "$DEST/style_regime_report"
          copy_dir_clean outputs/macro_policy_engine "$DEST/macro_policy_engine"
          copy_dir_clean outputs/monster_lifecycle_replay "$DEST/monster_lifecycle_replay"
          copy_dir_clean outputs/lifecycle_review_overlay_main "$DEST/lifecycle_review_overlay_main"
          copy_dir_clean outputs/monster_lifecycle_review_main "$DEST/monster_lifecycle_review_main"
          copy_dir_clean outputs/monster_lifecycle_review_concentrated "$DEST/monster_lifecycle_review_concentrated"
          copy_dir_clean outputs/historical_trade_journey "$DEST/historical_trade_journey"
          # Run summary
          cp outputs/full_rebuild_logs/verdict.log "$DEST/" 2>/dev/null || true
          # Symlink/copy to "latest" pointer for sync helper convenience
          rm -rf "cloud_results/full_rebuild/latest_${{ inputs.universe_mode }}"
          cp -r "$DEST" "cloud_results/full_rebuild/latest_${{ inputs.universe_mode }}"
          git add -f cloud_results/ 2>/dev/null || true
          if [ "${{ inputs.auto_learning_promote_live }}" = "true" ] && [ -f research/auto_feature_gates.yaml ]; then
            git add research/auto_feature_gates.yaml 2>/dev/null || true
          fi
          git diff --cached --quiet || \
            git commit -m "chore(bot): full rebuild [${{ inputs.universe_mode }}] $(date +%Y-%m-%d) [skip ci]"

          # Push with rebase-on-conflict (race condition guard). Use the
          # dispatch branch, not master, so branch test runs do not replay
          # master-only commits and conflict after a long rebuild.
          PUSHED="no"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$RESULT_BRANCH" 2>&1; then
              echo "[push] attempt $attempt: success"
              PUSHED="yes"
              break
            fi
            echo "[push] attempt $attempt: failed — fetch+rebase and retry"
            if fetch_result_branch && git rev-parse --verify "origin/${RESULT_BRANCH}" >/dev/null 2>&1; then
              git rebase --autostash "origin/${RESULT_BRANCH}" 2>&1 || git rebase --abort 2>&1 || true
            fi
            sleep $((attempt * 2))
          done
          if [ "$PUSHED" != "yes" ]; then
            echo "[push] WARN: result commit was not pushed after retries."
          fi
