      - name: Sync outputs to user's Google Drive (OAuth preferred, Service Account fallback)
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          # Auth method selection
          AUTH=""
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            AUTH="oauth"
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            AUTH="service_account"
          else
            echo "[gdrive-sync] No auth secret set (need GOOGLE_SERVICE_ACCOUNT_KEY or RCLONE_CONFIG_GDRIVE)"
            echo "[gdrive-sync] Mobile-only setup: see GDRIVE_MOBILE_SETUP.md"
            exit 0
          fi
          echo "[gdrive-sync] auth=$AUTH"

          # Install rclone (~5MB, ~3s)
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -qo /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone

          mkdir -p ~/.config/rclone

          if [ "$AUTH" = "service_account" ]; then
            # Mobile-friendly path: service account JSON in secret
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > ~/.config/rclone/rclone.conf
          else
            # OAuth fallback (legacy, PC-required setup)
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          fi

          # Sync FULL rebuild outputs. Only master may update canonical
          # GDrive outputs/. Branch experiments are isolated under
          # research_runs/<branch>/<run_id>/ so research cannot overwrite the
          # production operating view.
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-unknown}}"
          SAFE_BRANCH=$(printf '%s' "$BRANCH_NAME" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')
          if [ -z "$SAFE_BRANCH" ]; then
            SAFE_BRANCH="unknown"
          fi
          GDRIVE_SCOPE="research"
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            if [ "$BRANCH_NAME" = "master" ]; then
              GDRIVE_SCOPE="production"
              DEST="gdrive:outputs"
              LOG_DEST="gdrive:full_rebuild_logs"
            else
              DEST="gdrive:research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/outputs"
              LOG_DEST="gdrive:research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/full_rebuild_logs"
            fi
          else
            if [ "$BRANCH_NAME" = "master" ]; then
              GDRIVE_SCOPE="production"
              DEST="gdrive:${GDRIVE_FOLDER_NAME}/outputs"
              LOG_DEST="gdrive:${GDRIVE_FOLDER_NAME}/full_rebuild_logs"
            else
              DEST="gdrive:${GDRIVE_FOLDER_NAME}/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/outputs"
              LOG_DEST="gdrive:${GDRIVE_FOLDER_NAME}/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/full_rebuild_logs"
            fi
          fi
          GUARD_HARD_ERRORS="999"
          if [ -s outputs/portfolio_system_guard/error_check.json ]; then
            GUARD_HARD_ERRORS="$(python -c 'import json; from pathlib import Path; p=Path("outputs/portfolio_system_guard/error_check.json"); print(int(json.loads(p.read_text()).get("hard_error_count", 999))) if p.exists() else print(999)' 2>/dev/null || echo 999)"
          else
            echo "[gdrive-sync] WARN: portfolio_system_guard/error_check.json missing; preserving canonical outputs."
          fi
          # Universe-collapse guard (Full Rebuild #82 regression): a starved
          # universe (R1000 base dropped after a failed live IWB fetch) must NOT
          # overwrite the production GDrive outputs/ either. Mirror the
          # cloud_results rotation gate so master runs with < 400 scored R1000
          # base are routed to failed_runs/ instead of canonical outputs.
          UNIVERSE_HEALTHY="yes"
          if [ "${{ inputs.universe_mode }}" != "adr" ]; then
            UNIVERSE_HEALTHY="$(python - <<'PY' 2>/dev/null || echo no
import csv, json
from pathlib import Path
audit = Path("outputs/universe_health/universe_source_audit.json")
if audit.exists():
    payload = json.loads(audit.read_text(encoding="utf-8"))
    print("yes" if payload.get("promotion_allowed") is True else "no")
else:
    p = Path("outputs/scored_latest.csv")
    rows = list(csv.DictReader(p.open())) if p.exists() else []
    base = sum(1 for r in rows if "current_constituents_proxy" in str(r.get("universe_source", "")) or "historical_membership_file" in str(r.get("universe_source", "")))
    print("yes" if (rows and "universe_source" in rows[0] and base >= 400) else "no")
PY
)"
            echo "[gdrive-sync] universe_healthy=$UNIVERSE_HEALTHY (scored R1000 base >= 400 required for ${{ inputs.universe_mode }})"
          fi
          VALID_PRIMARY_OUTPUTS="no"
          if [ -s outputs/backtest_metrics.json ] && [ -s outputs/concentrated_backtest_metrics.json ] && [ "$GUARD_HARD_ERRORS" = "0" ] && [ "$UNIVERSE_HEALTHY" = "yes" ]; then
            VALID_PRIMARY_OUTPUTS="yes"
          else
            if [ "$UNIVERSE_HEALTHY" != "yes" ]; then
              echo "[gdrive-sync] WARN: INVALID_UNIVERSE (R1000 base collapsed); preserving canonical outputs and syncing this run under failed_runs/${GITHUB_RUN_ID}/"
            else
              echo "[gdrive-sync] WARN: core metrics missing or system guard hard errors=$GUARD_HARD_ERRORS; preserving canonical outputs and syncing this run under failed_runs/${GITHUB_RUN_ID}/"
            fi
            if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
              if [ "$BRANCH_NAME" = "master" ]; then
                DEST="gdrive:failed_runs/${GITHUB_RUN_ID}/outputs"
                LOG_DEST="gdrive:failed_runs/${GITHUB_RUN_ID}/full_rebuild_logs"
              else
                DEST="gdrive:research_runs/${SAFE_BRANCH}/failed_runs/${GITHUB_RUN_ID}/outputs"
                LOG_DEST="gdrive:research_runs/${SAFE_BRANCH}/failed_runs/${GITHUB_RUN_ID}/full_rebuild_logs"
              fi
            else
              if [ "$BRANCH_NAME" = "master" ]; then
                DEST="gdrive:${GDRIVE_FOLDER_NAME}/failed_runs/${GITHUB_RUN_ID}/outputs"
                LOG_DEST="gdrive:${GDRIVE_FOLDER_NAME}/failed_runs/${GITHUB_RUN_ID}/full_rebuild_logs"
              else
                DEST="gdrive:${GDRIVE_FOLDER_NAME}/research_runs/${SAFE_BRANCH}/failed_runs/${GITHUB_RUN_ID}/outputs"
                LOG_DEST="gdrive:${GDRIVE_FOLDER_NAME}/research_runs/${SAFE_BRANCH}/failed_runs/${GITHUB_RUN_ID}/full_rebuild_logs"
              fi
            fi
          fi
          SYNC_MODE="${{ inputs.gdrive_sync_mode }}"
          if [ "$SYNC_MODE" = "off" ]; then
            echo "[gdrive-sync] gdrive_sync_mode=off; skipping"
            exit 0
          fi
          echo "[gdrive-sync] branch=$BRANCH_NAME safe_branch=$SAFE_BRANCH scope=$GDRIVE_SCOPE mode=$SYNC_MODE valid_primary_outputs=$VALID_PRIMARY_OUTPUTS"
          # Manifest field: portfolio_system_guard_hard_errors
          python tools/build_gdrive_sync_manifest.py \
            --latest-run outputs \
            --mode "$SYNC_MODE" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --head-sha "${GITHUB_SHA}" \
            --branch-name "$BRANCH_NAME" \
            --safe-branch "$SAFE_BRANCH" \
            --auth "$AUTH" \
            --dest "$DEST" \
            --portfolio-system-guard-hard-errors "$GUARD_HARD_ERRORS" \
            --strict-primary

          : > outputs/gdrive_copy_status.jsonl
          while IFS=$'\t' read -r src rel required semantic production_valid metric_mode; do
            if [ -z "$src" ]; then
              continue
            fi
            if [ ! -e "$src" ]; then
              echo "[gdrive-sync] skip missing: $src"
              python - <<PY
          import json
          with open("outputs/gdrive_copy_status.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps({"source": "$src", "skipped": True, "copied": False, "failed": False}) + "\n")
          PY
              continue
            fi
            echo "[gdrive-sync] copy $src -> $DEST/$rel [$semantic]"
            if rclone copyto "$src" "$DEST/$rel" --transfers 4 --checkers 8 --stats 30s --stats-one-line; then
              python - <<PY
          import json
          with open("outputs/gdrive_copy_status.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps({"source": "$src", "skipped": False, "copied": True, "failed": False}) + "\n")
          PY
            else
              if [ "$required" = "true" ]; then
                python - <<PY
          import json
          with open("outputs/gdrive_copy_status.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps({"source": "$src", "skipped": False, "copied": False, "failed": True, "error": "rclone copyto failed"}) + "\n")
          PY
                exit 2
              fi
              python - <<PY
          import json
          with open("outputs/gdrive_copy_status.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps({"source": "$src", "skipped": False, "copied": False, "failed": True, "error": "optional rclone copyto failed"}) + "\n")
          PY
            fi
          done < outputs/gdrive_sync_files.tsv

          python tools/build_gdrive_sync_manifest.py \
            --latest-run outputs \
            --mode "$SYNC_MODE" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --head-sha "${GITHUB_SHA}" \
            --branch-name "$BRANCH_NAME" \
            --safe-branch "$SAFE_BRANCH" \
            --auth "$AUTH" \
            --dest "$DEST" \
            --portfolio-system-guard-hard-errors "$GUARD_HARD_ERRORS" \
            --copy-status outputs/gdrive_copy_status.jsonl \
            --strict-primary
          rclone copyto outputs/gdrive_sync_manifest.json "$DEST/gdrive_sync_manifest.json"
          echo "[gdrive-sync] manifest allowlist sync complete: $DEST"

          # Cleanup secret file
          rm -f /tmp/sa.json

          echo "[gdrive-sync] done — check Google Drive destination: $DEST"

      - name: Telegram alert + zip results (mobile-friendly)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNIVERSE_MODE: ${{ inputs.universe_mode }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "[telegram] secrets unset, skipping"
            exit 0
          fi
          STATUS="${{ job.status }}"

          # Phase A automation: rich verdict via auto_verdict_summary.py
          # Includes ΔCAGR/ΔSharpe/ΔMaxDD vs CURRENT_BASELINE, sleeve composition,
          # top 5 holdings, concentrated portfolio, and recommended action.
          set +e
          SUMMARY=$(python3 tools/auto_verdict_summary.py --mode "$UNIVERSE_MODE" 2>&1)
          set -e

          # Build Telegram message: [status header] + [rich summary] + [run URL]
          MSG_HEADER="🔁 FULL rebuild status: ${STATUS}"
          # URL-encode (one-liner — multiline heredoc with indent caused IndentationError)
          ENCODED_SUMMARY=$(printf '%s' "$SUMMARY" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
          ENCODED_HEADER=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$MSG_HEADER'))")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="${ENCODED_HEADER}%0A%0A${ENCODED_SUMMARY}%0A%0Arun:%20${RUN_URL}"

          # Telegram message limit = 4096 chars. Truncate if too long.
          MSG_LEN=${#MSG}
          if [ "$MSG_LEN" -gt 3900 ]; then
            MSG="${MSG:0:3900}%0A%0A...truncated"
          fi

          curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "disable_web_page_preview=true" > /dev/null \
            || echo "[telegram] rich notification failed (length=$MSG_LEN)"

          # Mobile-friendly: send a small curated set of result files as
          # individual Telegram documents. The previous full-output ZIP
          # bundle frequently exceeded Telegram's 50MB sendDocument
          # limit (run 25713620719 produced a 54.4MB bundle). Sending
          # individual high-signal files avoids the size ceiling and
          # gives the operator the most useful numbers on phone. A
          # richer bundling story can be revisited later.
          TG_FILES=(
            "outputs/user_current/README_FIRST.md"
            "outputs/user_current/01_current_holdings.csv"
            "outputs/user_current/03_period_returns.csv"
            "outputs/user_current/04_official_metrics.json"
            "outputs/user_current/05_action_summary.md"
            "outputs/user_current/06_benchmark_comparison.csv"
            "outputs/daily_crisis_monitor/crisis_action_status.md"
            "outputs/decision_cadence/decision_cadence_report.md"
            "outputs/decision_cadence/decision_cadence_summary.json"
            "outputs/patch_application_manifest.json"
            "outputs/operator_review/dust_positions_report.csv"
            "outputs/operator_review/dust_cleanup_orders.csv"
            "outputs/operator_review/projected_holdings_after_ready_orders.csv"
            "outputs/operator_review/projected_holdings_after_integrated_target.csv"
            "outputs/operator_review/projected_orders_from_integrated_target.csv"
            "outputs/operator_review/sidecar_vs_current_diff.csv"
            "outputs/shadow_operating"
            "outputs/promotion_review"
            "outputs/alphaops_vnext/summary.json"
            "outputs/alphaops_vnext/production_activation.json"
            "outputs/broker_replay/main/metrics.json"
            "outputs/broker_replay/concentrated/metrics.json"
          )
          MAX_TG_FILE_BYTES=5000000
          for FILE in "${TG_FILES[@]}"; do
            if [ ! -s "$FILE" ]; then
              echo "[telegram] skip missing: $FILE"
              continue
            fi
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -gt "$MAX_TG_FILE_BYTES" ]; then
              echo "[telegram] skip oversized $FILE ($FILE_SIZE bytes > $MAX_TG_FILE_BYTES)"
              continue
            fi
            CAPTION_TG="r1000 ${{ inputs.universe_mode }} ${STATUS} :: $FILE"
            if curl -sf -F "document=@${FILE}" \
                 -F "chat_id=${TELEGRAM_CHAT_ID}" \
                 -F "caption=${CAPTION_TG}" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                 > /dev/null 2>&1; then
              echo "[telegram] sent $FILE ($FILE_SIZE bytes)"
            else
              echo "[telegram] failed to send $FILE ($FILE_SIZE bytes)"
            fi
          done

      - name: Commit verdict + portfolio CSVs (always — diagnostics on fail)
        if: always()    # ← changed from success() to capture fail-state logs
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          RESULT_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [ -z "$RESULT_BRANCH" ] || [ "$RESULT_BRANCH" = "HEAD" ]; then
            RESULT_BRANCH="${{ github.ref_name }}"
          fi
          echo "[push] result branch: $RESULT_BRANCH"
          fetch_result_branch() {
            git fetch --prune --depth=100 origin "+refs/heads/${RESULT_BRANCH}:refs/remotes/origin/${RESULT_BRANCH}" 2>&1
          }
          if fetch_result_branch && git rev-parse --verify "origin/${RESULT_BRANCH}" >/dev/null 2>&1; then
            if ! git rebase --autostash "origin/${RESULT_BRANCH}" 2>&1; then
              git rebase --abort 2>&1 || true
              echo "[push] pre-stage rebase failed; artifacts and GDrive sync are already preserved, skipping cloud_results commit."
              exit 0
            fi
          else
            echo "[push] WARN: could not fetch origin/${RESULT_BRANCH}; continuing without pre-stage rebase."
          fi
          mkdir -p cloud_results/full_rebuild
          GUARD_HARD_ERRORS="999"
          if [ -s outputs/portfolio_system_guard/error_check.json ]; then
            GUARD_HARD_ERRORS="$(python -c 'import json; from pathlib import Path; p=Path("outputs/portfolio_system_guard/error_check.json"); print(int(json.loads(p.read_text()).get("hard_error_count", 999))) if p.exists() else print(999)' 2>/dev/null || echo 999)"
          else
            echo "[push] WARN: portfolio_system_guard/error_check.json missing; preserving latest pointer."
          fi
          # Universe-collapse guard (Full Rebuild #82 regression, 2026-05-26).
          # Even when metrics exist and the system guard is clean, a starved
          # universe (R1000 base dropped after a failed live IWB fetch -> ~58
          # whitelist-only names) must NOT overwrite the shipped baseline.
