name: Full Rebuild (Manual / Long-Run)

# FULL pipeline rebuild (collector + universe + feature_store + walk-forward
# + backtest). Required when ENGINE_REUSE_VERSION bumps OR when feature_store
# schema changes (new PHASE_X_COLUMNS additions like Phase 14 hybrid alpha).
#
# Estimated runtime: ~3-5 hours (within GHA 6h timeout). Can use up to ~50%
# of free-tier monthly minutes (2000) PER run, so trigger judiciously.
#
# Schedule: NONE (manual trigger only via workflow_dispatch).
# Reason: A FULL rebuild is a deliberate decision. Auto-triggering would
# burn the entire monthly free tier in 1-2 runs.

on:
  workflow_dispatch:
    inputs:
      universe_mode:
        description: 'r1000 baseline | r1000+adr | global_alpha_universe (R1000+ADR+cycle play) | r1000+cycle | r1000+adr_phase14_off control'
        type: choice
        options:
          - global_alpha_universe
          - r1000
          - r1000+adr
          - r1000+cycle
          - r1000+adr_phase14_off
        default: global_alpha_universe
      backtest_years:
        description: 'official out-of-sample backtest window years (8 = current SHIP standard; 10 remains research/partial until full coverage)'
        type: choice
        options:
          - '8'
          - '10'
        default: '8'
      skip_collector:
        description: 'skip data collection (use cached prices/SEC/macro). Saves ~1-2h.'
        type: boolean
        default: true
      fast_mode:
        description: 'fast_mode=True (5 backtests, 2-3h total) vs False (FULL, 5-6h, may timeout)'
        type: boolean
        default: true
      leader_rescue_mode:
        description: 'leader rescue validation: latest_only=PIT-safe default, full_proxy=research/survivorship proxy, off=control'
        type: choice
        options:
          - latest_only
          - full_proxy
          - off
        default: latest_only
      cache_key_suffix:
        description: 'optional cache key suffix (e.g. "phase14-baseline" to keep separate caches)'
        type: string
        default: ''
      auto_learning_promote_live:
        description: 'guarded: if candidate gates pass promotion checks, commit research/auto_feature_gates.yaml for the next run'
        type: boolean
        default: false
      mode_y_enabled:
        description: 'Mode Y engine port: apply regime-conditioned capacity filter inline at operating-book build time so the headline broker_replay metrics reflect the filter (vs Mode X sidecar parallel measurement).'
        type: boolean
        default: false
      mode_y_main_multipliers:
        description: 'Mode Y Main portfolio multipliers (e.g. "bear=0.5,deep_bear=0.25"). Pass "" to disable Main filter while keeping Conc filter.'
        type: string
        default: 'bear=0.5,deep_bear=0.25'
      mode_y_concentrated_multipliers:
        description: 'Mode Y Concentrated portfolio multipliers (e.g. "bear=0.5,deep_bear=0.25,neutral=0.85").'
        type: string
        default: 'bear=0.5,deep_bear=0.25,neutral=0.85'

permissions:
  contents: write   # commit final scored CSVs + verdict to cloud_results/

jobs:
  full_rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 5h 50m (just under 6h GHA hard limit)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt
          # Heavy ML deps for full rebuild (not in requirements_github.txt by default)
          pip install "catboost>=1.2" "lightgbm>=4.0" "xgboost>=2.0" "scikit-learn>=1.4"

      # Cache collector outputs (price bars, SEC EDGAR XBRL, macro CSVs)
      # These are slow to fetch (rate limits) and rarely change.
      # `outputs/companyfacts.zip` is the SEC bulk archive — refreshed by the
      # next step. Caching keeps it across runs so we only re-download when
      # older than --max-age-days.
      - name: Restore collector cache
        uses: actions/cache@v4
        with:
          path: |
            cache_prices
            cache_fsds
            cache_macro
            cache_sec_actual
            cache_misc
            cache_live_fund
            aggressive/cache/bars
            aggressive/cache/finnhub
            aggressive/state/finnhub
            outputs/sec_companyfacts
            outputs/macro
            outputs/companyfacts.zip
          key: collector-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            collector-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-
            collector-cache-${{ runner.os }}-

      # Refresh SEC companyfacts.zip bulk archive if missing or older than 7d.
      # Without this, the pipeline silently falls back to per-CIK API calls
      # which respect companyfacts_refresh_days, but with --no-collector that
      # path never executes either — fundamentals lane goes stale →
      # fundamental_coverage_ok=False → portfolio_latest.csv blocked.
      # 7-day threshold = weekly refresh. Runs less than 7 days apart reuse
      # cache; longer gaps trigger re-download (~1GB once).
      - name: Refresh SEC companyfacts bulk archive
        env:
          SEC_USER_AGENT: "R1000InstitutionalBot (contact: andrewcha231@gmail.com)"
        run: |
          mkdir -p outputs
          python tools/refresh_companyfacts_bulk.py \
            --base-dir "$(pwd)/outputs" \
            --max-age-days 7 \
            --required

      # Cache feature_store + scored outputs (large files, prior FULL rebuild result)
      - name: Restore engine cache
        uses: actions/cache@v4
        with:
          path: |
            outputs/feature_store_*.parquet
            outputs/scored_*.csv
            outputs/walk_forward
          key: engine-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            engine-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-
            engine-cache-${{ runner.os }}-

      - name: Smoke test pre-flight
        run: |
          python tests/smoke_test.py
          python tests/audit_features.py --no-runtime

      - name: Phase 15-D data preflight
        run: |
          python - <<'PY'
          from pathlib import Path

          import pandas as pd

          from aggressive.universe import load_cycle_play_universe
          from r1000_helpers import px_cache_name

          cycle_tickers, _ = load_cycle_play_universe()
          missing_prices = [
              t for t in sorted(cycle_tickers)
              if not (Path("cache_prices") / px_cache_name(t)).exists()
          ]
          print(
              "[cycle] active=%d missing_price_cache_before_collector=%d"
              % (len(cycle_tickers), len(missing_prices))
          )
          if missing_prices:
              print("[cycle] missing sample: " + ", ".join(missing_prices[:30]))

          p = Path("aggressive/state/finnhub/r1000_features.parquet")
          if p.exists():
              df = pd.read_parquet(p)
              print(
                  "[finnhub] fallback parquet present rows=%d cols=%d"
                  % (len(df), len(df.columns))
              )
          else:
              print("[finnhub] WARN fallback parquet missing; Phase 15-D fallback will degrade")
          PY

      - name: Run FULL rebuild
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          # Per Phase 14 wiring + Phase 1 backtest validation
          UNIVERSE_MODE: ${{ inputs.universe_mode }}
          BACKTEST_YEARS: ${{ inputs.backtest_years }}
          LEADER_RESCUE_MODE: ${{ inputs.leader_rescue_mode }}
          PHASE_PHASE14_HYBRID_ALPHA_ENABLED: ${{ inputs.universe_mode == 'r1000+adr_phase14_off' && '0' || 'auto' }}
        run: |
          set -e
          set -o pipefail   # ← critical: catch python failures through tee pipe
          mkdir -p outputs/full_rebuild_logs
          LOG="outputs/full_rebuild_logs/$(date +%Y%m%d_%H%M%S)_${{ inputs.universe_mode }}.log"

          # Auto-detect: skip_collector=true is unsafe on FIRST run (no cache).
          # Check for collector cache markers; if absent, force collector run
          # even when user requested skip. Prevents the "1-min crash" bug from
          # reuse_existing_artifacts=True hitting empty parquet/csv paths.
          SKIP_COLLECTOR=""
          CACHE_PRESENT="no"
          has_cache_files() {
            [ -d "$1" ] && [ -n "$(find "$1" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]
          }
          if has_cache_files cache_prices; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_sec_actual; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_fsds; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_macro; then
            CACHE_PRESENT="yes"
          fi
          if [ -d aggressive/cache/finnhub ] && [ -n "$(ls -A aggressive/cache/finnhub 2>/dev/null)" ]; then
            CACHE_PRESENT="yes"
          fi
          if [ -d aggressive/cache/bars ] && [ -n "$(ls -A aggressive/cache/bars 2>/dev/null)" ]; then
            CACHE_PRESENT="yes"
          fi
          if ls outputs/feature_store_*.parquet 1>/dev/null 2>&1; then
            CACHE_PRESENT="yes"
          fi

          if [ "${{ inputs.skip_collector }}" = "true" ]; then
            if [ "$CACHE_PRESENT" = "yes" ]; then
              SKIP_COLLECTOR="--no-collector"
              echo "[skip_collector] cache present, skipping data collection"
            else
              echo "[skip_collector] WARN: requested but NO cache found in this runner."
              echo "[skip_collector]       Running collector anyway (first cloud run; will populate cache for future runs)."
            fi
          fi

          # fast_mode: true = 5 backtests + 6m retrain (~2-3h total, fits in 6h GHA limit)
          # fast_mode: false = full walk-forward (~5-6h, may TIMEOUT on first cloud run)
          # Previous run (24950857695) was cancelled at 7h+ — fast_mode now exposed.
          FAST_MODE_FLAG="${{ inputs.fast_mode }}"

          echo "=========================================="
          echo "FULL REBUILD START"
          echo "  universe_mode:    $UNIVERSE_MODE"
          echo "  skip_collector:   ${{ inputs.skip_collector }} (effective: $([ -n "$SKIP_COLLECTOR" ] && echo SKIP || echo RUN))"
          echo "  cache_present:    $CACHE_PRESENT"
          echo "  fast_mode:        $FAST_MODE_FLAG"
          echo "  backtest_years:   $BACKTEST_YEARS"
          echo "  leader_rescue:    $LEADER_RESCUE_MODE"
          echo "  ENGINE_REUSE_VERSION: $(python -c 'from r1000_config import ENGINE_REUSE_VERSION; print(ENGINE_REUSE_VERSION)')"
          echo "=========================================="

          # Use --base-dir to override Drive path with repo-local outputs/
          # --fast-mode passed as CLI flag (run_local.py:162 supports it natively)
          python run_local.py --full --fast-mode "$FAST_MODE_FLAG" --backtest-years "$BACKTEST_YEARS" --leader-rescue-mode "$LEADER_RESCUE_MODE" $SKIP_COLLECTOR --base-dir "$(pwd)" 2>&1 | tee "$LOG"

      - name: Verdict (Cell E equivalent)
        if: always()
        run: |
          python run_local.py --verdict-only --base-dir "$(pwd)" 2>&1 | tee outputs/full_rebuild_logs/verdict.log || true

      - name: Auto-learning diagnostics (sidecar)
        if: always()
        run: |
          mkdir -p outputs/auto_learning
          CANDIDATE_GATES="outputs/auto_learning/auto_feature_gates_candidate.yaml"
          rm -f "$CANDIDATE_GATES"
          python tools/build_concentrated_trade_journal.py --latest-run outputs --output-dir outputs/concentrated_trade_journal 2>&1 | tee outputs/auto_learning/concentrated_trade_journal.log || true
          EXTRA_TRADES=""
          if [ -f outputs/concentrated_trade_journal/trades.csv ]; then
            EXTRA_TRADES="--extra-trades outputs/concentrated_trade_journal/trades.csv"
          fi
          python tools/trade_insights.py --no-shap $EXTRA_TRADES 2>&1 | tee outputs/auto_learning/trade_insights.log || true
          python tools/feature_gate_proposal.py --gates-out "$CANDIDATE_GATES" 2>&1 | tee outputs/auto_learning/feature_gate_proposal.log || true
          if [ "${{ inputs.auto_learning_promote_live }}" = "true" ]; then
            python tools/auto_learning_promote.py --candidate-gates "$CANDIDATE_GATES" --active-gates research/auto_feature_gates.yaml 2>&1 | tee outputs/auto_learning/promotion_decision.log || true
          else
            python tools/auto_learning_promote.py --dry-run --candidate-gates "$CANDIDATE_GATES" --active-gates research/auto_feature_gates.yaml 2>&1 | tee outputs/auto_learning/promotion_decision.log || true
          fi
          python tools/auto_policy_proposal.py --latest-run outputs --candidate-out outputs/auto_learning/auto_learning_policy_candidate.yaml --diff-out outputs/auto_learning/policy_proposal_diff.md --evidence-out outputs/auto_learning/evidence_snapshot.json --summary-out outputs/auto_learning/policy_candidate_summary.md 2>&1 | tee outputs/auto_learning/auto_policy_proposal.log || true
          python tools/auto_policy_challenger.py --policy outputs/auto_learning/auto_learning_policy_candidate.yaml --latest-run outputs --out-dir outputs/auto_learning/challenger 2>&1 | tee outputs/auto_learning/auto_policy_challenger.log || true
          python tools/auto_policy_promote.py --candidate-policy outputs/auto_learning/auto_learning_policy_candidate.yaml --challenger-decision outputs/auto_learning/challenger/challenger_decision.json --out-dir outputs/auto_learning/promotion 2>&1 | tee outputs/auto_learning/auto_policy_promotion.log || true

      - name: Portfolio target replay + goal search (sidecar)
        if: always()
        env:
          MODE_Y_ENABLED: ${{ inputs.mode_y_enabled }}
          MODE_Y_MAIN_MULTIPLIERS: ${{ inputs.mode_y_main_multipliers }}
          MODE_Y_CONC_MULTIPLIERS: ${{ inputs.mode_y_concentrated_multipliers }}
        run: |
          set -e
          set -o pipefail
          python tools/run_main_v2_backtest.py --latest-run outputs --output-dir outputs/main_v2_backtest 2>&1 | tee outputs/full_rebuild_logs/main_v2_backtest.log || true
          python tools/run_main_v3_alpha_concentration.py --latest-run outputs --output-dir outputs/main_v3_alpha_concentration --single-name-cap 0.33 --cash-floor 0.00 2>&1 | tee outputs/full_rebuild_logs/main_v3_alpha_concentration.log || true
          python tools/run_concentrated_policy_replay.py --latest-run outputs --output-dir outputs/concentrated_policy_replay 2>&1 | tee outputs/full_rebuild_logs/concentrated_policy_replay.log || true
          python tools/run_concentrated_v2_challenger.py --latest-run outputs --output-dir outputs/concentrated_v2_challenger --target-n 7 --single-cap 0.25 2>&1 | tee outputs/full_rebuild_logs/concentrated_v2_challenger.log || true
          python tools/run_concentrated_position_risk_replay.py --latest-run outputs --output-dir outputs/concentrated_position_risk_replay 2>&1 | tee outputs/full_rebuild_logs/concentrated_position_risk_replay.log || true
          python tools/run_alpha_sprint_backtest.py --latest-run outputs --output-dir outputs/alpha_sprint_backtest 2>&1 | tee outputs/full_rebuild_logs/alpha_sprint_backtest.log || true
          python tools/run_position_aware_risk_replay.py --holdings outputs/main_v2_backtest/monthly_holdings.csv --output-dir outputs/position_aware_risk_replay 2>&1 | tee outputs/full_rebuild_logs/position_aware_risk_replay.log || true
          if [ "$MODE_Y_ENABLED" = "true" ]; then
            python tools/build_operating_target_books.py --latest-run outputs --price-cache cache_prices --output-dir outputs/reports --apply-regime-capacity-filter --main-multipliers "$MODE_Y_MAIN_MULTIPLIERS" --concentrated-multipliers "$MODE_Y_CONC_MULTIPLIERS" 2>&1 | tee outputs/full_rebuild_logs/operating_target_books.log
          else
            python tools/build_operating_target_books.py --latest-run outputs --price-cache cache_prices --output-dir outputs/reports 2>&1 | tee outputs/full_rebuild_logs/operating_target_books.log
          fi
          python tools/archive_target_snapshots.py --latest-run outputs --price-cache cache_prices --output-dir outputs/target_snapshots 2>&1 | tee outputs/full_rebuild_logs/target_snapshot_archive.log
          python tools/build_replay_price_cache.py --books outputs/reports/operating_main_target_book.csv outputs/reports/operating_concentrated_target_book.csv --candidate-books outputs/reports/candidate_replay_book.csv --candidate-max-per-date 20 --candidate-max-total 600 --extra-tickers QQQ SPY '^IXIC' '^GSPC' --max-scored 0 --output-dir cache_prices --batch-size 8 --refresh-stale-days -1 2>&1 | tee outputs/full_rebuild_logs/benchmark_price_cache_preflight.log || true
          python tools/run_position_risk_weekly_validation.py --holdings outputs/reports/main_monthly_weights.csv --period-map outputs/reports/regime_by_month.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/position_risk_weekly_validation/main 2>&1 | tee outputs/full_rebuild_logs/position_risk_weekly_validation_main.log || true
          python tools/run_position_risk_weekly_validation.py --holdings outputs/main_v2_backtest/monthly_holdings.csv --period-map outputs/reports/regime_by_month.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/position_risk_weekly_validation/main_v2 2>&1 | tee outputs/full_rebuild_logs/position_risk_weekly_validation_main_v2.log || true
          python tools/run_position_risk_weekly_validation.py --holdings outputs/main_v3_alpha_concentration/monthly_holdings.csv --period-map outputs/reports/regime_by_month.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/position_risk_weekly_validation/main_v3_alpha_concentration 2>&1 | tee outputs/full_rebuild_logs/position_risk_weekly_validation_main_v3_alpha_concentration.log || true
          python tools/run_position_risk_weekly_validation.py --holdings outputs/reports/concentrated_strategy_holdings.csv --period-map outputs/reports/concentrated_strategy_monthly.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/position_risk_weekly_validation/concentrated 2>&1 | tee outputs/full_rebuild_logs/position_risk_weekly_validation_concentrated.log || true
          python tools/run_broker_ledger_replay.py --target-book outputs/reports/operating_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/broker_replay/main --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 --tail-row-fill-fallback-same-close 2>&1 | tee outputs/full_rebuild_logs/broker_ledger_replay_main.log
          python tools/run_broker_ledger_replay.py --target-book outputs/reports/operating_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/broker_replay/concentrated --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 --tail-row-fill-fallback-same-close 2>&1 | tee outputs/full_rebuild_logs/broker_ledger_replay_concentrated.log
          python tools/run_broker_market_circuit_replay.py --target-book outputs/reports/operating_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/broker_market_circuit_replay/main --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/broker_market_circuit_replay_main.log || true
          python tools/run_broker_market_circuit_replay.py --target-book outputs/reports/operating_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/broker_market_circuit_replay/concentrated --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/broker_market_circuit_replay_concentrated.log || true
          python tools/run_broker_market_circuit_grid.py --target-book outputs/reports/operating_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/broker_market_circuit_grid/main --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/broker_market_circuit_grid_main.log || true
          python tools/run_broker_market_circuit_grid.py --target-book outputs/reports/operating_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/broker_market_circuit_grid/concentrated --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/broker_market_circuit_grid_concentrated.log || true
          python tools/run_broker_ledger_replay.py --target-book outputs/main_v3_alpha_concentration/monthly_holdings.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/main_v3_alpha_concentration_broker_replay --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/main_v3_alpha_concentration_broker_replay.log || true
          python tools/run_broker_ledger_replay.py --target-book outputs/concentrated_v2_challenger/monthly_holdings.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/concentrated_v2_challenger_broker_replay --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/concentrated_v2_challenger_broker_replay.log || true
          python tools/run_concentrated_broker_grid.py --target-book outputs/reports/operating_concentrated_target_book.csv --price-cache cache_prices --output-dir outputs/concentrated_broker_grid --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 --max-variants 10 --tail-row-fill-fallback-same-close 2>&1 | tee outputs/full_rebuild_logs/concentrated_broker_grid.log || true
          python tools/build_event_target_books.py --latest-run outputs --price-cache cache_prices --output-dir outputs/event_target_books --reports-dir outputs/reports 2>&1 | tee outputs/full_rebuild_logs/event_target_books.log || true
          if [ -s outputs/reports/event_main_target_book.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/event_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/event_broker_replay/main --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/event_broker_replay_main.log || true
          fi
          if [ -s outputs/reports/event_concentrated_target_book.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/event_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/event_broker_replay/concentrated --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/event_broker_replay_concentrated.log || true
          fi
          python tools/build_weekly_leader_target_books.py --latest-run outputs --price-cache cache_prices --output-dir outputs/weekly_leader_snapshots --reports-dir outputs/reports 2>&1 | tee outputs/full_rebuild_logs/weekly_leader_target_books.log || true
          if [ -s outputs/reports/weekly_leader_main_target_book.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/weekly_leader_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/weekly_leader_broker_replay/main --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/weekly_leader_broker_replay_main.log || true
          fi
          if [ -s outputs/reports/weekly_leader_concentrated_target_book.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/weekly_leader_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/weekly_leader_broker_replay/concentrated --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/weekly_leader_broker_replay_concentrated.log || true
          fi
          if [ -s outputs/reports/operating_main_target_book.csv ]; then
            python tools/run_cost_sensitivity_sidecar.py --target-book outputs/reports/operating_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/cost_sensitivity/main --cost-bps-list 25 50 75 100 --baseline-cost-bps 25 2>&1 | tee outputs/full_rebuild_logs/cost_sensitivity_main.log || true
          fi
          if [ -s outputs/reports/operating_concentrated_target_book.csv ]; then
            python tools/run_cost_sensitivity_sidecar.py --target-book outputs/reports/operating_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/cost_sensitivity/concentrated --cost-bps-list 25 50 75 100 --baseline-cost-bps 25 2>&1 | tee outputs/full_rebuild_logs/cost_sensitivity_concentrated.log || true
          fi
          if [ -s outputs/reports/operating_main_target_book.csv ]; then
            python tools/run_neutral_regime_churn_filter.py --input-book outputs/reports/operating_main_target_book.csv --output-book outputs/reports/operating_main_target_book_churn_filtered.csv --diagnostics outputs/churn_filter/main/diagnostics.json --swap-threshold 2 --window-months 6 --target-regimes neutral 2>&1 | tee outputs/full_rebuild_logs/churn_filter_main.log || true
          fi
