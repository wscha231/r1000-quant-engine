          UNIVERSE_HEALTHY="yes"
          if [ "${{ inputs.universe_mode }}" != "adr" ]; then
            UNIVERSE_HEALTHY="$(python - <<'PY' 2>/dev/null || echo no
import csv, json
from pathlib import Path
audit = Path("outputs/universe_health/universe_source_audit.json")
if audit.exists():
    payload = json.loads(audit.read_text(encoding="utf-8"))
    print("yes" if payload.get("promotion_allowed") is True else "no")
else:
    p = Path("outputs/scored_latest.csv")
    rows = list(csv.DictReader(p.open())) if p.exists() else []
    base = sum(1 for r in rows if "current_constituents_proxy" in str(r.get("universe_source", "")) or "historical_membership_file" in str(r.get("universe_source", "")))
    print("yes" if (rows and "universe_source" in rows[0] and base >= 400) else "no")
PY
)"
            echo "[push] universe_healthy=$UNIVERSE_HEALTHY (scored R1000 base >= 400 required for ${{ inputs.universe_mode }})"
          fi
          RUN_ARTIFACT_VALID="no"
          if [ -s outputs/backtest_metrics.json ] && [ -s outputs/concentrated_backtest_metrics.json ] && [ "$GUARD_HARD_ERRORS" = "0" ] && [ "$UNIVERSE_HEALTHY" = "yes" ]; then
            RUN_ARTIFACT_VALID="yes"
            DEST="cloud_results/full_rebuild/$(date +%Y%m%d)_${{ inputs.universe_mode }}"
          else
            DEST="cloud_results/full_rebuild/failed_runs/${GITHUB_RUN_ID}_${{ inputs.universe_mode }}"
            if [ "$UNIVERSE_HEALTHY" != "yes" ]; then
