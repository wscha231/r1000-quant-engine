name: Full Rebuild (Manual / Long-Run)

# FULL pipeline rebuild (collector + universe + feature_store + walk-forward
# + backtest). Required when ENGINE_REUSE_VERSION bumps OR when feature_store
# schema changes (new PHASE_X_COLUMNS additions like Phase 14 hybrid alpha).
#
# Estimated runtime: ~3-5 hours (within GHA 6h timeout). Can use up to ~50%
# of free-tier monthly minutes (2000) PER run, so trigger judiciously.
#
# Schedule: WEEKLY (Mon 09:00 UTC) + manual workflow_dispatch.
# The weekly cron is the self-sustaining loop's heartbeat: each run appends a
# row to cloud_results/performance_ledger/ledger.jsonl (IS-CAGR trend, Tier-2
# gate pass, IS-attribution leak tags), so the engine's trajectory accumulates
# and self-evaluates without manual intervention.
# CAVEAT: GitHub only fires `schedule:` from the repository's DEFAULT branch.
# This cron stays dormant until this workflow is merged to the default branch;
# until then the loop runs per manual/dispatched run (which already accumulate
# the ledger). A scheduled run uses input DEFAULTS — note portfolio_policy now
# defaults to alphaops_vnext_production, so the weekly run produces the
# production cash-overlay book + ledger row automatically.
# Budget: a FULL rebuild is ~3-5h and up to ~50% of the 2000-min monthly free
# tier per run. Weekly (~4 runs/mo) is the affordable cadence; drop to monthly
# if the budget tightens.

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC — weekly self-sustaining ledger run
  workflow_dispatch:
    inputs:
      universe_mode:
        description: 'r1000 baseline | r1000+adr | global_alpha_universe (R1000+ADR+cycle play) | r1000+cycle | r1000+adr_phase14_off control'
        type: choice
        options:
          - global_alpha_universe
          - r1000
          - r1000+adr
          - r1000+cycle
          - r1000+adr_phase14_off
        default: global_alpha_universe
      backtest_years:
        description: 'official out-of-sample backtest window years (8 = current SHIP standard; 10 remains research/partial until full coverage)'
        type: choice
        options:
          - '8'
          - '10'
        default: '8'
      skip_collector:
        description: 'skip data collection (use cached prices/SEC/macro). Saves ~1-2h.'
        type: boolean
        default: true
      fast_mode:
        description: 'fast_mode=True (5 backtests, 2-3h total) vs False (FULL, 5-6h, may timeout)'
        type: boolean
        default: true
      leader_rescue_mode:
        description: 'leader rescue validation: latest_only=PIT-safe default, full_proxy=research/survivorship proxy, off=control'
        type: choice
        options:
          - latest_only
          - full_proxy
          - off
        default: latest_only
      cache_key_suffix:
        description: 'optional cache key suffix (e.g. "phase14-baseline" to keep separate caches)'
        type: string
        default: ''
      auto_learning_promote_live:
        description: 'guarded: if candidate gates pass promotion checks, commit research/auto_feature_gates.yaml for the next run'
        type: boolean
        default: false
      phase11_multibagger_enabled:
        description: 'Phase 11 multibagger ML sleeve. CHANGELOG 13448: A/B REJECT (CAGR -1.73pp, sleeve_cap_policy_compare bug). Default OFF — keep OFF unless you are explicitly experimenting and accept regression risk.'
        type: boolean
        default: false
      phase11_episodes_source:
        description: 'multibagger training episodes source if you DO experiment with Phase 11 (v1=55 ep / v2=162 ep)'
        type: choice
        options:
          - v2
          - v1
        default: v2
      sidecar_profile:
        description: 'sidecar generation profile: operating_minimal avoids heavy research sidecars'
        type: choice
        options:
          - operating_minimal
          - official
          - research_full
          - phase_g_only
        default: operating_minimal
      artifact_profile:
        description: 'artifact upload profile'
        type: choice
        options:
          - minimal
          - official
          - research_full
        default: minimal
      gdrive_sync_mode:
        description: 'Google Drive sync allowlist mode'
        type: choice
        options:
          - minimal
          - official
          - research
          - off
        default: minimal
      portfolio_policy:
        description: 'operating target policy: baseline, shadow-only integrated/market-leader, approved integrated, or AlphaOps vNext production'
        type: choice
        options:
          - production_baseline
          - integrated_shadow
          - market_leader_shadow
          - approved_integrated
          - alphaops_vnext_production
        default: alphaops_vnext_production
      approved_target_policy_path:
        description: 'approved_integrated policy file path; default stays unapproved'
        type: string
        default: outputs/promotion_review/approved_target_policy.json
      experiment_env_json:
        description: 'review-approved A/B env overrides as JSON object; keys must start with PHASE_, R1000_, or ALPHAOPS_'
        type: string
        default: ''

permissions:
  contents: write   # commit final scored CSVs + verdict to cloud_results/

jobs:
  full_rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 5h 50m (just under 6h GHA hard limit)

    steps:
      - name: Free disk space on runner
        # Full Rebuild 27426321227 (2026-06-12, cold cache) failed with
        # OSError [Errno 28] No space left on device while writing
        # fund_panel_latest.parquet. ubuntu-latest ships ~14 GB free, and a
        # cold collector loads SEC companyfacts (~1.3 GB), FSDS history
        # (~60 quarterly zips ≈ several GB), and 1100-ticker price history at
        # once, then parquet buffers on top of that. The pre-installed
        # Android/.NET/Haskell/CodeQL toolchains consume ~30 GB we never use.
        # Removing them up-front gives the collector room to finish.
        run: |
          set -eu
          echo "=== disk before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift \
                      /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY/Ruby" \
                      "$AGENT_TOOLSDIRECTORY/PyPy" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after ==="; df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt
          # Heavy ML deps for full rebuild (not in requirements_github.txt by default)
          pip install "catboost>=1.2" "lightgbm>=4.0" "xgboost>=2.0" "scikit-learn>=1.4"

      - name: Apply review-approved experiment env
        env:
          EXPERIMENT_ENV_JSON: ${{ github.event.inputs.experiment_env_json || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys

          raw = os.environ.get("EXPERIMENT_ENV_JSON", "").strip()
          if not raw:
              print("[experiment-env] no overrides")
              raise SystemExit(0)
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"[experiment-env] invalid JSON: {exc}", file=sys.stderr)
              raise SystemExit(2)
          if not isinstance(payload, dict):
              print("[experiment-env] payload must be a JSON object", file=sys.stderr)
              raise SystemExit(2)
          allowed = re.compile(r"^(PHASE_|R1000_|ALPHAOPS_)[A-Z0-9_]+$")
          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as fh:
              for key, value in sorted(payload.items()):
                  key = str(key).strip().upper()
                  if not allowed.match(key):
                      print(f"[experiment-env] rejected key: {key}", file=sys.stderr)
                      raise SystemExit(2)
                  text = str(value).replace("\n", " ").replace("\r", " ").strip()
                  fh.write(f"{key}={text}\n")
                  print(f"[experiment-env] applied {key}={text}")
          PY

      # Cache collector outputs (price bars, SEC EDGAR XBRL, macro CSVs)
      # These are slow to fetch (rate limits) and rarely change.
      # `outputs/companyfacts.zip` is the SEC bulk archive — refreshed by the
      # next step. Caching keeps it across runs so we only re-download when
      # older than --max-age-days.
      - name: Restore collector cache
        uses: actions/cache@v4
        with:
          path: |
            cache_prices
            cache_fsds
            cache_macro
            cache_sec_actual
            cache_misc
            cache_live_fund
            aggressive/cache/universe
            aggressive/cache/bars
            aggressive/cache/finnhub
            aggressive/state/finnhub
            outputs/sec_companyfacts
            outputs/macro
            outputs/companyfacts.zip
            data_raw/free/sec/companyfacts.zip
          key: collector-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            collector-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-
            collector-cache-${{ runner.os }}-

      # Refresh SEC companyfacts.zip bulk archive if missing or older than 3d.
      # Without this, the pipeline silently falls back to per-CIK API calls
      # which respect companyfacts_refresh_days, but with --no-collector that
      # path never executes either — fundamentals lane goes stale →
      # fundamental_coverage_ok=False → portfolio_latest.csv blocked.
      # 3-day threshold keeps the full rebuild fundamentals lane aligned with
      # the AlphaOps data-system contract without downloading the 1GB+ archive
      # on every replay-only run.
      - name: Refresh SEC companyfacts bulk archive
        env:
          SEC_USER_AGENT: "R1000InstitutionalBot (contact: andrewcha231@gmail.com)"
        run: |
          mkdir -p outputs data_raw/free/sec
          python tools/refresh_companyfacts_bulk.py \
            --base-dir "$(pwd)/outputs" \
            --max-age-days 3 \
            --required
          cp outputs/companyfacts.zip data_raw/free/sec/companyfacts.zip

      # Cache feature_store + scored outputs (large files, prior FULL rebuild result)
      - name: Restore engine cache
        uses: actions/cache@v4
        with:
          path: |
            outputs/feature_store_*.parquet
            outputs/scored_*.csv
            outputs/walk_forward
          key: engine-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            engine-cache-${{ inputs.cache_key_suffix }}-${{ runner.os }}-
            engine-cache-${{ runner.os }}-

      - name: Smoke test pre-flight
        run: |
          python tests/smoke_test.py
          python tests/audit_features.py --no-runtime

      - name: Phase 15-D data preflight
        run: |
          python - <<'PY'
          from pathlib import Path

          import pandas as pd

          from aggressive.universe import load_cycle_play_universe
          from r1000_helpers import px_cache_name

          cycle_tickers, _ = load_cycle_play_universe()
          missing_prices = [
              t for t in sorted(cycle_tickers)
              if not (Path("cache_prices") / px_cache_name(t)).exists()
          ]
          print(
              "[cycle] active=%d missing_price_cache_before_collector=%d"
              % (len(cycle_tickers), len(missing_prices))
          )
          if missing_prices:
              print("[cycle] missing sample: " + ", ".join(missing_prices[:30]))

          p = Path("aggressive/state/finnhub/r1000_features.parquet")
          if p.exists():
              df = pd.read_parquet(p)
              print(
                  "[finnhub] fallback parquet present rows=%d cols=%d"
                  % (len(df), len(df.columns))
              )
          else:
              print("[finnhub] WARN fallback parquet missing; Phase 15-D fallback will degrade")
          PY

      - name: Restore SEC evidence overlays from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs outputs/sec_institutional_signals outputs/sec_ownership_signals outputs/etf_thematic_signals data_pit/sec data_pit/etf_holdings
          MANIFEST="outputs/full_rebuild_logs/sec_evidence_restore_manifest.json"
          python - <<'PY' > "$MANIFEST"
          import json
          print(json.dumps({"gdrive_ready": False, "restored": [], "missing": [], "errors": []}, indent=2))
          PY

          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[sec-restore] no Google Drive auth configured; SEC overlay will use local/cache files only"
            exit 0
          fi

          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -qo /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone

          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi

          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi

          RESTORED=""
          MISSING=""
          ERRORS=""
          restore_dir() {
            local d="$1"
            mkdir -p "$d"
            if rclone lsf "$BASE$d" >/dev/null 2>&1; then
              if timeout 8m rclone copy "$BASE$d" "$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line; then
                RESTORED="${RESTORED}${d}"$'\n'
              else
                ERRORS="${ERRORS}${d}"$'\n'
                echo "[sec-restore] warning: restore for $d failed or timed out"
              fi
            else
              MISSING="${MISSING}${d}"$'\n'
              echo "[sec-restore] no Drive path for $d"
            fi
          }

          restore_dir outputs/sec_institutional_signals
          restore_dir outputs/sec_ownership_signals
          restore_dir data_pit/sec
          restore_dir outputs/etf_thematic_signals
          restore_dir data_pit/etf_holdings

          python - <<PY > "$MANIFEST"
          import json
          from pathlib import Path
          import pandas as pd
          restored = [x for x in """$RESTORED""".splitlines() if x]
          missing = [x for x in """$MISSING""".splitlines() if x]
          errors = [x for x in """$ERRORS""".splitlines() if x]
          def table_stats(path, ticker_col="ticker", date_col="latest_available_from"):
              p = Path(path)
              out = {"exists": p.exists(), "rows": 0, "ticker_count": 0, "latest_available_from": ""}
              if not p.exists():
                  return out
              try:
                  if p.suffix == ".parquet":
                      df = pd.read_parquet(p)
                  else:
                      df = pd.read_csv(p, low_memory=False)
                  out["rows"] = int(len(df))
                  if ticker_col in df.columns:
                      out["ticker_count"] = int(df[ticker_col].astype(str).str.upper().str.strip().replace("", pd.NA).nunique(dropna=True))
                  if date_col in df.columns:
                      dt = pd.to_datetime(df[date_col], errors="coerce", utc=True)
                      out["latest_available_from"] = dt.max().isoformat() if dt.notna().any() else ""
              except Exception as exc:
                  out["error"] = str(exc)
              return out
          checks = {
              "institutional_13f_latest": Path("outputs/sec_institutional_signals/13f_latest.csv").exists() or Path("outputs/sec_institutional_signals/13f_latest.parquet").exists(),
              "institutional_signals_latest": Path("outputs/sec_institutional_signals/signals_latest.csv").exists() or Path("outputs/sec_institutional_signals/signals_latest.parquet").exists(),
              "ownership_form4_latest": Path("outputs/sec_ownership_signals/form4_latest.csv").exists() or Path("outputs/sec_ownership_signals/form4_latest.parquet").exists(),
              "ownership_signals_latest": Path("outputs/sec_ownership_signals/signals_latest.csv").exists() or Path("outputs/sec_ownership_signals/signals_latest.parquet").exists(),
              "data_pit_sec_ownership_signals": Path("data_pit/sec/sec_ownership_signals.parquet").exists(),
              "data_pit_13f_holdings": Path("data_pit/sec/institutional_13f_holdings.parquet").exists(),
              "etf_thematic_latest": Path("outputs/etf_thematic_signals/etf_latest.csv").exists() or Path("outputs/etf_thematic_signals/etf_latest.parquet").exists(),
              "data_pit_etf_holdings": Path("data_pit/etf_holdings/etf_holdings.parquet").exists(),
          }
          stats = {
              "form4_latest_csv": table_stats("outputs/sec_ownership_signals/form4_latest.csv"),
              "form4_canonical_signals": table_stats("data_pit/sec/sec_ownership_signals.parquet"),
              "form4_transactions": table_stats("data_pit/sec/form4_transactions.parquet", ticker_col="issuer_ticker", date_col="available_from"),
              "institutional_latest_csv": table_stats("outputs/sec_institutional_signals/13f_latest.csv"),
              "institutional_holdings": table_stats("data_pit/sec/institutional_13f_holdings.parquet", ticker_col="ticker_mapped", date_col="available_from"),
              "etf_latest_csv": table_stats("outputs/etf_thematic_signals/etf_latest.csv"),
              "etf_holdings": table_stats("data_pit/etf_holdings/etf_holdings.parquet", ticker_col="holding_ticker", date_col="available_from"),
          }
          print(json.dumps({
              "gdrive_ready": True,
              "restored": restored,
              "missing": missing,
              "errors": errors,
              "checks": checks,
              "stats": stats,
          }, indent=2, sort_keys=True))
          PY
          cat "$MANIFEST"

      - name: Run FULL rebuild
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          # Per Phase 14 wiring + Phase 1 backtest validation
          UNIVERSE_MODE: ${{ inputs.universe_mode }}
          BACKTEST_YEARS: ${{ inputs.backtest_years }}
          LEADER_RESCUE_MODE: ${{ inputs.leader_rescue_mode }}
          PHASE_PHASE14_HYBRID_ALPHA_ENABLED: ${{ inputs.universe_mode == 'r1000+adr_phase14_off' && '0' || 'auto' }}
          PHASE_PHASE11_MULTIBAGGER_ENABLED: ${{ inputs.phase11_multibagger_enabled && '1' || '0' }}
          PHASE11_EPISODES_PATH: ${{ inputs.phase11_episodes_source == 'v2' && 'research/multibagger_episodes_v2.csv' || 'research/multibagger_episodes.csv' }}
        run: |
          set -e
          set -o pipefail   # ← critical: catch python failures through tee pipe
          mkdir -p outputs/full_rebuild_logs
          LOG="outputs/full_rebuild_logs/$(date +%Y%m%d_%H%M%S)_${{ inputs.universe_mode }}.log"

          # Auto-detect: skip_collector=true is unsafe on FIRST run (no cache).
          # Check for collector cache markers; if absent, force collector run
          # even when user requested skip. Prevents the "1-min crash" bug from
          # reuse_existing_artifacts=True hitting empty parquet/csv paths.
          SKIP_COLLECTOR=""
          CACHE_PRESENT="no"
          has_cache_files() {
            [ -d "$1" ] && [ -n "$(find "$1" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]
          }
          if has_cache_files cache_prices; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_sec_actual; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_fsds; then
            CACHE_PRESENT="yes"
          fi
          if has_cache_files cache_macro; then
            CACHE_PRESENT="yes"
          fi
          if [ -d aggressive/cache/finnhub ] && [ -n "$(ls -A aggressive/cache/finnhub 2>/dev/null)" ]; then
            CACHE_PRESENT="yes"
          fi
          if [ -d aggressive/cache/bars ] && [ -n "$(ls -A aggressive/cache/bars 2>/dev/null)" ]; then
            CACHE_PRESENT="yes"
          fi
          if ls outputs/feature_store_*.parquet 1>/dev/null 2>&1; then
            CACHE_PRESENT="yes"
          fi

          if [ "${{ inputs.skip_collector }}" = "true" ]; then
            if [ "$CACHE_PRESENT" = "yes" ]; then
              SKIP_COLLECTOR="--no-collector"
              echo "[skip_collector] cache present, skipping data collection"
            else
              echo "[skip_collector] WARN: requested but NO cache found in this runner."
              echo "[skip_collector]       Running collector anyway (first cloud run; will populate cache for future runs)."
            fi
          fi

          # fast_mode: true = 5 backtests + 6m retrain (~2-3h total, fits in 6h GHA limit)
          # fast_mode: false = full walk-forward (~5-6h, may TIMEOUT on first cloud run)
          # Previous run (24950857695) was cancelled at 7h+ — fast_mode now exposed.
          FAST_MODE_FLAG="${{ inputs.fast_mode }}"

          echo "=========================================="
          echo "FULL REBUILD START"
          echo "  universe_mode:    $UNIVERSE_MODE"
          echo "  skip_collector:   ${{ inputs.skip_collector }} (effective: $([ -n "$SKIP_COLLECTOR" ] && echo SKIP || echo RUN))"
          echo "  cache_present:    $CACHE_PRESENT"
          echo "  fast_mode:        $FAST_MODE_FLAG"
          echo "  backtest_years:   $BACKTEST_YEARS"
          echo "  leader_rescue:    $LEADER_RESCUE_MODE"
          echo "  ENGINE_REUSE_VERSION: $(python -c 'from r1000_config import ENGINE_REUSE_VERSION; print(ENGINE_REUSE_VERSION)')"
          echo "=========================================="

          # Use --base-dir to override Drive path with repo-local outputs/
          # --fast-mode passed as CLI flag (run_local.py:162 supports it natively)
          python run_local.py --full --fast-mode "$FAST_MODE_FLAG" --backtest-years "$BACKTEST_YEARS" --leader-rescue-mode "$LEADER_RESCUE_MODE" $SKIP_COLLECTOR --base-dir "$(pwd)" 2>&1 | tee "$LOG"

      - name: Verdict (Cell E equivalent)
        if: always()
        run: |
          python run_local.py --verdict-only --base-dir "$(pwd)" 2>&1 | tee outputs/full_rebuild_logs/verdict.log || true

      - name: Auto-learning diagnostics (sidecar)
        if: always()
        run: |
          mkdir -p outputs/auto_learning
          CANDIDATE_GATES="outputs/auto_learning/auto_feature_gates_candidate.yaml"
          rm -f "$CANDIDATE_GATES"
          python tools/build_concentrated_trade_journal.py --latest-run outputs --output-dir outputs/concentrated_trade_journal 2>&1 | tee outputs/auto_learning/concentrated_trade_journal.log || true
          EXTRA_TRADES=""
          if [ -f outputs/concentrated_trade_journal/trades.csv ]; then
            EXTRA_TRADES="--extra-trades outputs/concentrated_trade_journal/trades.csv"
          fi
          python tools/trade_insights.py --no-shap $EXTRA_TRADES 2>&1 | tee outputs/auto_learning/trade_insights.log || true
          python tools/feature_gate_proposal.py --gates-out "$CANDIDATE_GATES" 2>&1 | tee outputs/auto_learning/feature_gate_proposal.log || true
          if [ "${{ inputs.auto_learning_promote_live }}" = "true" ]; then
            python tools/auto_learning_promote.py --candidate-gates "$CANDIDATE_GATES" --active-gates research/auto_feature_gates.yaml 2>&1 | tee outputs/auto_learning/promotion_decision.log || true
          else
            python tools/auto_learning_promote.py --dry-run --candidate-gates "$CANDIDATE_GATES" --active-gates research/auto_feature_gates.yaml 2>&1 | tee outputs/auto_learning/promotion_decision.log || true
          fi
          python tools/auto_policy_proposal.py --latest-run outputs --candidate-out outputs/auto_learning/auto_learning_policy_candidate.yaml --diff-out outputs/auto_learning/policy_proposal_diff.md --evidence-out outputs/auto_learning/evidence_snapshot.json --summary-out outputs/auto_learning/policy_candidate_summary.md 2>&1 | tee outputs/auto_learning/auto_policy_proposal.log || true
          python tools/auto_policy_challenger.py --policy outputs/auto_learning/auto_learning_policy_candidate.yaml --latest-run outputs --out-dir outputs/auto_learning/challenger 2>&1 | tee outputs/auto_learning/auto_policy_challenger.log || true
          python tools/auto_policy_promote.py --candidate-policy outputs/auto_learning/auto_learning_policy_candidate.yaml --challenger-decision outputs/auto_learning/challenger/challenger_decision.json --out-dir outputs/auto_learning/promotion 2>&1 | tee outputs/auto_learning/auto_policy_promotion.log || true

