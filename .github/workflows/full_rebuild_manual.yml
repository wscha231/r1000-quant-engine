          # core metrics. Failed/cancelled partial runs must not overwrite the
          # last valid analysis baseline.
          if [ "$RUN_ARTIFACT_VALID" = "yes" ]; then
            rm -rf "cloud_results/full_rebuild/latest_${{ inputs.universe_mode }}"
            cp -r "$DEST" "cloud_results/full_rebuild/latest_${{ inputs.universe_mode }}"
          else
            echo "[push] latest_${{ inputs.universe_mode }} preserved because RUN_ARTIFACT_VALID=$RUN_ARTIFACT_VALID"
          fi
