name: vNext Integrated Diagnostic

on:
  push:
    branches:
      - chatgpt/vnext-integrated-diagnostic-20260917
    paths:
      - 'research/vnext_integrated/**'
      - '.github/workflows/vnext_integrated_diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch research slice
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            research/vnext_integrated
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy

      - name: Download frozen source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8088582521/zip" \
            -o "${RUNNER_TEMP}/run287_source_archive.zip"
          test -s "${RUNNER_TEMP}/run287_source_archive.zip"

      - name: Run one-shot vNext diagnostic
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/vnext-output"
          mkdir -p "${RUNNER_TEMP}/vnext-output"
          python research/vnext_integrated/run_diagnostic.py \
            --source-zip "${RUNNER_TEMP}/run287_source_archive.zip" \
            --experiment research/vnext_integrated/experiment.json \
            --output-dir "${RUNNER_TEMP}/vnext-output"

      - name: Verify no raw source publication
        run: |
          set -euo pipefail
          if find "${RUNNER_TEMP}/vnext-output" -type f -size +20M | grep -q .; then
            echo 'unexpected large output; refusing publication' >&2
            exit 1
          fi
          if find "${RUNNER_TEMP}/vnext-output" -type f | grep -E 'candidate_replay_book|source_archive' >/dev/null; then
            echo 'raw source payload name detected in output; refusing publication' >&2
            exit 1
          fi

      - name: Upload aggregate diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: vnext-integrated-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/vnext-output/
          if-no-files-found: error
          retention-days: 30
