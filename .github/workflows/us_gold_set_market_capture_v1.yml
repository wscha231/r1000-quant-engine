name: US Gold Set A3 Market Capture V1

on:
  pull_request:
    paths:
      - "research/us_strict_market_snapshot_v1.py"
      - "tests/us_strict_market_snapshot_v1_smoke.py"
      - "tools/capture_gold_set_us_market_v1.py"
      - "research/cross_market_gold_set_v1.json"
      - ".github/workflows/us_gold_set_market_capture_v1.yml"
  push:
    branches: [master]
    paths:
      - "research/us_strict_market_snapshot_v1.py"
      - "tests/us_strict_market_snapshot_v1_smoke.py"
      - "tools/capture_gold_set_us_market_v1.py"
      - "research/cross_market_gold_set_v1.json"
      - ".github/workflows/us_gold_set_market_capture_v1.yml"
  workflow_dispatch:
    inputs:
      session:
        description: "Optional completed NYSE session YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: offline_contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas numpy requests pandas-market-calendars exchange-calendars
      - name: Strict U.S. snapshot smoke
        run: python tests/us_strict_market_snapshot_v1_smoke.py
      - name: Actual capture CLI import regression (no network)
        run: python -m tools.capture_gold_set_us_market_v1 --help > /dev/null

  capture:
    name: live_capture
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      SESSION: ${{ github.event.inputs.session || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded capture dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pandas numpy requests pandas-market-calendars exchange-calendars
      - name: Capture reviewed research proxy (ephemeral)
        run: |
          python -m tools.capture_gold_set_us_market_v1 \
            --output-dir _artifacts/us_gold_set_market_v1 \
            --attempt-id "run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --session "$SESSION"
      # This is a public repository. Provider-origin response bytes and the
      # bundled research artifact cannot be uploaded as public Actions artifacts.
      # The probe is ephemeral until separate private retention/rights admission.
      - name: Report sanitized, non-retaining result
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          receipt = Path('_artifacts/us_gold_set_market_v1/latest_attempt.json')
          status, session = 'NO_RECEIPT', None
          if receipt.is_file():
              try:
                  payload = json.loads(receipt.read_text(encoding='utf-8'))
                  if isinstance(payload, dict):
                      status = payload.get('status')
                      session = payload.get('session_date')
              except (ValueError, OSError, UnicodeError, RecursionError):
                  status = 'INVALID_RECEIPT'
          if status not in ('COMPLETE_REVIEWED_RESEARCH_PROXY', 'BLOCKED'):
              status = 'INVALID_RECEIPT' if status != 'NO_RECEIPT' else status
          if not isinstance(session, str) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}', session):
              session = None
          result = {
              'scope': 'US_GOLD_SET_EPHEMERAL_PROBE',
              'collector_status': status,
              'session_date': session,
              'raw_provider_bytes_published': False,
              'durable_source_retained': False,
              'official_source_admission': False,
              'portfolio_or_order_authority': False,
          }
          print(json.dumps(result, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Gold Set A1 ephemeral capture\n\n')
              out.write(f'Collector: `{status}`; session: `{session or "UNKNOWN"}`.\n\n')
              out.write('No provider bytes published or durably admitted. No portfolio/order authority.\n')
          PY
