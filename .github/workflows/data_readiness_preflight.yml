name: Data Readiness Preflight

on:
  workflow_dispatch:
    inputs:
      latest_run:
        description: 'Latest run path to audit'
        required: false
        default: 'cloud_results/full_rebuild/latest_global_alpha_universe'
      strict:
        description: 'Fail when readiness blockers are present'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      sec_companyfacts:
        description: 'Refresh SEC companyfacts.zip into data_raw/free/sec before audit when fullrun readiness reports it missing'
        required: false
        default: false
        type: boolean
      sec_max_age_days:
        description: 'SEC companyfacts refresh threshold when sec_companyfacts=true'
        required: false
        default: '3'
  schedule:
    # Tue-Sat 09:15 KST, after the free-data daily update window.
    - cron: '15 0 * * 2-6'

permissions:
  contents: read

jobs:
  data_readiness_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_github.txt ]; then
            pip install -r requirements_github.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore GitHub cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache_prices
            data_raw/free
            data_pit/free
            data_pit/events
            data_pit/sec
            data_pit/etf_holdings
            data_pit/macro
            manifests/free_data
          key: collector-cache-${{ runner.os }}-${{ github.ref_name }}-preflight-${{ github.run_id }}
          restore-keys: |
            collector-cache-${{ runner.os }}-${{ github.ref_name }}-
            collector-cache-${{ runner.os }}-

      - name: Restore Google Drive data lake
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          set -e
          mkdir -p outputs/full_rebuild_logs
          if [ -z "$RCLONE_CONFIG_GDRIVE" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "[preflight] no Google Drive auth configured; local/cache-only audit will run"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          restore_dir() {
            local remote="$1"
            local local_dir="$2"
            mkdir -p "$local_dir"
            if rclone lsf "$BASE$remote" --dirs-only 1>/dev/null 2>&1 || rclone lsf "$BASE$remote" --files-only 1>/dev/null 2>&1; then
              echo "[preflight] restore $BASE$remote -> $local_dir"
              rclone copy "$BASE$remote" "$local_dir" --drive-acknowledge-abuse --transfers 8 --checkers 16
            else
              echo "[preflight] missing on Drive: $BASE$remote"
            fi
          }
          restore_requested_latest_run() {
            local latest_run="$1"
            if [ -z "$latest_run" ]; then
              return 0
            fi
            case "$latest_run" in
              /*|../*|*/../*|*"/.."|.)
                echo "[preflight] skip unsafe latest_run restore path: $latest_run"
                return 0
                ;;
            esac
            restore_dir "$latest_run" "$latest_run"
          }
          LATEST_RUN_INPUT="${{ github.event.inputs.latest_run || 'cloud_results/full_rebuild/latest_global_alpha_universe' }}"
          restore_dir cache_prices cache_prices
          restore_dir data_raw/free data_raw/free
          restore_dir data_pit/free data_pit/free
          restore_dir data_pit/events data_pit/events
          restore_dir data_pit/sec data_pit/sec
          restore_dir data_pit/etf_holdings data_pit/etf_holdings
          restore_dir data_pit/macro data_pit/macro
          restore_dir manifests/free_data manifests/free_data
          restore_requested_latest_run "$LATEST_RUN_INPUT"
          mkdir -p data_raw/free/sec
          if [ ! -s data_raw/free/sec/companyfacts.zip ] && rclone lsf "$BASE" --files-only 2>/dev/null | grep -qx 'companyfacts.zip'; then
            rclone copyto "$BASE"companyfacts.zip data_raw/free/sec/companyfacts.zip
          fi
          rm -f /tmp/sa.json

      - name: Refresh SEC companyfacts when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sec_companyfacts }}
        env:
          SEC_USER_AGENT: "R1000InstitutionalBot (contact: andrewcha231@gmail.com)"
        run: |
          set -euo pipefail
          mkdir -p data_raw/free/sec outputs/full_rebuild_logs
          python tools/refresh_companyfacts_bulk.py \
            --base-dir data_raw/free/sec \
            --max-age-days "${{ inputs.sec_max_age_days || '3' }}" \
            --required \
            2>&1 | tee outputs/full_rebuild_logs/sec_companyfacts_refresh.log

      - name: Run data readiness audit
        run: |
          set -e
          mkdir -p outputs/full_rebuild_logs
          python tools/build_data_catalog.py \
            --output outputs/data_catalog/catalog.json \
            --print-summary \
            2>&1 | tee outputs/full_rebuild_logs/data_catalog.log
          STRICT_FLAG=""
          if [ "${{ github.event.inputs.strict || 'false' }}" = "true" ]; then
            STRICT_FLAG="--strict"
          fi
          LATEST_RUN="${{ github.event.inputs.latest_run || 'cloud_results/full_rebuild/latest_global_alpha_universe' }}"
          python tools/audit_data_readiness.py \
            --latest-run "$LATEST_RUN" \
            --price-cache cache_prices \
            --output-dir outputs/data_readiness \
            $STRICT_FLAG \
            2>&1 | tee outputs/full_rebuild_logs/data_readiness.log

      - name: Build current virtual-account evaluation and rebalance review
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs
          LATEST_RUN="${{ github.event.inputs.latest_run || 'cloud_results/full_rebuild/latest_global_alpha_universe' }}"
          python tools/run_weekly_evaluation.py \
            --latest-run "$LATEST_RUN" \
            --price-cache cache_prices \
            --output-dir outputs/weekly_evaluation \
            2>&1 | tee outputs/full_rebuild_logs/weekly_evaluation.log
          python tools/run_account_evaluation.py \
            --latest-run "$LATEST_RUN" \
            --data-readiness-summary outputs/data_readiness/summary.json \
            --output-dir outputs/account_evaluation \
            2>&1 | tee outputs/full_rebuild_logs/account_evaluation.log
          python tools/run_decision_cadence_review.py \
            --latest-run "$LATEST_RUN" \
            --price-cache cache_prices \
            --output-dir outputs/decision_cadence \
            2>&1 | tee outputs/full_rebuild_logs/decision_cadence.log
          python tools/build_operating_model_review.py \
            --data-readiness outputs/data_readiness/summary.json \
            --data-catalog outputs/data_catalog/catalog.json \
            --weekly-evaluation outputs/weekly_evaluation/weekly_freshness_audit.json \
            --account-evaluation outputs/account_evaluation/official_metrics.json \
            --decision-cadence outputs/decision_cadence/decision_cadence_summary.json \
            --output-dir outputs/operating_model_review \
            2>&1 | tee outputs/full_rebuild_logs/operating_model_review.log

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-readiness-preflight-${{ github.run_id }}
          path: |
            outputs/data_readiness/
            outputs/data_catalog/
            outputs/weekly_evaluation/
            outputs/account_evaluation/
            outputs/decision_cadence/
            outputs/operating_model_review/
            outputs/full_rebuild_logs/data_readiness.log
            outputs/full_rebuild_logs/data_catalog.log
            outputs/full_rebuild_logs/sec_companyfacts_refresh.log
            outputs/full_rebuild_logs/weekly_evaluation.log
            outputs/full_rebuild_logs/account_evaluation.log
            outputs/full_rebuild_logs/decision_cadence.log
            outputs/full_rebuild_logs/operating_model_review.log
          retention-days: 30

      - name: Sync preflight report to Google Drive
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          set -e
          if [ ! -d outputs/data_readiness ]; then
            echo "[preflight] no data_readiness output to sync"
            exit 0
          fi
          if ! command -v rclone >/dev/null 2>&1; then
            curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
            unzip -q /tmp/rclone.zip -d /tmp/
            sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
            chmod +x /usr/local/bin/rclone
          fi
          if [ -z "$RCLONE_CONFIG_GDRIVE" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "[preflight] no Google Drive auth configured; skipping sync"
            exit 0
          fi
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          BRANCH_NAME="${GITHUB_REF_NAME:-manual}"
          SAFE_BRANCH="$(printf '%s' "$BRANCH_NAME" | tr '/ ' '__')"
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            DEST="gdrive:research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/data_readiness"
            BASE="gdrive:"
          else
            DEST="gdrive:${GDRIVE_FOLDER_NAME}/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/data_readiness"
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          rclone copy outputs/data_readiness "$DEST/"
          for report_dir in data_catalog weekly_evaluation account_evaluation decision_cadence operating_model_review; do
            if [ -d "outputs/$report_dir" ]; then
              rclone copy "outputs/$report_dir" "$DEST/$report_dir/"
            fi
          done
          if [ "${{ github.event.inputs.sec_companyfacts || 'false' }}" = "true" ] && [ -s data_raw/free/sec/companyfacts.zip ]; then
            echo "[preflight] syncing refreshed companyfacts.zip to canonical Drive paths"
            rclone copy data_raw/free/sec "$BASE"data_raw/free/sec/ --include companyfacts.zip
            rclone copyto data_raw/free/sec/companyfacts.zip "$BASE"companyfacts.zip
          fi
          rm -f /tmp/sa.json
          echo "[preflight] synced to $DEST"
