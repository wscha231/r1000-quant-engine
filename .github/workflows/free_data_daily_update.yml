name: Free Data Daily Update

on:
  workflow_dispatch:
    inputs:
      etf116_report_only:
        description: 'Export a research workbook from pinned existing metrics; skip daily collection'
        type: boolean
        default: false
      etf116_input_run_id:
        description: 'Completed same-repository run containing etf116-simple-report-input artifact'
        type: string
        default: ''
      etf116_input_sha256:
        description: 'Exact SHA256 of report-input.json; not a source-admission attestation'
        type: string
        default: ''
      force_run:
        description: 'Run even if no fresh NYSE close is detected'
        type: boolean
        default: false
      max_price_tickers:
        description: '0 = all target-book tickers; keep small while free providers are being tested'
        type: string
        default: '80'
      sec_companyfacts:
        description: 'Manual only: refresh SEC companyfacts.zip into data_raw/free/sec when fullrun readiness reports it missing'
        type: boolean
        default: false
      sec_max_age_days:
        description: 'SEC companyfacts refresh threshold when sec_companyfacts=true'
        type: string
        default: '3'
  schedule:
    # 08:30 KST Tue-Sat, after the prior US regular-session close.
    - cron: '30 23 * * 1-5'

permissions:
  contents: read

jobs:
  daily_update:
    if: ${{ !inputs.etf116_report_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Check latest NYSE close
        id: market
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p outputs/free_data_daily_update
          ARGS=(
            --output outputs/free_data_daily_update/market_gate.json
            --min-close-age-minutes 90
            --max-close-age-hours 18
          )
          case "${FORCE_RUN,,}" in
            true) ARGS+=(--force) ;;
            false|"") ;;
            *) echo "::error::invalid force_run boolean" >&2; exit 2 ;;
          esac
          python tools/run_daily_market_session_gate.py "${ARGS[@]}"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("outputs/free_data_daily_update/market_gate.json")
          raw = path.read_bytes()
          gate = json.loads(raw)
          if type(gate.get("ready")) is not bool or gate.get("calendar") != "NYSE":
              raise SystemExit("invalid_nyse_market_gate_receipt")
          reason = gate.get("status", "")
          state = (
              "READY_VALIDATION_REQUIRED" if gate["ready"] else
              "WAITING" if reason == "SKIP_CLOSE_SETTLEMENT_BUFFER" else
              "SKIPPED"
          )
          receipt = {
              "schema_version": "r1000-free-data-a7-market-disposition-v1",
              "status": state,
              "reason_code": reason,
              "candidate_session_date": gate.get("session_date") or None,
              "latest_completed_session_date": gate.get("latest_completed_session_date") or None,
              "checked_at_utc": gate["checked_at_utc"],
              "market_gate_sha256": hashlib.sha256(raw).hexdigest(),
              "source_head_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "data_receipts_verified": False,
              "current_portfolio_verified": False,
              "investment_publication_allowed": False,
          }
          Path("outputs/free_data_daily_update/operating_status.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"[a7] status={state} reason={reason} "
                f"session={receipt['candidate_session_date']}")
          PY

      - name: Restore GitHub cache
        if: steps.market.outputs.ready == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            cache_prices
            data_raw/free
            data_pit/free
            data_pit/events
          key: free-data-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            free-data-daily-${{ runner.os }}-
            free-data-lake-${{ runner.os }}-
            replay-price-cache-${{ runner.os }}-

      - name: Configure rclone
        if: steps.market.outputs.ready == 'yes'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_GDRIVE" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "[gdrive] no auth configured; continuing without Drive restore/sync"
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore free data from Google Drive
        if: steps.market.outputs.ready == 'yes'
        env:
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          for d in data_raw/free data_pit/free manifests/free_data cache_prices; do
            mkdir -p "$d"
            if rclone lsf "$BASE$d" >/dev/null 2>&1; then
              rclone copy "$BASE$d" "$d/"
            fi
          done
          mkdir -p data_pit/events
          if rclone lsf "$BASE""data_pit/events" >/dev/null 2>&1; then
            rclone copy "$BASE""data_pit/events" data_pit/events/
          fi
          mkdir -p data_raw/free/sec
          if [ ! -s data_raw/free/sec/companyfacts.zip ] && rclone lsf "$BASE" --files-only 2>/dev/null | grep -qx 'companyfacts.zip'; then
            echo "[gdrive] restoring existing root companyfacts.zip -> data_raw/free/sec/companyfacts.zip"
            rclone copyto "$BASE"companyfacts.zip data_raw/free/sec/companyfacts.zip
          fi

      - name: Run free data daily validation
        if: steps.market.outputs.ready == 'yes'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: "R1000InstitutionalBot (contact: andrewcha231@gmail.com)"
          MAX_PRICE_TICKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_price_tickers || '80' }}
          SEC_COMPANYFACTS: ${{ github.event_name == 'workflow_dispatch' && inputs.sec_companyfacts || 'false' }}
          SEC_MAX_AGE_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.sec_max_age_days || '3' }}
        run: |
          set -euo pipefail
          # Engine validation writes the recurring CAGR / Sharpe / MaxDD report.
          LATEST="cloud_results/full_rebuild/latest_global_alpha_universe"
          ARGS=(
            --latest-run "$LATEST"
            --price-mode target_books
            --max-price-tickers "$MAX_PRICE_TICKERS"
            --pit-label pit_proxy_universe
          )
          if [ "$SEC_COMPANYFACTS" = "true" ]; then
            ARGS+=(--sec-companyfacts --sec-max-age-days "$SEC_MAX_AGE_DAYS")
          fi
          python tools/run_free_data_lake_bootstrap.py "${ARGS[@]}" 2>&1 | tee free_data_daily_bootstrap.log
          mkdir -p outputs/free_data_proxy_backtest/main outputs/free_data_proxy_backtest/concentrated outputs/full_rebuild_logs
          python tools/run_broker_ledger_replay.py --target-book "$LATEST/reports/main_monthly_weights.csv" --price-cache cache_prices --portfolio-kind main --output-dir outputs/free_data_proxy_backtest/main --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/free_data_daily_proxy_main.log || true
          python tools/run_broker_ledger_replay.py --target-book "$LATEST/reports/concentrated_strategy_holdings.csv" --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/free_data_proxy_backtest/concentrated --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/free_data_daily_proxy_concentrated.log || true
          python tools/run_free_data_engine_validation.py --latest-run "$LATEST" 2>&1 | tee outputs/full_rebuild_logs/free_data_engine_validation.log
          python tools/check_10y_backtest_readiness.py --latest-run "$LATEST" --ref "${GITHUB_REF_NAME:-master}" --repo "${GITHUB_REPOSITORY:-wscha231/r1000-quant-engine}" 2>&1 | tee outputs/full_rebuild_logs/ten_year_backtest_readiness.log
          python tools/build_data_catalog.py --output data/catalog.json --print-summary
          python tools/audit_free_historical_data_coverage.py --latest-run "$LATEST" --output-dir outputs/free_historical_data_coverage

      - name: Upload daily validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-data-daily-update-${{ github.run_id }}
          path: |
            free_data_daily_bootstrap.log
            outputs/free_data_lake_bootstrap/
            outputs/free_historical_data_coverage/
            outputs/free_data_proxy_backtest/
            outputs/free_data_engine_validation/
            outputs/ten_year_backtest_readiness/
            outputs/full_rebuild_logs/free_data_*.log
            outputs/full_rebuild_logs/ten_year_backtest_readiness.log
            data_pit/free/coverage_audit.json
            data/catalog.json
            manifests/free_data/latest_manifest.json
            outputs/free_data_daily_update/market_gate.json
            outputs/free_data_daily_update/operating_status.json
          if-no-files-found: error
          retention-days: 90

      - name: Sync daily validation to Google Drive
        if: ${{ always() && steps.market.outputs.ready == 'yes' }}
        env:
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-daily}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          for d in data_raw/free data_pit/free data_pit/events manifests/free_data cache_prices data; do
            if [ -e "$d" ]; then
              rclone copy "$d" "$BASE$d/"
            fi
          done
          rclone copy outputs/free_data_engine_validation "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/free_data_engine_validation/"
          rclone copy outputs/free_data_proxy_backtest "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/free_data_proxy_backtest/"
          rclone copy outputs/free_historical_data_coverage "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/free_historical_data_coverage/"
          rclone copy outputs/ten_year_backtest_readiness "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/ten_year_backtest_readiness/"

  etf116_eod_research:
    name: ETF116 research-only isolated EOD (disabled)
    if: ${{ false && vars.ETF116_RESEARCH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: etf116-research-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Read only code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing calculation dependencies
        run: python -m pip install -r requirements_github.txt
      - name: Offline guarded contract tests
        run: |
          python tests/etf116_research_backend_smoke.py
          python -O tests/etf116_research_backend_smoke.py
      - name: Fail closed without approved A1 daily TR original and source rights
        run: |
          echo 'ETF116_SOURCE_INPUT_REQUIRED: not authorized to publish research' >&2
          exit 2
      # DO NOT add target-book, broker-ledger, trading, rclone writes, web scrape,
      # GDRIVE OAuth, `continue-on-error`, permissions write or release steps here.
      # Later T3 PR must replace terminal guard only after accepted source+rights,
      # private COPY Sheet readback, successful 2-session dry-run and A6.

  etf116_simple_report:
    name: ETF116 research workbook from pinned existing results
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.etf116_report_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: etf116-simple-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source-run identity before downloading one small input
        env:
          INPUT_RUN_ID: ${{ inputs.etf116_input_run_id }}
          INPUT_SHA256: ${{ inputs.etf116_input_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          run_id = os.environ['INPUT_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]{0,19}', run_id) or not re.fullmatch(r'[0-9a-f]{64}', os.environ['INPUT_SHA256']):
              raise SystemExit('REPORT_INPUT_BINDING_REQUIRED')
          url = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + run_id
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(131073)
              if len(raw) > 131072:
                  raise ValueError()
              run = json.loads(raw)
              if str(run.get('id')) != run_id or run.get('repository', {}).get('full_name') != os.environ['GITHUB_REPOSITORY'] or run.get('status') != 'completed' or run.get('conclusion') != 'success':
                  raise ValueError()
          except Exception:
              raise SystemExit('REPORT_SOURCE_RUN_REFUSED') from None
          PY
      - uses: actions/download-artifact@v4
        with:
          name: etf116-simple-report-input
          run-id: ${{ inputs.etf116_input_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/etf116-report-input
      - name: Install small public workbook dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Native report regression in normal and optimized modes
        run: |
          python tests/etf116_simple_report_smoke.py
          python -O tests/etf116_simple_report_smoke.py
      - name: Export three-tab research workbook without collecting market data
        env:
          INPUT_SHA256: ${{ inputs.etf116_input_sha256 }}
        run: |
          python tools/etf116_simple_report.py \
            --input "${RUNNER_TEMP}/etf116-report-input/report-input.json" \
            --input-sha256 "$INPUT_SHA256" \
            --output-dir "${RUNNER_TEMP}/etf116-report"
      - uses: actions/upload-artifact@v4
        with:
          name: etf116-simple-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/etf116-report/
          if-no-files-found: error
          retention-days: 30
      # File generation is separately reviewable from Drive automation. No Drive
      # credentials, mutable Sheet updates, scheduler activation or accepted EOD.
