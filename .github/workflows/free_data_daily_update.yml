name: Free Data Daily Update

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if no fresh NYSE close is detected'
        type: boolean
        default: false
      max_price_tickers:
        description: '0 = all target-book tickers; keep small while free providers are being tested'
        type: string
        default: '80'
  schedule:
    # 08:30 KST Tue-Sat, after the prior US regular-session close.
    - cron: '30 23 * * 1-5'

permissions:
  contents: read

jobs:
  daily_update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Check latest NYSE close
        id: market
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || 'false' }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os
          import pandas as pd
          import pandas_market_calendars as mcal

          force = str(os.environ.get("FORCE_RUN", "false")).lower() == "true"
          now = datetime.now(timezone.utc)
          cal = mcal.get_calendar("NYSE")
          sched = cal.schedule(start_date=(now - timedelta(days=5)).date(), end_date=now.date())
          ready = force
          last_close = ""
          if not sched.empty:
              close = sched["market_close"].max()
              if isinstance(close, pd.Timestamp):
                  close_utc = close.to_pydatetime()
                  if close_utc.tzinfo is None:
                      close_utc = close_utc.replace(tzinfo=timezone.utc)
                  last_close = close_utc.isoformat()
                  ready = ready or (timedelta(0) <= now - close_utc <= timedelta(hours=18))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MARKET_READY={'yes' if ready else 'no'}\n")
              handle.write(f"LAST_NYSE_CLOSE_UTC={last_close}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"ready={'yes' if ready else 'no'}\n")
              handle.write(f"last_close={last_close}\n")
          print(f"[market] ready={ready} force={force} last_close={last_close}")
          PY

      - name: Restore GitHub cache
        if: steps.market.outputs.ready == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            cache_prices
            data_raw/free
            data_pit/free
          key: free-data-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            free-data-daily-${{ runner.os }}-
            free-data-lake-${{ runner.os }}-
            replay-price-cache-${{ runner.os }}-

      - name: Configure rclone
        if: steps.market.outputs.ready == 'yes'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_GDRIVE" ] && [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "[gdrive] no auth configured; continuing without Drive restore/sync"
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore free data from Google Drive
        if: steps.market.outputs.ready == 'yes'
        env:
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          for d in data_raw/free data_pit/free manifests/free_data cache_prices; do
            mkdir -p "$d"
            if rclone lsf "$BASE$d" >/dev/null 2>&1; then
              rclone copy "$BASE$d" "$d/"
            fi
          done
          mkdir -p data_raw/free/sec
          if [ ! -s data_raw/free/sec/companyfacts.zip ] && rclone lsf "$BASE" --files-only 2>/dev/null | grep -qx 'companyfacts.zip'; then
            echo "[gdrive] restoring existing root companyfacts.zip -> data_raw/free/sec/companyfacts.zip"
            rclone copyto "$BASE"companyfacts.zip data_raw/free/sec/companyfacts.zip
          fi

      - name: Run free data daily validation
        if: steps.market.outputs.ready == 'yes'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: "R1000InstitutionalBot (contact: andrewcha231@gmail.com)"
          MAX_PRICE_TICKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_price_tickers || '80' }}
        run: |
          set -euo pipefail
          # Engine validation writes the recurring CAGR / Sharpe / MaxDD report.
          LATEST="cloud_results/full_rebuild/latest_global_alpha_universe"
          python tools/run_free_data_lake_bootstrap.py \
            --latest-run "$LATEST" \
            --price-mode target_books \
            --max-price-tickers "$MAX_PRICE_TICKERS" \
            --pit-label pit_proxy_universe \
            2>&1 | tee free_data_daily_bootstrap.log
          mkdir -p outputs/free_data_proxy_backtest/main outputs/free_data_proxy_backtest/concentrated outputs/full_rebuild_logs
          python tools/run_broker_ledger_replay.py --target-book "$LATEST/reports/main_monthly_weights.csv" --price-cache cache_prices --portfolio-kind main --output-dir outputs/free_data_proxy_backtest/main --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/free_data_daily_proxy_main.log || true
          python tools/run_broker_ledger_replay.py --target-book "$LATEST/reports/concentrated_strategy_holdings.csv" --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/free_data_proxy_backtest/concentrated --fill-mode next_close --cost-bps 25 --max-fill-lag-days 7 2>&1 | tee outputs/full_rebuild_logs/free_data_daily_proxy_concentrated.log || true
          python tools/run_free_data_engine_validation.py --latest-run "$LATEST" 2>&1 | tee outputs/full_rebuild_logs/free_data_engine_validation.log
          python tools/check_10y_backtest_readiness.py --latest-run "$LATEST" 2>&1 | tee outputs/full_rebuild_logs/ten_year_backtest_readiness.log

      - name: Refresh broker-ledger account reports from latest close
        if: steps.market.outputs.ready == 'yes'
        continue-on-error: true
        run: |
          set -o pipefail
          LATEST="cloud_results/full_rebuild/latest_global_alpha_universe"
          mkdir -p outputs/full_rebuild_logs
          python tools/run_after_close_account_refresh.py \
            --latest-run "$LATEST" \
            --price-cache cache_prices \
            --output-dir outputs/after_close_account_refresh \
            --fill-mode next_close \
            --cost-bps 25 \
            --max-fill-lag-days 7 \
            2>&1 | tee outputs/full_rebuild_logs/after_close_account_refresh.log

      - name: Run merged after-close signal diagnostics
        if: steps.market.outputs.ready == 'yes'
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          LATEST="cloud_results/full_rebuild/latest_global_alpha_universe"
          mkdir -p outputs/full_rebuild_logs
          python tools/macro_daily_snapshot.py --telegram 2>&1 | tee outputs/full_rebuild_logs/merged_macro_daily_snapshot.log || true
          python tools/etf_leadership_snapshot.py --telegram 2>&1 | tee outputs/full_rebuild_logs/merged_etf_leadership_snapshot.log || true

          SCORED_CSV=""
          for p in \
            "$LATEST/scored_latest.csv" \
            outputs/scored_latest.csv \
            cloud_results/full_rebuild/latest/scored_latest.csv
          do
            if [ -f "$p" ]; then SCORED_CSV="$p"; break; fi
          done
          if [ -n "$SCORED_CSV" ]; then
            python tools/run_theme_leadership_tape.py \
              --scored "$SCORED_CSV" \
              --price-cache cache_prices \
              --output-dir outputs/merged_after_close/theme_leadership_tape \
              2>&1 | tee outputs/full_rebuild_logs/merged_theme_leadership_tape.log || true
            python tools/explosive_mover_scan_daily.py \
              --scored "$SCORED_CSV" \
              --top-n 10 \
              --entry-threshold 0.65 \
              --telegram \
              2>&1 | tee outputs/full_rebuild_logs/merged_explosive_mover_scan.log || true
          else
            echo "::warning::merged after-close diagnostics skipped scored-dependent scans: no scored_latest.csv found"
          fi

      - name: Run merged daily AutoLearning diagnostics
        if: steps.market.outputs.ready == 'yes'
        continue-on-error: true
        run: |
          set -o pipefail
          LATEST="cloud_results/full_rebuild/latest_global_alpha_universe"
          BASE="outputs/merged_daily_autolearning"
          mkdir -p "$BASE" outputs/full_rebuild_logs

          python tools/run_winner_lifecycle_reports.py \
            --latest-run "$LATEST" \
            --output-dir "$BASE/winner_lifecycle" \
            2>&1 | tee outputs/full_rebuild_logs/merged_winner_lifecycle.log || true

          if [ -f "$LATEST/scored_latest.csv" ]; then
            python tools/run_winner_onset_study.py \
              --scored "$LATEST/scored_latest.csv" \
              --top-tickers 120 \
              --limit 80 \
              --years 10 \
              --sleep 0 \
              --output-dir "$BASE/winner_onset_study" \
              2>&1 | tee outputs/full_rebuild_logs/merged_winner_onset_study.log || true
            python tools/run_shakeout_breakdown_study.py \
              --scored "$LATEST/scored_latest.csv" \
              --top-tickers 120 \
              --limit 80 \
              --years 10 \
              --sleep 0 \
              --output-dir "$BASE/shakeout_breakdown_study" \
              2>&1 | tee outputs/full_rebuild_logs/merged_shakeout_breakdown_study.log || true
          else
            echo "::warning::merged AutoLearning skipped onset/shakeout studies: $LATEST/scored_latest.csv missing"
          fi

          if [ -f "$LATEST/reports/main_monthly_weights.csv" ]; then
            python tools/run_main_cash_drag_replay.py \
              --latest-run "$LATEST" \
              --output-dir "$BASE/main_cash_drag_replay" \
              2>&1 | tee outputs/full_rebuild_logs/merged_main_cash_drag_replay.log || true
            python tools/run_historical_trade_journey.py \
              --latest-run "$LATEST" \
              --output-dir "$BASE/historical_trade_journey" \
              2>&1 | tee outputs/full_rebuild_logs/merged_historical_trade_journey.log || true
          fi

          if [ -f "$LATEST/reports/candidate_replay_book.csv" ]; then
            python tools/run_main_v2_backtest.py \
              --latest-run "$LATEST" \
              --output-dir "$BASE/main_v2_backtest" \
              2>&1 | tee outputs/full_rebuild_logs/merged_main_v2_backtest.log || true
            python tools/run_concentrated_policy_replay.py \
              --latest-run "$LATEST" \
              --output-dir "$BASE/concentrated_policy_replay" \
              2>&1 | tee outputs/full_rebuild_logs/merged_concentrated_policy_replay.log || true
            python tools/run_alpha_sprint_backtest.py \
              --latest-run "$LATEST" \
              --output-dir "$BASE/alpha_sprint_backtest" \
              2>&1 | tee outputs/full_rebuild_logs/merged_alpha_sprint_backtest.log || true
            if [ -f "$BASE/main_v2_backtest/monthly_holdings.csv" ]; then
              python tools/run_position_aware_risk_replay.py \
                --holdings "$BASE/main_v2_backtest/monthly_holdings.csv" \
                --output-dir "$BASE/position_aware_risk_replay" \
                2>&1 | tee outputs/full_rebuild_logs/merged_position_aware_risk_replay.log || true
            fi
            python tools/run_monster_lifecycle_replay.py \
              --latest-run "$LATEST" \
              --policy concentrated \
              --output-dir "$BASE/monster_lifecycle_replay" \
              2>&1 | tee outputs/full_rebuild_logs/merged_monster_lifecycle_replay.log || true
            python tools/run_lifecycle_review_overlay.py \
              --latest-run "$LATEST" \
              --policy lifecycle_review_main \
              --output-dir "$BASE/lifecycle_review_overlay_main" \
              2>&1 | tee outputs/full_rebuild_logs/merged_lifecycle_review_overlay_main.log || true
          fi

          python tools/run_autolearning_winner_challenger.py \
            --latest-run "$LATEST" \
            --lifecycle-dir "$BASE/winner_lifecycle" \
            --onset-dir "$BASE/winner_onset_study" \
            --shakeout-dir "$BASE/shakeout_breakdown_study" \
            --output-dir "$BASE/autolearning_winner_challenger" \
            2>&1 | tee outputs/full_rebuild_logs/merged_autolearning_winner_challenger.log || true

      - name: Upload daily validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-data-daily-update-${{ github.run_id }}
          path: |
            free_data_daily_bootstrap.log
            outputs/free_data_lake_bootstrap/
            outputs/free_data_proxy_backtest/
            outputs/free_data_engine_validation/
            outputs/ten_year_backtest_readiness/
            outputs/after_close_account_refresh/
            outputs/merged_after_close/
            outputs/merged_daily_autolearning/
            outputs/full_rebuild_logs/free_data_*.log
            outputs/full_rebuild_logs/ten_year_backtest_readiness.log
            outputs/full_rebuild_logs/after_close_account_refresh.log
            outputs/full_rebuild_logs/merged_*.log
            cloud_results/macro_daily/
            cloud_results/etf_leadership/
            cloud_results/explosive_movers/
            data_pit/free/coverage_audit.json
            manifests/free_data/latest_manifest.json
          retention-days: 90

      - name: Sync daily validation to Google Drive
        if: ${{ always() && steps.market.outputs.ready == 'yes' }}
        env:
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-daily}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          for d in data_raw/free data_pit/free manifests/free_data cache_prices; do
            if [ -e "$d" ]; then
              rclone copy "$d" "$BASE$d/"
            fi
          done
          rclone copy outputs/free_data_engine_validation "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/free_data_engine_validation/"
          rclone copy outputs/free_data_proxy_backtest "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/free_data_proxy_backtest/"
          rclone copy outputs/ten_year_backtest_readiness "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/ten_year_backtest_readiness/"
          if [ -d outputs/after_close_account_refresh ]; then
            rclone copy outputs/after_close_account_refresh "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/after_close_account_refresh/"
          fi
          if [ -d outputs/merged_after_close ]; then
            rclone copy outputs/merged_after_close "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/merged_after_close/"
          fi
          if [ -d outputs/merged_daily_autolearning ]; then
            rclone copy outputs/merged_daily_autolearning "$BASE/research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/merged_daily_autolearning/"
          fi
