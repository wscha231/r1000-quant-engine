name: A1 Twelve private research capture
on:
  workflow_dispatch:
    inputs:
      twelve_key_name:
        description: Select one account; no quota fallback
        required: true
        type: choice
        default: TWELVE_API_KEY2
        options: [TWELVE_API_KEY, TWELVE_API_KEY2]
      private_root_folder_id:
        description: Existing private storage root bound by the reviewed contract
        required: true
        type: string
      private_research_authorized:
        description: Owner authorizes private noncommercial research under provider retention terms
        required: true
        type: boolean
        default: false
      capture_history:
        description: Capture history; without a pinned scope, use the existing four-symbol pilot
        required: true
        type: boolean
        default: false
      cohort_file_id:
        description: Optional owner-only collection scope file ID (current instruments; no PIT admission)
        type: string
        default: ''
      cohort_sha256:
        description: Exact scope SHA256; required together with cohort_file_id
        type: string
        default: ''
      resume_file_id:
        description: Optional exact checkpoint file ID for the same scope
        type: string
        default: ''
      resume_sha256:
        description: Exact resume checkpoint SHA256
        type: string
        default: ''
      max_new_symbols:
        description: Maximum new symbols this batch (1-360; account budget may stop earlier)
        type: number
        default: 32
permissions:
  contents: read
concurrency:
  group: a1-private-research-single-writer
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'wscha231/r1000-quant-engine' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/twelve_private_capture.py
            /tools/twelve_private_cohort.py
            /tools/configure_macro_research_drive.py
            /tools/macro_history_sources.py
            /tools/macro_research_checkpoint.py
            /tests/twelve_private_capture_smoke.py
            /tests/twelve_private_cohort_smoke.py
            /.github/workflows/twelve_private_capture.yml
      - name: Offline contract checks before credentials
        run: |
          python3 tests/twelve_private_capture_smoke.py
          python3 tests/twelve_private_cohort_smoke.py
      - name: Install the existing pinned research transport
        env:
          MACRO_RCLONE_RELEASE: 1.75.0
          MACRO_RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://downloads.rclone.org/v${MACRO_RCLONE_RELEASE}/rclone-v${MACRO_RCLONE_RELEASE}-linux-amd64.zip" -o "$RUNNER_TEMP/private-rclone.zip"
          printf '%s  %s\n' "$MACRO_RCLONE_SHA256" "$RUNNER_TEMP/private-rclone.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/private-rclone.zip" -d "$RUNNER_TEMP/private-rclone-bin"
          echo "MACRO_RCLONE_BIN=$RUNNER_TEMP/private-rclone-bin/rclone-v${MACRO_RCLONE_RELEASE}-linux-amd64/rclone" >> "$GITHUB_ENV"
      - name: Verify account and private destination, then optional bounded capture
        env:
          TWELVE_KEY_NAME: ${{ inputs.twelve_key_name }}
          TWELVE_API_KEY: ${{ inputs.twelve_key_name == 'TWELVE_API_KEY' && secrets.TWELVE_API_KEY || '' }}
          TWELVE_API_KEY2: ${{ inputs.twelve_key_name == 'TWELVE_API_KEY2' && secrets.TWELVE_API_KEY2 || '' }}
          MACRO_DRIVE_CONFIG: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          R1000_PRIVATE_RESEARCH_FOLDER_ID: ${{ inputs.private_root_folder_id }}
          A1_PRIVATE_RESEARCH_AUTHORIZED: ${{ inputs.private_research_authorized }}
          CAPTURE_HISTORY: ${{ inputs.capture_history }}
          COHORT_FILE_ID: ${{ inputs.cohort_file_id }}
          COHORT_SHA256: ${{ inputs.cohort_sha256 }}
          RESUME_FILE_ID: ${{ inputs.resume_file_id }}
          RESUME_SHA256: ${{ inputs.resume_sha256 }}
          MAX_NEW_SYMBOLS: ${{ inputs.max_new_symbols }}
        run: |
          set -euo pipefail
          if [ "$CAPTURE_HISTORY" = "true" ]; then
            python3 tools/twelve_private_capture.py --capture-history \
              --cohort-file-id "$COHORT_FILE_ID" --cohort-sha256 "$COHORT_SHA256" \
              --resume-file-id "$RESUME_FILE_ID" --resume-sha256 "$RESUME_SHA256" \
              --max-new-symbols "$MAX_NEW_SYMBOLS"
          else
            python3 tools/twelve_private_capture.py
          fi
