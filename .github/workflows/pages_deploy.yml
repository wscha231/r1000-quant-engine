name: Deploy Run287 Portfolio Dashboard

# Publishes ONLY docs/public/ via the GitHub Actions Pages artifact path.
# Internal docs/ files are never part of the deployed artifact.
#
# Daily refresh contract:
#   - portfolio updates require a successful daily run and its review artifact;
#   - quotes and freshness labels refresh even while paper processing is blocked;
#   - publishes weights/prices and review proposals, never account dollars,
#     quantities, P&L, secrets, local paths, or automatic order instructions;
#   - fails closed when the artifact is not explicitly review_only.

on:
  push:
    branches: [master]
    paths:
      - 'docs/public/**'
      - 'tools/build_public_portfolio_dashboard.py'
      - 'tools/refresh_public_market_quotes.py'
      - 'tools/build_public_project_results.py'
      - 'tools/run_run287_daily_research_monitor.py'
      - 'tools/run287_research_score_handoff.py'
      - 'docs/run287_daily_research_monitor_contract.json'
      - 'tools/run287_promotion_gate.py'
      - 'data_static/run287_promotion_state.json'
      - 'tests/public_portfolio_dashboard_smoke.py'
      - '.github/workflows/pages_deploy.yml'
  workflow_run:
    workflows: ['Daily Operating Selection Refresh', 'Run287 Daily Research Monitor', 'After-Close Daily Automation', 'Earnings Estimates Daily Archive', 'Smart Money Top 30 Refresh', 'Durable financial and macro history']
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * 2-6'
    - cron: '45 8 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: run287-public-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["schedule","workflow_dispatch","workflow_run","push"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    outputs:
      deploy_ready: ${{ steps.publish_gate.outputs.ready }}
    steps:
      - name: Checkout trusted master source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 60
          sparse-checkout: |
            /*.py
            docs/public
            docs/run287_daily_research_monitor_contract.json
            .github/workflows/pages_deploy.yml
            .github/workflows/long_history_research.yml
            tools
            tests
            data_static/run287_promotion_state.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Public validation imports the paper-ledger smoke and its runtime.
      - name: Install public validation dependencies
        run: python -m pip install 'pandas>=2.2,<3' numpy pyarrow 'pandas_market_calendars>=4.4' requests pyyaml

      - name: Set up dashboard JavaScript checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Preserve last published portfolio snapshot
        env:
          PUBLIC_PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -n "$PUBLIC_PAGES_BASE_URL"
          python -m tools.refresh_public_market_quotes --preserve-deployed \
            --deployed-url "${PUBLIC_PAGES_BASE_URL%/}/data/dashboard.json"
          cp docs/public/data/dashboard.json .dashboard-previous.json

      - name: Check for completed-session daily artifact
        id: daily_artifact
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'Daily Operating Selection Refresh'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const expected = `daily-operating-selection-refresh-${runId}`;
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const artifact = response.data.artifacts.find(
              item => item.name === expected && !item.expired
            );
            core.setOutput('available', artifact ? 'yes' : 'no');
            core.info(artifact
              ? `completed-session artifact ready: ${expected}`
              : `no completed-session artifact: ${expected}; keeping current Pages deployment`);

      - name: Resolve Pages publication gate
        id: publish_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DAILY_ARTIFACT_AVAILABLE: ${{ steps.daily_artifact.outputs.available || 'no' }}
        run: |
          # A missing/failed paper session never authorizes a portfolio update.
          # Publish fresh quote observations and explicit stale portfolio labels.
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: Download completed daily review artifact
        if: steps.daily_artifact.outputs.available == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: daily-operating-selection-refresh-${{ github.event.workflow_run.id }}
          path: .dashboard-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Refresh privacy-safe public snapshot
        if: steps.daily_artifact.outputs.available == 'yes'
        run: |
          python tools/build_public_portfolio_dashboard.py \
            --source .dashboard-source \
            --base-json docs/public/data/dashboard.json \
            --output docs/public/data/dashboard.json \
            --repo-root .
          # Delayed successful daily events cannot roll the public account back.
          python -m tools.refresh_public_market_quotes --preserve-from .dashboard-previous.json

      - name: Refresh public close observations without portfolio mutation
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m tools.refresh_public_market_quotes

      - name: Connect current project research results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/build_public_project_results.py

      - name: Validate public data and static assets
        if: steps.publish_gate.outputs.ready == 'yes'
        run: python tests/public_portfolio_dashboard_smoke.py

      - name: Upload public-only Pages artifact
        if: steps.publish_gate.outputs.ready == 'yes'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/public

  deploy:
    needs: build
    if: needs.build.outputs.deploy_ready == 'yes'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
