name: Deploy GitHub Pages (docs/public)

# Publishes ONLY docs/public/ via the GitHub Actions artifact deployment path.
#
# Why GitHub Actions instead of "Deploy from a branch":
#   The branch-source UI only offers `/` (repo root) or `/docs` as the folder.
#   `/docs/public/` is not selectable. Using `/docs` would expose every
#   internal strategy doc under docs/ (CODEX_*, MASTER_PRIORITY_*, etc).
#   The Actions path uploads ONLY docs/public/ as the Pages artifact, so the
#   rest of docs/ is never published.
#
# Activation (user, one-time): Settings -> Pages -> Source: "GitHub Actions".
# After that this workflow runs on every push that touches docs/public/.

on:
  push:
    branches: [master]
    paths:
      - 'docs/public/**'
      - '.github/workflows/pages_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel an in-progress run so a
# half-finished deploy is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload docs/public as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
