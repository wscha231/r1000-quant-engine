name: Run287 U0 Acceptance

# Research-only canonical evidence producer. It never runs a backtest, builds
# target books, creates orders, mutates paper/live state, or promotes a model.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: run287-u0-acceptance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  accept:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact master head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify execution identity and fetch branch ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wscha231/r1000-quant-engine"
          test "$GITHUB_REF" = "refs/heads/master"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          REMOTE_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          test "$REMOTE_MASTER" = "$GITHUB_SHA"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Build exact-head GitHub census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/build_run287_u0_v2_github_census.py \
            --repository "$GITHUB_REPOSITORY" \
            --audit-sha "$GITHUB_SHA" \
            --collect-local-ancestry \
            --output-dir "$RUNNER_TEMP/run287-u0"

      # This artifact is evidence for repairing an incomplete census only.  It
      # is deliberately published before the acceptance gate and uses a name
      # that the expected-return runner will never accept as U0 approval.
      - name: Publish blocked-or-complete U0 census diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: run287-u0-census-diagnostic
          path: |
            ${{ runner.temp }}/run287-u0/github_census.json
            ${{ runner.temp }}/run287-u0/github_census_summary.json
            ${{ runner.temp }}/run287-u0/experiment_candidates.csv
          if-no-files-found: error
          retention-days: 30

      - name: Require complete U0 and create acceptance envelope
        env:
          U0_ROOT: ${{ runner.temp }}/run287-u0
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["U0_ROOT"])
          census_path = root / "github_census.json"
          census = json.loads(census_path.read_text(encoding="utf-8"))
          summary = census.get("summary") or {}
          blockers = census.get("promotion_blockers")
          audit_sha = str(census.get("audit_default_branch_sha") or "").lower()
          failures = []
          if census.get("schema_version") != "run287-u0-v2-github-census-v1":
              failures.append("schema")
          if census.get("repository") != os.environ["GITHUB_REPOSITORY"]:
              failures.append("repository")
          if census.get("audit_default_branch") != "master":
              failures.append("default_branch")
          if audit_sha != os.environ["GITHUB_SHA"].lower():
              failures.append("audit_sha")
          if re.fullmatch(r"[0-9a-f]{40}", audit_sha) is None:
              failures.append("audit_sha_format")
          if summary.get("historical_experiment_census_complete") is not True:
              failures.append("census_incomplete")
          if summary.get("historical_challenger_allowed") is not True:
              failures.append("challenger_not_allowed")
          if blockers != []:
              failures.append("promotion_blockers")
          if failures:
              raise SystemExit(
                  "U0 acceptance blocked: " + ",".join(sorted(set(failures)))
              )

          def canonical_sha256(value):
              raw = json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=False,
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          evidence = {
              "schema_version": "run287-u0-accepted-evidence-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_identity": "run287-u0-v2-acceptance",
              "audit_default_branch_sha": audit_sha,
              "census_sha256": canonical_sha256(census),
              "source_contract_sha256": canonical_sha256(
                  census.get("source_contract")
              ),
              "historical_experiment_census_complete": True,
              "historical_challenger_allowed": True,
              "promotion_blockers": [],
          }
          (root / "u0_accepted_evidence.json").write_text(
              json.dumps(
                  evidence,
                  indent=2,
                  sort_keys=True,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Reverify master head before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)" = "$GITHUB_SHA"

      - name: Publish canonical U0 acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: run287-u0-accepted-evidence
          path: |
            ${{ runner.temp }}/run287-u0/github_census.json
            ${{ runner.temp }}/run287-u0/u0_accepted_evidence.json
          if-no-files-found: error
          retention-days: 90
