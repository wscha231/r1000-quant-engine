name: Run287 U0 Acceptance

# Research-only canonical evidence producer. It never runs a backtest, builds
# target books, creates orders, mutates paper/live state, or promotes a model.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: run287-u0-acceptance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  accept:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact master head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify execution identity and fetch branch ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wscha231/r1000-quant-engine"
          test "$GITHUB_REF" = "refs/heads/master"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          REMOTE_MASTER="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)"
          test "$REMOTE_MASTER" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/run287-u0-pull-heads/*'

      - name: Build exact-head GitHub census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/build_run287_u0_v2_github_census.py \
            --repository "$GITHUB_REPOSITORY" \
            --audit-sha "$GITHUB_SHA" \
            --collect-local-ancestry \
            --output-dir "$RUNNER_TEMP/run287-u0"

      - name: Classify conservative U0-v3 recovery census
        run: |
          set -euo pipefail
          python tools/build_run287_u0_v3_recovery_census.py \
            --source-census "$RUNNER_TEMP/run287-u0/github_census.json" \
            --output-dir "$RUNNER_TEMP/run287-u0"

      # This artifact is evidence for repairing an incomplete census only.  It
      # is deliberately published before the acceptance gate and uses a name
      # that the expected-return runner will never accept as U0 approval.
      - name: Publish blocked-or-complete U0 census diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: run287-u0-census-diagnostic
          path: |
            ${{ runner.temp }}/run287-u0/github_census.json
            ${{ runner.temp }}/run287-u0/github_census_summary.json
            ${{ runner.temp }}/run287-u0/experiment_candidates.csv
            ${{ runner.temp }}/run287-u0/github_recovery_census.json
            ${{ runner.temp }}/run287-u0/github_recovery_census_summary.json
            ${{ runner.temp }}/run287-u0/recovered_experiment_candidates.csv
          if-no-files-found: error
          retention-days: 30

      - name: Require complete U0 and create acceptance envelope
        run: |
          set -euo pipefail
          python tools/build_run287_u0_v3_acceptance.py \
            --source-census "$RUNNER_TEMP/run287-u0/github_census.json" \
            --recovery-census "$RUNNER_TEMP/run287-u0/github_recovery_census.json" \
            --expected-audit-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/run287-u0/u0_accepted_evidence.json"

      - name: Reverify master head before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)" = "$GITHUB_SHA"

      - name: Publish canonical U0 acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: run287-u0-accepted-evidence
          path: |
            ${{ runner.temp }}/run287-u0/github_census.json
            ${{ runner.temp }}/run287-u0/github_recovery_census.json
            ${{ runner.temp }}/run287-u0/u0_accepted_evidence.json
          if-no-files-found: error
          retention-days: 90
