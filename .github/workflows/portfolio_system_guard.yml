name: Portfolio System Guard

on:
  pull_request:
  workflow_dispatch:
    inputs:
      latest_run:
        description: "Existing latest rebuild artifact directory"
        type: string
        default: "cloud_results/full_rebuild/latest_global_alpha_universe"
      strict_targets:
        description: "Fail when main/concentrated target gates are not met"
        type: boolean
        default: false
      refresh_auto_learning_v2:
        description: "Regenerate AutoLearning v2 research artifacts before guard"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  portfolio_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The guard reads the canonical latest baseline, not dated rebuild
          # copies. Preserve all code/test inputs while excluding those copies.
          sparse-checkout: |
            .github
            aggressive
            auto_learning_v2
            backtest_results
            cloud_results/full_rebuild/latest_global_alpha_universe
            cloud_results/ic_monitor
            cloud_results/paper_runs
            cloud_results/performance_ledger
            cloud_results/scanner
            cloud_results/tactical_alpha
            cloud_results/theme_discovery
            data_static
            docs
            outputs
            outputs_advisor
            outputs_advisor_v2
            outputs_advisor_v3
            outputs_advisor_v4
            reports
            research
            tests
            tools
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile guard modules
        run: |
          python -m py_compile \
            tools/run_portfolio_system_guard.py \
            tools/run_auto_learning_v2.py \
            tools/run_orchestrator_replay.py \
            tools/run_portfolio_goal_search.py \
            tools/run_concentrated_position_risk_replay.py \
            tests/portfolio_system_guard_smoke.py \
            tests/auto_learning_v2_smoke.py \
            tests/orchestrator_replay_smoke.py \
            tests/portfolio_goal_search_smoke.py

      - name: Run AutoLearning v2 snapshot
        if: ${{ github.event_name == 'pull_request' || inputs.refresh_auto_learning_v2 }}
        run: |
          LATEST="${{ inputs.latest_run || 'cloud_results/full_rebuild/latest_global_alpha_universe' }}"
          python tools/run_auto_learning_v2.py --latest-run "$LATEST"

      - name: Run concentrated orchestrator replay
        run: |
          LATEST="${{ inputs.latest_run || 'cloud_results/full_rebuild/latest_global_alpha_universe' }}"
          python tools/run_orchestrator_replay.py --latest-run "$LATEST"

      - name: Run portfolio goal search
        run: |
          LATEST="${{ inputs.latest_run || 'cloud_results/full_rebuild/latest_global_alpha_universe' }}"
          python tools/run_portfolio_goal_search.py --latest-run "$LATEST"

      - name: Run portfolio system guard
        run: |
          LATEST="${{ inputs.latest_run || 'cloud_results/full_rebuild/latest_global_alpha_universe' }}"
          ARGS="--latest-run $LATEST"
          # PR cadence enforces CONTRACTS (book shape / concentration), not the
          # aspirational CAGR/MDD goals: --strict-targets exits non-zero while
          # the 35%/50% goals are unmet, which would fail every PR regardless
          # of content. Shape violations inherited unchanged from the base ref
          # are downgraded to warnings so pre-existing production-book state
          # cannot fail unrelated PRs; only violations the PR introduces fail.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="$ARGS --enforce-contracts"
            # Explicit refspec: a bare `git fetch origin <branch>` may only
            # update FETCH_HEAD without creating the origin/<branch> tracking
            # ref on shallow CI checkouts, silently skipping the baseline and
            # losing the inherited-violation downgrade. FETCH_HEAD fallback
            # covers remotes where the refspec form is rejected.
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1 \
              || git fetch origin "${{ github.base_ref }}" --depth=1 || true
            for KIND in main concentrated; do
              BOOK="cloud_results/full_rebuild/latest_global_alpha_universe/reports/operating_${KIND}_target_book.csv"
              if git show "origin/${{ github.base_ref }}:$BOOK" > "/tmp/baseline_${KIND}_target_book.csv" 2>/dev/null \
                || git show "FETCH_HEAD:$BOOK" > "/tmp/baseline_${KIND}_target_book.csv" 2>/dev/null; then
                ARGS="$ARGS --baseline-${KIND}-target-book /tmp/baseline_${KIND}_target_book.csv"
              fi
            done
          fi
          if [ "${{ inputs.strict_targets }}" = "true" ]; then
            ARGS="$ARGS --strict-targets"
          fi
          python tools/run_portfolio_system_guard.py $ARGS

      - name: Smoke tests
        run: |
          python tests/portfolio_system_guard_smoke.py
          python tests/auto_learning_v2_smoke.py
          python tests/orchestrator_replay_smoke.py
          python tests/portfolio_goal_search_smoke.py

      - name: Upload system guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-system-guard-${{ github.run_id }}
          path: |
            outputs/portfolio_system_guard/
            outputs/orchestrator_replay/
            outputs/portfolio_goal_search/
            outputs/auto_learning_v2/
            research/auto_learning_v2/
          retention-days: 365
