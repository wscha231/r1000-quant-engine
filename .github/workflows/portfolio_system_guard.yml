name: Portfolio System Guard

on:
  pull_request:
  workflow_dispatch:
    inputs:
      latest_run:
        description: "Checksum-manifested baseline directory; unsupported paths fail closed"
        type: string
        default: "tests/fixtures/run287_canonical_baseline"
      strict_targets:
        description: "Fail when main/concentrated target gates are not met"
        type: boolean
        default: false
      refresh_auto_learning_v2:
        description: "Regenerate AutoLearning v2 research artifacts before guard"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  portfolio_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The guard reads a small checksum-locked canonical fixture. Large
          # historical/runtime artifacts are restored only in manual lanes.
          sparse-checkout: |
            .github
            aggressive
            auto_learning_v2
            backtest_results
            data_static
            docs
            outputs
            outputs_advisor
            outputs_advisor_v2
            outputs_advisor_v3
            outputs_advisor_v4
            reports
            research
            tests
            tools
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile guard modules
        run: |
          python -m py_compile \
            tools/run_portfolio_system_guard.py \
            tools/run_auto_learning_v2.py \
            tools/run_orchestrator_replay.py \
            tools/run_portfolio_goal_search.py \
            tools/run_concentrated_position_risk_replay.py \
            tools/verify_run287_artifact_manifest.py \
            tests/portfolio_system_guard_smoke.py \
            tests/auto_learning_v2_smoke.py \
            tests/orchestrator_replay_smoke.py \
            tests/portfolio_goal_search_smoke.py

      - name: Resolve checksum-verified baseline
        env:
          REQUESTED_LATEST_RUN: ${{ inputs.latest_run }}
        run: |
          LATEST="${REQUESTED_LATEST_RUN:-tests/fixtures/run287_canonical_baseline}"
          python tools/verify_run287_artifact_manifest.py \
            --resolve-baseline "$LATEST" \
            --output /tmp/run287_baseline_resolution.json
          RESOLVED=$(python -c 'import json; print(json.load(open("/tmp/run287_baseline_resolution.json"))["resolved_path"])')
          echo "RUN287_LATEST_RUN=$RESOLVED" >> "$GITHUB_ENV"

      - name: Run AutoLearning v2 snapshot
        if: ${{ github.event_name == 'pull_request' || inputs.refresh_auto_learning_v2 }}
        run: |
          python tools/run_auto_learning_v2.py --latest-run "$RUN287_LATEST_RUN"

      - name: Run concentrated orchestrator replay
        run: |
          python tools/run_orchestrator_replay.py --latest-run "$RUN287_LATEST_RUN"

      - name: Run portfolio goal search
        run: |
          python tools/run_portfolio_goal_search.py --latest-run "$RUN287_LATEST_RUN"

      - name: Run portfolio system guard
        run: |
          ARGS="--latest-run $RUN287_LATEST_RUN"
          # PR cadence enforces CONTRACTS (book shape / concentration), not the
          # aspirational CAGR/MDD goals: --strict-targets exits non-zero while
          # the 35%/50% goals are unmet, which would fail every PR regardless
          # of content. Shape violations inherited unchanged from the base ref
          # are downgraded to warnings so pre-existing production-book state
          # cannot fail unrelated PRs; only violations the PR introduces fail.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS="$ARGS --enforce-contracts"
            for KIND in main concentrated; do
              BOOK="$RUN287_LATEST_RUN/reports/operating_${KIND}_target_book.csv"
              ARGS="$ARGS --baseline-${KIND}-target-book $BOOK"
            done
          fi
          if [ "${{ inputs.strict_targets }}" = "true" ]; then
            ARGS="$ARGS --strict-targets"
          fi
          python tools/run_portfolio_system_guard.py $ARGS

      - name: Smoke tests
        run: |
          python tests/portfolio_system_guard_smoke.py
          python tests/auto_learning_v2_smoke.py
          python tests/orchestrator_replay_smoke.py
          python tests/portfolio_goal_search_smoke.py

      - name: Upload system guard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-system-guard-${{ github.run_id }}
          path: |
            outputs/portfolio_system_guard/
            outputs/orchestrator_replay/
            outputs/portfolio_goal_search/
            outputs/auto_learning_v2/
            research/auto_learning_v2/
          retention-days: 365
