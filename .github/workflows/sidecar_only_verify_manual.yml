name: Sidecar-Only Re-Verify (Manual)

# Registration stub on the default branch so workflow_dispatch is callable.
# GitHub requires the dispatchable workflow file to live on the default
# branch; the actual run uses the file at the dispatched ref. Dispatch with
#   --ref claude/analyze-updated-code-OfEbu (or whichever branch holds the
# fast-loop workflow + tools) to execute the real sidecar-only verify code.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID of the Full Rebuild whose artifacts to reuse'
        type: string
        required: true
      ref:
        description: 'Git ref under test (the sidecar_only_verify.yml + tools live there)'
        type: string
        default: 'claude/analyze-updated-code-OfEbu'
      rerun_long_crisis_learning:
        description: 'Re-run long_crisis dataset + signal + threshold search'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  registration_stub:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain
        run: |
          echo "This is the master-branch registration stub for sidecar_only_verify.yml."
          echo "Dispatch the workflow named 'Sidecar-Only Re-Verify (Fast Loop)' on the"
          echo "ref '${{ inputs.ref }}' (e.g. claude/analyze-updated-code-OfEbu) with the same inputs."
          echo "GitHub registers workflow_dispatch from the default branch's copy of the"
          echo "workflow file, but the executed code comes from the dispatched ref."
