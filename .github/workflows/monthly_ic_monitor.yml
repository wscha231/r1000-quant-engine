name: Monthly IC Monitor (ADR Macro Decorrelation)

# Per user mandate (2026-04-25): "1-2개월 cadence가 훨씬 합리적".
# Measures rank IC of macro features (US CPI, VIX, SPY momentum, USD/CNY FX,
# China CPI) vs forward 30/60/90-day returns of each ADR. Telegram-alerts
# when:
#   - ADR IC drops < -0.03 for 2 consecutive months
#   - China-specific feature IC > US-default IC by 0.05+
#   - All-ADR average IC < 0.01
#
# Lets the user iterate on macro feature choice MUCH faster than annual.

on:
  schedule:
    # 1st of each month, 02:00 UTC = 11:00 KST 1st (data fully settled)
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      countries_filter:
        description: 'restrict to country codes (comma-sep, e.g. "CN" for China-only)'
        type: string
        default: ''
      windows:
        description: 'comma-sep forward-return windows (days)'
        type: string
        default: '30,60,90'

permissions:
  contents: write   # commit snapshot to cloud_results/ic_monitor/

jobs:
  ic_monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore Alpaca bar cache
        uses: actions/cache@v4
        with:
          path: aggressive/cache/bars
          key: alpaca-bars-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpaca-bars-${{ runner.os }}-

      - name: Smoke pre-flight
        run: python tests/smoke_test.py

      - name: Run IC monitor
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNTRIES="${{ github.event.inputs.countries_filter }}"
          WINDOWS="${{ github.event.inputs.windows }}"
          WINDOWS="${WINDOWS:-30,60,90}"

          ARGS="--telegram --windows $WINDOWS"
          if [ -n "$COUNTRIES" ]; then
            ARGS="$ARGS --countries-filter $COUNTRIES"
          fi

          mkdir -p cloud_results/ic_monitor
          python tools/monthly_ic_monitor.py $ARGS

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ic-monitor-${{ github.run_id }}
          path: cloud_results/ic_monitor/
          retention-days: 730    # 2 years (long-term IC trend tracking)

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          git add cloud_results/ic_monitor/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): IC monitor $(date +%Y-%m) [skip ci]"
          git push || true
