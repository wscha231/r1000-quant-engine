name: Telegram Insidertracking Research Ingest

on:
  pull_request:
    paths:
      - 'research/telegram_event_v1/**'
      - 'tools/run_telegram_event_ingest.py'
      - 'tests/telegram_event_ingest_smoke.py'
      - '.github/workflows/telegram_insidertracking_research.yml'
      - 'docs/TELEGRAM_INSIDERTRACKING_A2_20260921.md'
  push:
    branches: [master]
    paths:
      - 'research/telegram_event_v1/**'
      - 'tools/run_telegram_event_ingest.py'
      - 'tests/telegram_event_ingest_smoke.py'
      - '.github/workflows/telegram_insidertracking_research.yml'
      - 'docs/TELEGRAM_INSIDERTRACKING_A2_20260921.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect runs tests only; capture performs one source ingest on reviewed master'
        type: choice
        options: [inspect, capture]
        default: inspect
      expected_sha:
        description: 'Exact reviewed master SHA required for manual capture'
        type: string
        required: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: telegram-insidertracking-research-single-writer
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            research/telegram_event_v1
            tools/run_telegram_event_ingest.py
            tests/telegram_event_ingest_smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline fail-closed regressions
        run: |
          set -euo pipefail
          python tests/telegram_event_ingest_smoke.py
          python -O tests/telegram_event_ingest_smoke.py

  capture:
    needs: test
    if: >-
      github.repository == 'wscha231/r1000-quant-engine' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'capture'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHANNEL: insidertracking
      SOURCE_URL: https://t.me/s/insidertracking
      DRIVE_ROOT: gdrive:research/telegram_insidertracking/v1
      INITIAL_LAST_POST_ID: '64207'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            research/telegram_event_v1
            tools/run_telegram_event_ingest.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify manual exact-head request
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Install pinned rclone
        env:
          RCLONE_RELEASE: 1.75.0
          RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://downloads.rclone.org/v${RCLONE_RELEASE}/rclone-v${RCLONE_RELEASE}-linux-amd64.zip" \
            -o "$RUNNER_TEMP/rclone.zip"
          printf '%s  %s\n' "$RCLONE_SHA256" "$RUNNER_TEMP/rclone.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone-bin"
          echo "RCLONE_BIN=$RUNNER_TEMP/rclone-bin/rclone-v${RCLONE_RELEASE}-linux-amd64/rclone" >> "$GITHUB_ENV"

      - name: Configure temporary Drive client
        env:
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          set -euo pipefail
          test -n "${RCLONE_CONFIG_GDRIVE:-}"
          RCLONE_CONFIG_PATH="$RUNNER_TEMP/telegram-rclone.conf"
          printf '%s' "$RCLONE_CONFIG_GDRIVE" > "$RCLONE_CONFIG_PATH"
          chmod 600 "$RCLONE_CONFIG_PATH"
          echo "RCLONE_CONFIG_PATH=$RCLONE_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Restore durable state from a single committed pointer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/telegram-state" "$RUNNER_TEMP/telegram-out"
          "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" mkdir "$DRIVE_ROOT"
          "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" lsf --files-only "$DRIVE_ROOT" \
            > "$RUNNER_TEMP/telegram-state/root-files.txt"

          if grep -Fxq 'latest.json' "$RUNNER_TEMP/telegram-state/root-files.txt"; then
            "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto \
              "$DRIVE_ROOT/latest.json" "$RUNNER_TEMP/telegram-state/latest.json"
            python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          from research.telegram_event_v1.ingest import parse_latest_pointer
          root=Path(os.environ['RUNNER_TEMP'])/'telegram-state'
          pointer=parse_latest_pointer(
              (root/'latest.json').read_bytes(),
              channel=os.environ['CHANNEL'],
              source_url=os.environ['SOURCE_URL'],
          )
          (root/'run-key.txt').write_text(pointer['run_key']+'\n')
          PY
            RUN_KEY="$(cat "$RUNNER_TEMP/telegram-state/run-key.txt")"
            for name in checkpoint.json events.ndjson a2_discovery_inputs.json receipt.json; do
              "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto \
                "$DRIVE_ROOT/runs/$RUN_KEY/$name" "$RUNNER_TEMP/telegram-state/$name"
            done
            python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          from research.telegram_event_v1.ingest import parse_latest_pointer, verify_latest_pointer_files
          root=Path(os.environ['RUNNER_TEMP'])/'telegram-state'
          pointer=parse_latest_pointer((root/'latest.json').read_bytes(), channel=os.environ['CHANNEL'], source_url=os.environ['SOURCE_URL'])
          files={name:(root/name).read_bytes() for name in ('checkpoint.json','events.ndjson','a2_discovery_inputs.json','receipt.json')}
          verify_latest_pointer_files(pointer, files)
          (root/'bootstrap.txt').write_text('false\n')
          PY
          else
            # No pointer means no committed state. Rebuild conservatively from the
            # fixed known seed. Fifty pages bounds recovery; failure leaves no pointer.
            printf 'true\n' > "$RUNNER_TEMP/telegram-state/bootstrap.txt"
          fi

      - name: Capture public Telegram page and build A2 discovery input
        id: ingest
        run: |
          set -euo pipefail
          args=(
            --channel "$CHANNEL"
            --source-url "$SOURCE_URL"
            --output-dir "$RUNNER_TEMP/telegram-out"
            --initial-last-post-id "$INITIAL_LAST_POST_ID"
            --max-pages "$( [ "$(cat "$RUNNER_TEMP/telegram-state/bootstrap.txt")" = "true" ] && echo 50 || echo 10 )"
          )
          if [ -f "$RUNNER_TEMP/telegram-state/checkpoint.json" ]; then
            args+=(--checkpoint "$RUNNER_TEMP/telegram-state/checkpoint.json")
          fi
          if [ -f "$RUNNER_TEMP/telegram-state/events.ndjson" ]; then
            args+=(--events "$RUNNER_TEMP/telegram-state/events.ndjson")
          fi
          set +e
          python tools/run_telegram_event_ingest.py "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "ingest_rc=$rc" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'telegram-out'/'receipt.json'
          r=json.loads(p.read_text())
          print('TELEGRAM_INGEST_STATUS='+r['status'])
          print('TELEGRAM_NEW_POSTS='+str(r['new_post_count']))
          print('TELEGRAM_A2_EVENTS='+str(r['a2_event_count']))
          print('TELEGRAM_GAP_UNRESOLVED='+str(r['gap_unresolved']).lower())
          PY

      - name: Publish immutable run evidence and verify byte readback
        env:
          INGEST_RC: ${{ steps.ingest.outputs.ingest_rc }}
        run: |
          set -euo pipefail
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUN_DEST="$DRIVE_ROOT/runs/$RUN_KEY"
          VERIFY_DIR="$RUNNER_TEMP/telegram-verify"
          mkdir -p "$VERIFY_DIR"
          # GitHub run_id + run_attempt is unique per execution attempt, so the
          # immutable destination does not require an O(history) directory scan.
          for name in checkpoint.json events.ndjson a2_discovery_inputs.json receipt.json; do
            src="$RUNNER_TEMP/telegram-out/$name"
            test -f "$src"
            "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto "$src" "$RUN_DEST/$name"
            "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto "$RUN_DEST/$name" "$VERIFY_DIR/$name"
            test "$(sha256sum "$src" | cut -d' ' -f1)" = "$(sha256sum "$VERIFY_DIR/$name" | cut -d' ' -f1)"
          done
          if [ "$INGEST_RC" = "2" ]; then
            echo "Gap unresolved: immutable diagnostic evidence preserved; latest state not advanced." >&2
            exit 2
          fi

      - name: Commit latest state with one verified pointer write
        run: |
          set -euo pipefail
          RUN_KEY="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export RUN_KEY
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          from research.telegram_event_v1.ingest import build_latest_pointer
          out=Path(os.environ['RUNNER_TEMP'])/'telegram-out'
          receipt=json.loads((out/'receipt.json').read_text())
          files={name:(out/name).read_bytes() for name in ('checkpoint.json','events.ndjson','a2_discovery_inputs.json','receipt.json')}
          pointer=build_latest_pointer(
              channel=os.environ['CHANNEL'],
              source_url=os.environ['SOURCE_URL'],
              run_key=os.environ['RUN_KEY'],
              head_sha=os.environ['GITHUB_SHA'],
              generated_at=receipt['generated_at'],
              outputs=files,
          )
          (out/'latest.json').write_bytes(pointer)
          PY
          "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto \
            "$RUNNER_TEMP/telegram-out/latest.json" "$DRIVE_ROOT/latest.json"
          "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto \
            "$DRIVE_ROOT/latest.json" "$RUNNER_TEMP/latest-readback.json"
          test "$(sha256sum "$RUNNER_TEMP/telegram-out/latest.json" | cut -d' ' -f1)" = \
               "$(sha256sum "$RUNNER_TEMP/latest-readback.json" | cut -d' ' -f1)"

      - name: Upload compact GitHub evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-insidertracking-health-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/telegram-out/checkpoint.json
            ${{ runner.temp }}/telegram-out/a2_discovery_inputs.json
            ${{ runner.temp }}/telegram-out/receipt.json
            ${{ runner.temp }}/telegram-out/latest.json

      - name: Remove temporary credential file
        if: always()
        run: |
          rm -f "${RCLONE_CONFIG_PATH:-$RUNNER_TEMP/telegram-rclone.conf}"
