name: Telegram Insidertracking Research Ingest

on:
  pull_request:
    paths:
      - 'research/telegram_event_v1/**'
      - 'tools/run_telegram_event_ingest.py'
      - 'tests/telegram_event_ingest_smoke.py'
      - '.github/workflows/telegram_insidertracking_research.yml'
      - 'docs/TELEGRAM_INSIDERTRACKING_A2_20260921.md'
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect runs tests only; capture performs one source ingest on reviewed master'
        type: choice
        options: [inspect, capture]
        default: inspect
      expected_sha:
        description: 'Exact reviewed master SHA required for manual capture'
        type: string
        required: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: telegram-insidertracking-research-single-writer
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            research/telegram_event_v1
            tools/run_telegram_event_ingest.py
            tests/telegram_event_ingest_smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline fail-closed regressions
        run: |
          set -euo pipefail
          python tests/telegram_event_ingest_smoke.py
          python -O tests/telegram_event_ingest_smoke.py

  capture:
    needs: test
    if: >-
      github.repository == 'wscha231/r1000-quant-engine' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'capture'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHANNEL: insidertracking
      SOURCE_URL: https://t.me/s/insidertracking
      DRIVE_ROOT: gdrive:research/telegram_insidertracking/v1
      INITIAL_LAST_POST_ID: '64207'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            research/telegram_event_v1
            tools/run_telegram_event_ingest.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify manual exact-head request
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Install pinned rclone
        env:
          RCLONE_RELEASE: 1.75.0
          RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://downloads.rclone.org/v${RCLONE_RELEASE}/rclone-v${RCLONE_RELEASE}-linux-amd64.zip" \
            -o "$RUNNER_TEMP/rclone.zip"
          printf '%s  %s\n' "$RCLONE_SHA256" "$RUNNER_TEMP/rclone.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone-bin"
          echo "RCLONE_BIN=$RUNNER_TEMP/rclone-bin/rclone-v${RCLONE_RELEASE}-linux-amd64/rclone" >> "$GITHUB_ENV"

      - name: Configure temporary Drive client
        env:
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          set -euo pipefail
          test -n "${RCLONE_CONFIG_GDRIVE:-}"
          RCLONE_CONFIG_PATH="$RUNNER_TEMP/telegram-rclone.conf"
          printf '%s' "$RCLONE_CONFIG_GDRIVE" > "$RCLONE_CONFIG_PATH"
          chmod 600 "$RCLONE_CONFIG_PATH"
          echo "RCLONE_CONFIG_PATH=$RCLONE_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Restore durable checkpoint and append-only event log
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/telegram-state" "$RUNNER_TEMP/telegram-out"
          if "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" cat "$DRIVE_ROOT/latest/checkpoint.json" > "$RUNNER_TEMP/telegram-state/checkpoint.json" 2>/dev/null; then
            test -s "$RUNNER_TEMP/telegram-state/checkpoint.json"
          else
            rm -f "$RUNNER_TEMP/telegram-state/checkpoint.json"
          fi
          if "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" cat "$DRIVE_ROOT/latest/events.ndjson" > "$RUNNER_TEMP/telegram-state/events.ndjson" 2>/dev/null; then
            true
          else
            rm -f "$RUNNER_TEMP/telegram-state/events.ndjson"
          fi

      - name: Capture public Telegram page and build A2 discovery input
        id: ingest
        run: |
          set -euo pipefail
          args=(
            --channel "$CHANNEL"
            --source-url "$SOURCE_URL"
            --output-dir "$RUNNER_TEMP/telegram-out"
            --initial-last-post-id "$INITIAL_LAST_POST_ID"
            --max-pages 10
          )
          if [ -f "$RUNNER_TEMP/telegram-state/checkpoint.json" ]; then
            args+=(--checkpoint "$RUNNER_TEMP/telegram-state/checkpoint.json")
          fi
          if [ -f "$RUNNER_TEMP/telegram-state/events.ndjson" ]; then
            args+=(--events "$RUNNER_TEMP/telegram-state/events.ndjson")
          fi
          set +e
          python tools/run_telegram_event_ingest.py "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "ingest_rc=$rc" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'telegram-out'/'receipt.json'
          r=json.loads(p.read_text())
          print('TELEGRAM_INGEST_STATUS='+r['status'])
          print('TELEGRAM_NEW_POSTS='+str(r['new_post_count']))
          print('TELEGRAM_A2_EVENTS='+str(r['a2_event_count']))
          print('TELEGRAM_GAP_UNRESOLVED='+str(r['gap_unresolved']).lower())
          PY

      - name: Publish immutable run evidence and verify byte readback
        env:
          INGEST_RC: ${{ steps.ingest.outputs.ingest_rc }}
        run: |
          set -euo pipefail
          RUN_DEST="$DRIVE_ROOT/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VERIFY_DIR="$RUNNER_TEMP/telegram-verify"
          mkdir -p "$VERIFY_DIR"
          for name in checkpoint.json events.ndjson a2_discovery_inputs.json receipt.json; do
            src="$RUNNER_TEMP/telegram-out/$name"
            test -f "$src"
            "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto "$src" "$RUN_DEST/$name"
            "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto "$RUN_DEST/$name" "$VERIFY_DIR/$name"
            test "$(sha256sum "$src" | cut -d' ' -f1)" = "$(sha256sum "$VERIFY_DIR/$name" | cut -d' ' -f1)"
          done
          if [ "$INGEST_RC" = "2" ]; then
            echo "Gap unresolved: immutable diagnostic evidence preserved; latest state not advanced." >&2
            exit 2
          fi

      - name: Advance durable latest state only after verified immutable publication
        run: |
          set -euo pipefail
          for name in checkpoint.json events.ndjson a2_discovery_inputs.json receipt.json; do
            "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto \
              "$RUNNER_TEMP/telegram-out/$name" "$DRIVE_ROOT/latest/$name"
          done
          VERIFY_LATEST="$RUNNER_TEMP/telegram-latest-verify"
          mkdir -p "$VERIFY_LATEST"
          for name in checkpoint.json events.ndjson a2_discovery_inputs.json receipt.json; do
            "$RCLONE_BIN" --config "$RCLONE_CONFIG_PATH" copyto "$DRIVE_ROOT/latest/$name" "$VERIFY_LATEST/$name"
            test "$(sha256sum "$RUNNER_TEMP/telegram-out/$name" | cut -d' ' -f1)" = "$(sha256sum "$VERIFY_LATEST/$name" | cut -d' ' -f1)"
          done

      - name: Upload compact GitHub evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-insidertracking-health-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/telegram-out/checkpoint.json
            ${{ runner.temp }}/telegram-out/a2_discovery_inputs.json
            ${{ runner.temp }}/telegram-out/receipt.json

      - name: Remove temporary credential file
        if: always()
        run: |
          rm -f "${RCLONE_CONFIG_PATH:-$RUNNER_TEMP/telegram-rclone.conf}"
