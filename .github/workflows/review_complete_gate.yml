name: Review Complete Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: string
      head_sha:
        description: Exact 40-character PR head SHA being attested
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

jobs:
  evaluate:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/review-complete ') ||
          (github.event.action == 'edited' &&
            startsWith(github.event.changes.body.from, '/review-complete ') &&
            contains(github.event.changes.body.from, ' codex-receipt '))))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted gate implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            tools/check_pr_review_complete.py
          sparse-checkout-cone-mode: false

      - name: Resolve trusted head observation and maintainer attestation
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          REQUESTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          mkdir -p "$RUNNER_TEMP/review-complete"
          ROOT="$RUNNER_TEMP/review-complete"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$ROOT/pr.json"
          HEAD_SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["head"]["sha"])' "$ROOT/pr.json")"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            export HEAD_SHA
            python - <<'PY' > "$ROOT/observation-request.json"
          import json
          import os
          print(json.dumps({
              "name": "review_head_observed",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "success",
              "external_id": "head-observation:" + os.environ["GITHUB_RUN_ID"],
              "output": {
                  "title": "Trusted default-branch workflow observed this PR head",
                  "summary": "A later maintainer attestation must bind review evidence to this exact observation.",
              },
          }))
          PY
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              --input "$ROOT/observation-request.json" > "$ROOT/observation-response.json"
            python - <<'PY' "$ROOT/observation-response.json" "$ROOT/head-observation.json"
          import json
          import sys
          source = json.load(open(sys.argv[1], encoding="utf-8"))
          result = {
              "head_sha": source["head_sha"],
              "observed_at": source["started_at"],
              "check_run_id": source["id"],
              "source": "pull_request_target",
          }
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(result, handle)
          PY
            exit 0
          fi

          export HEAD_SHA
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            COMMAND="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["comment"]["body"].strip())')"
            PIN_EDIT="$(python -c 'import json,os; e=json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); old=((e.get("changes") or {}).get("body") or {}).get("from", ""); print("yes" if e.get("action")=="edited" and old.startswith("/review-complete ") and " codex-receipt " in old else "no")')"
            if [ "$COMMAND" != "/review-complete $HEAD_SHA" ] || [ "$PIN_EDIT" = yes ]; then
              # Only the trusted default-branch parser may recognize a pin.
              python - <<'PY' "$ROOT/pin-command.json" "$ROOT/attestation-event.json"
          import json
          import os
          import sys
          sys.path.insert(0, "tools")
          from check_pr_review_complete import parse_review_complete_command
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          pin = parse_review_complete_command(event["comment"]["body"], os.environ["HEAD_SHA"])
          cid = event["comment"]["id"]
          if pin is None or type(cid) is not int or cid <= 0:
              raise SystemExit("invalid explicit receipt pin")
          selected = {"action": event.get("action"),
                      "repository": {"full_name": event["repository"].get("full_name")},
                      "issue": {"number": event["issue"].get("number"), "pull_request": event["issue"].get("pull_request")},
                      "sender": {key: event["sender"].get(key) for key in ("id", "login")},
                      "comment": {key: event["comment"].get(key) for key in
                                  ("id", "body", "created_at", "updated_at", "issue_url", "user")}}
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump({"receipt_pin": pin, "comment_id": cid, "actor_id": event["comment"]["user"]["id"]}, output)
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              json.dump(selected, output)
          PY
              PIN_COMMENT_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["comment_id"])' "$ROOT/pin-command.json")"
              gh api "repos/$GITHUB_REPOSITORY/issues/comments/$PIN_COMMENT_ID" > "$ROOT/attestation-comment.json"
            fi
            ACTOR="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["comment"]["user"]["login"])')"
            ATTESTED_AT="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["comment"]["created_at"])')"
            SOURCE=issue_comment
          else
            test "$REQUESTED_HEAD_SHA" = "$HEAD_SHA"
            ACTOR="$GITHUB_ACTOR"
            ATTESTED_AT="$(python -c 'from datetime import datetime,timezone; print(datetime.now(timezone.utc).isoformat())')"
            SOURCE=workflow_dispatch
          fi

          PERMISSION="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)"
          case "$PERMISSION" in
            admin|maintain|write) ;;
            *) echo "actor lacks write permission: $ACTOR ($PERMISSION)" >&2; exit 2 ;;
          esac

          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=review_head_observed&filter=latest&per_page=100" \
            > "$ROOT/observation-runs.json"
          python - <<'PY' "$ROOT/observation-runs.json" "$ROOT/head-observation.json" "$HEAD_SHA"
          import json
          import sys
          source = json.load(open(sys.argv[1], encoding="utf-8"))
          head_sha = sys.argv[3].lower()
          candidates = [
              row for row in source.get("check_runs", [])
              if row.get("name") == "review_head_observed"
              and str(row.get("head_sha") or "").lower() == head_sha
              and row.get("conclusion") == "success"
              and (row.get("app") or {}).get("slug") == "github-actions"
              and row.get("started_at")
          ]
          if not candidates:
              raise SystemExit("missing trusted review_head_observed check")
          selected = max(candidates, key=lambda row: row["started_at"])
          result = {
              "head_sha": selected["head_sha"],
              "observed_at": selected["started_at"],
              "check_run_id": selected["id"],
              "source": "review_head_observed",
          }
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(result, handle)
          PY

          export ACTOR ATTESTED_AT PERMISSION SOURCE
          python - <<'PY' "$ROOT/pin-command.json" > "$ROOT/attestation.json"
          import json
          import os
          import sys
          result = {
              "head_sha": os.environ["HEAD_SHA"],
              "created_at": os.environ["ATTESTED_AT"],
              "actor": os.environ["ACTOR"],
              "permission": os.environ["PERMISSION"],
              "source": os.environ["SOURCE"],
          }
          if os.path.exists(sys.argv[1]):
              command = json.load(open(sys.argv[1], encoding="utf-8"))
              result.update(receipt_pin=command["receipt_pin"], actor_id=command["actor_id"])
          print(json.dumps(result))
          PY

      - name: Evaluate Codex review evidence for current head
        id: gate
        if: always() && steps.context.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/review-complete"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" > "$ROOT/reviews.json"
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions" > "$ROOT/reactions.json"
          ARGS=()
          if [ -f "$ROOT/attestation.json" ]; then
            ARGS+=(--attestation "$ROOT/attestation.json")
          fi
          set +e
          python tools/check_pr_review_complete.py \
            --pull-request "$ROOT/pr.json" \
            --head-observation "$ROOT/head-observation.json" \
            --reviews "$ROOT/reviews.json" \
            --reactions "$ROOT/reactions.json" \
            "${ARGS[@]}" \
            --output "$ROOT/result.json" > "$ROOT/legacy-evaluation-stdout.json"
          GATE_RC=$?
          set -e
          # Preserve the legacy evidence path. Only its failed attested case
          # needs the additive, independently collected issue-comment receipt.
          if [ "$GATE_RC" != "0" ] && [ -f "$ROOT/attestation.json" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" > "$ROOT/issue-comments.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" > "$ROOT/review-comments.json"
            OWNER="${GITHUB_REPOSITORY%/*}"
            REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
            gh api graphql --paginate --slurp \
              -f owner="$OWNER" -f repository="$REPOSITORY_NAME" -F number="$PR_NUMBER" \
              -f query='query($owner:String!,$repository:String!,$number:Int!,$endCursor:String) {
                repository(owner:$owner,name:$repository) {
                  nameWithOwner
                  pullRequest(number:$number) {
                    number headRefOid
                    reviewThreads(first:100,after:$endCursor) {
                      totalCount
                      nodes { id isResolved }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' > "$ROOT/review-threads.json"
            # GitHub must expand the receipt prefix uniquely in this repository.
            # An ambiguous/missing commit lookup fails before evidence evaluation.
            gh api "repos/$GITHUB_REPOSITORY/commits/${HEAD_SHA:0:10}" \
              --jq '{sha: .sha, url: .url}' > "$ROOT/resolved-commit.json"
            python - <<'PY' "$ROOT/resolved-commit.json" "$ROOT/commit-binding.json"
          import json
          import os
          import sys
          resolved = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              json.dump({"repository": os.environ["GITHUB_REPOSITORY"],
                         "requested_prefix": os.environ["HEAD_SHA"][:10], **resolved}, output)
          PY
            PIN_ARGS=()
            if [ -f "$ROOT/attestation-comment.json" ] && [ -f "$ROOT/attestation-event.json" ]; then
              PIN_ARGS+=(--attestation-comment "$ROOT/attestation-comment.json" --attestation-event "$ROOT/attestation-event.json")
            fi
            set +e
            python tools/check_pr_review_complete.py \
              --pull-request "$ROOT/pr.json" --head-observation "$ROOT/head-observation.json" \
              --reviews "$ROOT/reviews.json" --reactions "$ROOT/reactions.json" \
              --attestation "$ROOT/attestation.json" --repository "$GITHUB_REPOSITORY" \
              --issue-comments "$ROOT/issue-comments.json" --review-comments "$ROOT/review-comments.json" \
              --review-threads "$ROOT/review-threads.json" --commit-binding "$ROOT/commit-binding.json" \
              "${PIN_ARGS[@]}" \
              --output "$ROOT/result.json" > "$ROOT/comment-evaluation-stdout.json"
            GATE_RC=$?
            set -e
          fi
          cat "$ROOT/result.json"
          echo "gate_rc=$GATE_RC" >> "$GITHUB_OUTPUT"
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); print("status="+p["status"]); print("evidence_type="+str(p.get("evidence_type") or "none")); print("failures="+",".join(p["failures"]))' "$ROOT/result.json" >> "$GITHUB_OUTPUT"
          python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); print("comment_binding="+json.dumps(p.get("comment_receipt_binding"),sort_keys=True,separators=(",",":")))' "$ROOT/result.json" >> "$GITHUB_OUTPUT"

      - name: Publish required review_complete check on PR head
        if: always() && steps.context.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          CONTEXT_OUTCOME: ${{ steps.context.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_RC: ${{ steps.gate.outputs.gate_rc }}
          GATE_STATUS: ${{ steps.gate.outputs.status }}
          EVIDENCE_TYPE: ${{ steps.gate.outputs.evidence_type }}
          FAILURES: ${{ steps.gate.outputs.failures }}
          COMMENT_BINDING: ${{ steps.gate.outputs.comment_binding }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/review-complete-check.json"
          import json
          import os
          # Missing step outputs must never be coerced to a successful exit code.
          accepted = {"ATTESTED_EXACT_HEAD_REVIEW", "MAINTAINER_BOUND_CLEAN_REACTION",
                      "MAINTAINER_BOUND_CLEAN_ISSUE_COMMENT_RECEIPT"}
          head = os.environ.get("HEAD_SHA", "")
          verified = (
              os.environ.get("CONTEXT_OUTCOME") == "success"
              and os.environ.get("GATE_OUTCOME") == "success"
              and os.environ.get("GATE_RC") == "0"
              and os.environ.get("GATE_STATUS") == "PASS_REVIEW_COMPLETE"
              and os.environ.get("EVIDENCE_TYPE") in accepted
              and os.environ.get("FAILURES") == ""
              and len(head) == 40 and all(c in "0123456789abcdef" for c in head)
          )
          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate evaluator result key")
                  value[key] = item
              return value
          def reject_constant(value):
              raise ValueError("nonfinite evaluator result")
          if verified:
              try:
                  with open(os.path.join(os.environ["RUNNER_TEMP"], "review-complete", "result.json"),
                            encoding="utf-8") as source:
                      result = json.load(source, object_pairs_hook=unique_object,
                                         parse_constant=reject_constant)
                  verified = (
                      type(result) is dict
                      and result.get("schema_version") == "run287-review-complete-gate-v2"
                      and result.get("passed") is True
                      and result.get("status") == "PASS_REVIEW_COMPLETE"
                      and result.get("head_sha") == head
                      and result.get("evidence_type") == os.environ["EVIDENCE_TYPE"]
                      and type(result.get("evidence_id")) is int and result["evidence_id"] > 0
                      and type(result.get("evidence_at")) is str and bool(result["evidence_at"])
                      and type(result.get("failures")) is list and not result["failures"]
                      and "comment_receipt_binding" in result
                      and (type(result["comment_receipt_binding"]) is dict
                           if result["evidence_type"] == "MAINTAINER_BOUND_CLEAN_ISSUE_COMMENT_RECEIPT"
                           else result["comment_receipt_binding"] is None)
                      and json.dumps(result.get("comment_receipt_binding"), sort_keys=True,
                                     separators=(",", ":")) == os.environ.get("COMMENT_BINDING")
                  )
              except (OSError, ValueError, TypeError, KeyError, RecursionError):
                  verified = False
          print(json.dumps({
              "name": "review_complete",
              "head_sha": head,
              "status": "completed",
              "conclusion": "success" if verified else "failure",
              "output": {
                  "title": "PASS_REVIEW_COMPLETE" if verified else "BLOCKED_REVIEW_INCOMPLETE",
                  "summary": (
                      "Evidence: " + (os.environ.get("EVIDENCE_TYPE") or "none") + "\n\n" +
                      "Failures: " + (os.environ.get("FAILURES") or "none") + "\n\n" +
                      "Comment receipt binding: " + (os.environ.get("COMMENT_BINDING") or "none") + "\n\n" +
                      "Publisher verification: " + ("verified" if verified else
                          "context, evaluator or result not verified") + "\n\n" +
                      "Unresolved conversations are enforced separately by master branch protection."
                  ),
              },
          }))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            --input "$RUNNER_TEMP/review-complete-check.json"
