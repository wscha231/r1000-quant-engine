name: Review Complete Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: string
      head_sha:
        description: Exact 40-character PR head SHA being attested
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
  actions: read

jobs:
  evaluate:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review-complete '))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted gate implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: |
            tools/check_pr_review_complete.py
          sparse-checkout-cone-mode: false

      - name: Resolve trusted head observation and maintainer attestation
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          REQUESTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          mkdir -p "$RUNNER_TEMP/review-complete"
          ROOT="$RUNNER_TEMP/review-complete"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$ROOT/pr.json"
          HEAD_SHA="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["head"]["sha"])' "$ROOT/pr.json")"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            export HEAD_SHA
            python - <<'PY' > "$ROOT/observation-request.json"
          import json, os
          print(json.dumps({
              "name": "review_head_observed",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "success",
              "external_id": "head-observation:" + os.environ["GITHUB_RUN_ID"],
              "output": {
                  "title": "Trusted default-branch workflow observed this PR head",
                  "summary": "A later maintainer attestation binds review policy to this exact observation.",
              },
          }))
          PY
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              --input "$ROOT/observation-request.json" > "$ROOT/observation-response.json"
            python - <<'PY' "$ROOT/observation-response.json" "$ROOT/head-observation.json"
          import json, sys
          source=json.load(open(sys.argv[1], encoding="utf-8"))
          json.dump({
              "head_sha": source["head_sha"],
              "observed_at": source["started_at"],
              "check_run_id": source["id"],
              "source": "pull_request_target",
          }, open(sys.argv[2], "w", encoding="utf-8"))
          PY
            exit 0
          fi

          export HEAD_SHA
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            COMMAND="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["comment"]["body"].strip())')"
            test "$COMMAND" = "/review-complete $HEAD_SHA"
            ACTOR="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["comment"]["user"]["login"])')"
            ATTESTED_AT="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["comment"]["created_at"])')"
            SOURCE=issue_comment
          else
            test "$REQUESTED_HEAD_SHA" = "$HEAD_SHA"
            ACTOR="$GITHUB_ACTOR"
            ATTESTED_AT="$(python -c 'from datetime import datetime,timezone; print(datetime.now(timezone.utc).isoformat())')"
            SOURCE=workflow_dispatch
          fi

          PERMISSION="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)"
          case "$PERMISSION" in
            admin|maintain|write) ;;
            *) echo "actor lacks write permission: $ACTOR ($PERMISSION)" >&2; exit 2 ;;
          esac

          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=review_head_observed&filter=latest&per_page=100" \
            > "$ROOT/observation-runs.json"
          python - <<'PY' "$ROOT/observation-runs.json" "$ROOT/head-observation.json" "$HEAD_SHA"
          import json,sys
          source=json.load(open(sys.argv[1],encoding="utf-8")); head=sys.argv[3].lower()
          rows=[
              r for r in source.get("check_runs",[])
              if r.get("name")=="review_head_observed"
              and str(r.get("head_sha") or "").lower()==head
              and r.get("conclusion")=="success"
              and (r.get("app") or {}).get("slug")=="github-actions"
              and r.get("started_at")
          ]
          if not rows:
              raise SystemExit("missing trusted review_head_observed check")
          row=max(rows,key=lambda x:x["started_at"])
          json.dump({
              "head_sha":row["head_sha"],"observed_at":row["started_at"],
              "check_run_id":row["id"],"source":"review_head_observed",
          },open(sys.argv[2],"w",encoding="utf-8"))
          PY

          export ACTOR ATTESTED_AT PERMISSION SOURCE
          python - <<'PY' > "$ROOT/attestation.json"
          import json,os
          print(json.dumps({
              "head_sha":os.environ["HEAD_SHA"],"created_at":os.environ["ATTESTED_AT"],
              "actor":os.environ["ACTOR"],"permission":os.environ["PERMISSION"],
              "source":os.environ["SOURCE"],
          }))
          PY

      - name: Evaluate risk tier and exact-head review evidence
        id: gate
        if: always() && steps.context.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/review-complete"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" > "$ROOT/reviews.json"
          gh api --paginate --slurp -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions" > "$ROOT/reactions.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$ROOT/files.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
            > "$ROOT/runs.json"

          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          gh api graphql --paginate --slurp \
            -f owner="$OWNER" -f name="$NAME" -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$endCursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}' \
            > "$ROOT/threads.json"

          ARGS=()
          if [ -f "$ROOT/attestation.json" ]; then
            ARGS+=(--attestation "$ROOT/attestation.json")
          fi
          set +e
          python tools/check_pr_review_complete.py \
            --pull-request "$ROOT/pr.json" \
            --head-observation "$ROOT/head-observation.json" \
            --reviews "$ROOT/reviews.json" \
            --reactions "$ROOT/reactions.json" \
            --files "$ROOT/files.json" \
            --runs "$ROOT/runs.json" \
            --threads "$ROOT/threads.json" \
            "${ARGS[@]}" \
            --output "$ROOT/result.json"
          GATE_RC=$?
          set -e
          echo "gate_rc=$GATE_RC" >> "$GITHUB_OUTPUT"
          python - <<'PY' "$ROOT/result.json" >> "$GITHUB_OUTPUT"
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          print("status="+p["status"])
          print("risk_tier="+p["risk_tier"])
          print("independent_review_required="+str(p["independent_review_required"]).lower())
          print("evidence_type="+str(p.get("evidence_type") or "none"))
          print("failures="+",".join(p["failures"]))
          PY

      - name: Publish required review_complete check on PR head
        if: always() && steps.context.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GATE_STATUS: ${{ steps.gate.outputs.status }}
          RISK_TIER: ${{ steps.gate.outputs.risk_tier }}
          INDEPENDENT_REQUIRED: ${{ steps.gate.outputs.independent_review_required }}
          EVIDENCE_TYPE: ${{ steps.gate.outputs.evidence_type }}
          FAILURES: ${{ steps.gate.outputs.failures }}
          CONCLUSION: ${{ steps.gate.outputs.gate_rc == '0' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/review-complete-check.json"
          import json,os
          print(json.dumps({
              "name":"review_complete","head_sha":os.environ["HEAD_SHA"],
              "status":"completed","conclusion":os.environ["CONCLUSION"],
              "output":{
                  "title":os.environ.get("GATE_STATUS") or "review gate evaluation failed",
                  "summary":"Risk tier: "+(os.environ.get("RISK_TIER") or "unknown")
                    +"\n\nIndependent review required: "+(os.environ.get("INDEPENDENT_REQUIRED") or "unknown")
                    +"\n\nEvidence: "+(os.environ.get("EVIDENCE_TYPE") or "none")
                    +"\n\nFailures: "+(os.environ.get("FAILURES") or "none")
                    +"\n\nUnresolved conversations remain a separate merge condition.",
              },
          }))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            --input "$RUNNER_TEMP/review-complete-check.json"
