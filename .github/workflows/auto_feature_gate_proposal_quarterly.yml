name: Auto Feature Gate Proposal (Quarterly)

# Phase 18c (2026-04-30) — closes the AlphaTrade self-improvement loop.
#
# Reads outputs/trade_journal/insights/{ic_matrix,cluster_winrate}.csv
# (produced by quarterly_trade_insights.yml), runs the conservative
# proposal drafter, and opens a PULL REQUEST with the proposed
# research/auto_feature_gates.yaml changes. Human reviews + merges
# (or rejects). On merge, the next FULL rebuild applies the gates
# automatically via r1000_features.apply_phase18c_gates_to_frame.
#
# IMPORTANT: this workflow does NOT push to master directly. The PR
# review is the human-in-loop checkpoint that distinguishes "auto
# improvement" from "auto risk-taking with my money".

on:
  schedule:
    # 2nd of Jan / Apr / Jul / Oct at 06:00 UTC = 15:00 KST
    # (1 day after quarterly_trade_insights.yml runs)
    - cron: '0 6 2 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      ic_disable:
        description: 'IC threshold for auto-disable (negative)'
        type: string
        default: '-0.05'
      ic_amplify:
        description: 'IC threshold for auto-amplify (positive)'
        type: string
        default: '0.10'
      ic_min_n:
        description: 'Min n trades for IC gate'
        type: string
        default: '25'
      cluster_winrate_max:
        description: 'Max win_rate for pattern_block'
        type: string
        default: '0.30'
      dry_run:
        description: 'Print proposals only; do not write yaml or open PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Locate insights
        id: locate
        run: |
          for d in \
            outputs/trade_journal/insights \
            cloud_results/trade_journal/insights \
            cloud_results/full/trade_journal/insights
          do
            if [ -f "$d/ic_matrix.csv" ] || [ -f "$d/cluster_winrate.csv" ]; then
              echo "[locate] using $d"
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "[locate] no insights directory found"
          echo "dir=" >> "$GITHUB_OUTPUT"

      - name: Run proposal drafter
        if: steps.locate.outputs.dir != ''
        id: draft
        run: |
          ARGS="--insights ${{ steps.locate.outputs.dir }}"
          ARGS="$ARGS --ic-disable ${{ github.event.inputs.ic_disable || '-0.05' }}"
          ARGS="$ARGS --ic-amplify ${{ github.event.inputs.ic_amplify || '0.10' }}"
          ARGS="$ARGS --ic-min-n ${{ github.event.inputs.ic_min_n || '25' }}"
          ARGS="$ARGS --cluster-winrate-max ${{ github.event.inputs.cluster_winrate_max || '0.30' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python tools/feature_gate_proposal.py $ARGS | tee proposal_output.txt

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet research/auto_feature_gates.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "[detect] no yaml changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "[detect] yaml changed"
          fi

      - name: Open PR with proposal
        if: steps.detect.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto-feature-gate-proposal-$(date +%Y%m%d)"
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add research/auto_feature_gates.yaml
          git add outputs/trade_journal/insights/proposal_diff.md 2>/dev/null || true
          git commit -m "chore(phase18c): auto feature gate proposal $(date +%Y-%m-%d)"
          for i in 1 2 3 4; do
            if git push -u origin "$BRANCH"; then
              break
            fi
            sleep $((2 ** i))
          done
          PROPOSAL_BODY=""
          if [ -f outputs/trade_journal/insights/proposal_diff.md ]; then
            PROPOSAL_BODY="$(cat outputs/trade_journal/insights/proposal_diff.md)"
          fi
          gh pr create \
            --title "chore(phase18c): auto feature gate proposal $(date +%Y-%m-%d)" \
            --body "$PROPOSAL_BODY" \
            --base master \
            --head "$BRANCH" \
            --label "phase18c" \
            --label "auto-proposal" || true

      - name: Telegram digest
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANGED: ${{ steps.detect.outputs.changed }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request, pathlib
          tok = os.getenv("TELEGRAM_BOT_TOKEN")
          chat = os.getenv("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              raise SystemExit(0)
          changed = os.getenv("CHANGED", "false")
          out = pathlib.Path("proposal_output.txt").read_text() if pathlib.Path("proposal_output.txt").exists() else "(no output)"
          tag = "PR-OPENED" if changed == "true" else "NO-CHANGE"
          msg = f"[auto-feature-gate {tag}]\n{out[:3500]}"
          url = f"https://api.telegram.org/bot{tok}/sendMessage"
          data = urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=15).read()
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-gate-proposal-${{ github.run_id }}
          path: |
            outputs/trade_journal/insights/proposal_diff.md
            research/auto_feature_gates.yaml
          retention-days: 730
