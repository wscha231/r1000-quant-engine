name: Monthly Research and Universe Maintenance

# Consolidates monthly research and maintenance:
# cycle-play universe refresh, ADR/macro IC monitoring, tactical sleeve
# backtest, and explosive pattern model retraining.

on:
  schedule:
    - cron: '45 22 15 * *'  # 15th after US close
  workflow_dispatch:
    inputs:
      countries_filter:
        description: 'IC monitor country filter, comma-separated'
        type: string
        default: ''
      windows:
        description: 'IC monitor forward-return windows'
        type: string
        default: '30,60,90'
      tactical_top_n:
        description: 'tactical backtest top-N picks'
        type: string
        default: '5'
      tactical_start:
        description: 'tactical backtest start date, optional'
        type: string
        default: ''
      history_path:
        description: 'override scored_history parquet path'
        type: string
        default: ''
      explosion_years:
        description: 'years of yfinance history to mine'
        type: string
        default: '8'
      explosion_limit:
        description: 'limit ticker count for debug; 0 = all'
        type: string
        default: '0'
      neg_per_pos:
        description: 'negative-sample multiplier for entry models'
        type: string
        default: '4'

permissions:
  contents: write

jobs:
  monthly_research:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt
          pip install "xgboost>=2.0" "yfinance>=0.2" pyyaml

      - name: Restore research caches
        uses: actions/cache@v4
        with:
          path: |
            aggressive/cache/bars
            aggressive/cache/finnhub
            aggressive/state/finnhub
          key: monthly-research-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpaca-bars-${{ runner.os }}-
            finnhub-cache-${{ runner.os }}-
            monthly-research-cache-${{ runner.os }}-

      - name: Quick smoke pre-flight
        run: python tests/smoke_test.py --quick

      - name: Refresh cycle play universe
        run: |
          set +e
          python tools/refresh_cycle_play_universe.py 2>&1 | tee refresh_cycle_play.log
          STATUS=$?
          set -e
          echo "CYCLE_STATUS=$STATUS" >> "$GITHUB_ENV"
          if [ "$STATUS" != "0" ]; then
            echo "::warning::cycle play refresh failed with status $STATUS"
          fi

      - name: Run monthly IC monitor
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNTRIES="${{ github.event.inputs.countries_filter }}"
          WINDOWS="${{ github.event.inputs.windows || '30,60,90' }}"
          ARGS="--telegram --windows $WINDOWS"
          if [ -n "$COUNTRIES" ]; then
            ARGS="$ARGS --countries-filter $COUNTRIES"
          fi
          mkdir -p cloud_results/ic_monitor
          set +e
          python tools/monthly_ic_monitor.py $ARGS
          STATUS=$?
          set -e
          echo "IC_STATUS=$STATUS" >> "$GITHUB_ENV"
          if [ "$STATUS" != "0" ]; then
            echo "::warning::IC monitor failed with status $STATUS"
          fi

      - name: Locate scored_history for tactical backtest
        id: locate_history
        run: |
          OVERRIDE="${{ github.event.inputs.history_path }}"
          if [ -n "$OVERRIDE" ] && [ -f "$OVERRIDE" ]; then
            echo "path=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for p in \
            outputs/scored_history.parquet \
            cloud_results/scored_history.parquet \
            cloud_results/quick/scored_history.parquet \
            cloud_results/full/scored_history.parquet \
            cloud_results/full_rebuild/latest_global_alpha_universe/scored_history.parquet
          do
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "path=" >> "$GITHUB_OUTPUT"

      - name: Run tactical sleeve backtest
        if: steps.locate_history.outputs.path != ''
        run: |
          mkdir -p outputs/tactical_backtest
          ARGS="--top-n ${{ github.event.inputs.tactical_top_n || '5' }} --history ${{ steps.locate_history.outputs.path }}"
          START="${{ github.event.inputs.tactical_start }}"
          if [ -n "$START" ]; then
            ARGS="$ARGS --start $START"
          fi
          set +e
          python r1000_tactical_backtest.py $ARGS
          STATUS=$?
          set -e
          echo "TACTICAL_BT_STATUS=$STATUS" >> "$GITHUB_ENV"
          if [ "$STATUS" != "0" ]; then
            echo "::warning::tactical backtest failed with status $STATUS"
          fi

      - name: Mark missing tactical history
        if: steps.locate_history.outputs.path == ''
        run: |
          echo "TACTICAL_BT_STATUS=0" >> "$GITHUB_ENV"
          echo "::warning::no scored_history parquet found; tactical backtest skipped"

      - name: Mine historical explosions
        run: |
          mkdir -p outputs/explosive_pattern_db
          YEARS="${{ github.event.inputs.explosion_years || '8' }}"
          LIMIT="${{ github.event.inputs.explosion_limit || '0' }}"
          ARGS="--years $YEARS"
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          set +e
          python tools/build_explosive_pattern_db.py $ARGS
          STATUS=$?
          set -e
          echo "EXPLOSION_DB_STATUS=$STATUS" >> "$GITHUB_ENV"
          if [ "$STATUS" != "0" ]; then
            echo "::warning::explosive pattern DB build failed with status $STATUS"
          fi

      - name: Train explosive entry/exit classifiers
        run: |
          NEG="${{ github.event.inputs.neg_per_pos || '4' }}"
          set +e
          python tools/train_explosion_classifier.py --neg-per-pos "$NEG" --cv-folds 5
          STATUS=$?
          set -e
          echo "EXPLOSION_TRAIN_STATUS=$STATUS" >> "$GITHUB_ENV"
          if [ "$STATUS" != "0" ]; then
            echo "::warning::explosive classifier training failed with status $STATUS"
          fi

      - name: Upload monthly research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-research-${{ github.run_id }}
          path: |
            refresh_cycle_play.log
            cycle_play_universe.yaml
            cloud_results/ic_monitor/
            outputs/tactical_backtest/
            outputs/explosive_pattern_db/
          retention-days: 730

      - name: Commit monthly research outputs
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          mkdir -p cloud_results/tactical_backtest cloud_results/explosive_pattern_db
          cp -v outputs/tactical_backtest/metrics.json cloud_results/tactical_backtest/ 2>/dev/null || true
          cp -v outputs/tactical_backtest/weekly_returns.csv cloud_results/tactical_backtest/ 2>/dev/null || true
          cp -v outputs/explosive_pattern_db/models/*.json cloud_results/explosive_pattern_db/ 2>/dev/null || true
          cp -v outputs/explosive_pattern_db/models/cv_metrics.json cloud_results/explosive_pattern_db/ 2>/dev/null || true
          cp -v outputs/explosive_pattern_db/models/feature_importance.csv cloud_results/explosive_pattern_db/ 2>/dev/null || true
          cp -v outputs/explosive_pattern_db/events.csv cloud_results/explosive_pattern_db/ 2>/dev/null || true

          git pull --rebase --autostash || true
          git add cycle_play_universe.yaml \
                  cloud_results/ic_monitor/ \
                  cloud_results/tactical_backtest/ \
                  cloud_results/explosive_pattern_db/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): monthly research $(date +%Y-%m) [skip ci]"
          for i in 1 2 3 4; do
            if git push; then
              break
            fi
            sleep $((2 ** i))
          done

      - name: Fail on critical monthly research errors
        if: always()
        run: |
          for status in \
            "${CYCLE_STATUS:-0}" \
            "${IC_STATUS:-0}" \
            "${TACTICAL_BT_STATUS:-0}" \
            "${EXPLOSION_DB_STATUS:-0}" \
            "${EXPLOSION_TRAIN_STATUS:-0}"
          do
            if [ "$status" != "0" ]; then
              exit 1
            fi
          done
