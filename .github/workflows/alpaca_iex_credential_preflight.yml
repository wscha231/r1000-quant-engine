# A1 non-retaining, read-only, manually dispatched credential/IEX preflight.
# Only runs from reviewed master. No vendor bytes, secret values or artifacts
# are published. An HTTP 200 is NOT a retention/license/admission approval.
name: A1 Alpaca IEX Credential Preflight
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: a1-alpaca-iex-credential-preflight
  cancel-in-progress: false
jobs:
  iex_probe:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only IEX single-bar access probe (no retention)
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          python3 - <<'PYTHON'
          """One AAPL/2026-10-09 IEX read, sanitized result only; no file writes."""
          import json
          import math
          import os
          from datetime import datetime, timedelta
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          HOST = 'https://data.alpaca.markets/v2/stocks/bars'
          SESSION = '2026-10-09'
          MAX_BYTES = 65_536
          QUERY = {
              'symbols': 'AAPL',
              'timeframe': '1Day',
              'start': '2026-10-09T00:00:00Z',
              'end': '2026-10-10T00:00:00Z',
              'feed': 'iex',
              'adjustment': 'raw',
              'sort': 'asc',
              'limit': 1,
          }

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request_status_body(key, secret):
              # Credentials are used only in headers; no redirect or body logging.
              request = Request(
                  HOST + '?' + urlencode(QUERY),
                  headers={
                      'APCA-API-KEY-ID': key,
                      'APCA-API-SECRET-KEY': secret,
                      'Accept': 'application/json',
                  },
                  method='GET',
              )
              try:
                  with build_opener(NoRedirect()).open(request, timeout=15) as response:
                      return response.status, response.read(MAX_BYTES + 1)
              except HTTPError as exc:
                  status = exc.code
                  exc.close()
                  return status, None
              except Exception:
                  # Exception strings may embed a URL, proxy or credential.
                  return 0, None

          def valid_bar(bar):
              if not isinstance(bar, dict):
                  return False
              timestamp = bar.get('t')
              if not isinstance(timestamp, str) or not timestamp.startswith(SESSION + 'T'):
                  return False
              try:
                  clock = datetime.fromisoformat(timestamp.replace('Z', '+00:00'))
                  if clock.utcoffset() != timedelta(0) or clock.date().isoformat() != SESSION:
                      return False
              except (ValueError, OverflowError):
                  return False
              for field in ('o', 'h', 'l', 'c', 'v'):
                  value = bar.get(field)
                  if isinstance(value, bool) or not isinstance(value, (int, float)):
                      return False
                  try:
                      if not math.isfinite(value) or value < 0:
                          return False
                  except (OverflowError, ValueError):
                      return False
              return (
                  all(bar[field] > 0 for field in ('o', 'h', 'l', 'c'))
                  and isinstance(bar['v'], int)
                  and bar['l'] <= min(bar['o'], bar['c'])
                  and bar['h'] >= max(bar['o'], bar['c'])
              )

          def classify(status, raw):
              if status == 0:
                  return 'NETWORK'
              if status == 401:
                  return 'AUTH'
              if status in (402, 403):
                  return 'ENTITLEMENT_OR_SCOPE'
              if status in (400, 422):
                  return 'REQUEST_OR_ENTITLEMENT'
              if status == 429:
                  return 'RATE_LIMIT'
              if status == 307 or status == 308 or 300 <= status < 400:
                  return 'REDIRECT_REFUSED'
              if status >= 500:
                  return 'PROVIDER_ERROR'
              if status != 200:
                  return 'HTTP_ERROR'
              if not isinstance(raw, bytes) or len(raw) > MAX_BYTES:
                  return 'INVALID_OR_OVERSIZE_RESPONSE'
              try:
                  data = json.loads(raw)
              except (ValueError, UnicodeError, TypeError, RecursionError):
                  return 'INVALID_RESPONSE'
              if not isinstance(data, dict) or not isinstance(data.get('bars'), dict):
                  return 'INVALID_RESPONSE'
              bars = data['bars'].get('AAPL')
              if bars == []:
                  return 'NO_DATA'
              if not isinstance(bars, list) or len(bars) != 1 or not valid_bar(bars[0]):
                  return 'INVALID_RESPONSE'
              return 'IEX_ACCESS_CONFIRMED'

          def run():
              key = os.environ.get('ALPACA_API_KEY', '').strip()
              secret = os.environ.get('ALPACA_API_SECRET', '').strip()
              if not key or not secret:
                  result, http = 'MISSING_SECRET_IN_RUNNER', None
              else:
                  http, raw = request_status_body(key, secret)
                  result = classify(http, raw)
              # Deliberately do not print response, exception, URL or credential.
              print(json.dumps({
                  'scope': 'nonretaining_IEX_AAPL_2026-10-09_one_bar',
                  'result': result,
                  'http_status': http,
                  'raw_bytes_persisted': False,
                  'provider_rights_verified': False,
                  'source_admission': False,
              }, sort_keys=True))
              return 0 if result == 'IEX_ACCESS_CONFIRMED' else 1

          if __name__ == '__main__':
              raise SystemExit(run())
          PYTHON
