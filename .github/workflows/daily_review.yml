name: Daily Review (Scanner + Advisor)

# Runs weekdays at 14:00 UTC = 23:00 KST (30 min after US market open)
# - Full R1000 scan with Finnhub gates
# - Rebalance advisor (if scored_latest.csv present in repo)
# - Telegram digest + commit results JSON back to repo

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 14:00 UTC Mon-Fri
  workflow_dispatch:          # manual trigger from GitHub UI

permissions:
  contents: write              # allow commit of result JSONs

jobs:
  daily_review:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      # Restore cached Alpaca bars + Finnhub per-ticker JSONs
      - name: Restore bar cache
        uses: actions/cache@v4
        with:
          path: aggressive/cache/bars
          key: alpaca-bars-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpaca-bars-${{ runner.os }}-

      - name: Restore Finnhub per-ticker cache
        uses: actions/cache@v4
        with:
          path: aggressive/cache/finnhub
          key: finnhub-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            finnhub-cache-${{ runner.os }}-

      # Run scanner directly (no position management in cloud — user tracks manually)
      - name: Run R1000 scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python aggressive/scanner.py --universe r1000 --top 25 --min-score 70

      - name: Upload scanner artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner-${{ github.run_id }}
          path: aggressive/state/scanner/latest.json
          retention-days: 14

      - name: Commit scanner summary
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          mkdir -p cloud_results/scanner
          cp aggressive/state/scanner/latest.json \
             "cloud_results/scanner/$(date +%Y%m%d).json" 2>/dev/null || true
          git add cloud_results/ aggressive/state/finnhub/r1000_features.parquet 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): daily scan $(date +%Y-%m-%d) [skip ci]"
          git push || true
