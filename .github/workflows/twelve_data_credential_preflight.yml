# One account, non-retaining access and reported-history metadata only.
# Execute from reviewed master; no original data, artifacts or admission.
name: A1 Twelve Data Four Symbol Preflight
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: a1-twelve-four-symbol-preflight
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Single-account access and earliest-date probes (no retention)
        shell: bash
        env:
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from datetime import date
          from decimal import Decimal, InvalidOperation
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          HOST = 'https://api.twelvedata.com'
          SESSION = '2026-10-09'
          SESSION_END = '2026-10-10'  # Exclusive daily upper bound.
          DECADE_START = '2016-10-09'
          SYMBOLS = (('AAPL', 'XNAS'), ('MSFT', 'XNAS'), ('BE', 'XNYS'), ('TSM', 'XNYS'))
          MAX_BYTES = 65_536
          STOP_RESULTS = {'AUTH', 'RATE_LIMIT', 'NETWORK', 'REDIRECT_REFUSED'}

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request_body(endpoint, query, key):
              req = Request(HOST + endpoint + '?' + urlencode(query), method='GET',
                            headers={'Authorization': 'apikey ' + key, 'Accept': 'application/json'})
              try:
                  with build_opener(NoRedirect()).open(req, timeout=15) as response:
                      return response.status, response.read(MAX_BYTES + 1)
              except HTTPError as exc:
                  code = exc.code
                  exc.close()
                  return code, None
              except Exception:
                  return 0, None

          def reject_constant(value):
              raise ValueError('invalid JSON constant')

          def decode(status, raw):
              codes = {0: 'NETWORK', 401: 'AUTH', 402: 'ENTITLEMENT_OR_SCOPE',
                       403: 'ENTITLEMENT_OR_SCOPE', 429: 'RATE_LIMIT'}
              if status in codes:
                  return codes[status], None
              if 300 <= status < 400:
                  return 'REDIRECT_REFUSED', None
              if status != 200:
                  return 'HTTP_ERROR', None
              if not isinstance(raw, bytes) or len(raw) > MAX_BYTES:
                  return 'INVALID_RESPONSE', None
              try:
                  data = json.loads(raw, parse_constant=reject_constant)
              except (ValueError, UnicodeError, TypeError, RecursionError):
                  return 'INVALID_RESPONSE', None
              if not isinstance(data, dict):
                  return 'INVALID_RESPONSE', None
              # Provider sometimes returns HTTP 200 with a JSON error code.
              if data.get('status') == 'error' or ('code' in data and data['code'] != 200):
                  code = data.get('code')
                  return codes.get(code, 'PROVIDER_ERROR') if type(code) is int else 'PROVIDER_ERROR', None
              return 'OK', data

          def valid_date(value):
              if not isinstance(value, str) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}', value):
                  return False
              try:
                  return date(1900, 1, 1) <= date.fromisoformat(value) <= date.fromisoformat(SESSION)
              except ValueError:
                  return False

          def access_result(data, symbol, mic):
              meta, values = data.get('meta'), data.get('values')
              if not isinstance(meta, dict) or not isinstance(values, list):
                  return 'INVALID_RESPONSE'
              if (meta.get('symbol') != symbol or meta.get('interval') != '1day'
                      or meta.get('currency') != 'USD' or meta.get('mic_code') != mic):
                  return 'IDENTITY_MISMATCH'
              if values == []:
                  return 'NO_DATA'
              if len(values) != 1 or not isinstance(values[0], dict) or values[0].get('datetime') != SESSION:
                  return 'INVALID_RESPONSE'
              try:
                  fields = [values[0][name] for name in ('open', 'high', 'low', 'close', 'volume')]
                  if any(isinstance(v, bool) or not isinstance(v, (str, int, float)) for v in fields):
                      return 'INVALID_RESPONSE'
                  o, h, l, c, v = [Decimal(str(value)) for value in fields]
                  if not all(value.is_finite() for value in (o, h, l, c, v)):
                      return 'INVALID_RESPONSE'
                  valid = min(o, h, l, c) > 0 and l <= min(o, c) <= max(o, c) <= h and v >= 0 and v == v.to_integral_value()
                  return 'DAILY_ACCESS_CONFIRMED' if valid else 'INVALID_RESPONSE'
              except (KeyError, InvalidOperation, ValueError, OverflowError):
                  return 'INVALID_RESPONSE'

          def run():
              key = os.environ.get('TWELVE_API_KEY', '').strip()
              results, stopped, calls = [], None, 0
              for symbol, mic in SYMBOLS:
                  row = {'symbol': symbol, 'access': 'NOT_RUN', 'history': 'NOT_RUN',
                         'access_http': None, 'history_http': None, 'reported_earliest_date': None,
                         'ten_year_span_reported': None}
                  if not key:
                      row['access'] = 'MISSING_SECRET_IN_RUNNER'
                  elif stopped:
                      row['access'] = 'SKIPPED_AFTER_STOP'
                  else:
                      query = {'symbol': symbol, 'mic_code': mic, 'interval': '1day'}
                      status, raw = request_body('/time_series', dict(query, start_date=SESSION,
                                                end_date=SESSION_END, outputsize=1, adjust='none'), key)
                      calls += 1
                      result, data = decode(status, raw)
                      row['access_http'] = status
                      row['access'] = access_result(data, symbol, mic) if result == 'OK' else result
                      if row['access'] == 'DAILY_ACCESS_CONFIRMED':
                          status, raw = request_body('/earliest_timestamp', query, key)
                          calls += 1
                          result, data = decode(status, raw)
                          earliest = data.get('datetime') if result == 'OK' else None
                          row['history_http'] = status
                          row['history'] = 'EARLIEST_DATE_REPORTED' if valid_date(earliest) else (result if result != 'OK' else 'INVALID_RESPONSE')
                          if row['history'] == 'EARLIEST_DATE_REPORTED':
                              row['reported_earliest_date'] = earliest
                              row['ten_year_span_reported'] = earliest <= DECADE_START
                      if row['access'] in STOP_RESULTS or row['history'] in STOP_RESULTS:
                          stopped = row['access'] if row['access'] in STOP_RESULTS else row['history']
                  results.append(row)
              print(json.dumps({'scope': 'one_account_four_symbol_nonretaining_preflight',
                                'request_count': calls, 'results': results,
                                'raw_bytes_persisted': False, 'full_history_collected': False,
                                'continuous_history_verified': False, 'provider_rights_verified': False,
                                'historical_identity_verified': False, 'pit_verified': False,
                                'source_admission': False}, sort_keys=True))
              return 0 if all(r['access'] == 'DAILY_ACCESS_CONFIRMED' and r['history'] == 'EARLIEST_DATE_REPORTED' for r in results) else 1

          if __name__ == '__main__':
              raise SystemExit(run())
          PYTHON
