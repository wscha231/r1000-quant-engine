name: Daily Crisis Monitor

on:
  schedule:
    # After the US close with enough delay for daily price caches/sidecars.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (vars.A4_PRIMARY_COLLECTION_ENABLED == 'true' || vars.A4_FINANCING_COLLECTION_ENABLED == 'true') && 60 || 30 }}
    concurrency:
      group: a4-daily-cloud-research-single-writer
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ vars.A4_PRIMARY_COLLECTION_ENABLED == 'true' && secrets.A4_RCLONE_CONFIG_GDRIVE || secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -oq /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '[gdrive]\ntype = drive\nscope = drive\nservice_account_file = /tmp/sa.json\n'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore latest operating state
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          mkdir -p outputs/user_current outputs/operating_snapshot outputs/live_trading_safety outputs/live_trading_risk_controls outputs/macro_policy_engine outputs/long_crisis_learning data_pit/macro outputs/market_analysis_inputs
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            echo "[daily-crisis] no gdrive auth; running with repo-local outputs only"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          for d in outputs/user_current outputs/operating_snapshot outputs/live_trading_safety outputs/live_trading_risk_controls outputs/macro_policy_engine outputs/long_crisis_learning data_pit/macro outputs/market_analysis_inputs; do
            if timeout 30s rclone lsf "$BASE$d" >/dev/null 2>&1; then
              timeout 5m rclone copy "$BASE$d" "$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line || true
            fi
          done

      - name: Prepare pinned native A4 inputs
        id: a4_native_prepare
        if: vars.A4_PRIMARY_COLLECTION_ENABLED == 'true' && vars.A4_NATIVE_SOURCE_MANIFEST_SHA256 != ''
        continue-on-error: true
        env:
          NATIVE_MANIFEST_SHA256: ${{ vars.A4_NATIVE_SOURCE_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          DEST="outputs/a4_native_preparation/${{ github.run_id }}-${{ github.run_attempt }}"
          # A failed current preparation must never reuse the restored request.
          echo "A4_NATIVE_INPUT_ROOT=$DEST" >> "$GITHUB_ENV"
          python tools/prepare_a4_native_inputs.py \
            --source-root outputs/market_analysis_inputs/native_source \
            --manifest-sha256 "$NATIVE_MANIFEST_SHA256" --output-dir "$DEST"

      - name: Configure primary A4 research transport
        id: a4_primary_config
        if: vars.A4_PRIMARY_COLLECTION_ENABLED == 'true'
        env:
          MACRO_DRIVE_CONFIG: ${{ secrets.A4_RCLONE_CONFIG_GDRIVE }}
          MACRO_RESEARCH_LANE: scheduled
        run: |
          set -euo pipefail
          # Dedicated collection credentials work without the legacy secrets.
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSLo "$RUNNER_TEMP/a4-rclone.zip" https://downloads.rclone.org/rclone-current-linux-amd64.zip
            unzip -oq "$RUNNER_TEMP/a4-rclone.zip" -d "$RUNNER_TEMP/a4-rclone"
            sudo install -m 0755 "$RUNNER_TEMP"/a4-rclone/rclone-*/rclone /usr/local/bin/rclone
          fi
          python tools/configure_macro_research_drive.py

      - name: Collect and verify primary A4 research data
        id: a4_primary_collect
        if: vars.A4_PRIMARY_COLLECTION_ENABLED == 'true' && steps.a4_primary_config.outcome == 'success'
        continue-on-error: true
        env:
          A4_FINANCING_COLLECTION_ENABLED: ${{ vars.A4_FINANCING_COLLECTION_ENABLED }}
        run: |
          set -euo pipefail
          DEST="outputs/a4_primary_collection/${{ github.run_id }}-${{ github.run_attempt }}"
          # Set the attempted input root even on failure; never fall back to a
          # restored current-looking report after today's collection failed.
          echo "A4_INPUT_ROOT=$DEST/inputs" >> "$GITHUB_ENV"
          financing=()
          if [ "${A4_FINANCING_COLLECTION_ENABLED:-false}" = true ]; then financing=(--include-financing-inputs); fi
          python tools/collect_a4_primary_data.py --output-dir "$DEST" \
            --existing-input-root "${A4_NATIVE_INPUT_ROOT:-outputs/market_analysis_inputs}" --publish --include-economic-inputs "${financing[@]}"

      - name: Build and verify unified A4 data center
        id: a4_data_center
        if: vars.A4_PRIMARY_COLLECTION_ENABLED == 'true' && steps.a4_primary_collect.outcome == 'success'
        continue-on-error: true
        env:
          A4_LEARNING_POLICY_SHA256: ${{ vars.A4_LEARNING_POLICY_SHA256 }}
        run: |
          set -euo pipefail
          DEST="outputs/a4_data_center/${{ github.run_id }}-${{ github.run_attempt }}"
          # A failed index must not fall back to a current-looking prior root.
          echo "A4_INPUT_ROOT=$DEST/inputs" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          from pathlib import Path
          from tools import a4_data_center as center, a4_primary_sources as source
          from tools.macro_history_sources import digest
          from tools.macro_research_checkpoint import RcloneTransport
          run=os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          capture=Path('outputs/a4_primary_collection')/run
          catalog,receipt=center.build([dict(root=str(capture),execution_sha256=digest((capture/'execution.json').read_bytes()))],
              cutoff=source.now(),output_dir=Path('outputs/a4_data_center')/run,
              transport=RcloneTransport(os.environ['MACRO_RESEARCH_REMOTE']),probe_lake=True,
              code_sha=os.environ['GITHUB_SHA'],
              learning_root='outputs/market_analysis_inputs',
              learning_policy_sha256=os.environ.get('A4_LEARNING_POLICY_SHA256') or None)
          print({'status':receipt['status'],'catalog_sha256':receipt['catalog_sha256'],
              'current_diagnosis':catalog['current_diagnosis']['status'],
              'historical_evaluation':catalog['historical_evaluation']['status']})
          if not receipt['selected_core_verified']:
              raise SystemExit(2)
          PY

      - name: Restore A4 research checkpoint
        id: a4_restore
        if: vars.A4_RESEARCH_ENABLED == 'true'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          ALLOW_GENESIS: ${{ vars.A4_RESEARCH_ALLOW_STATE_GENESIS }}
        run: |
          set -euo pipefail
          test "${GDRIVE_READY:-no}" = yes
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then BASE='gdrive:'; else BASE="gdrive:${GDRIVE_FOLDER_NAME}/"; fi
          mkdir -p outputs/a4_research/state
          if timeout 30s rclone lsf "${BASE}outputs/a4_research/state" > "$RUNNER_TEMP/a4-state-files.txt" 2>/dev/null; then
            timeout 5m rclone copy "${BASE}outputs/a4_research/state" outputs/a4_research/state --checksum --transfers 2 --checkers 2 --max-duration 4m
            timeout 2m rclone check "${BASE}outputs/a4_research/state" outputs/a4_research/state --one-way --checkers 2 --max-duration 90s
          elif [ "${ALLOW_GENESIS:-false}" = true ]; then
            # Prove the parent is reachable and the namespace is absent. Quota,
            # auth or an existing-but-unreadable state can never start afresh.
            timeout 30s rclone lsjson "${BASE}outputs" --dirs-only --max-depth 1 > "$RUNNER_TEMP/a4-parent.json"
            python - <<'PY'
            import json, os
            from pathlib import Path
            entries=json.loads((Path(os.environ['RUNNER_TEMP'])/'a4-parent.json').read_bytes())
            if not isinstance(entries,list) or any(r.get('Name')=='a4_research' for r in entries):
                raise SystemExit('A4 namespace exists or parent inventory is invalid; genesis refused')
            Path('outputs/a4_research/state/namespace.json').write_text('{"schema":"a4-research-state-v1","accepted_model":false}\n')
            PY
            echo 'Explicit research-state genesis; no prior history certified.'
          else
            echo 'A4 checkpoint unavailable; refuse an implicit fresh start.'
            exit 2
          fi

      - name: Run hosted A4 research cycle
        id: a4_cycle
        if: vars.A4_RESEARCH_ENABLED == 'true' && steps.a4_restore.outcome == 'success' && (vars.A4_PRIMARY_COLLECTION_ENABLED != 'true' || steps.a4_data_center.outcome == 'success')
        continue-on-error: true
        env:
          A4_LEARNING_POLICY_SHA256: ${{ vars.A4_LEARNING_POLICY_SHA256 }}
          A5_MODEL_POLICY_SHA256: ${{ vars.A5_MODEL_POLICY_SHA256 }}
          A4_RESEARCH_SCOPE: ${{ vars.A4_RESEARCH_SCOPE || 'A4_ONLY' }}
        run: |
          python tools/run_a4_research_cycle.py \
            --scope "$A4_RESEARCH_SCOPE" \
            --input-root "${A4_INPUT_ROOT:-outputs/market_analysis_inputs}" \
            --learning-input-root outputs/market_analysis_inputs \
            --state-root outputs/a4_research/state \
            --output-dir "outputs/a4_research/attempts/${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Persist and verify A4 research checkpoint
        id: a4_persist
        if: always() && vars.A4_RESEARCH_ENABLED == 'true' && steps.a4_restore.outcome == 'success'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          test "${GDRIVE_READY:-no}" = yes
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then BASE='gdrive:'; else BASE="gdrive:${GDRIVE_FOLDER_NAME}/"; fi
          DEST="${BASE}outputs/a4_research"
          timeout 5m rclone copy outputs/a4_research "$DEST" --immutable --checksum --transfers 2 --checkers 2 --max-duration 4m
          timeout 2m rclone check outputs/a4_research "$DEST" --one-way --checkers 2 --max-duration 90s
          # This is a transport readback witness, not Source/PIT or model approval.
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('outputs/a4_research/attempts') / (os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          p.mkdir(parents=True, exist_ok=True)
          (p/'drive-readback.json').write_text(json.dumps(dict(schema='a4-drive-readback-v1',
              run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              tree_copy_and_check_passed=True, accepted_model_changed=False))+'\n')
          PY
          timeout 30s rclone copy "outputs/a4_research/attempts/${{ github.run_id }}-${{ github.run_attempt }}/drive-readback.json" "$DEST/attempts/${{ github.run_id }}-${{ github.run_attempt }}" --immutable --checksum
          timeout 30s rclone check "outputs/a4_research/attempts/${{ github.run_id }}-${{ github.run_attempt }}" "$DEST/attempts/${{ github.run_id }}-${{ github.run_attempt }}" --one-way --checkers 2

      - name: Run daily crisis monitor
        if: vars.A4_NATIVE_SOURCE_MANIFEST_SHA256 == '' || steps.a4_native_prepare.outcome == 'success'
        run: |
          python tools/run_daily_crisis_monitor.py \
            --latest-run outputs \
            --output-dir outputs/daily_crisis_monitor \
            --market-analysis-request "${A4_INPUT_ROOT:-outputs/market_analysis_inputs}/request.json" \
            --market-analysis-root "${A4_INPUT_ROOT:-outputs/market_analysis_inputs}" \
            --market-analysis-request-sha-file "${A4_INPUT_ROOT:-outputs/market_analysis_inputs}/request.sha256" \
            --update-history

      - name: Upload daily crisis artifact
        if: always() && (vars.A4_NATIVE_SOURCE_MANIFEST_SHA256 == '' || steps.a4_native_prepare.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: daily-crisis-monitor-${{ github.run_id }}
          path: outputs/daily_crisis_monitor/
          retention-days: 30

      - name: Upload A4 cloud research attempt
        if: always() && vars.A4_RESEARCH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a4-cloud-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/a4_research/attempts/
          retention-days: 30

      - name: Upload primary A4 capture receipt
        if: always() && vars.A4_PRIMARY_COLLECTION_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a4-primary-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/a4_primary_collection/*/execution.json
            outputs/a4_primary_collection/*/publication_failed.json
            outputs/a4_primary_collection/*/market_analysis.json
            outputs/a4_primary_collection/*/market_analysis.md
          retention-days: 30

      - name: Upload native A4 preparation receipt
        if: always() && vars.A4_NATIVE_SOURCE_MANIFEST_SHA256 != ''
        uses: actions/upload-artifact@v4
        with:
          name: a4-native-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/a4_native_preparation/*/native-preparation.json
          retention-days: 30

      - name: Upload unified A4 data center evidence
        if: always() && vars.A4_PRIMARY_COLLECTION_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a4-data-center-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/a4_data_center/*/catalog.json
            outputs/a4_data_center/*/catalog.md
            outputs/a4_data_center/*/audit.json
            outputs/a4_data_center/*/execution.json
            outputs/a4_data_center/*/publication_failed.json
            outputs/a4_data_center/*/failure.json
            outputs/a4_data_center/*/market_analysis.json
            outputs/a4_data_center/*/market_analysis.md
          retention-days: 30

      - name: Sync daily crisis status to Google Drive
        if: always() && (vars.A4_NATIVE_SOURCE_MANIFEST_SHA256 == '' || steps.a4_native_prepare.outcome == 'success')
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[daily-crisis] gdrive unavailable; skip sync"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            DEST="gdrive:daily_crisis_monitor"
          else
            DEST="gdrive:${GDRIVE_FOLDER_NAME}/daily_crisis_monitor"
          fi
          rclone copy outputs/daily_crisis_monitor "$DEST/" --transfers 4 --checkers 8 --stats 30s --stats-one-line || true

      - name: Require A4 computation and durable readback
        if: always() && (vars.A4_RESEARCH_ENABLED == 'true' || vars.A4_PRIMARY_COLLECTION_ENABLED == 'true' || vars.A4_FINANCING_COLLECTION_ENABLED == 'true' || vars.A4_NATIVE_SOURCE_MANIFEST_SHA256 != '')
        env:
          RESTORE: ${{ steps.a4_restore.outcome }}
          CYCLE: ${{ steps.a4_cycle.outcome }}
          PERSIST: ${{ steps.a4_persist.outcome }}
          RESEARCH_ENABLED: ${{ vars.A4_RESEARCH_ENABLED }}
          PRIMARY_ENABLED: ${{ vars.A4_PRIMARY_COLLECTION_ENABLED }}
          FINANCING_ENABLED: ${{ vars.A4_FINANCING_COLLECTION_ENABLED }}
          PRIMARY_CONFIG: ${{ steps.a4_primary_config.outcome }}
          PRIMARY: ${{ steps.a4_primary_collect.outcome }}
          DATA_CENTER: ${{ steps.a4_data_center.outcome }}
          NATIVE_PIN: ${{ vars.A4_NATIVE_SOURCE_MANIFEST_SHA256 }}
          NATIVE: ${{ steps.a4_native_prepare.outcome }}
        run: |
          set -euo pipefail
          if [ -n "${NATIVE_PIN:-}" ]; then
            test "$PRIMARY_ENABLED" = true || exit 2
            test "$NATIVE" = success || exit 2
          fi
          if [ "${FINANCING_ENABLED:-false}" = true ]; then
            test "$PRIMARY_ENABLED" = true || exit 2
          fi
          if [ "$RESEARCH_ENABLED" = true ]; then
            test "$RESTORE" = success || exit 2
            test "$CYCLE" = success || exit 2
            test "$PERSIST" = success || exit 2
          fi
          if [ "$PRIMARY_ENABLED" = true ]; then
            test "$PRIMARY_CONFIG" = success || exit 2
            test "$PRIMARY" = success || exit 2
            test "$DATA_CENTER" = success || exit 2
          fi
