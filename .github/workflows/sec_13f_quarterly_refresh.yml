name: SEC 13F Quarterly Refresh

on:
  workflow_dispatch:
    inputs:
      manager_ciks:
        description: 'Canonical publication requires empty; subset CIK dispatches are blocked and must run locally.'
        type: string
        default: ''
      max_filings:
        description: 'Max indexed 13F filings to parse in this shard'
        type: string
        default: '1500'
      history_start:
        description: 'Earliest SEC accepted/filing/report date to include. Empty = recent submissions only.'
        type: string
        default: '2018-01-01'
      safety_delay_hours:
        description: 'PIT safety delay after SEC accepted_at'
        type: string
        default: '0'
  schedule:
    # Daily throughout SEC 13F filing months, including late filings and amendments.
    - cron: '40 23 * 2,5,8,11 *'
    # Weekly outside the filing windows so later amendments are not missed.
    - cron: '10 0 * 1,3,4,6,7,9,10,12 1'

permissions:
  contents: read
  actions: read

concurrency:
  group: sec-evidence-data-lake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sec_13f_quarterly:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Check recent GitHub Actions overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/full_rebuild_logs
          gh run list --repo "$GITHUB_REPOSITORY" --limit 20 --json databaseId,workflowName,status,conclusion,headBranch,createdAt,url \
            | tee outputs/full_rebuild_logs/actions_overlap_preflight.json
          gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --limit 20 || true

      - name: Restore SEC cache
        uses: actions/cache@v4
        with:
          path: |
            data_raw/sec
            data_pit/sec
          key: sec-13f-quarterly-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sec-13f-quarterly-${{ runner.os }}-
            sec-evidence-${{ runner.os }}-

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[gdrive] durable SEC publication requires configured Drive authentication" >&2
            exit 2
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore SEC data lake from Google Drive
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            echo "[gdrive] canonical SEC restore is unavailable" >&2
            exit 2
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          restore_required_dir() {
            local d="$1"
            local limit="${2:-6m}"
            mkdir -p "$d"
            rclone lsf "$BASE$d" >/dev/null
            echo "[gdrive] restore $d with timeout $limit"
            timeout "$limit" rclone copy "$BASE$d" "$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line
          }
          restore_required_dir data_raw/sec 6m
          restore_required_dir data_pit/sec 6m
          restore_required_dir outputs/sec_institutional_signals 3m

      - name: Collect and score 13F
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'R1000QuantEngine research andrewcha231@gmail.com' }}
          MANAGER_CIKS_INPUT: ${{ github.event.inputs.manager_ciks || '' }}
          MAX_FILINGS: ${{ github.event.inputs.max_filings || '1500' }}
          HISTORY_START: ${{ github.event.inputs.history_start || '2018-01-01' }}
          SAFETY_DELAY_HOURS: ${{ github.event.inputs.safety_delay_hours || '0' }}
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs outputs/sec_institutional_signals data_pit/sec data_raw/sec
          if [ -n "${MANAGER_CIKS_INPUT:-}" ]; then
            echo "[sec-13f] subset manager dispatch is non-canonical and cannot publish or chain; use a local smoke run" >&2
            exit 2
          fi
          python tools/build_sec_13f_manager_universe.py \
            --output-ciks outputs/sec_institutional_signals/manager_ciks.txt \
            --output-summary outputs/sec_institutional_signals/manager_universe_summary.json \
            --max-managers 50 \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_manager_universe.log
          MANAGER_CIKS="$(cat outputs/sec_institutional_signals/manager_ciks.txt)"
          if [ -z "${MANAGER_CIKS:-}" ]; then
            echo "[sec-13f] manager CIK list is empty; refusing to run BRK-only fallback"
            exit 2
          fi
          python tools/run_sec_submissions_collector.py \
            --ciks "$MANAGER_CIKS" \
            --universe-file ./.missing_universe.csv \
            --forms '13F-HR,13F-HR/A' \
            --output-dir data_pit/sec/13f_latest \
            --raw-dir data_raw/sec \
            --user-agent "$SEC_USER_AGENT" \
            --sleep 0.12 \
            --safety-delay-hours "$SAFETY_DELAY_HOURS" \
            --refresh-recent-submissions \
            --include-older-submissions \
            --history-start "$HISTORY_START" \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_submissions.log
          AS_OF_DATE="$(TZ=America/New_York date +%F)"
          AS_OF_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          python tools/audit_sec_13f_filing_freshness.py \
            --schedule research/sec_13f_filing_schedule.json \
            --filings-index data_pit/sec/13f_latest/sec_filings_index.parquet \
            --manager-ciks-file outputs/sec_institutional_signals/manager_ciks.txt \
            --as-of "$AS_OF_DATE" \
            --as-of-timestamp "$AS_OF_TIMESTAMP" \
            --minimum-manager-coverage 0.80 \
            --minimum-future-deadlines 2 \
            --output-json outputs/sec_institutional_signals/13f_index_freshness.json \
            --output-report outputs/sec_institutional_signals/13f_index_freshness.md \
            --strict \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_freshness.log
          FRESHNESS_STATUS="${PIPESTATUS[0]}"
          set -e
          cat outputs/sec_institutional_signals/13f_index_freshness.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$FRESHNESS_STATUS" -ne 0 ]; then
            exit "$FRESHNESS_STATUS"
          fi
          python tools/run_sec_13f_parser.py \
            --filings-index data_pit/sec/13f_latest/sec_filings_index.parquet \
            --output-dir data_pit/sec \
            --raw-dir data_raw/sec \
            --user-agent "$SEC_USER_AGENT" \
            --sleep 0.12 \
            --max-filings "$MAX_FILINGS" \
            --as-of "$AS_OF_TIMESTAMP" \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_parser.log
          python tools/build_sec_13f_cusip_ticker_map.py \
            --holdings data_pit/sec/institutional_13f_holdings.parquet \
            --raw-dir data_raw/sec \
            --manual-overrides research/sec_13f_cusip_map_overrides.csv \
            --output data_pit/sec/cusip_ticker_map.parquet \
            --csv-output data_pit/sec/cusip_ticker_map.csv \
            --audit outputs/sec_institutional_signals/mapping_audit.json \
            --unmapped outputs/sec_institutional_signals/unmapped_13f_holdings.csv \
            --user-agent "$SEC_USER_AGENT" \
            --refresh-company-tickers \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_cusip_map.log
          python tools/run_sec_13f_parser.py \
            --filings-index data_pit/sec/13f_latest/sec_filings_index.parquet \
            --output-dir data_pit/sec \
            --raw-dir data_raw/sec \
            --cusip-map data_pit/sec/cusip_ticker_map.parquet \
            --user-agent "$SEC_USER_AGENT" \
            --sleep 0.12 \
            --max-filings "$MAX_FILINGS" \
            --as-of "$AS_OF_TIMESTAMP" \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_parser_mapped.log
          python tools/audit_sec_13f_filing_freshness.py \
            --schedule research/sec_13f_filing_schedule.json \
            --filings-index data_pit/sec/13f_latest/sec_filings_index.parquet \
            --manager-ciks-file outputs/sec_institutional_signals/manager_ciks.txt \
            --holdings data_pit/sec/institutional_13f_holdings.parquet \
            --require-parsed-holdings \
            --as-of "$AS_OF_DATE" \
            --as-of-timestamp "$AS_OF_TIMESTAMP" \
            --minimum-manager-coverage 0.80 \
            --minimum-mapped-row-coverage 0.20 \
            --minimum-mapped-value-coverage 0.50 \
            --minimum-future-deadlines 2 \
            --source-workflow-run-id "$GITHUB_RUN_ID" \
            --source-head-sha "$GITHUB_SHA" \
            --source-head-branch "$GITHUB_REF_NAME" \
            --source-workflow-name "SEC 13F Quarterly Refresh" \
            --source-repository "$GITHUB_REPOSITORY" \
            --output-json outputs/sec_institutional_signals/13f_filing_freshness.json \
            --output-report outputs/sec_institutional_signals/13f_filing_freshness.md \
            --strict \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_parsed_freshness.log
          cat outputs/sec_institutional_signals/13f_filing_freshness.md >> "$GITHUB_STEP_SUMMARY"
          python tools/run_sec_institutional_signals.py \
            --holdings data_pit/sec/institutional_13f_holdings.parquet \
            --output-dir outputs/sec_institutional_signals \
            --as-of "$AS_OF_TIMESTAMP" \
            --lookback-days 210 \
            --require-nonempty \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_signals.log

      - name: Upload SEC 13F artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-13f-quarterly-${{ github.run_id }}
          path: |
            data_pit/sec/sec_filings_index.*
            data_pit/sec/13f_latest/sec_filings_index.*
            data_pit/sec/cusip_ticker_map.*
            data_pit/sec/institutional_13f_holdings.*
            data_pit/sec/*13f*summary.json
            outputs/sec_institutional_signals/
            outputs/full_rebuild_logs/sec_13f_*.log
          retention-days: 30

      - name: Sync SEC 13F data lake to Google Drive
        if: success()
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          sync_dir() {
            local src="$1"
            local dst="$2"
            echo "[gdrive] sync $src -> $dst"
            timeout 8m rclone copy "$src" "$dst" --transfers 4 --checkers 8 --stats 30s --stats-one-line
          }
          for d in data_raw/sec data_pit/sec outputs/sec_institutional_signals; do
            if [ -d "$d" ]; then
              sync_dir "$d" "$BASE$d/"
            fi
          done
