name: Tactical Alpha After-Close Review

# Runs after the regular US close with a DST-safe buffer:
# - 22:30 UTC = 18:30 ET during daylight time, 17:30 ET during standard time.
# - Weekends/NYSE holidays are handled in r1000_tactical_alpha.py by mapping to
#   the last valid NYSE trading day and no-oping when there is no new data.

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tactical_after_close:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore full-rebuild price cache
        uses: actions/cache@v4
        with:
          path: |
            cache_prices
            cache_misc
            cache_macro
            cache_fsds
            cache_sec_actual
          key: tactical-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            collector-cache-${{ runner.os }}-
            tactical-cache-${{ runner.os }}-

      - name: Run tactical after-close review
        run: |
          python r1000_tactical_alpha.py \
            --base-dir "$(pwd)" \
            --target-n 5 \
            --preliminary-limit 240 \
            --update-prices \
            --max-price-updates 160 \
            --mirror-cloud-results

      - name: Upload tactical artifact
        uses: actions/upload-artifact@v4
        with:
          name: tactical-alpha-${{ github.run_id }}
          path: |
            outputs/tactical_alpha/
            cloud_results/tactical_alpha/
          retention-days: 90

      - name: Sync tactical outputs to user's Google Drive
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          AUTH=""
          if [ -n "$RCLONE_CONFIG_GDRIVE" ]; then
            AUTH="oauth"
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            AUTH="service_account"
          else
            echo "[gdrive-sync] No auth secret set; skipping"
            exit 0
          fi
          echo "[gdrive-sync] auth=$AUTH"

          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone

          if [ "$AUTH" = "service_account" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > ~/.config/rclone/rclone.conf
          else
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          fi

          if [ -n "$GDRIVE_ROOT_FOLDER_ID" ]; then
            DEST="gdrive:outputs/tactical_alpha"
          else
            DEST="gdrive:${GDRIVE_FOLDER_NAME}/outputs/tactical_alpha"
          fi
          rclone copy outputs/tactical_alpha/ "$DEST/" 2>&1 || true
          rm -f /tmp/sa.json
          echo "[gdrive-sync] done: $DEST"

      - name: Commit tactical results
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          git add cloud_results/tactical_alpha 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): tactical alpha review $(date +%Y-%m-%d) [skip ci]"
          git push || true
