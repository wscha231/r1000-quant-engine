name: ETF Leadership Daily

# Phase 17 v3 Layer 8 (2026-04-30) — daily ETF return tracker for
# 11 sector SPDRs + 10 theme ETFs (semis, biotech, ARKK, clean energy,
# china internet, solar, mining, oil&gas E&P, homebuilders, big biotech).
# Output feeds the adaptive sector cap + concentrated picker bias +
# Telegram leadership digest.

on:
  schedule:
    # Weekday 22:00 UTC (1h after US close, 17:00 ET, 07:00 KST next day)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2" pandas

      - name: Run ETF leadership snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tools/etf_leadership_snapshot.py --telegram

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          git add cloud_results/etf_leadership/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): etf leadership $(date +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4; do
            if git push; then
              break
            fi
            sleep $((2 ** i))
          done
