name: Unified Universe Monthly Rebuild

# Reconciles real model scores against the full universe. Missing names remain
# diagnostic inventory; no synthetic scores are published. The compatibility
# CSV and its hash-bound coverage receipt are one publication packet.
#
# Schedule: 1st and 15th of each month after the US close.
# Rationale: 정석 engine typically runs monthly locally; unified should refresh
# shortly after to reflect latest model scores.
#
# Outputs committed to: cloud_results/unified/{YYYYMMDD}.csv

on:
  schedule:
    # 1st and 15th of each month after US close.
    - cron: '45 22 1,15 * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if scored_latest is stale'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: unified-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore Finnhub cache
        uses: actions/cache@v4
        with:
          path: |
            aggressive/cache/finnhub
            aggressive/state/finnhub
          key: finnhub-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            finnhub-cache-${{ runner.os }}-

      - name: Restore Alpaca bars cache
        uses: actions/cache@v4
        with:
          path: aggressive/cache/bars
          key: alpaca-bars-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            alpaca-bars-${{ runner.os }}-

      # Check if scored_latest.csv is in the repo (committed by user's monthly run).
      # Missing inputs fail and revoke the retained packet below.
      - name: Verify scored_latest.csv available
        id: check_scored
        run: |
          SCORED="outputs/scored_latest.csv"
          if [ -f "$SCORED" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            wc -l "$SCORED"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "scored_latest.csv not in repo. Commit it from your local run."
            exit 1
          fi

      - name: Run unified universe builder
        if: steps.check_scored.outputs.found == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python r1000_unified_universe.py \
              --scored-csv outputs/scored_latest.csv \
              --output-csv outputs/scored_unified.csv

      - name: Run validation after unify
        if: steps.check_scored.outputs.found == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python tests/validate_system.py --quick || echo "Validation warnings, non-fatal"
          python -c "from r1000_legacy_input_guard import load_current_csv; load_current_csv('outputs/scored_unified.csv')"

      - name: Upload unified artifact
        if: steps.check_scored.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scored-unified-${{ github.run_id }}
          path: |
            outputs/scored_unified.csv
            outputs/scored_unified.csv.coverage.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit unified CSV + snapshot
        if: steps.check_scored.outputs.found == 'true'
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          mkdir -p cloud_results/unified
          SNAPSHOT="cloud_results/unified/$(date +%Y%m%d).csv"
          cp outputs/scored_unified.csv "$SNAPSHOT"
          cp outputs/scored_unified.csv.coverage.json "$SNAPSHOT.coverage.json"
          python -c "import sys; from r1000_legacy_input_guard import load_current_csv; load_current_csv(sys.argv[1])" "$SNAPSHOT"
          git add -f outputs/scored_unified.csv outputs/scored_unified.csv.coverage.json "$SNAPSHOT" "$SNAPSHOT.coverage.json"
          git diff --cached --quiet || \
            git commit -m "chore(bot): unified universe $(date +%Y-%m-%d) [skip ci]"
          git push

      - name: Publish blocked receipt after failed rebuild
        if: ${{ always() && (failure() || cancelled()) }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('outputs/scored_unified.csv.coverage.json')
          try:
              receipt = json.loads(path.read_text())
          except (OSError, ValueError):
              receipt = {}
          if not isinstance(receipt, dict) or not str(receipt.get('status', '')).startswith('BLOCKED'):
              receipt = {'status': 'BLOCKED_WORKFLOW_FAILURE', 'investment_approved': False}
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          # Publish only revocation from a clean remote tree, even if a failed
          # success publication left local CSV/snapshot changes or commits.
          git fetch origin "$GITHUB_REF_NAME"
          REVOKE_ROOT=$(mktemp -d)
          git worktree add --detach "$REVOKE_ROOT" FETCH_HEAD
          trap 'git worktree remove --force "$REVOKE_ROOT"' EXIT
          mkdir -p "$REVOKE_ROOT/outputs"
          cp outputs/scored_unified.csv.coverage.json "$REVOKE_ROOT/outputs/"
          git -C "$REVOKE_ROOT" config user.name github-actions-bot
          git -C "$REVOKE_ROOT" config user.email actions@github.com
          git -C "$REVOKE_ROOT" add -f outputs/scored_unified.csv.coverage.json
          git -C "$REVOKE_ROOT" diff --cached --quiet || \
            git -C "$REVOKE_ROOT" commit -m "chore(bot): revoke failed unified packet [skip ci]"
          git -C "$REVOKE_ROOT" push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload blocked receipt
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v4
        with:
          name: blocked-unified-${{ github.run_id }}
          path: outputs/scored_unified.csv.coverage.json
          if-no-files-found: error
          retention-days: 90

      - name: Telegram summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          FOUND: ${{ steps.check_scored.outputs.found }}
        run: |
          python -c "
          import os, requests
          tok = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat = os.environ.get('TELEGRAM_CHAT_ID', '')
          status = os.environ.get('STATUS', 'unknown')
          found = os.environ.get('FOUND', 'false')
          if found != 'true':
              msg = ('[UNIFIED FAIL] scored_latest.csv not in repo. '
                     'Run 정석 engine locally + commit outputs/scored_latest.csv.')
          elif status == 'success':
              msg = '[UNIFIED OK] scored_unified rebuild complete.'
          else:
              msg = f'[UNIFIED FAIL] status={status}'
          if tok and chat:
              requests.post(f'https://api.telegram.org/bot{tok}/sendMessage',
                            json={'chat_id':chat,'text':msg}, timeout=5)
          "
