# Add this file as .github/workflows/api_credentials_check.yml.
# Manual only. No checkout, installs, repository writes or raw-data uploads.
# Review through the repository's normal PR process before merging.
name: API Credentials Check
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: api-credentials-check
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read-only API probes
        shell: bash
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          """Read-only credential probes. Never log URLs, credentials or response bodies."""
          import json
          import os
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.parse import urlencode, quote
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def request(url, params=None, headers=None):
              if params:
                  url += '?' + urlencode(params)
              req = Request(url, headers=headers or {}, method='GET')
              try:
                  with build_opener(NoRedirect()).open(req, timeout=20) as response:
                      code, raw = response.status, response.read(4_000_001)
              except HTTPError as exc:
                  code, raw = exc.code, exc.read(4_000_001)
                  exc.close()
              except Exception:
                  return 0, None
              if len(raw) > 4_000_000:
                  return code, None
              try:
                  return code, json.loads(raw)
              except Exception:
                  return code, None
          
          
          def classify(provider, status, data):
              if status == 0:
                  return 'NETWORK_ERROR'
              if status == 401:
                  return 'AUTH_REJECTED'
              if status == 402:
                  return 'PLAN_RESTRICTED'
              if status == 403:
                  return 'FORBIDDEN_CHECK_KEY_PLAN_IP'
              if status == 429:
                  return 'RATE_LIMITED'
              if not 200 <= status < 300:
                  return 'HTTP_ERROR'
              if data is None:
                  return 'INVALID_OR_OVERSIZE_RESPONSE'
              if isinstance(data, dict):
                  if provider == 'DART' and data.get('status') != '000':
                      return {'010': 'AUTH_REJECTED', '011': 'AUTH_REJECTED',
                              '012': 'IP_RESTRICTED', '013': 'NO_DATA',
                              '020': 'RATE_LIMITED', '901': 'AUTH_REJECTED'}.get(
                                  data.get('status'), 'PROVIDER_ERROR')
                  if provider == 'ECOS' and 'RESULT' in data:
                      return 'PROVIDER_ERROR_CHECK_KEY_SERVICE'
                  if any(k in data for k in ('error', 'error_code', 'Error Message')):
                      return 'PROVIDER_ERROR'
                  if provider == 'AlphaVantage' and any(k in data for k in ('Note', 'Information')):
                      return 'PROVIDER_NOTICE_CHECK_QUOTA_PLAN'
              checks = {
                  'Alpaca': lambda d: isinstance(d.get('bars'), list) and bool(d['bars'])
                      and all('t' in x and 'c' in x for x in d['bars']),
                  'Finnhub': lambda d: d.get('ticker') == 'AAPL' and bool(d.get('name')),
                  'Finnhub estimates': lambda d: isinstance(d.get('data'), list) and bool(d['data']),
                  'FMP': lambda d: isinstance(d, list) and bool(d) and d[0].get('symbol') == 'AAPL',
                  'FMP estimates': lambda d: isinstance(d, list) and bool(d) and d[0].get('symbol') == 'AAPL',
                  'FRED': lambda d: bool(d.get('observations')) and 'value' in d['observations'][0],
                  'AlphaVantage': lambda d: d.get('Symbol') == 'IBM',
                  'DART': lambda d: d.get('status') == '000' and d.get('stock_code') == '005930',
                  'ECOS': lambda d: bool(d.get('StatisticTableList', {}).get('row')),
                  'KRX': lambda d: bool(d.get('OutBlock_1')) and
                      all(x.get('BAS_DD') == '20260904' and 'ISU_CD' in x for x in d['OutBlock_1']),
              }
              try:
                  return 'PASS' if checks[provider](data) else 'EMPTY_OR_UNEXPECTED_RESPONSE'
              except (KeyError, TypeError, AttributeError):
                  return 'EMPTY_OR_UNEXPECTED_RESPONSE'
          
          
          def run():
              env = os.environ
              results = []
              def probe(provider, names, build):
                  values = [env.get(name, '').strip() for name in names]
                  if not all(values):
                      results.append({'service': provider, 'result': 'MISSING_SECRET', 'http': None})
                      return
                  try:
                      code, data = request(*build(*values))
                      result = classify(provider, code, data)
                  except Exception:
                      code, result = 0, 'LOCAL_PROBE_ERROR'
                  results.append({'service': provider, 'result': result, 'http': code})
          
              aliases = []
              for primary, alternate in [('ALPHAVANTAGE_API_KEY', 'ALPHA_VANTAGE_API_KEY'),
                                         ('BOK_ECOS_API_KEY', 'ECOS_API_KEY')]:
                  a, b = env.get(primary, '').strip(), env.get(alternate, '').strip()
                  if a and b and a != b:
                      aliases.append(primary + ': CONFLICT_PRIMARY_USED')
                  elif not a and b:
                      env[primary] = b
                      aliases.append(primary + ': FALLBACK_USED')
          
              probe('Alpaca', ['ALPACA_API_KEY', 'ALPACA_API_SECRET'], lambda k, s: (
                  'https://data.alpaca.markets/v2/stocks/SPY/bars',
                  {'timeframe': '1Day', 'start': '2026-09-04T00:00:00Z',
                   'end': '2026-09-05T00:00:00Z', 'limit': 1, 'feed': 'sip', 'adjustment': 'raw'},
                  {'APCA-API-KEY-ID': k, 'APCA-API-SECRET-KEY': s}))
              probe('Finnhub', ['FINNHUB_API_KEY'], lambda k: (
                  'https://finnhub.io/api/v1/stock/profile2', {'symbol': 'AAPL'}, {'X-Finnhub-Token': k}))
              probe('Finnhub estimates', ['FINNHUB_API_KEY'], lambda k: (
                  'https://finnhub.io/api/v1/stock/eps-estimate', {'symbol': 'AAPL'}, {'X-Finnhub-Token': k}))
              probe('FMP', ['FMP_API_KEY'], lambda k: (
                  'https://financialmodelingprep.com/stable/profile', {'symbol': 'AAPL', 'apikey': k}))
              probe('FMP estimates', ['FMP_API_KEY'], lambda k: (
                  'https://financialmodelingprep.com/stable/analyst-estimates',
                  {'symbol': 'AAPL', 'period': 'annual', 'limit': 1, 'apikey': k}))
              probe('FRED', ['FRED_API_KEY'], lambda k: (
                  'https://api.stlouisfed.org/fred/series/observations',
                  {'series_id': 'DGS10', 'file_type': 'json', 'limit': 1, 'sort_order': 'desc', 'api_key': k}))
              probe('AlphaVantage', ['ALPHAVANTAGE_API_KEY'], lambda k: (
                  'https://www.alphavantage.co/query', {'function': 'OVERVIEW', 'symbol': 'IBM', 'apikey': k}))
              probe('DART', ['DART_API_KEY'], lambda k: (
                  'https://opendart.fss.or.kr/api/company.json', {'corp_code': '00126380', 'crtfc_key': k}))
              probe('ECOS', ['BOK_ECOS_API_KEY'], lambda k: (
                  'https://ecos.bok.or.kr/api/StatisticTableList/' + quote(k, safe='') + '/json/kr/1/1/',))
              probe('KRX', ['KRX_API_KEY'], lambda k: (
                  'https://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd',
                  {'basDd': '20260904'}, {'AUTH_KEY': k}))
              report = {
                  'checked_at_utc': datetime.now(timezone.utc).isoformat(),
                  'scope': 'sample_endpoint_access_only_not_PIT_coverage_or_trading_readiness',
                  'results': results, 'alias_warnings': aliases,
              }
              # Only controlled enums and locally-generated metadata leave this process.
              print(json.dumps(report, ensure_ascii=True, indent=2))
              summary = ['# API credential check', '', '| Service | Result | HTTP |', '|---|---|---|']
              summary += ['| {service} | {result} | {http} |'.format(**r) for r in results]
              summary += ['', 'PASS means only this sample endpoint returned the expected schema.',
                          'No raw data, credentials, accounts, orders, portfolio or Drive writes.', *aliases]
              if env.get('GITHUB_STEP_SUMMARY'):
                  with open(env['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                      f.write('\n'.join(summary) + '\n')
              return 0 if all(r['result'] == 'PASS' for r in results) and not aliases else 1
          
          
          if __name__ == '__main__':
              raise SystemExit(run())
          PYTHON
