            # uncommitted and may be resumed. Publish the manifest last.
            assert_current_default_head
            rclone sync \
              "$source/" \
              "$remote_head/" \
              --exclude snapshot_integrity.json \
              --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check \
              "$source/" \
              "$remote_head/" \
              --exclude snapshot_integrity.json \
              --checksum
            assert_current_default_head
            rclone copyto \
              "$source/snapshot_integrity.json" \
              "$remote_head/snapshot_integrity.json" \
              --stats 30s --stats-one-line
            rclone check "$source/" "$remote_head/" --checksum
          }
          download_committed_paper_heads() {
            local destination="$1"
            local raw_dirs="$destination.raw-dirs"
            local archive_dirs="$destination.archive-dirs"
            rm -rf "$destination" "$raw_dirs" "$archive_dirs"
            mkdir -p "$destination"
            if ! rclone lsf "$HEADS/" --dirs-only > "$raw_dirs" 2>/dev/null; then
