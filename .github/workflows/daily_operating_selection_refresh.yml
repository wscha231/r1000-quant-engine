            outputs/full_rebuild_logs/daily_*.log
            outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
            data_pit/free/market_snapshot/
            data_raw/free/market_snapshot/
            outputs/full_rebuild_logs/daily_user_current_contract.log
            outputs/full_rebuild_logs/daily_paper_bootstrap.log
            outputs/full_rebuild_logs/daily_simulated_fill_ledger_mark_only.log
            outputs/full_rebuild_logs/daily_holding_risk_watch.log
            outputs/full_rebuild_logs/daily_run287_exact_packet_upstream.log
            outputs/full_rebuild_logs/daily_run287_exact_packet_input_registry.log
            outputs/full_rebuild_logs/daily_run287_exact_packet_producer.log
            outputs/full_rebuild_logs/daily_run287_same_close_target_books.log
            outputs/full_rebuild_logs/daily_run287_decision_observation_archive.log
            outputs/full_rebuild_logs/daily_run287_risk_outcome_parent_anchor.log
            outputs/full_rebuild_logs/daily_run287_risk_outcomes.log
            outputs/full_rebuild_logs/daily_run287_*outcome_head*.json
            outputs/full_rebuild_logs/daily_run287_outcome_parent_paper_continuity.json
            outputs/full_rebuild_logs/daily_run287_operating_scorecard.log
            outputs/full_rebuild_logs/daily_run287_promotion_gate.log
            outputs/full_rebuild_logs/daily_accepted_publication_manifest.log
            outputs/full_rebuild_logs/data_freshness_contract.log
            cache_prices/replay_price_cache_manifest.json
          retention-days: 45

      - name: Reverify accepted publication before GitHub publication
        id: accepted_publication_preflight
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success'
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"

      - name: Sync daily operating artifact to Google Drive
        if: always()
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[gdrive] not configured; skip daily operating sync"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-daily}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          DEST="${BASE}research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/daily_operating_selection_refresh"
          for d in outputs/data_freshness_contract outputs/daily_market_snapshot outputs/daily_operating_selection_refresh outputs/data_readiness outputs/holding_risk_watch outputs/run287_exact_packet_upstream outputs/run287_exact_packet_input_sources outputs/run287_exact_packet_input_registry outputs/run287_exact_packet_producer outputs/run287_decision_observation_archive outputs/run287_risk_outcome_parent_accepted outputs/run287_risk_outcome_parent_anchor outputs/run287_risk_outcome_accepted_head_manifests outputs/run287_risk_outcome_archive outputs/run287_operating_scorecard outputs/run287_promotion_gate outputs/sec_enriched_candidate_replay data_pit/free/market_snapshot data_raw/free/market_snapshot data_pit/macro data_raw/free/macro/daily_snapshot; do
            if [ -d "$d" ]; then
              rclone copy "$d" "$DEST/$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line || true
            fi
          done
          if [ -s cache_prices/replay_price_cache_manifest.json ]; then
            rclone copyto cache_prices/replay_price_cache_manifest.json "$DEST/cache_prices/replay_price_cache_manifest.json" || true
          fi

      - name: Persist validated forward paper ledger state
        id: paper_persist
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"
          ACCEPTED_OUTCOME_HEAD_SHA="${{ steps.accepted_publication.outputs.manifest_sha256 }}"
          OUTCOME_HEAD_STAGING_ROOT="outputs/run287_risk_outcome_accepted_head_staging"
          OUTCOME_HEAD_STAGING="$OUTCOME_HEAD_STAGING_ROOT/$ACCEPTED_OUTCOME_HEAD_SHA"
          rm -rf "$OUTCOME_HEAD_STAGING_ROOT"
          python tools/manage_run287_risk_outcome_accepted_heads.py stage \
            --latest-run outputs \
            --expected-manifest-sha256 "$ACCEPTED_OUTCOME_HEAD_SHA" \
            --output-dir "$OUTCOME_HEAD_STAGING" \
            --output outputs/full_rebuild_logs/daily_run287_outcome_head_stage.json
          mkdir -p outputs/run287_risk_outcome_accepted_head_bundles
          python tools/manage_run287_risk_outcome_accepted_heads.py stage \
            --latest-run outputs \
            --expected-manifest-sha256 "$ACCEPTED_OUTCOME_HEAD_SHA" \
            --output-dir "outputs/run287_risk_outcome_accepted_head_bundles/$ACCEPTED_OUTCOME_HEAD_SHA"
          mkdir -p "outputs/run287_risk_outcome_accepted_head_manifests/$ACCEPTED_OUTCOME_HEAD_SHA"
          if [ -f "outputs/run287_risk_outcome_accepted_head_manifests/$ACCEPTED_OUTCOME_HEAD_SHA/manifest.json" ] && \
             ! cmp -s \
               "$OUTCOME_HEAD_STAGING/manifest.json" \
               "outputs/run287_risk_outcome_accepted_head_manifests/$ACCEPTED_OUTCOME_HEAD_SHA/manifest.json"; then
            echo "[risk-outcome] BLOCKED: staged accepted manifest conflicts with immutable local head"
            exit 2
          fi
          cp \
            "$OUTCOME_HEAD_STAGING/manifest.json" \
            "outputs/run287_risk_outcome_accepted_head_manifests/$ACCEPTED_OUTCOME_HEAD_SHA/manifest.json"
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[gdrive] not configured; validated paper state remains in the GitHub cache/artifact"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          test -s outputs/daily_simulated_fill_ledger/summary.json
          test -s outputs/daily_simulated_fill_ledger/snapshot_integrity.json
          test -s outputs/holding_risk_watch/summary.json
          python tools/run287_paper_ledger_integrity.py \
            --state-dir outputs/daily_simulated_fill_ledger \
            --require-integrity
          RECOVERY="${BASE}paper_archive/recovery/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/run287_daily_simulated_fill_ledger"
          CANONICAL="${BASE}paper_archive/run287_daily_simulated_fill_ledger"
          HEADS="${BASE}paper_archive/run287_daily_simulated_fill_ledger_heads"
          PAPER_REMOTE_PERSIST_ANCHOR="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_persist_anchor"
          PAPER_REMOTE_CAS_CHECK="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_cas_check"
          PAPER_REMOTE_POSTCHECK="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_postcheck"
          rm -rf "$PAPER_REMOTE_PERSIST_ANCHOR"
          mkdir -p "$PAPER_REMOTE_PERSIST_ANCHOR"
          PAPER_CANONICAL_EXPECTED_STATE="${PAPER_CANONICAL_REMOTE_STATE:-UNKNOWN}"
          if [ "$PAPER_CANONICAL_EXPECTED_STATE" = "PROVEN_PRESENT" ]; then
            rclone copy "$CANONICAL/" "$PAPER_REMOTE_PERSIST_ANCHOR/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          elif [ "$PAPER_CANONICAL_EXPECTED_STATE" != "PROVEN_ABSENT" ]; then
            echo "[paper-ledger] BLOCKED: remote canonical state was not authoritatively classified during restore"
            exit 2
          fi
          LOCAL_SNAPSHOT_HASH="$(python -c 'import json; print(json.load(open("outputs/daily_simulated_fill_ledger/snapshot_integrity.json", encoding="utf-8"))["snapshot_hash"])')"
          if ! [[ "$LOCAL_SNAPSHOT_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "[paper-ledger] BLOCKED: invalid local continuity hash"
            exit 2
          fi
          ANCHOR_SNAPSHOT_HASH=""
          assert_legacy_drive_source_matches() {
            local observed="$1"
            python - "$PAPER_REMOTE_PERSIST_ANCHOR" "$observed" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          def tree(root: Path) -> dict[str, str]:
              if (root / "snapshot_integrity.json").exists():
                  raise SystemExit("legacy Drive migration blocked: remote gained an unverified manifest")
              return {
                  path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.rglob("*")) if path.is_file()
              }

          anchor, observed = (Path(value) for value in sys.argv[1:])
          if tree(anchor) != tree(observed):
              raise SystemExit("legacy Drive migration blocked: Drive source changed during semantic attestation")
          PY
          }
          assert_remote_canonical_absent() {
            local base_dirs="$RUNNER_TEMP/run287_paper_persist_base_dirs.txt"
            local archive_dirs="$RUNNER_TEMP/run287_paper_persist_archive_dirs.txt"
            if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
              if ! rclone lsf "$BASE" --dirs-only > "$base_dirs"; then
                echo "[paper-ledger] BLOCKED: Drive root unavailable during first-canonical CAS"
                exit 2
              fi
            else
              local top_dirs="$RUNNER_TEMP/run287_paper_persist_top_dirs.txt"
              if ! rclone lsf "gdrive:" --dirs-only > "$top_dirs"; then
                echo "[paper-ledger] BLOCKED: Drive top level unavailable during first-canonical CAS"
                exit 2
              fi
              if ! grep -Fx "${GDRIVE_FOLDER_NAME}/" "$top_dirs" >/dev/null; then
                return 0
              fi
              if ! rclone lsf "$BASE" --dirs-only > "$base_dirs"; then
                echo "[paper-ledger] BLOCKED: configured Drive base unavailable during first-canonical CAS"
                exit 2
              fi
            fi
            if ! grep -Fx "paper_archive/" "$base_dirs" >/dev/null; then
              return 0
            fi
            if ! rclone lsf "${BASE}paper_archive/" --dirs-only > "$archive_dirs"; then
              echo "[paper-ledger] BLOCKED: paper archive unavailable during first-canonical CAS"
              exit 2
            fi
            if grep -Fx "run287_daily_simulated_fill_ledger/" "$archive_dirs" >/dev/null; then
              echo "[paper-ledger] BLOCKED_CONTINUITY: canonical Drive state appeared after authoritative absence preflight"
              exit 2
            fi
          }
          persist_immutable_paper_head() {
            local source="$1"
            local expected_hash="$2"
            local remote_head="$HEADS/$expected_hash"
            if ! [[ "$expected_hash" =~ ^[0-9a-f]{64}$ ]]; then
              echo "[paper-ledger] BLOCKED: invalid immutable paper head hash=$expected_hash"
              exit 2
            fi
            python tools/run287_paper_ledger_integrity.py \
              --state-dir "$source" \
              --require-integrity
            local observed_hash
            observed_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$source/snapshot_integrity.json")"
            if [ "$observed_hash" != "$expected_hash" ]; then
              echo "[paper-ledger] BLOCKED: immutable paper head source/hash mismatch"
              exit 2
            fi
            if rclone lsf "$remote_head/snapshot_integrity.json" >/dev/null 2>&1; then
              rclone check "$source/" "$remote_head/" --checksum
              return 0
            fi
            # An address without its recursive integrity manifest is
            # uncommitted and may be resumed. Publish the manifest last.
            rclone sync \
              "$source/" \
              "$remote_head/" \
              --exclude snapshot_integrity.json \
              --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check \
              "$source/" \
              "$remote_head/" \
              --exclude snapshot_integrity.json \
              --checksum
            rclone copyto \
              "$source/snapshot_integrity.json" \
              "$remote_head/snapshot_integrity.json" \
              --stats 30s --stats-one-line
            rclone check "$source/" "$remote_head/" --checksum
          }
          if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
            if [ "$PAPER_CANONICAL_EXPECTED_STATE" != "PROVEN_PRESENT" ]; then
              echo "[paper-ledger] BLOCKED: legacy migration requires the classified remote canonical source"
              exit 2
            fi
            # A manifest-free source is not a continuity anchor.  It may be
            # replaced only after the in-job semantic attestation above and a
            # byte-for-byte compare against the original quarantined copy.
            assert_legacy_drive_source_matches "$RUNNER_TEMP/run287_daily_simulated_fill_ledger_remote"
            rclone copy "$PAPER_REMOTE_PERSIST_ANCHOR/" "$RECOVERY/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check "$PAPER_REMOTE_PERSIST_ANCHOR/" "$RECOVERY/" --checksum --one-way
          elif [ "$PAPER_CANONICAL_EXPECTED_STATE" = "PROVEN_ABSENT" ]; then
            # This is either a true first bootstrap or recovery from a verified
            # cache/immutable head after canonical loss.  Re-prove absence
            # before publishing any mutable canonical state.
            assert_remote_canonical_absent
            rclone copy outputs/daily_simulated_fill_ledger "$RECOVERY/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check outputs/daily_simulated_fill_ledger "$RECOVERY/" --checksum --one-way
          else
            test -s "$PAPER_REMOTE_PERSIST_ANCHOR/snapshot_integrity.json"
            python tools/run287_paper_ledger_integrity.py \
              --state-dir "$PAPER_REMOTE_PERSIST_ANCHOR" \
              --require-integrity
            python tools/run287_paper_ledger_integrity.py \
              --state-dir outputs/daily_simulated_fill_ledger \
              --require-integrity \
              --require-state-descends-from "$PAPER_REMOTE_PERSIST_ANCHOR"
            ANCHOR_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_PERSIST_ANCHOR/snapshot_integrity.json")"
            if ! [[ "$ANCHOR_SNAPSHOT_HASH" =~ ^[0-9a-f]{64}$ ]]; then
              echo "[paper-ledger] BLOCKED: invalid remote continuity hash"
              exit 2
            fi
            rclone copy outputs/daily_simulated_fill_ledger "$RECOVERY/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check outputs/daily_simulated_fill_ledger "$RECOVERY/" --checksum --one-way
          fi
          if [ "${PAPER_VERIFIED_CANONICAL_BOOTSTRAP_PENDING:-no}" = "yes" ]; then
            PAPER_BOOTSTRAP_EVIDENCE="outputs/full_rebuild_logs/daily_paper_verified_canonical_bootstrap.json"
            python - \
              "$PAPER_BOOTSTRAP_EVIDENCE" \
              "$ANCHOR_SNAPSHOT_HASH" <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (
              evidence.get("schema_version")
              != "run287-verified-paper-canonical-bootstrap-v1"
              or evidence.get("status")
              != "EXPLICIT_ONE_TIME_MIGRATION_AUTHORIZED"
              or evidence.get("snapshot_hash") != sys.argv[2]
              or evidence.get("remote_immutable_head_count") != 0
              or evidence.get("verified_cache_anchor_present") is not False
              or evidence.get("review_only") is not True
              or evidence.get("production_activation_allowed") is not False
              or evidence.get("live_trading_enabled") is not False
          ):
              raise SystemExit(
                  "verified canonical bootstrap blocked: migration evidence mismatch"
              )
          PY
            # Re-read the source immediately before committing the migration
            # anchor. If it changed since restore, do not create either head.
            rm -rf "$PAPER_REMOTE_CAS_CHECK"
            mkdir -p "$PAPER_REMOTE_CAS_CHECK"
            rclone copy "$CANONICAL/" "$PAPER_REMOTE_CAS_CHECK/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
            python tools/run287_paper_ledger_integrity.py \
              --state-dir "$PAPER_REMOTE_CAS_CHECK" \
              --require-integrity
            PAPER_BOOTSTRAP_CAS_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_CAS_CHECK/snapshot_integrity.json")"
            if [ "$PAPER_BOOTSTRAP_CAS_HASH" != "$ANCHOR_SNAPSHOT_HASH" ]; then
              echo "[paper-ledger] BLOCKED_CONTINUITY: pre-head canonical changed before first immutable-head commit"
              exit 2
            fi
            persist_immutable_paper_head \
              "$PAPER_REMOTE_PERSIST_ANCHOR" \
              "$ANCHOR_SNAPSHOT_HASH"
            echo "[paper-ledger] committed explicitly attested pre-head canonical as first immutable paper head=$ANCHOR_SNAPSHOT_HASH"
          fi
          persist_immutable_paper_head \
            outputs/daily_simulated_fill_ledger \
            "$LOCAL_SNAPSHOT_HASH"
          rm -rf "$PAPER_REMOTE_CAS_CHECK"
          mkdir -p "$PAPER_REMOTE_CAS_CHECK"
          if [ "$PAPER_CANONICAL_EXPECTED_STATE" = "PROVEN_ABSENT" ]; then
            assert_remote_canonical_absent
          else
            rclone copy "$CANONICAL/" "$PAPER_REMOTE_CAS_CHECK/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
            assert_legacy_drive_source_matches "$PAPER_REMOTE_CAS_CHECK"
          elif [ "$PAPER_CANONICAL_EXPECTED_STATE" = "PROVEN_PRESENT" ]; then
            python tools/run287_paper_ledger_integrity.py \
              --state-dir "$PAPER_REMOTE_CAS_CHECK" \
              --require-integrity
            CAS_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_CAS_CHECK/snapshot_integrity.json")"
            if [ "$CAS_SNAPSHOT_HASH" != "$ANCHOR_SNAPSHOT_HASH" ]; then
              echo "[paper-ledger] BLOCKED_CONTINUITY: canonical Drive head changed after preflight; immutable local head retained"
              exit 2
            fi
          fi
          rclone sync outputs/daily_simulated_fill_ledger "$CANONICAL/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          rclone check outputs/daily_simulated_fill_ledger "$CANONICAL/" --checksum
          rm -rf "$PAPER_REMOTE_POSTCHECK"
          mkdir -p "$PAPER_REMOTE_POSTCHECK"
          rclone copy "$CANONICAL/" "$PAPER_REMOTE_POSTCHECK/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          python tools/run287_paper_ledger_integrity.py \
            --state-dir "$PAPER_REMOTE_POSTCHECK" \
            --require-integrity
          POSTCHECK_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_POSTCHECK/snapshot_integrity.json")"
          if [ "$POSTCHECK_SNAPSHOT_HASH" != "$LOCAL_SNAPSHOT_HASH" ]; then
            echo "[paper-ledger] BLOCKED_CONTINUITY: canonical Drive postcheck differs; immutable heads preserve both accepted states"
            exit 2
          fi
          OUTCOME_REMOTE_HEADS="${BASE}paper_archive/run287_risk_outcome_accepted_heads"
          persist_immutable_outcome_head() {
            local local_head="$1"
            local head_sha="$2"
            local remote_head="$OUTCOME_REMOTE_HEADS/$head_sha"
            python tools/manage_run287_risk_outcome_accepted_heads.py verify \
              --head-dir "$local_head" \
              --expected-manifest-sha256 "$head_sha"
            if rclone lsf "$remote_head/manifest.json" >/dev/null 2>&1; then
              rclone check \
                "$local_head/" \
                "$remote_head/" \
                --checksum
              return 0
            fi
            rclone copy \
              "$local_head/" \
              "$remote_head/" \
              --exclude manifest.json \
              --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check \
              "$local_head/" \
              "$remote_head/" \
              --exclude manifest.json \
              --checksum
            rclone copyto \
              "$local_head/manifest.json" \
              "$remote_head/manifest.json" \
              --stats 30s --stats-one-line
            rclone check \
              "$local_head/" \
              "$remote_head/" \
              --checksum
          }
          OUTCOME_CACHE_HEADS="$RUNNER_TEMP/run287_risk_outcome_cache_heads"
          if [ -d "$OUTCOME_CACHE_HEADS" ]; then
            while IFS= read -r -d '' cached_manifest; do
              CACHED_HEAD_SHA="$(basename "$(dirname "$cached_manifest")")"
              persist_immutable_outcome_head \
                "$(dirname "$cached_manifest")" \
                "$CACHED_HEAD_SHA"
            done < <(find "$OUTCOME_CACHE_HEADS" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print0)
          fi
          persist_immutable_outcome_head \
            "$OUTCOME_HEAD_STAGING" \
            "$ACCEPTED_OUTCOME_HEAD_SHA"
          echo "[risk-outcome] persisted immutable accepted head=$ACCEPTED_OUTCOME_HEAD_SHA"
          if [ -n "$ANCHOR_SNAPSHOT_HASH" ] && [ "$LOCAL_SNAPSHOT_HASH" != "$ANCHOR_SNAPSHOT_HASH" ] && \
             rclone lsf "$HEADS/$ANCHOR_SNAPSHOT_HASH/" >/dev/null 2>&1; then
            rclone purge "$HEADS/$ANCHOR_SNAPSHOT_HASH"
          fi
          rclone copy outputs/holding_risk_watch "${BASE}paper_archive/run287_holding_risk_watch/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          if [ -s outputs/run287_decision_observation_archive/manifest.json ]; then
            rclone copy outputs/run287_decision_observation_archive "${BASE}paper_archive/run287_decision_observation_archive/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          if [ -s outputs/run287_risk_outcome_archive/summary.json ]; then
            rclone copy outputs/run287_risk_outcome_archive "${BASE}paper_archive/run287_risk_outcome_archive/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          if [ -d outputs/run287_risk_outcome_price_cache ]; then
            rclone copy outputs/run287_risk_outcome_price_cache "${BASE}paper_archive/run287_risk_outcome_price_cache/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi

      - name: Reverify accepted publication before refreshed cache
        id: accepted_refresh_preflight
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success'
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"

      - name: Upload accepted paper transaction artifact
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_transaction.outcome == 'success' && steps.paper_integrity.outcome == 'success' && steps.risk_outcomes.outcome == 'success' && steps.operating_scorecard.outcome == 'success' && steps.promotion_gate.outcome == 'success' && steps.operating_review.outcome == 'success' && steps.accepted_publication.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: accepted-paper-transaction-${{ github.run_id }}
          path: |
            outputs/reports/operating_*_target_book.csv
            outputs/operating_snapshot/
            outputs/user_current/
            outputs/user_portfolio_reports/
            outputs/account_ledger_preview/
            outputs/daily_simulated_fill_ledger/
            outputs/run287_same_close_decision/
            outputs/run287_decision_observation_archive/
            outputs/run287_risk_outcome_parent_accepted/
            outputs/run287_risk_outcome_parent_anchor/
            outputs/run287_risk_outcome_accepted_head_bundles/
            outputs/run287_risk_outcome_accepted_head_manifests/
            outputs/run287_risk_outcome_archive/
            outputs/run287_risk_outcome_price_cache/
            outputs/run287_operating_scorecard/
            outputs/run287_promotion_gate/
            outputs/run287_accepted_publication/
            outputs/full_rebuild_logs/daily_paper_snapshot_integrity.json
            outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
            outputs/full_rebuild_logs/daily_run287_outcome_parent_paper_continuity.json
          if-no-files-found: error
          retention-days: 45

      - name: Save validated forward paper state cache
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/daily_simulated_fill_ledger
            outputs/holding_risk_watch
            outputs/run287_exact_packet_upstream
            outputs/run287_exact_packet_input_sources
            outputs/run287_exact_packet_input_registry
            outputs/run287_decision_observation_archive
            outputs/run287_accepted_publication
            outputs/run287_risk_outcome_accepted_head_bundles
            outputs/run287_risk_outcome_accepted_head_manifests
            outputs/run287_risk_outcome_archive
            outputs/run287_risk_outcome_price_cache
          key: daily-paper-ledger-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sync accepted paper transaction to Google Drive
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_transaction.outcome == 'success' && steps.paper_integrity.outcome == 'success' && steps.risk_outcomes.outcome == 'success' && steps.operating_scorecard.outcome == 'success' && steps.promotion_gate.outcome == 'success' && steps.operating_review.outcome == 'success' && steps.accepted_publication.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[gdrive] not configured; accepted paper transaction remains in GitHub artifact/cache"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-daily}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          DEST="${BASE}research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/accepted_paper_transaction"
          for d in outputs/operating_snapshot outputs/user_current outputs/user_portfolio_reports outputs/account_ledger_preview outputs/daily_simulated_fill_ledger outputs/run287_same_close_decision outputs/run287_decision_observation_archive outputs/run287_risk_outcome_parent_anchor outputs/run287_risk_outcome_accepted_head_manifests outputs/run287_risk_outcome_archive outputs/run287_risk_outcome_price_cache outputs/run287_operating_scorecard outputs/run287_promotion_gate; do
            test -d "$d"
            rclone copy "$d" "$DEST/$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line
          done
          if [ -d outputs/run287_risk_outcome_parent_accepted ]; then
            rclone copy \
              outputs/run287_risk_outcome_parent_accepted \
              "$DEST/outputs/run287_risk_outcome_parent_accepted/" \
              --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          for f in outputs/reports/operating_main_target_book.csv outputs/reports/operating_concentrated_target_book.csv; do
            test -s "$f"
            rclone copyto "$f" "$DEST/$f"
          done
          # Publish the verified manifest last as the remote acceptance marker.
          test -s outputs/run287_accepted_publication/manifest.json
          rclone copy outputs/run287_accepted_publication "$DEST/outputs/run287_accepted_publication/" --transfers 2 --checkers 4 --stats 30s --stats-one-line

      - name: Save refreshed GitHub cache
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            cache_prices
            cache_macro
            models
            feature_store/scored_oos_latest.parquet
            data_raw/free
            data_pit/free
            data_pit/sec
            data_pit/etf_holdings
            data_pit/macro
            manifests/free_data
          key: daily-operating-selection-${{ runner.os }}-${{ github.run_id }}
