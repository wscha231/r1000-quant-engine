              )
          PY
          echo "scorecard_sha256=$(sha256sum outputs/run287_operating_scorecard/operating_scorecard.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Evaluate single promotion and rollback gate
