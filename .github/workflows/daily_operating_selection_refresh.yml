          import hashlib
          import json
          import sys
          from pathlib import Path

          def tree(root: Path) -> dict[str, str]:
              if (root / "snapshot_integrity.json").exists():
                  raise SystemExit("legacy Drive migration blocked: remote gained an unverified manifest")
              return {
                  path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.rglob("*")) if path.is_file()
              }

          anchor, observed = (Path(value) for value in sys.argv[1:])
          if tree(anchor) != tree(observed):
              raise SystemExit("legacy Drive migration blocked: Drive source changed during semantic attestation")
