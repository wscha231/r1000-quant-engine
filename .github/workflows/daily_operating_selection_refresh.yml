      - name: Sync daily operating artifact to Google Drive
        if: always() && steps.market.outputs.catchup_mode != 'yes'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          RUN_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[gdrive] not configured; skip daily operating sync"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-daily}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          DEST="${BASE}research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/daily_operating_selection_refresh"
          for d in outputs/data_freshness_contract outputs/daily_market_snapshot outputs/daily_operating_selection_refresh outputs/data_readiness outputs/holding_risk_watch outputs/run287_exact_packet_upstream outputs/run287_exact_packet_input_sources outputs/run287_exact_packet_input_registry outputs/run287_exact_packet_producer outputs/run287_decision_observation_archive outputs/run287_risk_outcome_parent_accepted outputs/run287_risk_outcome_parent_anchor outputs/run287_risk_outcome_accepted_head_manifests outputs/run287_risk_outcome_archive outputs/run287_operating_scorecard outputs/run287_promotion_gate outputs/sec_enriched_candidate_replay data_pit/free/market_snapshot data_raw/free/market_snapshot data_pit/macro data_raw/free/macro/daily_snapshot; do
            if [ -d "$d" ]; then
              rclone copy "$d" "$DEST/$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line || true
            fi
          done
          for f in \
            outputs/full_rebuild_logs/daily_operating_price_cache_refresh.log \
            outputs/full_rebuild_logs/daily_operating_final_price_cache_refresh.log \
            outputs/full_rebuild_logs/daily_operating_price_cache_refresh_attempt.json \
            outputs/full_rebuild_logs/daily_operating_initial_price_cache_refresh_attempt.json \
            outputs/full_rebuild_logs/daily_operating_price_cache_refresh_prior_manifest.json \
            cache_prices/replay_price_cache_transaction.json; do
            if [ -s "$f" ]; then
              rclone copyto "$f" "$DEST/$f" || true
            fi
          done
          if [ "${RUN_JOB_STATUS:-failure}" = "success" ] && \
            python -c 'import hashlib,json,os,sys; mp,ap,s=sys.argv[1:]; raw=open(mp,"rb").read(); p=json.loads(raw); a=json.load(open(ap,encoding="utf-8")); ok=a.get("phase")=="final_operating_universe" and a.get("status")=="completed" and a.get("exit_code")==0 and a.get("manifest_current_attempt") is True and a.get("manifest_sha256")==hashlib.sha256(raw).hexdigest() and a.get("required_through_date")==s and a.get("source_commit_sha")==os.environ.get("GITHUB_SHA","") and a.get("run_id")==os.environ.get("GITHUB_RUN_ID","") and p.get("schema_version")=="run287-replay-price-cache-manifest-v2" and p.get("status") in {"already_cached","completed"} and p.get("refresh_through_date")==s and p.get("common_coverage_end")==s and p.get("refresh_through_exact_coverage") is True and p.get("refresh_through_missing_tickers")==[] and p.get("refresh_through_exact_ticker_count")==p.get("refresh_through_ticker_count") and int(p.get("refresh_through_ticker_count") or 0)>0; raise SystemExit(0 if ok else 1)' cache_prices/replay_price_cache_manifest.json outputs/full_rebuild_logs/daily_operating_price_cache_refresh_attempt.json "$LAST_NYSE_SESSION_DATE"; then
            rclone copyto cache_prices/replay_price_cache_manifest.json "$DEST/cache_prices/replay_price_cache_manifest.json" || true
          else
            echo "[gdrive] current price manifest not published: job or exact-session contract failed"
          fi

      - name: Reverify one-time scope attestation before durable persistence
        id: durable_scope_persist_preflight
        if: success() && steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_COMMENT_ID: ${{ inputs.catchup_secret_scope_attestation_comment_id }}
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_EVIDENCE_RUN_ID: ${{ inputs.catchup_price_evidence_run_id }}
          EXPECTED_EVIDENCE_ARTIFACT_DIGEST: ${{ inputs.catchup_price_evidence_artifact_digest }}
        run: |
          set -euo pipefail
          SCOPE_INITIAL="$RUNNER_TEMP/run287_durable_scope_initial.json"
          SCOPE_PRE_TRANSACTION="$RUNNER_TEMP/run287_durable_scope_final.json"
          SCOPE_PRE_PERSIST="$RUNNER_TEMP/run287_durable_scope_persist.json"
          CONSUMPTION_RECORD="$RUNNER_TEMP/run287_durable_scope_consumption_record.json"
          CONSUMPTION_INITIAL="$RUNNER_TEMP/run287_durable_scope_consumption_initial.json"
          CONSUMPTION_PRE_TRANSACTION="$RUNNER_TEMP/run287_durable_scope_consumption_final.json"
          CONSUMPTION_PRE_PERSIST="$RUNNER_TEMP/run287_durable_scope_consumption_persist.json"
          OWNER_COMMENT="$RUNNER_TEMP/run287_durable_scope_attestation_comment_persist.json"
          CONSUMPTION_COMMENT="$RUNNER_TEMP/run287_durable_scope_consumption_comment_persist.json"
          RUN_EVIDENCE="$RUNNER_TEMP/run287_durable_scope_workflow_run_persist.json"
          verify_receipt_hash() {
            local path="$1"
            local expected="$2"
            local label="$3"
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || \
               [ "$(sha256sum "$path" | awk '{print $1}')" != "$expected" ]; then
              echo "[run287-scope-attestation] BLOCKED: $label receipt hash mismatch"
              exit 2
            fi
          }
          verify_receipt_hash \
            "$SCOPE_INITIAL" \
            "${RUN287_DURABLE_SCOPE_INITIAL_SHA256:-}" \
            "initial owner scope"
          verify_receipt_hash \
            "$CONSUMPTION_RECORD" \
            "${RUN287_DURABLE_SCOPE_CONSUMPTION_RECORD_SHA256:-}" \
            "consumption record"
          verify_receipt_hash \
            "$CONSUMPTION_INITIAL" \
            "${RUN287_DURABLE_SCOPE_CONSUMPTION_RECEIPT_SHA256:-}" \
            "initial consumption"
          verify_receipt_hash \
            "$SCOPE_PRE_TRANSACTION" \
            "${RUN287_DURABLE_SCOPE_PRE_TRANSACTION_SHA256:-}" \
            "pre-transaction owner scope"
          verify_receipt_hash \
            "$CONSUMPTION_PRE_TRANSACTION" \
            "${RUN287_DURABLE_SCOPE_CONSUMPTION_PRE_TRANSACTION_SHA256:-}" \
            "pre-transaction consumption"
          if ! [[ "${SCOPE_COMMENT_ID:-}" =~ ^[1-9][0-9]*$ ]] || \
             ! [[ "${RUN287_DURABLE_SCOPE_CONSUMPTION_COMMENT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "[run287-scope-attestation] BLOCKED: immutable comment ids are unavailable"
            exit 2
          fi
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/comments/${SCOPE_COMMENT_ID}" \
            > "$OWNER_COMMENT"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/comments/${RUN287_DURABLE_SCOPE_CONSUMPTION_COMMENT_ID}" \
            > "$CONSUMPTION_COMMENT"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$RUN_EVIDENCE"
          python tools/verify_run287_catchup_scope_attestation.py \
            --comment "$OWNER_COMMENT" \
            --run "$RUN_EVIDENCE" \
            --event "$GITHUB_EVENT_PATH" \
            --prior-verification "$SCOPE_INITIAL" \
            --expected-comment-id "$SCOPE_COMMENT_ID" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-default-branch "$EXPECTED_DEFAULT_BRANCH" \
            --expected-default-branch-sha "$GITHUB_SHA" \
            --expected-session-date "$LAST_NYSE_SESSION_DATE" \
            --expected-evidence-run-id "$EXPECTED_EVIDENCE_RUN_ID" \
            --expected-evidence-artifact-digest "$EXPECTED_EVIDENCE_ARTIFACT_DIGEST" \
            --expected-workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-actor "$GITHUB_ACTOR" \
            --output "$SCOPE_PRE_PERSIST"
          python tools/run287_catchup_scope_consumption.py verify \
            --comment "$CONSUMPTION_COMMENT" \
            --expected-record "$CONSUMPTION_RECORD" \
            --verification "$SCOPE_INITIAL" \
            --run "$RUN_EVIDENCE" \
            --prior-receipt "$CONSUMPTION_INITIAL" \
            --output "$CONSUMPTION_PRE_PERSIST"
          SCOPE_PRE_PERSIST_SHA256="$(sha256sum "$SCOPE_PRE_PERSIST" | awk '{print $1}')"
          CONSUMPTION_PRE_PERSIST_SHA256="$(sha256sum "$CONSUMPTION_PRE_PERSIST" | awk '{print $1}')"
          echo "RUN287_DURABLE_SCOPE_PRE_PERSIST_SHA256=$SCOPE_PRE_PERSIST_SHA256" >> "$GITHUB_ENV"
          echo "RUN287_DURABLE_SCOPE_CONSUMPTION_PRE_PERSIST_SHA256=$CONSUMPTION_PRE_PERSIST_SHA256" >> "$GITHUB_ENV"

      - name: Persist validated forward paper ledger state
        id: paper_persist
        if: success() && steps.market.outputs.ready == 'yes' && (steps.market.outputs.catchup_mode != 'yes' || steps.durable_scope_persist_preflight.outcome == 'success')
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACCEPTED_PUBLICATION_MANIFEST_SHA256: ${{ steps.accepted_publication.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          if [ "${PAPER_CATCHUP_MODE:-no}" = "yes" ]; then
            SCOPE_PRE_PERSIST="$RUNNER_TEMP/run287_durable_scope_persist.json"
            CONSUMPTION_PRE_PERSIST="$RUNNER_TEMP/run287_durable_scope_consumption_persist.json"
            CONSUMPTION_RECORD="$RUNNER_TEMP/run287_durable_scope_consumption_record.json"
            if ! [[ "${RUN287_DURABLE_SCOPE_PRE_PERSIST_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] || \
               [ "$(sha256sum "$SCOPE_PRE_PERSIST" | awk '{print $1}')" != "$RUN287_DURABLE_SCOPE_PRE_PERSIST_SHA256" ] || \
               ! [[ "${RUN287_DURABLE_SCOPE_CONSUMPTION_PRE_PERSIST_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] || \
               [ "$(sha256sum "$CONSUMPTION_PRE_PERSIST" | awk '{print $1}')" != "$RUN287_DURABLE_SCOPE_CONSUMPTION_PRE_PERSIST_SHA256" ]; then
              echo "[run287-scope-attestation] BLOCKED: durable-persistence preflight hash mismatch"
              exit 2
            fi
            python - \
              "$SCOPE_PRE_PERSIST" \
              "$CONSUMPTION_PRE_PERSIST" \
              "$CONSUMPTION_RECORD" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          scope = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          consumption = json.loads(
              Path(sys.argv[2]).read_text(encoding="utf-8")
          )
          record = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          if (
              scope.get("schema_version")
              != "run287-durable-scope-comment-verification-v2"
              or scope.get("status")
              != "VERIFIED_OWNER_SCOPE_ATTESTATION"
              or scope.get("verification_phase") != "REVERIFICATION"
              or scope.get("allowed") is not True
              or scope.get("failures") != []
              or consumption.get("schema_version")
              != "run287-durable-scope-consumption-receipt-v1"
              or consumption.get("status") != "CONSUMPTION_RECORDED"
              or consumption.get("verification_phase") != "REVERIFICATION"
              or consumption.get("allowed") is not True
              or consumption.get("failures") != []
              or record.get("workflow_run_lease_expires_at")
              != scope.get("workflow_run_lease_expires_at")
          ):
              raise SystemExit(
                  "durable-persistence scope receipts are not accepted"
              )
          lease = datetime.strptime(
              str(scope["workflow_run_lease_expires_at"]),
              "%Y-%m-%dT%H:%M:%SZ",
          ).replace(tzinfo=timezone.utc)
          if datetime.now(timezone.utc) > lease:
              raise SystemExit(
                  "exact workflow-run lease expired before persistence start"
              )
          PY
          fi
          assert_current_default_head() {
            if [ -z "${DEFAULT_BRANCH:-}" ]; then
              echo "[paper-ledger] BLOCKED: repository default branch is unavailable"
              exit 2
            fi
            local remote_default_sha
            remote_default_sha="$(
              git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" \
                | awk 'NR == 1 { print $1 }'
            )"
            if ! [[ "$remote_default_sha" =~ ^[0-9a-f]{40}$ ]] || \
               [ "$remote_default_sha" != "${GITHUB_SHA:-}" ]; then
              echo "[paper-ledger] BLOCKED: default branch advanced before durable persistence"
              exit 2
            fi
          }
          assert_current_default_head
          if [ "${PAPER_CATCHUP_MODE:-no}" != "yes" ]; then
