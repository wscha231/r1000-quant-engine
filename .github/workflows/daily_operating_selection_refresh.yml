              echo "[paper-ledger] committed verified cache anchor before local successor=$CACHE_ANCHOR_HASH"
            fi
          fi

          assert_current_default_head
          rclone sync outputs/daily_simulated_fill_ledger "$CANONICAL/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          rclone check outputs/daily_simulated_fill_ledger "$CANONICAL/" --checksum
          assert_current_default_head
          rm -rf "$PAPER_REMOTE_POSTCHECK"
          mkdir -p "$PAPER_REMOTE_POSTCHECK"
          rclone copy "$CANONICAL/" "$PAPER_REMOTE_POSTCHECK/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          python tools/run287_paper_ledger_integrity.py \
            --state-dir "$PAPER_REMOTE_POSTCHECK" \
            --require-integrity
          POSTCHECK_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_POSTCHECK/snapshot_integrity.json")"
          if [ "$POSTCHECK_SNAPSHOT_HASH" != "$LOCAL_SNAPSHOT_HASH" ]; then
            echo "[paper-ledger] BLOCKED_CONTINUITY: canonical Drive postcheck differs; immutable heads preserve both accepted states"
            exit 2
          fi
          download_committed_paper_heads "$PAPER_REMOTE_HEADS_POSTMIRROR"
          POSTMIRROR_SELECTION="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_heads_postmirror.json"
          select_head_set "$PAPER_REMOTE_HEADS_POSTMIRROR" "$POSTMIRROR_SELECTION"
          POSTMIRROR_TERMINAL_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["selected_snapshot_hash"])' "$POSTMIRROR_SELECTION")"
          if [ "$POSTMIRROR_TERMINAL_HASH" != "$LOCAL_SNAPSHOT_HASH" ]; then
            echo "[paper-ledger] BLOCKED_CONTINUITY: immutable terminal changed during canonical mirror publication"
            exit 2
          fi
          if [ "${PAPER_CATCHUP_MODE:-no}" != "yes" ]; then
          OUTCOME_REMOTE_HEADS="${BASE}paper_archive/run287_risk_outcome_accepted_heads"
          persist_immutable_outcome_head() {
            local local_head="$1"
            local head_sha="$2"
            local remote_head="$OUTCOME_REMOTE_HEADS/$head_sha"
            python tools/manage_run287_risk_outcome_accepted_heads.py verify \
              --head-dir "$local_head" \
              --expected-manifest-sha256 "$head_sha"
            if rclone lsf "$remote_head/manifest.json" >/dev/null 2>&1; then
              rclone check \
                "$local_head/" \
                "$remote_head/" \
                --checksum
              return 0
            fi
            assert_current_default_head
            rclone copy \
              "$local_head/" \
              "$remote_head/" \
              --exclude manifest.json \
              --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check \
              "$local_head/" \
              "$remote_head/" \
              --exclude manifest.json \
              --checksum
            assert_current_default_head
            rclone copyto \
              "$local_head/manifest.json" \
              "$remote_head/manifest.json" \
              --stats 30s --stats-one-line
            rclone check \
              "$local_head/" \
              "$remote_head/" \
              --checksum
          }
          OUTCOME_CACHE_HEADS="$RUNNER_TEMP/run287_risk_outcome_cache_heads"
          if [ -d "$OUTCOME_CACHE_HEADS" ]; then
            while IFS= read -r -d '' cached_manifest; do
              CACHED_HEAD_SHA="$(basename "$(dirname "$cached_manifest")")"
              persist_immutable_outcome_head \
                "$(dirname "$cached_manifest")" \
                "$CACHED_HEAD_SHA"
            done < <(find "$OUTCOME_CACHE_HEADS" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print0)
          fi
          persist_immutable_outcome_head \
            "$OUTCOME_HEAD_STAGING" \
            "$ACCEPTED_OUTCOME_HEAD_SHA"
          echo "[risk-outcome] persisted immutable accepted head=$ACCEPTED_OUTCOME_HEAD_SHA"
          fi
          if [ -n "$ANCHOR_SNAPSHOT_HASH" ] && [ "$LOCAL_SNAPSHOT_HASH" != "$ANCHOR_SNAPSHOT_HASH" ]; then
            echo "[paper-ledger] accepted immutable ancestor retained=$ANCHOR_SNAPSHOT_HASH successor=$LOCAL_SNAPSHOT_HASH"
          fi
          assert_current_default_head
          if [ "${PAPER_CATCHUP_MODE:-no}" != "yes" ]; then
            rclone copy outputs/holding_risk_watch "${BASE}paper_archive/run287_holding_risk_watch/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          if [ "${PAPER_CATCHUP_MODE:-no}" != "yes" ] && [ -s outputs/run287_decision_observation_archive/manifest.json ]; then
            rclone copy outputs/run287_decision_observation_archive "${BASE}paper_archive/run287_decision_observation_archive/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          if [ "${PAPER_CATCHUP_MODE:-no}" != "yes" ] && [ -s outputs/run287_risk_outcome_archive/summary.json ]; then
            rclone copy outputs/run287_risk_outcome_archive "${BASE}paper_archive/run287_risk_outcome_archive/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          if [ "${PAPER_CATCHUP_MODE:-no}" != "yes" ] && [ -d outputs/run287_risk_outcome_price_cache ]; then
            rclone copy outputs/run287_risk_outcome_price_cache "${BASE}paper_archive/run287_risk_outcome_price_cache/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          assert_current_default_head

      - name: Reverify accepted publication before refreshed cache
        id: accepted_refresh_preflight
        if: success() && steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes' && steps.accepted_publication.outcome == 'success'
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"

      - name: Reverify default head before accepted publication and cache
        id: default_head_publication_gate
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_persist.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "[paper-ledger] BLOCKED: repository default branch is unavailable before publication"
            exit 2
          fi
          REMOTE_DEFAULT_SHA="$(
            git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" \
              | awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$REMOTE_DEFAULT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$REMOTE_DEFAULT_SHA" != "${GITHUB_SHA:-}" ]; then
            echo "[paper-ledger] BLOCKED: default branch advanced before accepted publication or cache save"
            exit 2
          fi

      - name: Upload accepted paper transaction artifact
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_transaction.outcome == 'success' && steps.paper_integrity.outcome == 'success' && steps.risk_outcomes.outcome == 'success' && steps.operating_scorecard.outcome == 'success' && steps.promotion_gate.outcome == 'success' && steps.operating_review.outcome == 'success' && steps.accepted_publication.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success' && steps.default_head_publication_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: accepted-paper-transaction-${{ github.run_id }}
          path: |
            outputs/reports/operating_*_target_book.csv
            outputs/operating_snapshot/
            outputs/user_current/
            outputs/user_portfolio_reports/
            outputs/account_ledger_preview/
            outputs/daily_simulated_fill_ledger/
            outputs/run287_paper_immutable_head_bundles/
            outputs/run287_same_close_decision/
            outputs/run287_decision_observation_archive/
            outputs/run287_risk_outcome_parent_accepted/
            outputs/run287_risk_outcome_parent_anchor/
            outputs/run287_risk_outcome_accepted_head_bundles/
            outputs/run287_risk_outcome_accepted_head_manifests/
            outputs/run287_risk_outcome_archive/
            outputs/run287_risk_outcome_price_cache/
            outputs/run287_operating_scorecard/
            outputs/run287_promotion_gate/
            outputs/run287_accepted_publication/
            outputs/full_rebuild_logs/daily_paper_snapshot_integrity.json
            outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
            outputs/full_rebuild_logs/daily_run287_outcome_parent_paper_continuity.json
          if-no-files-found: error
          retention-days: 45

      - name: Upload accepted chronological catch-up artifact
        if: success() && steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes' && steps.paper_transaction.outcome == 'success' && steps.paper_integrity.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.default_head_publication_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: accepted-paper-catchup-${{ env.LAST_NYSE_SESSION_DATE }}-${{ github.run_id }}
          path: |
            outputs/daily_market_session_gate/session.json
            outputs/daily_operating_selection_refresh/summary.json
            outputs/run287_catchup_price_evidence/status.json
            outputs/run287_catchup_price_evidence/github_artifact_metadata.json
            outputs/run287_catchup_price_cache/
            outputs/run287_catchup_target_evidence_status.json
            outputs/run287_catchup_target_evidence/
            outputs/run287_catchup_target_source/
            outputs/daily_simulated_fill_ledger/
            outputs/run287_paper_immutable_head_bundles/
            outputs/account_ledger_preview/
            outputs/run287_same_close_decision/*/status.json
            ${{ runner.temp }}/run287_durable_scope_initial.json
            ${{ runner.temp }}/run287_durable_scope_final.json
            ${{ runner.temp }}/run287_durable_scope_persist.json
            ${{ runner.temp }}/run287_durable_scope_consumption_record.json
            ${{ runner.temp }}/run287_durable_scope_consumption_initial.json
            ${{ runner.temp }}/run287_durable_scope_consumption_final.json
            ${{ runner.temp }}/run287_durable_scope_consumption_persist.json
            outputs/full_rebuild_logs/daily_paper_snapshot_integrity.json
            outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
            outputs/full_rebuild_logs/daily_simulated_fill_ledger_mark_only.log
          if-no-files-found: error
          retention-days: 45

      - name: Upload chronological catch-up diagnostics
        if: always() && steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes' && (steps.paper_persist.outcome != 'success' || steps.default_head_publication_gate.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: blocked-paper-catchup-${{ env.LAST_NYSE_SESSION_DATE }}-${{ github.run_id }}
          path: |
            outputs/daily_market_session_gate/session.json
            outputs/daily_operating_selection_refresh/summary.json
            outputs/run287_catchup_price_evidence/status.json
            outputs/run287_catchup_price_evidence/github_artifact_metadata.json
            outputs/run287_catchup_price_cache/
            outputs/run287_catchup_target_evidence_status.json
            outputs/run287_catchup_target_evidence/
            outputs/run287_catchup_target_source/
            ${{ runner.temp }}/run287_durable_scope_initial.json
            ${{ runner.temp }}/run287_durable_scope_final.json
            ${{ runner.temp }}/run287_durable_scope_persist.json
            ${{ runner.temp }}/run287_durable_scope_consumption_record.json
            ${{ runner.temp }}/run287_durable_scope_consumption_initial.json
            ${{ runner.temp }}/run287_durable_scope_consumption_final.json
            ${{ runner.temp }}/run287_durable_scope_consumption_persist.json
            outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
            outputs/full_rebuild_logs/daily_simulated_fill_ledger_mark_only.log
            outputs/full_rebuild_logs/daily_paper_snapshot_integrity.json
          if-no-files-found: warn
          retention-days: 45

      - name: Reverify default head immediately before accepted cache saves
        id: default_head_cache_gate
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_persist.outcome == 'success' && steps.default_head_publication_gate.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          REMOTE_DEFAULT_SHA="$(
            git ls-remote --exit-code origin "refs/heads/${DEFAULT_BRANCH:?}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$REMOTE_DEFAULT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$REMOTE_DEFAULT_SHA" != "${GITHUB_SHA:-}" ]; then
            echo "[paper-ledger] BLOCKED: default branch advanced before accepted cache save"
            exit 2
          fi

      - name: Save validated forward paper state cache
        if: success() && steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success' && steps.default_head_publication_gate.outcome == 'success' && steps.default_head_cache_gate.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/holding_risk_watch
            outputs/run287_exact_packet_upstream
            outputs/run287_exact_packet_input_sources
            outputs/run287_exact_packet_input_registry
            outputs/run287_decision_observation_archive
            outputs/run287_accepted_publication
            outputs/run287_risk_outcome_accepted_head_bundles
            outputs/run287_risk_outcome_accepted_head_manifests
            outputs/run287_risk_outcome_archive
            outputs/run287_risk_outcome_price_cache
          key: daily-paper-ledger-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save validated cross-mode paper continuity cache
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_persist.outcome == 'success' && steps.default_head_publication_gate.outcome == 'success' && steps.default_head_cache_gate.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/daily_simulated_fill_ledger
            outputs/run287_paper_immutable_head_bundles
          key: daily-paper-continuity-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sync accepted paper transaction to Google Drive
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_transaction.outcome == 'success' && steps.paper_integrity.outcome == 'success' && steps.risk_outcomes.outcome == 'success' && steps.operating_scorecard.outcome == 'success' && steps.promotion_gate.outcome == 'success' && steps.operating_review.outcome == 'success' && steps.accepted_publication.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success' && steps.default_head_publication_gate.outcome == 'success'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          assert_current_default_head() {
            local remote_default_sha
            remote_default_sha="$(
              git ls-remote --exit-code origin "refs/heads/${DEFAULT_BRANCH:?}" \
                | awk 'NR == 1 { print $1 }'
            )"
            if ! [[ "$remote_default_sha" =~ ^[0-9a-f]{40}$ ]] || \
               [ "$remote_default_sha" != "${GITHUB_SHA:-}" ]; then
              echo "[paper-ledger] BLOCKED: default branch advanced during accepted Drive publication"
              exit 2
            fi
          }
          assert_current_default_head
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[gdrive] not configured; accepted paper transaction remains in GitHub artifact/cache"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-daily}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          DEST="${BASE}research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/accepted_paper_transaction"
          for d in outputs/operating_snapshot outputs/user_current outputs/user_portfolio_reports outputs/account_ledger_preview outputs/daily_simulated_fill_ledger outputs/run287_same_close_decision outputs/run287_decision_observation_archive outputs/run287_risk_outcome_parent_anchor outputs/run287_risk_outcome_accepted_head_manifests outputs/run287_risk_outcome_archive outputs/run287_risk_outcome_price_cache outputs/run287_operating_scorecard outputs/run287_promotion_gate; do
            test -d "$d"
            rclone copy "$d" "$DEST/$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line
          done
          if [ -d outputs/run287_risk_outcome_parent_accepted ]; then
            rclone copy \
              outputs/run287_risk_outcome_parent_accepted \
              "$DEST/outputs/run287_risk_outcome_parent_accepted/" \
              --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          for f in outputs/reports/operating_main_target_book.csv outputs/reports/operating_concentrated_target_book.csv; do
            test -s "$f"
            rclone copyto "$f" "$DEST/$f"
          done
          # Publish the verified manifest last as the remote acceptance marker.
          test -s outputs/run287_accepted_publication/manifest.json
          assert_current_default_head
          rclone copy outputs/run287_accepted_publication "$DEST/outputs/run287_accepted_publication/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          assert_current_default_head

      - name: Reverify default head after accepted publication
        id: final_default_head_gate
        if: success() && steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes' && steps.accepted_publication.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          REMOTE_DEFAULT_SHA="$(
            git ls-remote --exit-code origin "refs/heads/${DEFAULT_BRANCH:?}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$REMOTE_DEFAULT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$REMOTE_DEFAULT_SHA" != "${GITHUB_SHA:-}" ]; then
            echo "[paper-ledger] BLOCKED: default branch advanced after accepted publication"
            exit 2
          fi

      - name: Save refreshed GitHub cache
        if: success() && steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes' && steps.accepted_publication.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success' && steps.final_default_head_gate.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            cache_prices
            cache_macro
            models
            feature_store/scored_oos_latest.parquet
            data_raw/free
            data_pit/free
            data_pit/sec
            data_pit/etf_holdings
            data_pit/macro
            manifests/free_data
          key: daily-operating-selection-${{ runner.os }}-${{ github.run_id }}
