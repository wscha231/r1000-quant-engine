name: Daily Operating Selection Refresh

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if no fresh NYSE close is detected'
        type: boolean
        default: false
      session_date:
        description: 'Optional completed NYSE session (YYYY-MM-DD); requires force_run and enables mark-only chronological catch-up when older than latest'
        type: string
        default: ''
      catchup_price_evidence_run_id:
        description: 'Required for catch-up: prior daily workflow run whose artifact captured the selected exact close'
        type: string
        default: ''
      catchup_price_evidence_artifact_digest:
        description: 'Required for catch-up: pinned GitHub artifact digest (sha256:<64 hex>)'
        type: string
        default: ''
      catchup_secret_scope_attestation_comment_id:
        description: 'Required for catch-up: fresh owner-authored scope attestation comment on issue #324'
        type: string
        default: ''
      latest_run:
        description: 'Run directory restored/used as operating source'
        type: string
        default: 'outputs'
      strict_selection:
        description: 'Fail when data freshness contract blocks operating selection'
        type: boolean
        default: true
      allow_risk_outcome_genesis_bootstrap:
        description: 'One-time bootstrap only: allow a new outcome genesis after authoritative Drive absence is confirmed'
        type: boolean
        default: false
      allow_quarantined_legacy_outcome_parent:
        description: 'One-time migration only: quarantine an existing legacy outcome prefix after authoritative Drive absence is confirmed'
        type: boolean
        default: false
      allow_verified_paper_canonical_head_bootstrap:
        description: 'One-time migration only: attest an integrity-valid pre-head paper canonical as the first immutable paper head'
        type: boolean
        default: false
  schedule:
    # 10:15 KST Tue-Sat, after crisis, Form4, free-data, and readiness windows.
    - cron: '15 1 * * 2-6'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: daily-operating-selection-refresh
  cancel-in-progress: false

jobs:
  refresh:
    environment: run287-paper-durable
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN287_DURABLE_ENVIRONMENT_NAME: run287-paper-durable
      RUN287_LEGACY_V1_APPROVED_TREE_SHA256: 8d8b39e1a9e49b27e5a16bee0c511b5e5627eb8a5443911e7ad5de2539fc204a
      RUN287_LEGACY_V1_SOURCE_RUN_ID: '29625744031'
      RUN287_LEGACY_V1_SOURCE_ARTIFACT_ID: '8424009573'
      RUN287_LEGACY_V1_SOURCE_ARTIFACT_DIGEST: sha256:703c34ffbbca84221c2c4448d1f95e75d696d6c52323435cd267429364793242
      RUN287_LEGACY_V1_SOURCE_HEAD_SHA: 4196e72f8450de0c652848c9b77d22c1b0bbcc37
      RUN287_LEGACY_V1_SOURCE_HEAD_BRANCH: codex/run287-paper-ledger-continuity-20260718

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Check latest NYSE close
        id: market
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || 'false' }}
          SELECTED_SESSION_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.session_date || '' }}
        run: |
          ARGS=(
            --output "$RUNNER_TEMP/daily_market_session_gate.json"
            --min-close-age-minutes 90
            --max-close-age-hours 18
          )
          if [ "${FORCE_RUN:-false}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ -n "${SELECTED_SESSION_DATE:-}" ]; then
            ARGS+=(--session-date "$SELECTED_SESSION_DATE")
          fi
          python tools/run_daily_market_session_gate.py "${ARGS[@]}"

      - name: Enforce default-branch sole writer
        if: steps.market.outputs.ready == 'yes'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${DEFAULT_BRANCH:-}" ] || \
             [ "${GITHUB_REF_TYPE:-}" != "branch" ] || \
             [ "${GITHUB_REF_NAME:-}" != "$DEFAULT_BRANCH" ]; then
            echo "[paper-ledger] BLOCKED: durable paper state may be written only by the repository default branch"
            exit 2
          fi
          REMOTE_DEFAULT_SHA="$(
            git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" \
              | awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$REMOTE_DEFAULT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$REMOTE_DEFAULT_SHA" != "${GITHUB_SHA:-}" ]; then
            echo "[paper-ledger] BLOCKED: workflow SHA is not the current remote default-branch head"
            exit 2
          fi

      - name: Fetch pinned Run287 policy commit
        if: steps.market.outputs.ready == 'yes'
        run: git fetch --no-tags --depth=1 origin 15176b588d5bb0792bce1df6367758d795a8a33a

      - name: Restore GitHub cache
        if: steps.market.outputs.ready == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: |
            cache_prices
            cache_macro
            models
            feature_store/scored_oos_latest.parquet
            data_raw/free
            data_pit/free
            data_pit/sec
            data_pit/etf_holdings
            data_pit/macro
            manifests/free_data
          key: daily-operating-selection-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            daily-operating-selection-${{ runner.os }}-
            collector-cache-${{ runner.os }}-
            replay-price-cache-${{ runner.os }}-

      - name: Restore immutable catch-up price evidence
        id: catchup_price_evidence
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.catchup_price_evidence_run_id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ inputs.catchup_price_evidence_artifact_digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "${EVIDENCE_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "[paper-catchup] BLOCKED: a prior evidence run id is required"
            exit 2
          fi
          if ! [[ "${EVIDENCE_ARTIFACT_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "[paper-catchup] BLOCKED: a pinned artifact digest is required"
            exit 2
          fi
          ARTIFACT_NAME="daily-operating-selection-refresh-${EVIDENCE_RUN_ID}"
          ARTIFACT_QUERY="$RUNNER_TEMP/run287_catchup_artifact_query_${EVIDENCE_RUN_ID}.json"
          RUN_QUERY="$RUNNER_TEMP/run287_catchup_run_query_${EVIDENCE_RUN_ID}.json"
          WORKFLOW_QUERY="$RUNNER_TEMP/run287_catchup_workflow_query.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}" \
            > "$RUN_QUERY"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily_operating_selection_refresh.yml" \
            > "$WORKFLOW_QUERY"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}/artifacts?name=${ARTIFACT_NAME}" \
            > "$ARTIFACT_QUERY"
          readarray -t ARTIFACT_FIELDS < <(
            python - "$ARTIFACT_QUERY" "$ARTIFACT_NAME" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          artifacts = payload.get("artifacts") or []
          if len(artifacts) != 1:
              raise SystemExit("catch-up price evidence requires exactly one named artifact")
          artifact = artifacts[0]
          if (
              artifact.get("name") != sys.argv[2]
              or artifact.get("expired") is not False
          ):
              raise SystemExit("catch-up price evidence artifact is unavailable")
          for value in (
              artifact.get("id"),
              artifact.get("digest"),
              artifact.get("created_at"),
          ):
              print(value or "")
          PY
          )
          if [ "${#ARTIFACT_FIELDS[@]}" -ne 3 ]; then
            echo "[paper-catchup] BLOCKED: incomplete artifact metadata"
            exit 2
          fi
          ARTIFACT_ID="${ARTIFACT_FIELDS[0]}"
          API_DIGEST="${ARTIFACT_FIELDS[1]}"
          ARTIFACT_CAPTURED_AT="${ARTIFACT_FIELDS[2]}"
          if [ "$API_DIGEST" != "$EVIDENCE_ARTIFACT_DIGEST" ]; then
            echo "[paper-catchup] BLOCKED: artifact API digest differs from the operator pin"
            exit 2
          fi
          readarray -t RUN_FIELDS < <(
            python - \
              "$RUN_QUERY" \
              "$WORKFLOW_QUERY" \
              "$EVIDENCE_RUN_ID" \
              "$GITHUB_REPOSITORY" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          workflow = json.loads(
              Path(sys.argv[2]).read_text(encoding="utf-8")
          )
          expected_run_id = sys.argv[3]
          expected_repository = sys.argv[4]
          fields = {
              "run_id": str(run.get("id") or ""),
              "workflow_id": str(run.get("workflow_id") or ""),
              "current_workflow_id": str(workflow.get("id") or ""),
              "workflow_path": str(run.get("path") or ""),
              "head_branch": str(run.get("head_branch") or ""),
              "head_sha": str(run.get("head_sha") or ""),
              "event": str(run.get("event") or ""),
              "status": str(run.get("status") or ""),
              "conclusion": str(run.get("conclusion") or ""),
              "created_at": str(run.get("created_at") or ""),
              "updated_at": str(run.get("updated_at") or ""),
              "run_attempt": str(run.get("run_attempt") or ""),
              "repository": str(
                  (run.get("repository") or {}).get("full_name") or ""
              ),
              "head_repository": str(
                  (run.get("head_repository") or {}).get("full_name")
                  or ""
              ),
          }
          if (
              fields["run_id"] != expected_run_id
              or not re.fullmatch(r"[1-9][0-9]*", fields["workflow_id"])
              or fields["workflow_id"] != fields["current_workflow_id"]
              or fields["workflow_path"]
              != ".github/workflows/daily_operating_selection_refresh.yml"
              or not re.fullmatch(r"[0-9a-f]{40}", fields["head_sha"])
              or fields["event"] not in {"schedule", "workflow_dispatch"}
              or fields["status"] != "completed"
              or fields["conclusion"] not in {"success", "failure"}
              or not re.fullmatch(r"[1-9][0-9]*", fields["run_attempt"])
              or fields["repository"] != expected_repository
              or fields["head_repository"] != expected_repository
              or not fields["created_at"]
              or not fields["updated_at"]
          ):
              raise SystemExit(
                  "catch-up source workflow run identity is untrusted"
              )
          for key in (
              "workflow_id",
              "workflow_path",
              "head_branch",
              "head_sha",
              "event",
              "status",
              "conclusion",
              "created_at",
              "updated_at",
              "run_attempt",
              "repository",
              "head_repository",
          ):
              print(fields[key])
          PY
          )
          if [ "${#RUN_FIELDS[@]}" -ne 12 ]; then
            echo "[paper-catchup] BLOCKED: incomplete workflow run provenance"
            exit 2
          fi
          WORKFLOW_ID="${RUN_FIELDS[0]}"
          WORKFLOW_PATH="${RUN_FIELDS[1]}"
          ARTIFACT_HEAD_BRANCH="${RUN_FIELDS[2]}"
          ARTIFACT_HEAD_SHA="${RUN_FIELDS[3]}"
          WORKFLOW_EVENT="${RUN_FIELDS[4]}"
          WORKFLOW_STATUS="${RUN_FIELDS[5]}"
          WORKFLOW_CONCLUSION="${RUN_FIELDS[6]}"
          WORKFLOW_CREATED_AT="${RUN_FIELDS[7]}"
          WORKFLOW_UPDATED_AT="${RUN_FIELDS[8]}"
          WORKFLOW_RUN_ATTEMPT="${RUN_FIELDS[9]}"
          WORKFLOW_REPOSITORY="${RUN_FIELDS[10]}"
          WORKFLOW_HEAD_REPOSITORY="${RUN_FIELDS[11]}"
          if [ "$EVIDENCE_RUN_ID" = "$RUN287_LEGACY_V1_SOURCE_RUN_ID" ]; then
            if [ "$ARTIFACT_ID" != "$RUN287_LEGACY_V1_SOURCE_ARTIFACT_ID" ] || \
               [ "$EVIDENCE_ARTIFACT_DIGEST" != "$RUN287_LEGACY_V1_SOURCE_ARTIFACT_DIGEST" ] || \
               [ "$ARTIFACT_HEAD_SHA" != "$RUN287_LEGACY_V1_SOURCE_HEAD_SHA" ] || \
               [ "$ARTIFACT_HEAD_BRANCH" != "$RUN287_LEGACY_V1_SOURCE_HEAD_BRANCH" ] || \
               [ "$WORKFLOW_EVENT" != "workflow_dispatch" ] || \
               [ "$WORKFLOW_CONCLUSION" != "success" ]; then
              echo "[paper-catchup] BLOCKED: approved legacy artifact provenance mismatch"
              exit 2
            fi
            ORIGIN_VERIFICATION_MODE="APPROVED_LEGACY_ARTIFACT_PIN"
          else
            if [ "$ARTIFACT_HEAD_BRANCH" != "$DEFAULT_BRANCH" ]; then
              echo "[paper-catchup] BLOCKED: source run is not from the default branch"
              exit 2
            fi
            COMPARE_QUERY="$RUNNER_TEMP/run287_catchup_compare_${EVIDENCE_RUN_ID}.json"
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${ARTIFACT_HEAD_SHA}...${GITHUB_SHA}" \
              > "$COMPARE_QUERY"
            python - "$COMPARE_QUERY" "$ARTIFACT_HEAD_SHA" "$GITHUB_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          from tools.build_run287_catchup_price_evidence import (
              validate_github_compare_payload,
          )

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          validate_github_compare_payload(
              payload,
              source_sha=sys.argv[2],
              current_sha=sys.argv[3],
          )
          PY
            ORIGIN_VERIFICATION_MODE="DEFAULT_BRANCH_ANCESTOR"
          fi
          ARTIFACT_ZIP="$RUNNER_TEMP/${ARTIFACT_NAME}.zip"
          ARTIFACT_ROOT="$RUNNER_TEMP/${ARTIFACT_NAME}"
          test ! -e "$ARTIFACT_ZIP"
          test ! -e "$ARTIFACT_ROOT"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > "$ARTIFACT_ZIP"
          OBSERVED_ZIP_SHA256="$(sha256sum "$ARTIFACT_ZIP" | cut -d' ' -f1)"
          if [ "sha256:${OBSERVED_ZIP_SHA256}" != "$EVIDENCE_ARTIFACT_DIGEST" ]; then
            echo "[paper-catchup] BLOCKED: downloaded artifact bytes differ from the operator pin"
            exit 2
          fi
          python - "$ARTIFACT_ZIP" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive = zipfile.ZipFile(sys.argv[1])
          seen = set()
          total_uncompressed = 0
          for member in archive.infolist():
              name = member.filename
              path = PurePosixPath(name)
              mode = member.external_attr >> 16
              if (
                  not name
                  or "\\" in name
                  or path.is_absolute()
                  or any(part in {"", ".", ".."} for part in path.parts)
                  or name in seen
                  or stat.S_ISLNK(mode)
              ):
                  raise SystemExit(
                      f"unsafe catch-up artifact archive member:{name!r}"
                  )
              seen.add(name)
              total_uncompressed += int(member.file_size)
          if not seen or total_uncompressed > 1_000_000_000:
              raise SystemExit(
                  "catch-up artifact archive is empty or exceeds the extraction limit"
              )
          PY
          mkdir -p "$ARTIFACT_ROOT" outputs/run287_catchup_price_evidence
          unzip -q "$ARTIFACT_ZIP" -d "$ARTIFACT_ROOT"
          ARTIFACT_METADATA="outputs/run287_catchup_price_evidence/github_artifact_metadata.json"
          python - \
            "$ARTIFACT_METADATA" \
            "$EVIDENCE_RUN_ID" \
            "$ARTIFACT_ID" \
            "$ARTIFACT_NAME" \
            "$OBSERVED_ZIP_SHA256" \
            "$API_DIGEST" \
            "$ARTIFACT_CAPTURED_AT" \
            "$WORKFLOW_ID" \
            "$WORKFLOW_PATH" \
            "$ARTIFACT_HEAD_BRANCH" \
            "$ARTIFACT_HEAD_SHA" \
            "$WORKFLOW_EVENT" \
            "$WORKFLOW_STATUS" \
            "$WORKFLOW_CONCLUSION" \
            "$WORKFLOW_CREATED_AT" \
            "$WORKFLOW_UPDATED_AT" \
            "$WORKFLOW_RUN_ATTEMPT" \
            "$WORKFLOW_REPOSITORY" \
            "$WORKFLOW_HEAD_REPOSITORY" \
            "$DEFAULT_BRANCH" \
            "$GITHUB_SHA" \
            "$ORIGIN_VERIFICATION_MODE" <<'PY'
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          output.write_text(
              json.dumps(
                  {
                      "schema_version": "github-artifact-download-metadata-v2",
                      "run_id": sys.argv[2],
                      "artifact_id": sys.argv[3],
                      "artifact_name": sys.argv[4],
                      "artifact_zip_sha256": sys.argv[5],
                      "artifact_api_digest": sys.argv[6],
                      "artifact_captured_at_utc": sys.argv[7],
                      "workflow_id": sys.argv[8],
                      "workflow_path": sys.argv[9],
                      "head_branch": sys.argv[10],
                      "head_sha": sys.argv[11],
                      "workflow_event": sys.argv[12],
                      "workflow_status": sys.argv[13],
                      "workflow_conclusion": sys.argv[14],
                      "workflow_created_at_utc": sys.argv[15],
                      "workflow_updated_at_utc": sys.argv[16],
                      "workflow_run_attempt": sys.argv[17],
                      "repository": sys.argv[18],
                      "head_repository": sys.argv[19],
                      "default_branch": sys.argv[20],
                      "current_default_head_sha": sys.argv[21],
                      "origin_verification_mode": sys.argv[22],
                      "workflow_identity_verified": True,
                      "repository_identity_verified": True,
                      "head_lineage_verified": True,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          python tools/build_run287_catchup_price_evidence.py \
            --artifact-root "$ARTIFACT_ROOT" \
            --artifact-metadata "$ARTIFACT_METADATA" \
            --session-date "$LAST_NYSE_SESSION_DATE" \
            --output-cache outputs/run287_catchup_price_cache \
            --output-evidence outputs/run287_catchup_price_evidence/status.json
          echo "price_cache=outputs/run287_catchup_price_cache" >> "$GITHUB_OUTPUT"
          echo "manifest=outputs/run287_catchup_price_cache/manifest.json" >> "$GITHUB_OUTPUT"
          echo "artifact_root=$ARTIFACT_ROOT" >> "$GITHUB_OUTPUT"
          echo "artifact_metadata=$ARTIFACT_METADATA" >> "$GITHUB_OUTPUT"

      - name: Restore Run287 research-static archive cache
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        id: run287-research-static-cache
        uses: actions/cache/restore@v4
        with:
          path: run287_static_archive/run287_exact_static_archive_v1.zip
          key: run287-research-static-${{ runner.os }}-66ca4b6a6a61cb7e-v1

      - name: Restore validated forward paper state cache
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        uses: actions/cache/restore@v4
        with:
          path: |
            outputs/holding_risk_watch
            outputs/run287_exact_packet_upstream
            outputs/run287_exact_packet_input_sources
            outputs/run287_exact_packet_input_registry
            outputs/run287_decision_observation_archive
            outputs/run287_accepted_publication
            outputs/run287_risk_outcome_accepted_head_bundles
            outputs/run287_risk_outcome_accepted_head_manifests
            outputs/run287_risk_outcome_archive
            outputs/run287_risk_outcome_price_cache
          key: daily-paper-ledger-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-paper-ledger-${{ runner.os }}-

      - name: Restore validated cross-mode paper continuity cache
        if: steps.market.outputs.ready == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: |
            outputs/daily_simulated_fill_ledger
            outputs/run287_paper_immutable_head_bundles
          key: daily-paper-continuity-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-paper-continuity-v1-${{ runner.os }}-

      - name: Verify owner scope attestation for catch-up
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_COMMENT_ID: ${{ inputs.catchup_secret_scope_attestation_comment_id }}
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_EVIDENCE_RUN_ID: ${{ inputs.catchup_price_evidence_run_id }}
          EXPECTED_EVIDENCE_ARTIFACT_DIGEST: ${{ inputs.catchup_price_evidence_artifact_digest }}
        run: |
          set -euo pipefail
          if ! [[ "${SCOPE_COMMENT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "[run287-scope-attestation] BLOCKED: a positive issue-comment id is required for catch-up"
            exit 2
          fi
          COMMENT_EVIDENCE="$RUNNER_TEMP/run287_durable_scope_attestation_comment.json"
          RUN_EVIDENCE="$RUNNER_TEMP/run287_durable_scope_workflow_run.json"
          SCOPE_EVIDENCE="$RUNNER_TEMP/run287_durable_scope_initial.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/comments/${SCOPE_COMMENT_ID}" \
            > "$COMMENT_EVIDENCE"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$RUN_EVIDENCE"
          python tools/verify_run287_catchup_scope_attestation.py \
            --comment "$COMMENT_EVIDENCE" \
            --run "$RUN_EVIDENCE" \
            --event "$GITHUB_EVENT_PATH" \
            --expected-comment-id "$SCOPE_COMMENT_ID" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-default-branch "$EXPECTED_DEFAULT_BRANCH" \
            --expected-default-branch-sha "$GITHUB_SHA" \
            --expected-session-date "$LAST_NYSE_SESSION_DATE" \
            --expected-evidence-run-id "$EXPECTED_EVIDENCE_RUN_ID" \
            --expected-evidence-artifact-digest "$EXPECTED_EVIDENCE_ARTIFACT_DIGEST" \
            --expected-workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-actor "$GITHUB_ACTOR" \
            --output "$SCOPE_EVIDENCE" \
            --github-env "$GITHUB_ENV"
          SCOPE_INITIAL_SHA256="$(sha256sum "$SCOPE_EVIDENCE" | awk '{print $1}')"
          echo "RUN287_DURABLE_SCOPE_INITIAL_SHA256=$SCOPE_INITIAL_SHA256" >> "$GITHUB_ENV"

      - name: Consume owner scope attestation once
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCOPE_EVIDENCE="$RUNNER_TEMP/run287_durable_scope_initial.json"
          RUN_EVIDENCE="$RUNNER_TEMP/run287_durable_scope_workflow_run.json"
          COMMENT_INVENTORY="$RUNNER_TEMP/run287_durable_scope_comment_inventory.json"
          CONSUMPTION_RECORD="$RUNNER_TEMP/run287_durable_scope_consumption_record.json"
          CONSUMPTION_REQUEST="$RUNNER_TEMP/run287_durable_scope_consumption_request.json"
          CONSUMPTION_COMMENT="$RUNNER_TEMP/run287_durable_scope_consumption_comment.json"
          CONSUMPTION_RECEIPT="$RUNNER_TEMP/run287_durable_scope_consumption_initial.json"
          if ! [[ "${RUN287_DURABLE_SCOPE_INITIAL_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] || \
             [ "$(sha256sum "$SCOPE_EVIDENCE" | awk '{print $1}')" != "$RUN287_DURABLE_SCOPE_INITIAL_SHA256" ]; then
            echo "[run287-scope-consumption] BLOCKED: initial scope receipt hash mismatch"
            exit 2
          fi
          gh api \
            --paginate \
            --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/324/comments?per_page=100" \
            > "$COMMENT_INVENTORY"
          python tools/run287_catchup_scope_consumption.py prepare \
            --verification "$SCOPE_EVIDENCE" \
            --run "$RUN_EVIDENCE" \
            --existing-comments "$COMMENT_INVENTORY" \
            --record-output "$CONSUMPTION_RECORD" \
            --request-output "$CONSUMPTION_REQUEST"
          gh api \
            --method POST \
            --input "$CONSUMPTION_REQUEST" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/324/comments" \
            > "$CONSUMPTION_COMMENT"
          python tools/run287_catchup_scope_consumption.py verify \
            --comment "$CONSUMPTION_COMMENT" \
            --expected-record "$CONSUMPTION_RECORD" \
            --verification "$SCOPE_EVIDENCE" \
            --run "$RUN_EVIDENCE" \
            --output "$CONSUMPTION_RECEIPT" \
            --github-env "$GITHUB_ENV"
          CONSUMPTION_RECORD_SHA256="$(sha256sum "$CONSUMPTION_RECORD" | awk '{print $1}')"
          CONSUMPTION_RECEIPT_SHA256="$(sha256sum "$CONSUMPTION_RECEIPT" | awk '{print $1}')"
          echo "RUN287_DURABLE_SCOPE_CONSUMPTION_RECORD_SHA256=$CONSUMPTION_RECORD_SHA256" >> "$GITHUB_ENV"
          echo "RUN287_DURABLE_SCOPE_CONSUMPTION_RECEIPT_SHA256=$CONSUMPTION_RECEIPT_SHA256" >> "$GITHUB_ENV"

      - name: Configure rclone
        if: steps.market.outputs.ready == 'yes'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.RUN287_DURABLE_GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RUN287_DURABLE_RCLONE_CONFIG_GDRIVE }}
          RUN287_DURABLE_ENVIRONMENT_ATTESTATION: ${{ secrets.RUN287_DURABLE_ENVIRONMENT_ATTESTATION }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          python tools/check_run287_catchup_drive_readiness.py \
            --phase authentication
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[gdrive] no auth configured; continuing cache/local only"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore persistent data and operating outputs
        id: persistent-restore
        if: steps.market.outputs.ready == 'yes'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          LATEST_RUN_INPUT: ${{ github.event.inputs.latest_run || 'outputs' }}
          ALLOW_VERIFIED_PAPER_CANONICAL_HEAD_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_verified_paper_canonical_head_bootstrap || 'false' }}
        run: |
          set -euo pipefail
          PAPER_DURABLE_RESTORE_MODE=UNAVAILABLE
          echo "PAPER_DURABLE_RESTORE_MODE=$PAPER_DURABLE_RESTORE_MODE" >> "$GITHUB_ENV"
          mkdir -p outputs/full_rebuild_logs
          PAPER_CACHE_ANCHOR="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_cache_anchor"
          rm -rf "$PAPER_CACHE_ANCHOR"
          PAPER_HEAD_CACHE="outputs/run287_paper_immutable_head_bundles"
          PAPER_HEAD_CACHE_SELECTION="$RUNNER_TEMP/run287_paper_head_cache_selection.json"
          if [ -d "$PAPER_HEAD_CACHE" ]; then
            python tools/run287_paper_ledger_integrity.py \
              --select-immutable-heads-root "$PAPER_HEAD_CACHE" \
              --output "$PAPER_HEAD_CACHE_SELECTION"
            CACHED_TERMINAL_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["selected_snapshot_hash"])' "$PAPER_HEAD_CACHE_SELECTION")"
            if [ -s outputs/daily_simulated_fill_ledger/snapshot_integrity.json ]; then
              python tools/run287_paper_ledger_integrity.py \
                --state-dir outputs/daily_simulated_fill_ledger \
                --require-integrity
              CACHED_LEDGER_HASH="$(python -c 'import json; print(json.load(open("outputs/daily_simulated_fill_ledger/snapshot_integrity.json", encoding="utf-8"))["snapshot_hash"])')"
              if [ "$CACHED_LEDGER_HASH" != "$CACHED_TERMINAL_HASH" ]; then
                echo "[paper-ledger] BLOCKED: continuity cache ledger/head terminal mismatch"
                exit 2
              fi
            else
              python tools/run287_paper_ledger_integrity.py \
                --state-dir outputs/daily_simulated_fill_ledger \
                --install-immutable-heads-root "$PAPER_HEAD_CACHE"
            fi
          elif [ -e "$PAPER_HEAD_CACHE" ]; then
            echo "[paper-ledger] BLOCKED: continuity head cache path is unsafe"
            exit 2
          elif [ -e outputs/daily_simulated_fill_ledger ]; then
            echo "[paper-ledger] BLOCKED: continuity cache restored a ledger without its immutable chain"
            exit 2
          fi
          if [ -s outputs/daily_simulated_fill_ledger/snapshot_integrity.json ] && \
             python tools/run287_paper_ledger_integrity.py \
               --state-dir outputs/daily_simulated_fill_ledger \
               --require-integrity; then
            cp -a outputs/daily_simulated_fill_ledger "$PAPER_CACHE_ANCHOR"
            echo "[paper-ledger] preserved checksum-verified GitHub cache continuity anchor"
          fi
          OUTCOME_CACHE_HEADS="$RUNNER_TEMP/run287_risk_outcome_cache_heads"
          OUTCOME_CACHE_HEAD_MANIFESTS="$RUNNER_TEMP/run287_risk_outcome_cache_head_manifests"
          OUTCOME_CACHE_ACCEPTANCE_MARKERS="$RUNNER_TEMP/run287_risk_outcome_cache_acceptance_markers"
          rm -rf \
            "$OUTCOME_CACHE_HEADS" \
            "$OUTCOME_CACHE_HEAD_MANIFESTS" \
            "$OUTCOME_CACHE_ACCEPTANCE_MARKERS"
          mkdir -p \
            "$OUTCOME_CACHE_HEADS" \
            "$OUTCOME_CACHE_HEAD_MANIFESTS" \
            "$OUTCOME_CACHE_ACCEPTANCE_MARKERS"
          if [ -d outputs/run287_risk_outcome_accepted_head_manifests ]; then
            cp -a outputs/run287_risk_outcome_accepted_head_manifests/. "$OUTCOME_CACHE_HEAD_MANIFESTS/"
          fi
          if [ -d outputs/run287_risk_outcome_accepted_head_bundles ]; then
            while IFS= read -r -d '' cached_bundle_manifest; do
              CACHED_BUNDLE_DIR="$(dirname "$cached_bundle_manifest")"
              CACHED_BUNDLE_SHA="$(basename "$CACHED_BUNDLE_DIR")"
              if [[ "$CACHED_BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]] && \
                 python tools/manage_run287_risk_outcome_accepted_heads.py verify \
                   --head-dir "$CACHED_BUNDLE_DIR" \
                   --expected-manifest-sha256 "$CACHED_BUNDLE_SHA"; then
                cp -a "$CACHED_BUNDLE_DIR" "$OUTCOME_CACHE_HEADS/$CACHED_BUNDLE_SHA"
                echo "[risk-outcome] preserved verified cached accepted-head bundle=$CACHED_BUNDLE_SHA"
              else
                echo "[risk-outcome] ignored corrupt cached accepted-head bundle=$CACHED_BUNDLE_SHA"
                rm -rf "$CACHED_BUNDLE_DIR"
              fi
            done < <(find outputs/run287_risk_outcome_accepted_head_bundles -mindepth 2 -maxdepth 2 -type f -name manifest.json -print0)
          fi
          OUTCOME_CACHE_SHA=""
          if [ -s outputs/run287_accepted_publication/manifest.json ]; then
            OUTCOME_CACHE_SHA="$(sha256sum outputs/run287_accepted_publication/manifest.json | cut -d' ' -f1)"
            mkdir -p "$OUTCOME_CACHE_ACCEPTANCE_MARKERS/$OUTCOME_CACHE_SHA"
            cp \
              outputs/run287_accepted_publication/manifest.json \
              "$OUTCOME_CACHE_ACCEPTANCE_MARKERS/$OUTCOME_CACHE_SHA/manifest.json"
          fi
          if [ -n "$OUTCOME_CACHE_SHA" ] && \
             [ -s outputs/run287_risk_outcome_archive/summary.json ]; then
            OUTCOME_CACHE_HEAD="$OUTCOME_CACHE_HEADS/$OUTCOME_CACHE_SHA"
            OUTCOME_CURRENT_CACHE_CANDIDATE="$RUNNER_TEMP/run287_risk_outcome_current_cache_candidate"
            rm -rf "$OUTCOME_CURRENT_CACHE_CANDIDATE"
            mkdir -p "$OUTCOME_CURRENT_CACHE_CANDIDATE/run287_risk_outcome_archive"
            cp outputs/run287_accepted_publication/manifest.json "$OUTCOME_CURRENT_CACHE_CANDIDATE/manifest.json"
            cp outputs/run287_risk_outcome_archive/summary.json "$OUTCOME_CURRENT_CACHE_CANDIDATE/run287_risk_outcome_archive/summary.json"
            if [ -f outputs/run287_risk_outcome_archive/risk_outcome_events.jsonl ]; then
              cp outputs/run287_risk_outcome_archive/risk_outcome_events.jsonl "$OUTCOME_CURRENT_CACHE_CANDIDATE/run287_risk_outcome_archive/risk_outcome_events.jsonl"
            fi
            if python tools/manage_run287_risk_outcome_accepted_heads.py verify \
              --head-dir "$OUTCOME_CURRENT_CACHE_CANDIDATE" \
              --expected-manifest-sha256 "$OUTCOME_CACHE_SHA" \
              --output outputs/full_rebuild_logs/daily_run287_cached_outcome_head_verification.json; then
              if [ -d "$OUTCOME_CACHE_HEAD" ]; then
                if ! diff -qr "$OUTCOME_CURRENT_CACHE_CANDIDATE" "$OUTCOME_CACHE_HEAD" >/dev/null; then
                  echo "[risk-outcome] BLOCKED: same accepted manifest hash has divergent cached bundles"
                  exit 2
                fi
              else
                cp -a "$OUTCOME_CURRENT_CACHE_CANDIDATE" "$OUTCOME_CACHE_HEAD"
              fi
              echo "[risk-outcome] preserved immutable GitHub-cache accepted head=$OUTCOME_CACHE_SHA"
            else
              echo "[risk-outcome] quarantined invalid GitHub-cache accepted head; authoritative Drive chain will be checked independently"
              rm -rf \
                "$OUTCOME_CURRENT_CACHE_CANDIDATE" \
                outputs/run287_accepted_publication \
                outputs/run287_risk_outcome_archive
            fi
          fi
          if [ "${GDRIVE_READY:-no}" = "yes" ]; then
            if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
              BASE="gdrive:"
            else
              BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
            fi
            restore_dir() {
              local remote="$1"
              local local_dir="$2"
              local exclude_glob="${3:-}"
              local filter_args=()
              if [ -n "$exclude_glob" ]; then
                filter_args=(--exclude "$exclude_glob")
              fi
              mkdir -p "$local_dir"
              if rclone lsf "$BASE$remote" >/dev/null 2>&1; then
                echo "[gdrive] restore $remote -> $local_dir"
                timeout 12m rclone copy "$BASE$remote" "$local_dir/" "${filter_args[@]}" --transfers 6 --checkers 12 --stats 30s --stats-one-line || true
              else
                echo "[gdrive] missing $remote"
              fi
            }
            restore_dir cache_prices cache_prices
            restore_dir cache_macro cache_macro
            restore_dir models models
            restore_file() {
              local remote="$1"
              local local_file="$2"
              mkdir -p "$(dirname "$local_file")"
              if rclone lsf "$BASE$remote" >/dev/null 2>&1; then
                echo "[gdrive] restore file $remote -> $local_file"
                timeout 6m rclone copyto "$BASE$remote" "$local_file" --stats 30s --stats-one-line || true
              else
                echo "[gdrive] missing file $remote"
              fi
            }
            restore_file feature_store/scored_oos_latest.parquet feature_store/scored_oos_latest.parquet
            restore_dir data_raw/free data_raw/free
            if [ ! -s data_raw/free/sec/company_tickers.json ]; then
              restore_file data_raw/sec/company_tickers.json data_raw/free/sec/company_tickers.json
            fi
            restore_dir data_pit/free data_pit/free
            restore_dir data_pit/sec data_pit/sec
            restore_dir data_pit/etf_holdings data_pit/etf_holdings
            restore_dir data_pit/macro data_pit/macro
            restore_dir manifests/free_data manifests/free_data
            restore_dir outputs outputs "daily_simulated_fill_ledger/**"
            if [ "${LATEST_RUN_INPUT:-outputs}" != "outputs" ]; then
              restore_dir "$LATEST_RUN_INPUT" "$LATEST_RUN_INPUT"
            fi
          fi
          if [ "${LATEST_RUN_INPUT:-outputs}" != "outputs" ] && [ -d "$LATEST_RUN_INPUT" ]; then
            echo "[source] hydrate outputs/ from requested latest_run=$LATEST_RUN_INPUT"
            rm -rf outputs
            mkdir -p outputs
            cp -a "$LATEST_RUN_INPUT"/. outputs/
          fi
          if [ ! -s outputs/scored_latest.csv ] && [ -d cloud_results/full_rebuild/latest_global_alpha_universe ]; then
            echo "[fallback] hydrate outputs/ from committed cloud_results latest mirror"
            mkdir -p outputs
            cp -a cloud_results/full_rebuild/latest_global_alpha_universe/. outputs/
          fi
          if [ "${LATEST_RUN_INPUT:-outputs}" != "outputs" ] && \
             [ -s outputs/daily_simulated_fill_ledger/snapshot_integrity.json ] && \
             python tools/run287_paper_ledger_integrity.py \
               --state-dir outputs/daily_simulated_fill_ledger \
               --require-integrity; then
            if [ -d "$PAPER_CACHE_ANCHOR" ]; then
              python tools/run287_paper_ledger_integrity.py \
                --state-dir "$PAPER_CACHE_ANCHOR" \
                --install-source outputs/daily_simulated_fill_ledger \
                --require-install-continuity
              echo "[paper-ledger] reconciled explicit latest_run ledger with immutable-cache anchor"
            else
              cp -a outputs/daily_simulated_fill_ledger "$PAPER_CACHE_ANCHOR"
              echo "[paper-ledger] adopted checksum-verified explicit latest_run ledger as continuity anchor"
            fi
          fi
          rm -rf outputs/daily_simulated_fill_ledger
          if [ -d "$PAPER_CACHE_ANCHOR" ]; then
            cp -a "$PAPER_CACHE_ANCHOR" outputs/daily_simulated_fill_ledger
          fi
          if [ "${GDRIVE_READY:-no}" = "yes" ]; then
            PAPER_REMOTE_CANDIDATE="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_remote"
            PAPER_LOCAL_RECOVERY="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_pre_remote"
            rm -rf "$PAPER_REMOTE_CANDIDATE" "$PAPER_LOCAL_RECOVERY"
            restore_dir paper_archive/run287_daily_simulated_fill_ledger "$PAPER_REMOTE_CANDIDATE"
            if [ -d outputs/daily_simulated_fill_ledger ]; then
              cp -a outputs/daily_simulated_fill_ledger "$PAPER_LOCAL_RECOVERY"
            fi
            # A manifest-addressed immutable head always outranks the legacy
            # adoption exception.  The exception is for the first deployment
            # only, before any verified cache/local/head anchor exists.
            PAPER_REMOTE_HEADS="${BASE}paper_archive/run287_daily_simulated_fill_ledger_heads"
            PAPER_HEAD_LIST="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_heads.txt"
            PAPER_IMMUTABLE_HEADS_LOCAL="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_immutable_heads"
            PAPER_IMMUTABLE_SELECTION="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_immutable_selection.json"
            PAPER_ARCHIVE_DIRS="$RUNNER_TEMP/run287_paper_archive_dirs.txt"
            BASE_ROOT_DIRS="$RUNNER_TEMP/run287_drive_root_dirs.txt"
            rm -rf "$PAPER_IMMUTABLE_HEADS_LOCAL" "$PAPER_IMMUTABLE_SELECTION"
            mkdir -p "$PAPER_IMMUTABLE_HEADS_LOCAL"
            if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
              if ! rclone lsf "$BASE" --dirs-only > "$BASE_ROOT_DIRS"; then
                echo "[gdrive] transient paper-archive discovery failure; retain verified cache/local state for this run"
                echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              DRIVE_TOP_LEVEL_DIRS="$RUNNER_TEMP/run287_drive_top_level_dirs.txt"
              if ! rclone lsf "gdrive:" --dirs-only > "$DRIVE_TOP_LEVEL_DIRS"; then
                echo "[gdrive] transient Drive-root discovery failure; retain verified cache/local state for this run"
                echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                exit 0
              fi
              if grep -Fx "${GDRIVE_FOLDER_NAME}/" "$DRIVE_TOP_LEVEL_DIRS" >/dev/null; then
                if ! rclone lsf "$BASE" --dirs-only > "$BASE_ROOT_DIRS"; then
                  echo "[gdrive] transient configured-base discovery failure; retain verified cache/local state for this run"
                  echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                  exit 0
                fi
              else
                : > "$BASE_ROOT_DIRS"
                echo "[gdrive] authoritative configured-base absence confirmed; first bootstrap may create it"
              fi
            fi
            if grep -Fx "paper_archive/" "$BASE_ROOT_DIRS" >/dev/null; then
              if ! rclone lsf "${BASE}paper_archive/" --dirs-only > "$PAPER_ARCHIVE_DIRS"; then
                echo "[gdrive] transient paper-archive discovery failure; retain verified cache/local state for this run"
                echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              : > "$PAPER_ARCHIVE_DIRS"
            fi
            PAPER_CANONICAL_REMOTE_PRESENT=no
            if grep -Fx "run287_daily_simulated_fill_ledger/" "$PAPER_ARCHIVE_DIRS" >/dev/null; then
              PAPER_CANONICAL_REMOTE_PRESENT=yes
            fi
            if [ "$PAPER_CANONICAL_REMOTE_PRESENT" = "yes" ]; then
              echo "PAPER_CANONICAL_REMOTE_STATE=PROVEN_PRESENT" >> "$GITHUB_ENV"
            else
              echo "PAPER_CANONICAL_REMOTE_STATE=PROVEN_ABSENT" >> "$GITHUB_ENV"
            fi
            PAPER_HAS_IMMUTABLE_HEAD=no
            if grep -Fx "run287_daily_simulated_fill_ledger_heads/" "$PAPER_ARCHIVE_DIRS" >/dev/null; then
              PAPER_HEAD_DIR_LIST="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_head_dirs.txt"
              PAPER_HEAD_LIST_RAW="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_heads_raw.txt"
              if ! rclone lsf "$PAPER_REMOTE_HEADS/" --dirs-only > "$PAPER_HEAD_LIST_RAW"; then
                echo "[gdrive] transient paper-head listing failure; retain verified cache/local state for this run"
                echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                exit 0
              fi
              sed 's#/$##' "$PAPER_HEAD_LIST_RAW" | sort -u > "$PAPER_HEAD_DIR_LIST"
              : > "$PAPER_HEAD_LIST"
              while IFS= read -r PAPER_HEAD_HASH; do
                [ -n "$PAPER_HEAD_HASH" ] || continue
                PAPER_HEAD_FILES="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_head_${PAPER_HEAD_HASH}_files.txt"
                if ! rclone lsf "$PAPER_REMOTE_HEADS/$PAPER_HEAD_HASH/" --files-only > "$PAPER_HEAD_FILES"; then
                  echo "[gdrive] transient paper-head enumeration failure; retain verified cache/local state for this run"
                  echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                  exit 0
                fi
                if grep -Fx "snapshot_integrity.json" "$PAPER_HEAD_FILES" >/dev/null; then
                  if ! [[ "$PAPER_HEAD_HASH" =~ ^[0-9a-f]{64}$ ]]; then
                    echo "[paper-ledger] BLOCKED: invalid committed immutable head name=$PAPER_HEAD_HASH"
                    exit 2
                  fi
                  mkdir -p "$PAPER_IMMUTABLE_HEADS_LOCAL/$PAPER_HEAD_HASH"
                  rclone copy \
                    "$PAPER_REMOTE_HEADS/$PAPER_HEAD_HASH/" \
                    "$PAPER_IMMUTABLE_HEADS_LOCAL/$PAPER_HEAD_HASH/" \
                    --transfers 2 --checkers 4 --stats 30s --stats-one-line
                  printf '%s\n' "$PAPER_HEAD_HASH" >> "$PAPER_HEAD_LIST"
                else
                  echo "[paper-ledger] ignore incomplete uncommitted immutable head=$PAPER_HEAD_HASH"
                fi
              done < "$PAPER_HEAD_DIR_LIST"
              if [ -s "$PAPER_HEAD_LIST" ]; then
                PAPER_HAS_IMMUTABLE_HEAD=yes
                python tools/run287_paper_ledger_integrity.py \
                  --select-immutable-heads-root "$PAPER_IMMUTABLE_HEADS_LOCAL" \
                  --output "$PAPER_IMMUTABLE_SELECTION"
                PAPER_IMMUTABLE_TERMINAL_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["selected_snapshot_hash"])' "$PAPER_IMMUTABLE_SELECTION")"
                if ! [[ "$PAPER_IMMUTABLE_TERMINAL_HASH" =~ ^[0-9a-f]{64}$ ]]; then
                  echo "[paper-ledger] BLOCKED: selected immutable terminal hash is invalid"
                  exit 2
                fi
                echo "PAPER_IMMUTABLE_REMOTE_TERMINAL_HASH=$PAPER_IMMUTABLE_TERMINAL_HASH" >> "$GITHUB_ENV"
                echo "PAPER_IMMUTABLE_REMOTE_HEADS_PRESENT=yes" >> "$GITHUB_ENV"
              fi
            else
              : > "$PAPER_HEAD_LIST"
            fi
            if [ "$PAPER_HAS_IMMUTABLE_HEAD" = "yes" ]; then
              if [ -s outputs/daily_simulated_fill_ledger/snapshot_integrity.json ] && \
                 python tools/run287_paper_ledger_integrity.py \
                   --state-dir outputs/daily_simulated_fill_ledger \
                   --require-integrity; then
                python tools/run287_paper_ledger_integrity.py \
                  --state-dir outputs/daily_simulated_fill_ledger \
                  --install-immutable-heads-root "$PAPER_IMMUTABLE_HEADS_LOCAL" \
                  --require-install-continuity
              else
                python tools/run287_paper_ledger_integrity.py \
                  --state-dir outputs/daily_simulated_fill_ledger \
                  --install-immutable-heads-root "$PAPER_IMMUTABLE_HEADS_LOCAL"
              fi
              if [ "$PAPER_CANONICAL_REMOTE_PRESENT" = "yes" ]; then
                if [ -s "$PAPER_REMOTE_CANDIDATE/snapshot_integrity.json" ] && \
                   python tools/run287_paper_ledger_integrity.py \
                     --state-dir "$PAPER_REMOTE_CANDIDATE" \
                     --require-integrity; then
                  PAPER_REMOTE_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_CANDIDATE/snapshot_integrity.json")"
                  if grep -Fx "$PAPER_REMOTE_SNAPSHOT_HASH" "$PAPER_HEAD_LIST" >/dev/null; then
                    python tools/run287_paper_ledger_integrity.py \
                      --state-dir outputs/daily_simulated_fill_ledger \
                      --require-state-descends-from "$PAPER_REMOTE_CANDIDATE"
                  else
                    echo "[paper-ledger] mutable canonical is not a committed head; immutable terminal will repair the mirror"
                    echo "PAPER_CANONICAL_REMOTE_STATE=REPAIR_FROM_IMMUTABLE" >> "$GITHUB_ENV"
                  fi
                else
                  echo "[paper-ledger] mutable canonical is corrupt; immutable terminal will repair the mirror"
                  echo "PAPER_CANONICAL_REMOTE_STATE=REPAIR_FROM_IMMUTABLE" >> "$GITHUB_ENV"
                fi
              fi
              PAPER_DURABLE_RESTORE_MODE=IMMUTABLE_HEAD
              echo "PAPER_DURABLE_RESTORE_MODE=$PAPER_DURABLE_RESTORE_MODE" >> "$GITHUB_ENV"
              echo "[paper-ledger] restored the unique verified immutable terminal; mutable canonical is only a checked mirror"
            elif [ -s "$PAPER_REMOTE_CANDIDATE/snapshot_integrity.json" ] && \
               python tools/run287_paper_ledger_integrity.py \
                 --state-dir "$PAPER_REMOTE_CANDIDATE" \
                 --require-integrity; then
              if [ -s outputs/daily_simulated_fill_ledger/snapshot_integrity.json ] && \
                 python tools/run287_paper_ledger_integrity.py \
                   --state-dir outputs/daily_simulated_fill_ledger \
                   --require-integrity; then
                python tools/run287_paper_ledger_integrity.py \
                  --state-dir outputs/daily_simulated_fill_ledger \
                  --install-source "$PAPER_REMOTE_CANDIDATE" \
                  --require-install-continuity
              else
                PAPER_REMOTE_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_CANDIDATE/snapshot_integrity.json")"
                if [[ "$PAPER_REMOTE_SNAPSHOT_HASH" =~ ^[0-9a-f]{64}$ ]] && \
                   grep -Fx "$PAPER_REMOTE_SNAPSHOT_HASH" "$PAPER_HEAD_LIST" >/dev/null; then
                  PAPER_HEAD_CANDIDATE="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_head_${PAPER_REMOTE_SNAPSHOT_HASH}"
                  rm -rf "$PAPER_HEAD_CANDIDATE"
                  mkdir -p "$PAPER_HEAD_CANDIDATE"
                  rclone copy "$PAPER_REMOTE_HEADS/$PAPER_REMOTE_SNAPSHOT_HASH/" "$PAPER_HEAD_CANDIDATE/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
                  python tools/run287_paper_ledger_integrity.py \
                    --state-dir "$PAPER_HEAD_CANDIDATE" \
                    --require-integrity
                  PAPER_HEAD_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_HEAD_CANDIDATE/snapshot_integrity.json")"
                  if [ "$PAPER_HEAD_SNAPSHOT_HASH" != "$PAPER_REMOTE_SNAPSHOT_HASH" ]; then
                    echo "[paper-ledger] BLOCKED: immutable Drive head/hash mismatch during cache-loss recovery"
                    exit 2
                  fi
                  python tools/run287_paper_ledger_integrity.py \
                    --state-dir outputs/daily_simulated_fill_ledger \
                    --install-source "$PAPER_HEAD_CANDIDATE"
                  echo "[paper-ledger] restored verified Drive snapshot from matching immutable Drive head after cache loss"
                elif [ "${ALLOW_VERIFIED_PAPER_CANONICAL_HEAD_BOOTSTRAP:-false}" = "true" ] && \
                     [ "$PAPER_HAS_IMMUTABLE_HEAD" = "no" ] && \
                     [ ! -d "$PAPER_CACHE_ANCHOR" ]; then
                  # Explicit one-time H4b migration for a pre-head canonical
                  # that already carries a valid recursive integrity manifest.
                  # It is never enabled on scheduled runs and is rechecked
                  # against the remote canonical again before persistence.
                  python - \
                    "$PAPER_REMOTE_CANDIDATE/snapshot_integrity.json" \
                    "$PAPER_REMOTE_CANDIDATE/summary.json" \
                    "$LAST_NYSE_SESSION_DATE" \
                    outputs/full_rebuild_logs/daily_paper_verified_canonical_bootstrap.json <<'PY'
          import json
          import sys
          from datetime import date
          from pathlib import Path

          from tools.run_daily_simulated_fill_ledger import (
              validate_restored_snapshot,
          )
          from tools.run287_paper_ledger_integrity import (
              SUPPORTED_INTEGRITY_SCHEMAS,
          )

          integrity_path = Path(sys.argv[1])
          summary_path = Path(sys.argv[2])
          state_root = integrity_path.parent
          requested_session = date.fromisoformat(sys.argv[3])
          output_path = Path(sys.argv[4])
          integrity = json.loads(integrity_path.read_text(encoding="utf-8"))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          snapshot_date = date.fromisoformat(str(integrity.get("as_of_date") or ""))
          source_integrity_schema = str(
              integrity.get("schema_version") or ""
          )
          if (
              source_integrity_schema not in SUPPORTED_INTEGRITY_SCHEMAS
              or not isinstance(integrity.get("snapshot_hash"), str)
              or len(integrity["snapshot_hash"]) != 64
              or snapshot_date > requested_session
              or summary.get("schema_version")
              != "daily-simulated-fill-ledger-summary-v1"
              or summary.get("status") != "completed"
              or summary.get("as_of_date") != snapshot_date.isoformat()
              or not isinstance(summary.get("portfolios"), dict)
              or summary.get("review_only") is not True
              or summary.get("simulated") is not True
              or summary.get("live_trading_enabled") is not False
              or summary.get("production_mutation_allowed") is not False
              or summary.get("historical_cagr_mdd_replacement_allowed")
              is not False
          ):
              raise SystemExit(
                  "verified canonical bootstrap blocked: unsafe or future paper state"
              )
          for portfolio in ("main", "concentrated"):
              if not (
                  state_root / portfolio / "account_state_latest.json"
              ).is_file():
                  raise SystemExit(
                      "verified canonical bootstrap blocked: portfolio account missing"
                  )
              validate_restored_snapshot(
                  state_root / portfolio,
                  portfolio,
                  bootstrap_path=(
                      state_root
                      / "bootstrap"
                      / f"{portfolio}_account.json"
                  ),
              )
              portfolio_manifest = json.loads(
                  (
                      state_root / portfolio / "manifest.json"
                  ).read_text(encoding="utf-8")
              )
              if summary["portfolios"].get(portfolio) != portfolio_manifest:
                  raise SystemExit(
                      "verified canonical bootstrap blocked: summary/portfolio mismatch"
                  )
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(
                  {
                      "schema_version":
                          "run287-verified-paper-canonical-bootstrap-v1",
                      "status": "EXPLICIT_ONE_TIME_MIGRATION_AUTHORIZED",
                      "snapshot_hash": integrity["snapshot_hash"],
                      "source_integrity_schema": source_integrity_schema,
                      "snapshot_as_of_date": snapshot_date.isoformat(),
                      "requested_session": requested_session.isoformat(),
                      "remote_immutable_head_count": 0,
                      "verified_cache_anchor_present": False,
                      "review_only": True,
                      "production_activation_allowed": False,
                      "live_trading_enabled": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
                  python tools/run287_paper_ledger_integrity.py \
                    --state-dir outputs/daily_simulated_fill_ledger \
                    --install-source "$PAPER_REMOTE_CANDIDATE"
                  echo "PAPER_VERIFIED_CANONICAL_BOOTSTRAP_PENDING=yes" >> "$GITHUB_ENV"
                  echo "[paper-ledger] explicitly adopted integrity-valid pre-head Drive canonical; persistence must create its first immutable head"
                else
                  echo "[paper-ledger] BLOCKED: verified Drive snapshot lacks a verified cache/local or immutable-head cross-source continuity anchor"
                  exit 2
                fi
              fi
              PAPER_DURABLE_RESTORE_MODE=VERIFIED_CANONICAL
              echo "PAPER_DURABLE_RESTORE_MODE=$PAPER_DURABLE_RESTORE_MODE" >> "$GITHUB_ENV"
              echo "[paper-ledger] reconciled Drive snapshot against immutable-cache continuity anchor; pre-install recovery=$PAPER_LOCAL_RECOVERY"
            elif [ -s outputs/daily_simulated_fill_ledger/snapshot_integrity.json ] && \
                 python tools/run287_paper_ledger_integrity.py \
                   --state-dir outputs/daily_simulated_fill_ledger \
                   --require-integrity; then
              echo "[paper-ledger] Drive snapshot was unverified; retained verified cache/local snapshot"
            elif [ "$PAPER_CANONICAL_REMOTE_PRESENT" = "yes" ] && \
                 [ ! -e "$PAPER_REMOTE_CANDIDATE/snapshot_integrity.json" ] && \
                 [ ! -d "$PAPER_CACHE_ANCHOR" ] && \
                 [ "$PAPER_HAS_IMMUTABLE_HEAD" = "no" ]; then
              # The sole migration exception is a durable Drive ledger from a
              # completed NYSE session at or before this run that predates
              # snapshot manifests.  It is quarantined locally and is not an
              # acceptance/continuity anchor: the first mark-only transaction
              # must semantically attest it and write a new manifest first.
              python tools/prepare_run287_legacy_paper_migration.py \
                --state-dir "$PAPER_REMOTE_CANDIDATE" \
                --requested-as-of-date "$LAST_NYSE_SESSION_DATE" \
                --expected-source-tree-sha256 "$RUN287_LEGACY_V1_APPROVED_TREE_SHA256" \
                --source-artifact-run-id "$RUN287_LEGACY_V1_SOURCE_RUN_ID" \
                --source-artifact-id "$RUN287_LEGACY_V1_SOURCE_ARTIFACT_ID" \
                --source-artifact-digest "$RUN287_LEGACY_V1_SOURCE_ARTIFACT_DIGEST" \
                --output outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
              cp -a "$PAPER_REMOTE_CANDIDATE" outputs/daily_simulated_fill_ledger
              PAPER_LEGACY_MIGRATION_PENDING=yes
              echo "PAPER_LEGACY_MIGRATION_PENDING=yes" >> "$GITHUB_ENV"
              PAPER_DURABLE_RESTORE_MODE=VERIFIED_LEGACY_MIGRATION_SOURCE
              echo "PAPER_DURABLE_RESTORE_MODE=$PAPER_DURABLE_RESTORE_MODE" >> "$GITHUB_ENV"
              echo "[paper-ledger] quarantined legacy Drive ledger; semantic attestation is required before acceptance"
            elif [ "$PAPER_CANONICAL_REMOTE_PRESENT" = "no" ] && \
                 [ ! -d "$PAPER_CACHE_ANCHOR" ] && \
                 [ "$PAPER_HAS_IMMUTABLE_HEAD" = "no" ]; then
              rm -rf "$PAPER_REMOTE_CANDIDATE"
              echo "[paper-ledger] authoritative Drive absence confirmed; later review-only bootstrap may create the first paper genesis"
            elif [ "$PAPER_HAS_IMMUTABLE_HEAD" = "yes" ]; then
              echo "[paper-ledger] BLOCKED: immutable Drive head exists; legacy manifest-free candidate cannot replace its continuity anchor"
              exit 2
            else
              echo "[paper-ledger] BLOCKED: no checksum-verified cross-source continuity anchor"
              exit 2
            fi
            if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
              echo "[paper-ledger] immutable Drive heads deferred until legacy semantic attestation completes"
            elif [ "$PAPER_HAS_IMMUTABLE_HEAD" = "yes" ]; then
              echo "[paper-ledger] immutable Drive chain selected atomically; orphaned or forked heads fail closed"
            fi
            restore_dir paper_archive/run287_holding_risk_watch outputs/holding_risk_watch
            restore_dir paper_archive/run287_decision_observation_archive outputs/run287_decision_observation_archive
            restore_dir paper_archive/run287_risk_outcome_archive outputs/run287_risk_outcome_archive
            restore_dir paper_archive/run287_risk_outcome_price_cache outputs/run287_risk_outcome_price_cache
          fi

      - name: Enforce durable Drive for chronological catch-up
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.RUN287_DURABLE_GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RUN287_DURABLE_RCLONE_CONFIG_GDRIVE }}
          RUN287_DURABLE_ENVIRONMENT_ATTESTATION: ${{ secrets.RUN287_DURABLE_ENVIRONMENT_ATTESTATION }}
        run: |
          set -euo pipefail
          python tools/check_run287_catchup_drive_readiness.py --phase restored

      - name: Restore immutable catch-up target evidence for legacy migration
        id: catchup_target_evidence
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes' && env.PAPER_LEGACY_MIGRATION_PENDING == 'yes'
        env:
          CATCHUP_ARTIFACT_ROOT: ${{ steps.catchup_price_evidence.outputs.artifact_root }}
          CATCHUP_ARTIFACT_METADATA: ${{ steps.catchup_price_evidence.outputs.artifact_metadata }}
        run: |
          set -euo pipefail
          python tools/build_run287_catchup_target_evidence.py \
            --artifact-root "${CATCHUP_ARTIFACT_ROOT:?missing catch-up artifact root}" \
            --artifact-metadata "${CATCHUP_ARTIFACT_METADATA:?missing catch-up artifact metadata}" \
            --session-date "$LAST_NYSE_SESSION_DATE" \
            --output-target-dir outputs/run287_catchup_target_evidence \
            --output-evidence outputs/run287_catchup_target_evidence_status.json
          echo "target_manifest=outputs/run287_catchup_target_evidence/manifest.json" >> "$GITHUB_OUTPUT"
          echo "main_target=outputs/run287_catchup_target_evidence/operating_main_target_book.csv" >> "$GITHUB_OUTPUT"
          echo "concentrated_target=outputs/run287_catchup_target_evidence/operating_concentrated_target_book.csv" >> "$GITHUB_OUTPUT"

      - name: Restore verified risk-outcome accepted head
        id: risk_outcome_accepted_parent
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
          ALLOW_RISK_OUTCOME_GENESIS_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_risk_outcome_genesis_bootstrap || 'false' }}
          ALLOW_QUARANTINED_LEGACY_OUTCOME_PARENT: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_quarantined_legacy_outcome_parent || 'false' }}
        run: |
          set -euo pipefail
          if [ "${ALLOW_RISK_OUTCOME_GENESIS_BOOTSTRAP:-false}" = "true" ] && \
             [ "${ALLOW_QUARANTINED_LEGACY_OUTCOME_PARENT:-false}" = "true" ]; then
            echo "[risk-outcome] BLOCKED: genesis and legacy-quarantine bootstrap authorizations are mutually exclusive"
            exit 2
          fi
          CACHE_HEADS="$RUNNER_TEMP/run287_risk_outcome_cache_heads"
          CACHE_MANIFESTS="$RUNNER_TEMP/run287_risk_outcome_cache_head_manifests"
          CACHE_ACCEPTANCE_MARKERS="$RUNNER_TEMP/run287_risk_outcome_cache_acceptance_markers"
          COMBINED_MANIFESTS="$RUNNER_TEMP/run287_risk_outcome_combined_head_manifests"
          REMOTE_MANIFESTS="$RUNNER_TEMP/run287_risk_outcome_remote_head_manifests"
          SELECTED_HEAD_ROOT="$RUNNER_TEMP/run287_risk_outcome_selected_heads"
          rm -rf "$COMBINED_MANIFESTS" "$REMOTE_MANIFESTS" "$SELECTED_HEAD_ROOT"
          mkdir -p "$COMBINED_MANIFESTS" "$REMOTE_MANIFESTS"
          install_manifest_candidate() {
            local source="$1"
            local expected="$2"
            local source_kind="${3:-authoritative}"
            local actual
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              if [ "$source_kind" = "cache" ]; then
                echo "[risk-outcome] ignore invalid cached accepted-head directory=$expected"
                return 0
              fi
              echo "[risk-outcome] BLOCKED: invalid accepted-head directory=$expected"
              exit 2
            fi
            actual="$(sha256sum "$source" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              if [ "$source_kind" = "cache" ]; then
                echo "[risk-outcome] ignore corrupt cached accepted-head manifest=$expected actual=$actual"
                return 0
              fi
              echo "[risk-outcome] BLOCKED: accepted-head directory/manifest mismatch directory=$expected manifest=$actual"
              exit 2
            fi
            mkdir -p "$COMBINED_MANIFESTS/$expected"
            if [ -f "$COMBINED_MANIFESTS/$expected/manifest.json" ] && \
               ! cmp -s "$source" "$COMBINED_MANIFESTS/$expected/manifest.json"; then
              echo "[risk-outcome] BLOCKED: divergent immutable manifest=$expected"
              exit 2
            fi
            cp "$source" "$COMBINED_MANIFESTS/$expected/manifest.json"
          }
          if [ -d "$CACHE_HEADS" ]; then
            while IFS= read -r -d '' manifest; do
              install_manifest_candidate "$manifest" "$(basename "$(dirname "$manifest")")"
            done < <(find "$CACHE_HEADS" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print0)
          fi
          REMOTE_HEADS_AVAILABLE=no
          REMOTE_HEAD_DISCOVERY_CONFIRMED=no
          REMOTE_COMMITTED_HEAD_COUNT=0
          if [ "${GDRIVE_READY:-no}" = "yes" ]; then
            if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
              BASE="gdrive:"
            else
              BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
            fi
            REMOTE_HEADS="${BASE}paper_archive/run287_risk_outcome_accepted_heads"
            PAPER_ARCHIVE_DIRS="$RUNNER_TEMP/run287_risk_outcome_paper_archive_dirs.txt"
            OUTCOME_BASE_ROOT_DIRS="$RUNNER_TEMP/run287_risk_outcome_drive_root_dirs.txt"
            if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
              if ! rclone lsf "$BASE" --dirs-only > "$OUTCOME_BASE_ROOT_DIRS"; then
                echo "[gdrive] transient outcome configured-root listing failure; use only verified cache state for this run"
                GDRIVE_READY=no
                echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                : > "$OUTCOME_BASE_ROOT_DIRS"
              fi
            else
              OUTCOME_DRIVE_TOP_LEVEL_DIRS="$RUNNER_TEMP/run287_risk_outcome_drive_top_level_dirs.txt"
              if ! rclone lsf "gdrive:" --dirs-only > "$OUTCOME_DRIVE_TOP_LEVEL_DIRS"; then
                echo "[gdrive] transient outcome Drive-root listing failure; use only verified cache state for this run"
                GDRIVE_READY=no
                echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                : > "$OUTCOME_BASE_ROOT_DIRS"
              elif grep -Fx "${GDRIVE_FOLDER_NAME}/" "$OUTCOME_DRIVE_TOP_LEVEL_DIRS" >/dev/null; then
                if ! rclone lsf "$BASE" --dirs-only > "$OUTCOME_BASE_ROOT_DIRS"; then
                  echo "[gdrive] transient outcome configured-base listing failure; use only verified cache state for this run"
                  GDRIVE_READY=no
                  echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                  : > "$OUTCOME_BASE_ROOT_DIRS"
                fi
              else
                : > "$OUTCOME_BASE_ROOT_DIRS"
                echo "[gdrive] authoritative outcome configured-base absence confirmed; first bootstrap may create it"
              fi
            fi
            if [ "${GDRIVE_READY:-no}" = "yes" ]; then
              if grep -Fx "paper_archive/" "$OUTCOME_BASE_ROOT_DIRS" >/dev/null; then
                if ! rclone lsf "${BASE}paper_archive/" --dirs-only > "$PAPER_ARCHIVE_DIRS"; then
                  echo "[gdrive] transient outcome paper-archive listing failure; use only verified cache state for this run"
                  GDRIVE_READY=no
                  echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                  : > "$PAPER_ARCHIVE_DIRS"
                fi
              else
                : > "$PAPER_ARCHIVE_DIRS"
              fi
            fi
            if [ "${GDRIVE_READY:-no}" = "yes" ] && \
               [ -f "$PAPER_ARCHIVE_DIRS" ]; then
              REMOTE_HEAD_DISCOVERY_CONFIRMED=yes
              if grep -Fx "run287_risk_outcome_accepted_heads/" "$PAPER_ARCHIVE_DIRS" >/dev/null; then
                REMOTE_HEADS_AVAILABLE=yes
                REMOTE_HEAD_LIST="$RUNNER_TEMP/run287_risk_outcome_remote_heads.txt"
                REMOTE_HEAD_LIST_RAW="$RUNNER_TEMP/run287_risk_outcome_remote_heads_raw.txt"
                if rclone lsf "$REMOTE_HEADS/" --dirs-only > "$REMOTE_HEAD_LIST_RAW"; then
                  sed 's#/$##' "$REMOTE_HEAD_LIST_RAW" | sort -u > "$REMOTE_HEAD_LIST"
                  REMOTE_ENUMERATION_FAILED=no
                  while IFS= read -r head_sha; do
                    [ -n "$head_sha" ] || continue
                    if ! [[ "$head_sha" =~ ^[0-9a-f]{64}$ ]]; then
                      echo "[risk-outcome] BLOCKED: invalid remote accepted-head name=$head_sha"
                      exit 2
                    fi
                    REMOTE_HEAD_FILES="$RUNNER_TEMP/run287_risk_outcome_remote_head_${head_sha}_files.txt"
                    if ! rclone lsf "$REMOTE_HEADS/$head_sha/" --files-only > "$REMOTE_HEAD_FILES"; then
                      REMOTE_ENUMERATION_FAILED=yes
                      break
                    fi
                    if ! grep -Fx "manifest.json" "$REMOTE_HEAD_FILES" >/dev/null; then
                      echo "[risk-outcome] ignore incomplete uncommitted head=$head_sha"
                      continue
                    fi
                    mkdir -p "$REMOTE_MANIFESTS/$head_sha"
                    if ! rclone copyto \
                      "$REMOTE_HEADS/$head_sha/manifest.json" \
                      "$REMOTE_MANIFESTS/$head_sha/manifest.json" \
                      --stats 30s --stats-one-line; then
                      REMOTE_ENUMERATION_FAILED=yes
                      break
                    fi
                  done < "$REMOTE_HEAD_LIST"
                  if [ "$REMOTE_ENUMERATION_FAILED" = "yes" ]; then
                    echo "[gdrive] transient outcome-head enumeration failure; discard partial remote view and use only verified cache state"
                    rm -rf "$REMOTE_MANIFESTS"
                    mkdir -p "$REMOTE_MANIFESTS"
                    GDRIVE_READY=no
                    REMOTE_HEADS_AVAILABLE=no
                    REMOTE_HEAD_DISCOVERY_CONFIRMED=no
                    echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                  else
                    while IFS= read -r -d '' remote_manifest; do
                      REMOTE_MANIFEST_SHA="$(basename "$(dirname "$remote_manifest")")"
                      install_manifest_candidate \
                        "$remote_manifest" \
                        "$REMOTE_MANIFEST_SHA"
                      REMOTE_COMMITTED_HEAD_COUNT=$((REMOTE_COMMITTED_HEAD_COUNT + 1))
                    done < <(find "$REMOTE_MANIFESTS" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print0)
                  fi
                else
                  echo "[gdrive] transient outcome-head listing failure; use only verified cache state for this run"
                  GDRIVE_READY=no
                  REMOTE_HEADS_AVAILABLE=no
                  REMOTE_HEAD_DISCOVERY_CONFIRMED=no
                  echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
                fi
              fi
            else
              echo "[gdrive] transient outcome-head discovery failure; use only verified cache state for this run"
              GDRIVE_READY=no
              echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            fi
          fi
          # When Drive discovery succeeded, its complete immutable graph plus
          # the separately bundle-verified cache terminal is authoritative.
          # Arbitrary cached graph entries are used only during a Drive
          # outage, so one corrupt cache manifest cannot poison Drive recovery.
          if [ "$REMOTE_HEAD_DISCOVERY_CONFIRMED" != "yes" ] && \
             [ -d "$CACHE_MANIFESTS" ]; then
            while IFS= read -r -d '' manifest; do
              install_manifest_candidate \
                "$manifest" \
                "$(basename "$(dirname "$manifest")")" \
                cache
            done < <(find "$CACHE_MANIFESTS" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print0)
          fi
          if [ -d "$CACHE_MANIFESTS" ]; then
            while IFS= read -r -d '' cached_graph_manifest; do
              CACHED_GRAPH_SHA="$(basename "$(dirname "$cached_graph_manifest")")"
              if ! [[ "$CACHED_GRAPH_SHA" =~ ^[0-9a-f]{64}$ ]] || \
                 [ "$(sha256sum "$cached_graph_manifest" | cut -d' ' -f1)" != "$CACHED_GRAPH_SHA" ]; then
                echo "[risk-outcome] BLOCKED: cached accepted-state manifest evidence is corrupt=$CACHED_GRAPH_SHA"
                exit 2
              fi
              CACHED_GRAPH_ORIGIN=""
              if [ -f "$CACHE_HEADS/$CACHED_GRAPH_SHA/manifest.json" ]; then
                CACHED_GRAPH_ORIGIN="$CACHE_HEADS/$CACHED_GRAPH_SHA/manifest.json"
              elif [ -f "$REMOTE_MANIFESTS/$CACHED_GRAPH_SHA/manifest.json" ]; then
                CACHED_GRAPH_ORIGIN="$REMOTE_MANIFESTS/$CACHED_GRAPH_SHA/manifest.json"
              fi
              if [ -z "$CACHED_GRAPH_ORIGIN" ] || \
                 ! cmp -s "$cached_graph_manifest" "$CACHED_GRAPH_ORIGIN"; then
                echo "[risk-outcome] BLOCKED: cached accepted-state manifest has no complete verified bundle or authoritative remote commit=$CACHED_GRAPH_SHA"
                exit 2
              fi
            done < <(find "$CACHE_MANIFESTS" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print0)
          fi
          if [ -d "$CACHE_ACCEPTANCE_MARKERS" ]; then
            while IFS= read -r -d '' cached_acceptance_marker; do
              CACHED_ACCEPTANCE_SHA="$(basename "$(dirname "$cached_acceptance_marker")")"
              if ! [[ "$CACHED_ACCEPTANCE_SHA" =~ ^[0-9a-f]{64}$ ]] || \
                 [ "$(sha256sum "$cached_acceptance_marker" | cut -d' ' -f1)" != "$CACHED_ACCEPTANCE_SHA" ] || \
                 [ ! -f "$COMBINED_MANIFESTS/$CACHED_ACCEPTANCE_SHA/manifest.json" ] || \
                 ! cmp -s \
                   "$cached_acceptance_marker" \
                   "$COMBINED_MANIFESTS/$CACHED_ACCEPTANCE_SHA/manifest.json"; then
                echo "[risk-outcome] BLOCKED: cached accepted-publication marker is absent from the complete verified cache/remote union=$CACHED_ACCEPTANCE_SHA"
                exit 2
              fi
            done < <(find "$CACHE_ACCEPTANCE_MARKERS" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print0)
          fi
          if ! find "$COMBINED_MANIFESTS" -mindepth 2 -maxdepth 2 -type f -name manifest.json -print -quit | grep -q .; then
            rm -rf \
              outputs/run287_risk_outcome_parent_accepted \
              outputs/run287_risk_outcome_accepted_head_manifests
            if [ "${GDRIVE_READY:-no}" != "yes" ] || \
               [ "$REMOTE_HEAD_DISCOVERY_CONFIRMED" != "yes" ]; then
              echo "[risk-outcome] BLOCKED: no accepted head is cached and authoritative Drive head discovery is unavailable"
              exit 2
            fi
            REMOTE_LEGACY_OUTCOME_STATE=PROVEN_ABSENT
            if grep -Fx "run287_risk_outcome_archive/" "$PAPER_ARCHIVE_DIRS" >/dev/null; then
              REMOTE_LEGACY_FILES="$RUNNER_TEMP/run287_remote_legacy_outcome_files.txt"
              if ! rclone lsf "${BASE}paper_archive/run287_risk_outcome_archive/" --recursive --files-only > "$REMOTE_LEGACY_FILES"; then
                echo "[risk-outcome] BLOCKED: authoritative legacy outcome archive could not be enumerated"
                exit 2
              fi
              if grep -Fx "summary.json" "$REMOTE_LEGACY_FILES" >/dev/null; then
                REMOTE_LEGACY_OUTCOME_STAGE="$RUNNER_TEMP/run287_remote_legacy_outcome_archive"
                rm -rf "$REMOTE_LEGACY_OUTCOME_STAGE"
                mkdir -p "$REMOTE_LEGACY_OUTCOME_STAGE"
                if ! rclone copy \
                  "${BASE}paper_archive/run287_risk_outcome_archive/" \
                  "$REMOTE_LEGACY_OUTCOME_STAGE/" \
                  --transfers 2 --checkers 4 --stats 30s --stats-one-line || \
                   ! rclone check \
                  "${BASE}paper_archive/run287_risk_outcome_archive/" \
                  "$REMOTE_LEGACY_OUTCOME_STAGE/" \
                  --checksum --one-way; then
                  echo "[risk-outcome] BLOCKED: authoritative legacy outcome archive could not be fetched exactly"
                  exit 2
                fi
                if [ ! -s "$REMOTE_LEGACY_OUTCOME_STAGE/summary.json" ]; then
                  echo "[risk-outcome] BLOCKED: authoritative legacy outcome summary is empty after exact fetch"
                  exit 2
                fi
                rm -rf outputs/run287_risk_outcome_archive
                cp -a "$REMOTE_LEGACY_OUTCOME_STAGE" outputs/run287_risk_outcome_archive
                REMOTE_LEGACY_OUTCOME_STATE=PRESENT_FETCHED
              elif [ -s "$REMOTE_LEGACY_FILES" ]; then
                echo "[risk-outcome] BLOCKED: authoritative legacy outcome archive is partial and has no summary commit marker"
                exit 2
              fi
            fi
            if [ -s outputs/run287_risk_outcome_archive/summary.json ]; then
              if [ "${ALLOW_QUARANTINED_LEGACY_OUTCOME_PARENT:-false}" != "true" ]; then
                echo "[risk-outcome] BLOCKED: legacy outcome parent requires explicit one-time workflow_dispatch authorization"
                exit 2
              fi
              echo "parent_mode=legacy_quarantine" >> "$GITHUB_OUTPUT"
              echo "[risk-outcome] authoritative absence confirmed; existing legacy prefix will be quarantined once"
            else
              if [ "$REMOTE_LEGACY_OUTCOME_STATE" != "PROVEN_ABSENT" ]; then
                echo "[risk-outcome] BLOCKED: outcome genesis requires proven absence of authoritative legacy state"
                exit 2
              fi
              if [ "${ALLOW_RISK_OUTCOME_GENESIS_BOOTSTRAP:-false}" != "true" ]; then
                echo "[risk-outcome] BLOCKED: outcome genesis requires explicit one-time workflow_dispatch authorization"
                exit 2
              fi
              echo "parent_mode=genesis" >> "$GITHUB_OUTPUT"
              echo "[risk-outcome] authoritative absence confirmed; use explicitly authorized true genesis"
            fi
            echo "accepted_manifest_sha256=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/manage_run287_risk_outcome_accepted_heads.py select \
            --heads-root "$COMBINED_MANIFESTS" \
            --output outputs/full_rebuild_logs/daily_run287_outcome_head_selection.json
          SELECTED_SHA="$(python -c 'import json; print(json.load(open("outputs/full_rebuild_logs/daily_run287_outcome_head_selection.json", encoding="utf-8"))["selected_accepted_manifest_sha256"])')"
          SELECTED_HEAD="$SELECTED_HEAD_ROOT/$SELECTED_SHA"
          mkdir -p "$SELECTED_HEAD_ROOT"
          if [ -d "$CACHE_HEADS/$SELECTED_SHA" ]; then
            cp -a "$CACHE_HEADS/$SELECTED_SHA" "$SELECTED_HEAD"
          elif [ "$REMOTE_HEADS_AVAILABLE" = "yes" ]; then
            mkdir -p "$SELECTED_HEAD"
            rclone copy \
              "$REMOTE_HEADS/$SELECTED_SHA/" \
              "$SELECTED_HEAD/" \
              --transfers 2 --checkers 4 --stats 30s --stats-one-line
          else
            echo "[risk-outcome] BLOCKED: selected accepted head bundle unavailable=$SELECTED_SHA"
            exit 2
          fi
          python tools/manage_run287_risk_outcome_accepted_heads.py verify \
            --head-dir "$SELECTED_HEAD" \
            --expected-manifest-sha256 "$SELECTED_SHA" \
            --output outputs/full_rebuild_logs/daily_run287_outcome_head_verification.json
          python tools/run287_paper_ledger_integrity.py \
            --state-dir outputs/daily_simulated_fill_ledger \
            --require-integrity \
            --output "$RUNNER_TEMP/run287_current_paper_integrity.json"
          python - \
            "$SELECTED_HEAD/manifest.json" \
            "$RUNNER_TEMP/run287_current_paper_integrity.json" \
            outputs/full_rebuild_logs/daily_run287_outcome_parent_paper_continuity.json <<'PY'
          import json
          import sys

          accepted = json.load(open(sys.argv[1], encoding="utf-8"))
          paper = json.load(open(sys.argv[2], encoding="utf-8"))
          accepted_paper = accepted["paper_snapshot"]
          accepted_hash = accepted_paper["snapshot_hash"]
          current_hash = paper["snapshot_hash"]
          current_ancestors = paper["ancestor_snapshot_hashes"]
          if (
              accepted_paper["genesis_identity_sha256"]
              != paper["genesis_identity_sha256"]
          ):
              raise SystemExit(
                  "accepted outcome head and current paper ledger have different genesis identities"
              )
          if accepted_hash == current_hash:
              relation = "SAME_SNAPSHOT"
              if (
                  accepted_paper["previous_snapshot_hash"]
                  != paper["previous_snapshot_hash"]
                  or accepted_paper["ancestor_snapshot_hashes"]
                  != current_ancestors
              ):
                  raise SystemExit(
                      "accepted outcome paper snapshot metadata differs from current paper snapshot"
                  )
          elif accepted_hash in current_ancestors:
              relation = "ACCEPTED_OUTCOME_PAPER_IS_ANCESTOR"
              index = current_ancestors.index(accepted_hash)
              if (
                  current_ancestors[index + 1 :]
                  != accepted_paper["ancestor_snapshot_hashes"]
              ):
                  raise SystemExit(
                      "accepted outcome paper ancestry does not preserve the current paper chain"
                  )
          else:
              raise SystemExit(
                  "accepted outcome head belongs to an unproven or divergent paper chain"
              )
          if accepted["as_of_date"] > paper["as_of_date"]:
              raise SystemExit(
                  "accepted outcome head is ahead of the current paper state"
              )
          result = {
              "schema_version": "run287-outcome-paper-continuity-v1",
              "status": "VERIFIED",
              "relation": relation,
              "accepted_manifest_sha256": sys.argv[1].split("/")[-2],
              "accepted_paper_snapshot_hash": accepted_hash,
              "current_paper_snapshot_hash": current_hash,
              "paper_genesis_identity_sha256":
                  paper["genesis_identity_sha256"],
              "review_only": True,
              "production_activation_allowed": False,
              "live_trading_enabled": False,
          }
          with open(sys.argv[3], "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          rm -rf \
            outputs/run287_risk_outcome_archive \
            outputs/run287_risk_outcome_parent_accepted \
            outputs/run287_risk_outcome_accepted_head_manifests
          cp -a "$SELECTED_HEAD/run287_risk_outcome_archive" outputs/run287_risk_outcome_archive
          mkdir -p outputs/run287_risk_outcome_parent_accepted
          cp "$SELECTED_HEAD/manifest.json" outputs/run287_risk_outcome_parent_accepted/manifest.json
          cp -a "$COMBINED_MANIFESTS" outputs/run287_risk_outcome_accepted_head_manifests
          echo "parent_mode=verified_accepted_head" >> "$GITHUB_OUTPUT"
          echo "accepted_manifest_sha256=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "[risk-outcome] restored verified immutable accepted head=$SELECTED_SHA"

      - name: Restore verified Run287 research-static archive
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        id: run287-research-static
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          ARCHIVE="run287_static_archive/run287_exact_static_archive_v1.zip"
          mkdir -p "$(dirname "$ARCHIVE")" outputs/run287_exact_static_restore
          if [ ! -s "$ARCHIVE" ] && [ "${GDRIVE_READY:-no}" = "yes" ] && command -v rclone >/dev/null 2>&1; then
            if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
              BASE="gdrive:"
            else
              BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
            fi
            timeout 8m rclone copyto \
              "${BASE}research_static/run287_exact_static_archive_v1.zip" \
              "$ARCHIVE" \
              --stats 30s --stats-one-line || true
          fi
          if [ ! -s "$ARCHIVE" ]; then
            echo "[run287-static] verified research archive unavailable; exact upstream will skip"
            echo "ready=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/restore_run287_exact_static_archive.py \
            --archive "$ARCHIVE" \
            --expected-archive-sha256 66ca4b6a6a61cb7e9a3a47e2f6d26aa42f30a9b96a25d07699c6cdeb8faf1d84 \
            --destination-root run287_research_static \
            --output outputs/run287_exact_static_restore/status.json
          echo "ready=yes" >> "$GITHUB_OUTPUT"

      - name: Save Run287 research-static archive cache
        if: steps.market.outputs.ready == 'yes' && steps.run287-research-static-cache.outputs.cache-hit != 'true' && steps.run287-research-static.outputs.ready == 'yes'
        uses: actions/cache/save@v4
        with:
          path: run287_static_archive/run287_exact_static_archive_v1.zip
          key: run287-research-static-${{ runner.os }}-66ca4b6a6a61cb7e-v1

      - name: Record completed market session gate
        if: steps.market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          mkdir -p outputs/daily_market_session_gate
          cp "$MARKET_SESSION_GATE_FILE" outputs/daily_market_session_gate/session.json

      - name: Refresh current price cache
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs
          PRICE_REFRESH_MANIFEST="cache_prices/replay_price_cache_manifest.json"
          PRICE_REFRESH_PRIOR_MANIFEST="outputs/full_rebuild_logs/daily_operating_price_cache_refresh_prior_manifest.json"
          PRICE_REFRESH_ATTEMPT="outputs/full_rebuild_logs/daily_operating_price_cache_refresh_attempt.json"
          rm -f "$PRICE_REFRESH_ATTEMPT" "$PRICE_REFRESH_PRIOR_MANIFEST"
          if [ -s "$PRICE_REFRESH_MANIFEST" ]; then
            cp "$PRICE_REFRESH_MANIFEST" "$PRICE_REFRESH_PRIOR_MANIFEST"
          fi
          BOOKS=()
          [ -s outputs/portfolio_latest.csv ] && BOOKS+=(outputs/portfolio_latest.csv)
          [ -s outputs/concentrated_portfolio_latest.csv ] && BOOKS+=(outputs/concentrated_portfolio_latest.csv)
          if [ "${#BOOKS[@]}" -eq 0 ]; then
            [ -s outputs/reports/main_monthly_weights.csv ] && BOOKS+=(outputs/reports/main_monthly_weights.csv)
            [ -s outputs/reports/concentrated_strategy_holdings.csv ] && BOOKS+=(outputs/reports/concentrated_strategy_holdings.csv)
          fi
          PRICE_REFRESH_EXIT=3
          PRICE_REFRESH_STATUS="failed_missing_books"
          if [ "${#BOOKS[@]}" -gt 0 ]; then
            printf '[daily-operating] price refresh books:\n' | tee outputs/full_rebuild_logs/daily_operating_price_cache_refresh.log
            printf '  %s\n' "${BOOKS[@]}" | tee -a outputs/full_rebuild_logs/daily_operating_price_cache_refresh.log
            set +e
            timeout 8m python tools/build_replay_price_cache.py \
              --books "${BOOKS[@]}" \
              --output-dir cache_prices \
              --required-tickers SPY QQQ SMH SOXX \
              --refresh-through-date "$LAST_NYSE_SESSION_DATE" \
              --refresh-stale-days 2 \
              --exact-operating-universe \
              --max-scored 0 \
              2>&1 | tee -a outputs/full_rebuild_logs/daily_operating_price_cache_refresh.log
            PRICE_REFRESH_EXIT=$?
            set -e
            if [ "$PRICE_REFRESH_EXIT" -eq 0 ]; then
              PRICE_REFRESH_STATUS="completed"
            else
              PRICE_REFRESH_STATUS="failed"
            fi
          else
            echo "[daily-operating] missing monthly books; exact-session price refresh blocked" | tee outputs/full_rebuild_logs/daily_operating_price_cache_refresh.log
          fi
          python tools/write_run287_price_refresh_attempt.py \
            --exit-code "$PRICE_REFRESH_EXIT" \
            --status "$PRICE_REFRESH_STATUS" \
            --phase initial_current_books \
            --output "$PRICE_REFRESH_ATTEMPT" \
            --manifest "$PRICE_REFRESH_MANIFEST" \
            --prior-manifest "$PRICE_REFRESH_PRIOR_MANIFEST" \
            --required-through-date "$LAST_NYSE_SESSION_DATE"
          if [ "$PRICE_REFRESH_EXIT" -ne 0 ]; then
            echo "[daily-operating] exact-session price refresh failed with exit ${PRICE_REFRESH_EXIT}" | tee -a outputs/full_rebuild_logs/daily_operating_price_cache_refresh.log
            exit "$PRICE_REFRESH_EXIT"
          fi

      - name: Build daily market snapshot
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs data_raw/free/market_snapshot data_pit/free/market_snapshot
          BOOKS=()
          [ -s outputs/portfolio_latest.csv ] && BOOKS+=(--book outputs/portfolio_latest.csv)
          [ -s outputs/concentrated_portfolio_latest.csv ] && BOOKS+=(--book outputs/concentrated_portfolio_latest.csv)
          [ -s outputs/reports/operating_main_target_book.csv ] && BOOKS+=(--book outputs/reports/operating_main_target_book.csv)
          [ -s outputs/reports/operating_concentrated_target_book.csv ] && BOOKS+=(--book outputs/reports/operating_concentrated_target_book.csv)
          timeout 10m python tools/build_daily_market_snapshot.py \
            --price-cache cache_prices \
            "${BOOKS[@]}" \
            --scored outputs/scored_latest.csv \
            --max-scored 250 \
            --required-tickers SPY QQQ SMH SOXX \
            --output-dir outputs/daily_market_snapshot \
            --data-lake-dir data_pit/free/market_snapshot \
            --info-cache data_raw/free/market_snapshot/yf_market_info_cache.csv \
            --refresh-info-days 14 \
            2>&1 | tee outputs/full_rebuild_logs/daily_market_snapshot.log || \
            echo "[daily-operating] daily market snapshot failed or timed out; freshness contract will warn" | tee -a outputs/full_rebuild_logs/daily_market_snapshot.log

      - name: Label restored-target revaluation input
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs outputs/sec_enriched_candidate_replay
          mkdir -p outputs/daily_operating_selection_refresh
          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd

          paths = [Path("outputs/portfolio_latest.csv"), Path("outputs/concentrated_portfolio_latest.csv")]
          frames = []
          for path in paths:
              if not path.exists() or path.stat().st_size == 0:
                  continue
              frame = pd.read_csv(path, low_memory=False)
              if frame.empty or "ticker" not in frame.columns:
                  continue
              frame["daily_candidate_source"] = str(path)
              frames.append(frame)
          if not frames:
              raise SystemExit(0)
          out = pd.concat(frames, ignore_index=True, sort=False)
          out["ticker"] = out["ticker"].astype(str).str.upper().str.strip()
          out = out[out["ticker"].ne("") & out["ticker"].ne("NAN")].copy()
          date_cols = [c for c in ["rebalance_date", "feature_date", "as_of_date", "last_trade_date"] if c in out.columns]
          if date_cols:
              parsed = pd.DataFrame({c: pd.to_datetime(out[c], errors="coerce") for c in date_cols})
              row_dates = parsed.max(axis=1)
          else:
              row_dates = pd.Series(pd.NaT, index=out.index)
          out["rebalance_date"] = pd.to_datetime(row_dates, errors="coerce").dt.strftime("%Y-%m-%d")
          out["selection_status"] = "RESTORED_TARGET_REVALUATION_ONLY"
          out["same_close_selector_recomputed"] = False
          out = out.drop_duplicates(subset=["rebalance_date", "ticker"], keep="last")
          output = Path("outputs/daily_operating_selection_refresh/restored_target_revaluation_candidate_book.csv")
          output.parent.mkdir(parents=True, exist_ok=True)
          out.to_csv(output, index=False)
          print(f"[daily-operating] restored target revaluation rows={len(out)} path={output}")
          PY
          CANDIDATE_BOOK="outputs/daily_operating_selection_refresh/restored_target_revaluation_candidate_book.csv"
          if [ -s "$CANDIDATE_BOOK" ]; then
            echo "[daily-operating] building SEC-enriched candidate replay from $CANDIDATE_BOOK" | tee outputs/full_rebuild_logs/daily_sec_enriched_candidate_replay.log
            timeout 8m python tools/run_sec_enriched_candidate_replay.py \
              --candidate-book "$CANDIDATE_BOOK" \
              --output-dir outputs/sec_enriched_candidate_replay \
              2>&1 | tee -a outputs/full_rebuild_logs/daily_sec_enriched_candidate_replay.log || \
              echo "[daily-operating] SEC-enriched candidate replay failed or timed out; continuing with restored artifacts if any" | tee -a outputs/full_rebuild_logs/daily_sec_enriched_candidate_replay.log
          elif [ -s outputs/sec_enriched_candidate_replay/candidate_replay_book_sec_enriched.csv ]; then
            echo "[daily-operating] using restored SEC-enriched candidate replay" | tee outputs/full_rebuild_logs/daily_sec_enriched_candidate_replay.log
          else
            echo "[daily-operating] missing candidate replay book; SEC-enriched candidate replay skipped" | tee outputs/full_rebuild_logs/daily_sec_enriched_candidate_replay.log
          fi

      - name: Build operating target books
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs
          timeout 3m python tools/build_operating_target_books.py \
            --latest-run outputs \
            --price-cache cache_prices \
            --output-dir outputs/reports \
            --require-current-latest-target \
            2>&1 | tee outputs/full_rebuild_logs/daily_operating_target_books.log || \
            echo "[daily-operating] operating target book build failed or timed out; freshness contract will block selection" | tee -a outputs/full_rebuild_logs/daily_operating_target_books.log

      - name: Ensure review-only forward paper bootstrap
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        run: |
          set -euo pipefail
          python tools/bootstrap_run287_daily_paper_accounts.py \
            --state-dir outputs/daily_simulated_fill_ledger \
            --price-cache cache_prices \
            --main-target outputs/reports/operating_main_target_book.csv \
            --concentrated-target outputs/reports/operating_concentrated_target_book.csv \
            --as-of-date "$LAST_NYSE_SESSION_DATE" \
            --expected-seed-date 2026-07-13 \
            --starting-capital 100000 \
            --cost-bps 25 \
            --max-fill-lag-days 7 \
            2>&1 | tee outputs/full_rebuild_logs/daily_paper_bootstrap.log

      - name: Complete exact close cache for final operating universe
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        run: |
          set -euo pipefail
          PRICE_REFRESH_MANIFEST="cache_prices/replay_price_cache_manifest.json"
          PRICE_REFRESH_PRIOR_MANIFEST="outputs/full_rebuild_logs/daily_operating_price_cache_refresh_prior_manifest.json"
          PRICE_REFRESH_ATTEMPT="outputs/full_rebuild_logs/daily_operating_price_cache_refresh_attempt.json"
          INITIAL_PRICE_REFRESH_ATTEMPT="outputs/full_rebuild_logs/daily_operating_initial_price_cache_refresh_attempt.json"
          rm -f "$INITIAL_PRICE_REFRESH_ATTEMPT"
          cp "$PRICE_REFRESH_ATTEMPT" "$INITIAL_PRICE_REFRESH_ATTEMPT"
          set +e
          timeout 8m python tools/build_replay_price_cache.py \
            --books \
              outputs/reports/operating_main_target_book.csv \
              outputs/reports/operating_concentrated_target_book.csv \
            --account outputs/daily_simulated_fill_ledger/bootstrap/main_account.json \
            --account outputs/daily_simulated_fill_ledger/bootstrap/concentrated_account.json \
            --state-dir outputs/daily_simulated_fill_ledger \
            --exact-operating-universe \
            --output-dir cache_prices \
            --required-tickers SPY QQQ SMH SOXX \
            --refresh-through-date "$LAST_NYSE_SESSION_DATE" \
            --refresh-stale-days -1 \
            --max-scored 0 \
            2>&1 | tee outputs/full_rebuild_logs/daily_operating_final_price_cache_refresh.log
          PRICE_REFRESH_EXIT=$?
          set -e
          if [ "$PRICE_REFRESH_EXIT" -eq 0 ]; then
            PRICE_REFRESH_STATUS="completed"
          else
            PRICE_REFRESH_STATUS="failed"
          fi
          python tools/write_run287_price_refresh_attempt.py \
            --exit-code "$PRICE_REFRESH_EXIT" \
            --status "$PRICE_REFRESH_STATUS" \
            --phase final_operating_universe \
            --output "$PRICE_REFRESH_ATTEMPT" \
            --manifest "$PRICE_REFRESH_MANIFEST" \
            --prior-manifest "$PRICE_REFRESH_PRIOR_MANIFEST" \
            --required-through-date "$LAST_NYSE_SESSION_DATE"
          if [ "$PRICE_REFRESH_EXIT" -ne 0 ]; then
            exit "$PRICE_REFRESH_EXIT"
          fi

      - name: Require exact completed-session close prices
        if: steps.market.outputs.ready == 'yes'
        env:
          CATCHUP_PRICE_CACHE: ${{ steps.catchup_price_evidence.outputs.price_cache }}
          CATCHUP_MAIN_TARGET: ${{ steps.catchup_target_evidence.outputs.main_target }}
          CATCHUP_CONCENTRATED_TARGET: ${{ steps.catchup_target_evidence.outputs.concentrated_target }}
          CATCHUP_TARGET_MANIFEST: ${{ steps.catchup_target_evidence.outputs.target_manifest }}
        run: |
          set -euo pipefail
          CLOSE_PRICE_CACHE="cache_prices"
          CLOSE_MAIN_TARGET="outputs/reports/operating_main_target_book.csv"
          CLOSE_CONCENTRATED_TARGET="outputs/reports/operating_concentrated_target_book.csv"
          if [ "${PAPER_CATCHUP_MODE:-no}" = "yes" ]; then
            CLOSE_PRICE_CACHE="${CATCHUP_PRICE_CACHE:?missing immutable catch-up price cache}"
            test -s "$CLOSE_PRICE_CACHE/manifest.json"
            if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
              CLOSE_MAIN_TARGET="${CATCHUP_MAIN_TARGET:?missing immutable catch-up main target}"
              CLOSE_CONCENTRATED_TARGET="${CATCHUP_CONCENTRATED_TARGET:?missing immutable catch-up concentrated target}"
              test -s "${CATCHUP_TARGET_MANIFEST:?missing immutable catch-up target manifest}"
            else
              CLOSE_MAIN_TARGET="outputs/daily_simulated_fill_ledger/main/effective_target_latest.csv"
              CLOSE_CONCENTRATED_TARGET="outputs/daily_simulated_fill_ledger/concentrated/effective_target_latest.csv"
            fi
            test -s "$CLOSE_MAIN_TARGET"
            test -s "$CLOSE_CONCENTRATED_TARGET"
          fi
          python tools/validate_daily_close_prices.py \
            --session-date "$LAST_NYSE_SESSION_DATE" \
            --price-cache "$CLOSE_PRICE_CACHE" \
            --target "$CLOSE_MAIN_TARGET" \
            --target "$CLOSE_CONCENTRATED_TARGET" \
            --account outputs/daily_simulated_fill_ledger/bootstrap/main_account.json \
            --account outputs/daily_simulated_fill_ledger/bootstrap/concentrated_account.json \
            --state-dir outputs/daily_simulated_fill_ledger \
            --required-ticker SPY \
            --required-ticker QQQ \
            --required-ticker SMH \
            --required-ticker SOXX \
            --output outputs/daily_market_session_gate/close_price_coverage.json \
            2>&1 | tee outputs/full_rebuild_logs/daily_close_price_coverage.log

      - name: Refresh daily macro snapshot
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs data_pit/macro data_raw/free/macro/daily_snapshot
          python tools/macro_daily_snapshot.py \
            --out-dir data_pit/macro \
            2>&1 | tee outputs/full_rebuild_logs/daily_macro_snapshot.log || true
          if [ -s data_pit/macro/latest.json ]; then
            cp data_pit/macro/latest.json data_raw/free/macro/daily_snapshot/latest.json
          fi

      - name: Validate freshness contract
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode != 'yes'
        env:
          STRICT_SELECTION: ${{ inputs.strict_selection }}
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${STRICT_SELECTION:-false}" != "true" ]; then
            echo "::error::daily target mutation is always fail-closed; strict_selection=false is not permitted"
            exit 2
          fi
          python tools/audit_data_readiness.py \
            --latest-run outputs \
            --price-cache cache_prices \
            --output-dir outputs/data_readiness \
            2>&1 | tee outputs/full_rebuild_logs/daily_operating_data_readiness.log || true
          python tools/run_data_freshness_contract.py \
            --latest-run outputs \
            --price-cache cache_prices \
            --output-dir outputs/data_freshness_contract \
            --asof-date "$LAST_NYSE_SESSION_DATE" \
            --require-current-operating-books \
            --strict-selection \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-commit-sha "${GITHUB_SHA}" \
            --source-branch "${GITHUB_REF_NAME}" \
            --source-artifact-name "daily-operating-selection-refresh-${GITHUB_RUN_ID}" \
            --source-context daily_operating_refresh \
            2>&1 | tee outputs/full_rebuild_logs/data_freshness_contract.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status_path = Path("outputs/data_freshness_contract/status.json")
          status = json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}
          core_coverage = status.get("core_candidate_coverage") or {}
          if (
              status.get("schema_version") != "data-freshness-contract-v1"
              or status.get("status") != "pass"
              or status.get("selection_allowed") is not True
              or status.get("blockers")
              or status.get("source_context") != "daily_operating_refresh"
              or status.get("freshness_contract_non_fatal") is not False
              or status.get("asof_date") != os.environ.get("LAST_NYSE_SESSION_DATE", "")
              or core_coverage.get("required_for_target_mutation") is not False
          ):
              raise SystemExit("fail-closed freshness mutation gate is not satisfied")
          session_path = Path("outputs/daily_market_session_gate/session.json")
          coverage_path = Path("outputs/daily_market_session_gate/close_price_coverage.json")
          session = json.loads(session_path.read_text(encoding="utf-8")) if session_path.exists() else {}
          coverage = json.loads(coverage_path.read_text(encoding="utf-8")) if coverage_path.exists() else {}
          completed_session_date = os.environ.get("LAST_NYSE_SESSION_DATE", "")
          exact_close_ready = bool(
              session.get("ready") is True
              and session.get("session_date") == completed_session_date
              and coverage.get("status") == "PASS"
              and coverage.get("exact_close_coverage") is True
              and coverage.get("session_date") == completed_session_date
              and int(coverage.get("missing_ticker_count", -1)) == 0
          )
          if not exact_close_ready:
              raise SystemExit("completed-session exact-close gate is not satisfied")
          summary = {
              "schema_version": "daily-operating-selection-refresh-v1",
              "daily_operating_refresh": True,
              "review_only": True,
              "canonical_production_sync": False,
              "live_trading_enabled": False,
              "production_mutation_allowed": False,
              "human_approval_required": True,
              "source_of_truth_level": "GITHUB_ARTIFACT",
              "source_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "source_commit_sha": os.environ.get("GITHUB_SHA", ""),
              "source_branch": os.environ.get("GITHUB_REF_NAME", ""),
              "source_artifact_name": f"daily-operating-selection-refresh-{os.environ.get('GITHUB_RUN_ID', '')}",
              "market_session_date": completed_session_date,
              "market_session_gate_status": session.get("status", "missing"),
              "exact_close_coverage": exact_close_ready,
              "close_price_coverage_status": coverage.get("status", "missing"),
              "selection_allowed": bool(status.get("selection_allowed", False)),
              "promotion_allowed": bool(status.get("promotion_allowed", False)),
              "selection_status": "RESTORED_TARGET_REVALUATION_ONLY",
              "same_close_selector_recomputed": False,
              "recommendation_status": status.get("recommendation_status", "DO_NOT_USE_REVIEW_REQUIRED"),
              "data_freshness_contract": "outputs/data_freshness_contract/status.json",
              "canonical_output_note": "This workflow syncs review artifacts under research_runs only; it does not update canonical production outputs.",
          }
          out = Path("outputs/daily_operating_selection_refresh")
          out.mkdir(parents=True, exist_ok=True)
          (out / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (out / "README.md").write_text(
              "# Daily Operating Selection Refresh\n\n"
              "- review_only: `true`\n"
              "- canonical_production_sync: `false`\n"
              "- live_trading_enabled: `false`\n"
              "- production_mutation_allowed: `false`\n"
              "- human_approval_required: `true`\n"
              "- source_of_truth_level: `GITHUB_ARTIFACT`\n",
              encoding="utf-8",
          )
          # P2 owns the final fail-closed selection decision.  Data freshness
          # is recorded here, but a restored target can never authorize a new
          # paper order or set same_close_selector_recomputed=true.
          PY

      - name: Reverify one-time scope attestation before local paper transaction
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_COMMENT_ID: ${{ inputs.catchup_secret_scope_attestation_comment_id }}
          EXPECTED_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_EVIDENCE_RUN_ID: ${{ inputs.catchup_price_evidence_run_id }}
          EXPECTED_EVIDENCE_ARTIFACT_DIGEST: ${{ inputs.catchup_price_evidence_artifact_digest }}
        run: |
          set -euo pipefail
          if ! [[ "${SCOPE_COMMENT_ID:-}" =~ ^[1-9][0-9]*$ ]] || \
             ! [[ "${RUN287_DURABLE_SCOPE_CONSUMPTION_COMMENT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "[run287-scope-attestation] BLOCKED: immutable comment ids are unavailable"
            exit 2
          fi
          OWNER_COMMENT="$RUNNER_TEMP/run287_durable_scope_attestation_comment_final.json"
          CONSUMPTION_COMMENT="$RUNNER_TEMP/run287_durable_scope_consumption_comment_final.json"
          RUN_EVIDENCE="$RUNNER_TEMP/run287_durable_scope_workflow_run_final.json"
          SCOPE_INITIAL="$RUNNER_TEMP/run287_durable_scope_initial.json"
          SCOPE_FINAL="$RUNNER_TEMP/run287_durable_scope_final.json"
          CONSUMPTION_RECORD="$RUNNER_TEMP/run287_durable_scope_consumption_record.json"
          CONSUMPTION_INITIAL="$RUNNER_TEMP/run287_durable_scope_consumption_initial.json"
          CONSUMPTION_FINAL="$RUNNER_TEMP/run287_durable_scope_consumption_final.json"
          verify_receipt_hash() {
            local path="$1"
            local expected="$2"
            local label="$3"
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || \
               [ "$(sha256sum "$path" | awk '{print $1}')" != "$expected" ]; then
              echo "[run287-scope-attestation] BLOCKED: $label receipt hash mismatch"
              exit 2
            fi
          }
          verify_receipt_hash \
            "$SCOPE_INITIAL" \
            "${RUN287_DURABLE_SCOPE_INITIAL_SHA256:-}" \
            "initial owner scope"
          verify_receipt_hash \
            "$CONSUMPTION_RECORD" \
            "${RUN287_DURABLE_SCOPE_CONSUMPTION_RECORD_SHA256:-}" \
            "consumption record"
          verify_receipt_hash \
            "$CONSUMPTION_INITIAL" \
            "${RUN287_DURABLE_SCOPE_CONSUMPTION_RECEIPT_SHA256:-}" \
            "initial consumption"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/comments/${SCOPE_COMMENT_ID}" \
            > "$OWNER_COMMENT"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/issues/comments/${RUN287_DURABLE_SCOPE_CONSUMPTION_COMMENT_ID}" \
            > "$CONSUMPTION_COMMENT"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "$RUN_EVIDENCE"
          python tools/verify_run287_catchup_scope_attestation.py \
            --comment "$OWNER_COMMENT" \
            --run "$RUN_EVIDENCE" \
            --event "$GITHUB_EVENT_PATH" \
            --prior-verification "$SCOPE_INITIAL" \
            --expected-comment-id "$SCOPE_COMMENT_ID" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-default-branch "$EXPECTED_DEFAULT_BRANCH" \
            --expected-default-branch-sha "$GITHUB_SHA" \
            --expected-session-date "$LAST_NYSE_SESSION_DATE" \
            --expected-evidence-run-id "$EXPECTED_EVIDENCE_RUN_ID" \
            --expected-evidence-artifact-digest "$EXPECTED_EVIDENCE_ARTIFACT_DIGEST" \
            --expected-workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-actor "$GITHUB_ACTOR" \
            --output "$SCOPE_FINAL" \
            --github-env "$GITHUB_ENV"
          python tools/run287_catchup_scope_consumption.py verify \
            --comment "$CONSUMPTION_COMMENT" \
            --expected-record "$CONSUMPTION_RECORD" \
            --verification "$SCOPE_INITIAL" \
            --run "$RUN_EVIDENCE" \
            --prior-receipt "$CONSUMPTION_INITIAL" \
            --output "$CONSUMPTION_FINAL" \
            --github-env "$GITHUB_ENV"
          SCOPE_PRE_TRANSACTION_SHA256="$(sha256sum "$SCOPE_FINAL" | awk '{print $1}')"
          CONSUMPTION_PRE_TRANSACTION_SHA256="$(sha256sum "$CONSUMPTION_FINAL" | awk '{print $1}')"
          echo "RUN287_DURABLE_SCOPE_PRE_TRANSACTION_SHA256=$SCOPE_PRE_TRANSACTION_SHA256" >> "$GITHUB_ENV"
          echo "RUN287_DURABLE_SCOPE_CONSUMPTION_PRE_TRANSACTION_SHA256=$CONSUMPTION_PRE_TRANSACTION_SHA256" >> "$GITHUB_ENV"

      - name: Enforce one-time durable scope before local paper transaction
        if: steps.market.outputs.ready == 'yes' && steps.market.outputs.catchup_mode == 'yes'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.RUN287_DURABLE_GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RUN287_DURABLE_RCLONE_CONFIG_GDRIVE }}
          RUN287_DURABLE_ENVIRONMENT_ATTESTATION: ${{ secrets.RUN287_DURABLE_ENVIRONMENT_ATTESTATION }}
        run: |
          set -euo pipefail
          python tools/check_run287_catchup_drive_readiness.py --phase mutation

      - name: Run transactional paper ledger and same-close selector
        id: paper_transaction
        if: steps.market.outputs.ready == 'yes'
        env:
          CATCHUP_PRICE_CACHE: ${{ steps.catchup_price_evidence.outputs.price_cache }}
          CATCHUP_PRICE_MANIFEST: ${{ steps.catchup_price_evidence.outputs.manifest }}
          CATCHUP_MAIN_TARGET: ${{ steps.catchup_target_evidence.outputs.main_target }}
          CATCHUP_CONCENTRATED_TARGET: ${{ steps.catchup_target_evidence.outputs.concentrated_target }}
          CATCHUP_TARGET_MANIFEST: ${{ steps.catchup_target_evidence.outputs.target_manifest }}
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs
          PAPER_AS_OF="$LAST_NYSE_SESSION_DATE"
          PAPER_PRICE_CACHE="cache_prices"
          PAPER_MAIN_TARGET="outputs/reports/operating_main_target_book.csv"
          PAPER_CONCENTRATED_TARGET="outputs/reports/operating_concentrated_target_book.csv"
          PAPER_REPLAY_ARGS=()
          if [ "${PAPER_CATCHUP_MODE:-no}" = "yes" ]; then
            DECISION_CUTOFF_UTC="$(python -c 'import os; import pandas as pd; print((pd.Timestamp(os.environ["LAST_NYSE_CLOSE_UTC"]) + pd.Timedelta(minutes=90)).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
            GENERATED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            PAPER_PRICE_CACHE="$CATCHUP_PRICE_CACHE"
            PAPER_REPLAY_ARGS=(
              --replay-only
              --price-evidence-manifest
              "$CATCHUP_PRICE_MANIFEST"
            )
            test -s "$PAPER_PRICE_CACHE/manifest.json"
            if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
              PAPER_MAIN_TARGET="${CATCHUP_MAIN_TARGET:?missing immutable catch-up main target}"
              PAPER_CONCENTRATED_TARGET="${CATCHUP_CONCENTRATED_TARGET:?missing immutable catch-up concentrated target}"
              test -s "${CATCHUP_TARGET_MANIFEST:?missing immutable catch-up target manifest}"
            else
              # The accepted effective targets live inside the directory that
              # the ledger replaces atomically. Preserve their exact input
              # bytes outside that directory so accepted-publication
              # provenance remains resolvable after the state swap.
              CATCHUP_TARGET_SOURCE_DIR="outputs/run287_catchup_target_source/${PAPER_AS_OF}"
              DURABLE_TARGET_SOURCE_DIR="outputs/daily_simulated_fill_ledger/replay_target_source/${PAPER_AS_OF}"
              PAPER_STATE_AS_OF="$(python -c 'import json; print(json.load(open("outputs/daily_simulated_fill_ledger/summary.json", encoding="utf-8"))["as_of_date"])')"
              mkdir -p "$CATCHUP_TARGET_SOURCE_DIR"
              rm -f \
                "$CATCHUP_TARGET_SOURCE_DIR/main.csv" \
                "$CATCHUP_TARGET_SOURCE_DIR/concentrated.csv"
              SOURCE_MAIN_TARGET="outputs/daily_simulated_fill_ledger/main/effective_target_latest.csv"
              SOURCE_CONCENTRATED_TARGET="outputs/daily_simulated_fill_ledger/concentrated/effective_target_latest.csv"
              if [ "$PAPER_STATE_AS_OF" = "$PAPER_AS_OF" ]; then
                # A retry of an already accepted session must reuse the exact
                # pre-transaction bytes retained inside the immutable ledger.
                # Reconstructing them from the post-transaction effective
                # target would change source_target_sha256.
                if [ -s "$DURABLE_TARGET_SOURCE_DIR/main.csv" ] && \
                   [ -s "$DURABLE_TARGET_SOURCE_DIR/concentrated.csv" ]; then
                  SOURCE_MAIN_TARGET="$DURABLE_TARGET_SOURCE_DIR/main.csv"
                  SOURCE_CONCENTRATED_TARGET="$DURABLE_TARGET_SOURCE_DIR/concentrated.csv"
                else
                  # Compatibility for immutable replay heads accepted before
                  # durable target-source retention existed. The effective
                  # target is a valid backfill only when its exact bytes equal
                  # the source hash already sealed in each ledger manifest.
                  python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("outputs/daily_simulated_fill_ledger")
          for portfolio in ("main", "concentrated"):
              source = root / portfolio / "effective_target_latest.csv"
              manifest = json.loads(
                  (root / portfolio / "manifest.json").read_text(
                      encoding="utf-8"
                  )
              )
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              expected = str(
                  manifest.get("source_target_sha256") or ""
              ).lower()
              if actual != expected:
                  raise SystemExit(
                      "pre-field replay target source backfill blocked:"
                      f"{portfolio}:effective/source hash mismatch"
                  )
          PY
                fi
              fi
              cp \
                "$SOURCE_MAIN_TARGET" \
                "$CATCHUP_TARGET_SOURCE_DIR/main.csv"
              cp \
                "$SOURCE_CONCENTRATED_TARGET" \
                "$CATCHUP_TARGET_SOURCE_DIR/concentrated.csv"
              cmp -s \
                "$SOURCE_MAIN_TARGET" \
                "$CATCHUP_TARGET_SOURCE_DIR/main.csv"
              cmp -s \
                "$SOURCE_CONCENTRATED_TARGET" \
                "$CATCHUP_TARGET_SOURCE_DIR/concentrated.csv"
              PAPER_MAIN_TARGET="$CATCHUP_TARGET_SOURCE_DIR/main.csv"
              PAPER_CONCENTRATED_TARGET="$CATCHUP_TARGET_SOURCE_DIR/concentrated.csv"
            fi
            test -s "$PAPER_MAIN_TARGET"
            test -s "$PAPER_CONCENTRATED_TARGET"
            rm -rf \
              outputs/daily_operating_selection_refresh \
              outputs/holding_risk_watch \
              outputs/run287_same_close_decision
          else
            DECISION_CUTOFF_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            GENERATED_AT_UTC="$DECISION_CUTOFF_UTC"
          fi
          export DECISION_CUTOFF_UTC
          export GENERATED_AT_UTC
          DATE_TOKEN="${PAPER_AS_OF//-/}"
          SAME_CLOSE_DIR="outputs/run287_same_close_decision/${DATE_TOKEN}"
          export SAME_CLOSE_DIR
          LEGACY_MIGRATION_ARGS=()
          if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
            LEGACY_MIGRATION_ARGS=(
              --legacy-migration-provenance
              outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
              --legacy-migration-expected-source-tree-sha256
              "$RUN287_LEGACY_V1_APPROVED_TREE_SHA256"
            )
          fi
          # First settle prior next-close orders and freeze the exact-close
          # account mark.  This pass is transaction-safe but may not create a
          # new preview or order from a restored target.
          python tools/run_daily_simulated_fill_ledger.py \
            --state-dir outputs/daily_simulated_fill_ledger \
            --price-cache "$PAPER_PRICE_CACHE" \
            --order-preview-root outputs/account_ledger_preview \
            --main-bootstrap-account outputs/daily_simulated_fill_ledger/bootstrap/main_account.json \
            --concentrated-bootstrap-account outputs/daily_simulated_fill_ledger/bootstrap/concentrated_account.json \
            --main-target "$PAPER_MAIN_TARGET" \
            --concentrated-target "$PAPER_CONCENTRATED_TARGET" \
            --as-of-date "$PAPER_AS_OF" \
            --decision-time-utc "$DECISION_CUTOFF_UTC" \
            --security-lifecycle-events data_static/run287_exact_packet/security_lifecycle_events.csv \
            --cost-bps 25 \
            --max-fill-lag-days 7 \
            --suppress-new-orders \
            "${PAPER_REPLAY_ARGS[@]}" \
            "${LEGACY_MIGRATION_ARGS[@]}" \
            2>&1 | tee outputs/full_rebuild_logs/daily_simulated_fill_ledger_mark_only.log
          if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
            # The ledger itself validates the remote-tree provenance and writes
            # the final attestation inside the same atomic, integrity-bound
            # paper snapshot.
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          state = Path("outputs/daily_simulated_fill_ledger")
          summary = json.loads((state / "summary.json").read_text(encoding="utf-8"))
          allowed_profiles = {
              "CURRENT_V2_SEMANTIC_REPLAY",
              "V1_ZERO_EVENT_SEMANTIC_REPLAY",
          }
          result_mode = (
              summary.get("result_status"),
              summary.get("legacy_snapshot_semantic_attestation_mode"),
          )
          if (
              result_mode
              not in {
                  ("LEGACY_ATTESTED", "SAME_SESSION_REUSE"),
                  (
                      "LEGACY_SCHEMA_UPGRADE",
                      "SAME_SESSION_SCHEMA_UPGRADE",
                  ),
                  ("RESTORED_CONTINUATION", "FORWARD_REPLAY"),
              }
              or summary.get("legacy_snapshot_semantically_validated") is not True
              or summary.get("legacy_schema_profile") not in allowed_profiles
              or summary.get("new_order_generation_suppressed") is not True
              or any(
                  row.get("new_order_generation_suppressed") is not True
                  or row.get("enqueued_this_run") != 0
                  or not isinstance(row.get("resolved_fills_this_run"), int)
                  or row.get("resolved_fills_this_run") < 0
                  or not isinstance(
                      row.get("resolved_rejections_this_run"), int
                  )
                  or row.get("resolved_rejections_this_run") < 0
                  for row in (summary.get("portfolios") or {}).values()
              )
          ):
              raise SystemExit("legacy Drive migration blocked: semantic attestation did not complete")
          manifest = state / "snapshot_integrity.json"
          if not manifest.is_file():
              raise SystemExit("legacy Drive migration blocked: semantic attestation wrote no integrity manifest")
          attestation_path = state / "legacy_migration_attestation.json"
          attestation = json.loads(attestation_path.read_text(encoding="utf-8"))
          attestation_sha256 = hashlib.sha256(attestation_path.read_bytes()).hexdigest()
          integrity = json.loads(manifest.read_text(encoding="utf-8"))
          if (
              attestation.get("status") != "SEMANTIC_ATTESTATION_VERIFIED"
              or attestation.get("accepted_for_use") is not True
              or attestation.get("semantic_attestation_result")
              != summary.get("result_status")
              or attestation.get("legacy_snapshot_semantic_attestation_mode")
              != summary.get("legacy_snapshot_semantic_attestation_mode")
              or attestation.get("legacy_snapshot_semantically_validated") is not True
              or attestation.get("legacy_schema_profile")
              != summary.get("legacy_schema_profile")
              or attestation.get("integrity_binding")
              != "INCLUDED_IN_PAPER_SNAPSHOT_INTEGRITY"
              or summary.get("legacy_migration_attestation_sha256")
              != attestation_sha256
              or (integrity.get("files") or {}).get(
                  "legacy_migration_attestation.json"
              )
              != attestation_sha256
          ):
              raise SystemExit("legacy Drive migration blocked: durable attestation binding failed")
          provenance_path = Path("outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          expected_tree = os.environ[
              "RUN287_LEGACY_V1_APPROVED_TREE_SHA256"
          ]
          if (
              provenance.get("status") != "PENDING_SEMANTIC_ATTESTATION"
              or provenance.get("legacy_schema_profile")
              != summary.get("legacy_schema_profile")
              or provenance.get("source")
              != "GITHUB_ACTIONS_ARTIFACT_TREE_SHA256_PIN"
              or provenance.get("verified_cross_source_anchor_present")
              is not True
              or provenance.get("expected_source_tree_sha256")
              != expected_tree
              or attestation.get("expected_source_tree_sha256")
              != expected_tree
          ):
              raise SystemExit("legacy Drive migration blocked: provenance state mismatch")
          if provenance.get("remote_tree_sha256") != attestation.get("remote_tree_sha256"):
              raise SystemExit("legacy Drive migration blocked: source-tree provenance mismatch")
          provenance = {
              **attestation,
