          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/run287_operating_scorecard/operating_scorecard.json")
          scorecard = json.loads(path.read_text(encoding="utf-8"))
          if scorecard.get("scorecard_trusted") is not True:
              raise SystemExit(
