          PY

      - name: Run transactional paper ledger and same-close selector
        id: paper_transaction
        if: steps.market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs
          PAPER_AS_OF="$LAST_NYSE_SESSION_DATE"
          RISK_AVAILABLE_FROM="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DATE_TOKEN="${PAPER_AS_OF//-/}"
          SAME_CLOSE_DIR="outputs/run287_same_close_decision/${DATE_TOKEN}"
          LEGACY_MIGRATION_ARGS=()
          if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
            LEGACY_MIGRATION_ARGS=(
              --legacy-migration-provenance
              outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
            )
          fi
          # First settle prior next-close orders and freeze the exact-close
          # account mark.  This pass is transaction-safe but may not create a
          # new preview or order from a restored target.
          python tools/run_daily_simulated_fill_ledger.py \
            --state-dir outputs/daily_simulated_fill_ledger \
            --price-cache cache_prices \
            --order-preview-root outputs/account_ledger_preview \
            --main-bootstrap-account outputs/daily_simulated_fill_ledger/bootstrap/main_account.json \
            --concentrated-bootstrap-account outputs/daily_simulated_fill_ledger/bootstrap/concentrated_account.json \
            --main-target outputs/reports/operating_main_target_book.csv \
            --concentrated-target outputs/reports/operating_concentrated_target_book.csv \
            --as-of-date "$PAPER_AS_OF" \
            --decision-time-utc "$RISK_AVAILABLE_FROM" \
            --security-lifecycle-events data_static/run287_exact_packet/security_lifecycle_events.csv \
            --cost-bps 25 \
            --max-fill-lag-days 7 \
            --suppress-new-orders \
            "${LEGACY_MIGRATION_ARGS[@]}" \
            2>&1 | tee outputs/full_rebuild_logs/daily_simulated_fill_ledger_mark_only.log
          if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
            # The ledger itself validates the remote-tree provenance and writes
            # the final attestation inside the same atomic, integrity-bound
            # paper snapshot.
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          state = Path("outputs/daily_simulated_fill_ledger")
          summary = json.loads((state / "summary.json").read_text(encoding="utf-8"))
          result_mode = (
              summary.get("result_status"),
              summary.get("legacy_snapshot_semantic_attestation_mode"),
          )
          if (
              result_mode
              not in {
                  ("LEGACY_ATTESTED", "SAME_SESSION_REUSE"),
                  ("RESTORED_CONTINUATION", "FORWARD_REPLAY"),
              }
              or summary.get("legacy_snapshot_semantically_validated") is not True
              or summary.get("new_order_generation_suppressed") is not True
              or any(
                  row.get("new_order_generation_suppressed") is not True
                  or row.get("enqueued_this_run") != 0
                  or not isinstance(row.get("resolved_fills_this_run"), int)
                  or row.get("resolved_fills_this_run") < 0
                  or not isinstance(
                      row.get("resolved_rejections_this_run"), int
                  )
                  or row.get("resolved_rejections_this_run") < 0
                  for row in (summary.get("portfolios") or {}).values()
              )
          ):
              raise SystemExit("legacy Drive migration blocked: semantic attestation did not complete")
          manifest = state / "snapshot_integrity.json"
          if not manifest.is_file():
              raise SystemExit("legacy Drive migration blocked: semantic attestation wrote no integrity manifest")
          attestation_path = state / "legacy_migration_attestation.json"
          attestation = json.loads(attestation_path.read_text(encoding="utf-8"))
          attestation_sha256 = hashlib.sha256(attestation_path.read_bytes()).hexdigest()
          integrity = json.loads(manifest.read_text(encoding="utf-8"))
          if (
              attestation.get("status") != "SEMANTIC_ATTESTATION_VERIFIED"
              or attestation.get("accepted_for_use") is not True
              or attestation.get("semantic_attestation_result")
              != summary.get("result_status")
              or attestation.get("legacy_snapshot_semantic_attestation_mode")
              != summary.get("legacy_snapshot_semantic_attestation_mode")
              or attestation.get("legacy_snapshot_semantically_validated") is not True
              or attestation.get("integrity_binding")
              != "INCLUDED_IN_PAPER_SNAPSHOT_INTEGRITY"
              or summary.get("legacy_migration_attestation_sha256")
              != attestation_sha256
              or (integrity.get("files") or {}).get(
                  "legacy_migration_attestation.json"
              )
              != attestation_sha256
          ):
              raise SystemExit("legacy Drive migration blocked: durable attestation binding failed")
          provenance_path = Path("outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json")
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          if provenance.get("status") != "PENDING_SEMANTIC_ATTESTATION":
              raise SystemExit("legacy Drive migration blocked: provenance state mismatch")
          if provenance.get("remote_tree_sha256") != attestation.get("remote_tree_sha256"):
              raise SystemExit("legacy Drive migration blocked: source-tree provenance mismatch")
          provenance = {
              **attestation,
              "verified_snapshot_integrity_sha256": hashlib.sha256(
                  manifest.read_bytes()
              ).hexdigest(),
          }
          provenance_path.write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          fi
          python tools/build_run287_holding_risk_watch.py \
            --main-account outputs/daily_simulated_fill_ledger/main/account_state_latest.json \
            --concentrated-account outputs/daily_simulated_fill_ledger/concentrated/account_state_latest.json \
            --price-cache cache_prices \
            --as-of-date "$PAPER_AS_OF" \
            --available-from "$RISK_AVAILABLE_FROM" \
            --output-dir outputs/holding_risk_watch \
            --require-exact-close \
            2>&1 | tee outputs/full_rebuild_logs/daily_holding_risk_watch.log
          export SEC_USER_AGENT="${SEC_USER_AGENT:-R1000QuantEngine research andrewcha231@gmail.com}"
          if python tools/run_run287_exact_packet_upstream.py \
            --valuation-date "$PAPER_AS_OF" \
            --decision-time-utc "$RISK_AVAILABLE_FROM" \
            --attempt-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --allow-network \
            2>&1 | tee outputs/full_rebuild_logs/daily_run287_exact_packet_upstream.log; then
            echo "[daily-operating] bounded exact-packet upstream completed or safely skipped"
          else
            echo "[daily-operating] bounded exact-packet upstream blocked; registry will fail closed"
          fi
          if python tools/build_run287_exact_packet_input_registry.py \
            --source-bundle outputs/run287_exact_packet_input_sources/source_bundle.json \
            --valuation-date "$PAPER_AS_OF" \
            --output-dir outputs/run287_exact_packet_input_registry \
            --allow-missing \
            2>&1 | tee outputs/full_rebuild_logs/daily_run287_exact_packet_input_registry.log; then
            echo "[daily-operating] exact packet input registry completed or safely skipped"
          else
            echo "[daily-operating] exact packet input registry blocked; producer will fail closed"
          fi
          if python tools/run_run287_exact_packet_producer.py \
            --input-registry outputs/run287_exact_packet_input_registry/registry.json \
            --valuation-date "$PAPER_AS_OF" \
            --holding-watch-summary outputs/holding_risk_watch/summary.json \
            --holding-watch-csv outputs/holding_risk_watch/holding_risk_watch.csv \
            --output-dir outputs/run287_exact_packet_producer \
            --packet-root outputs \
            --allow-missing \
            2>&1 | tee outputs/full_rebuild_logs/daily_run287_exact_packet_producer.log; then
            echo "[daily-operating] exact packet producer completed"
          else
            echo "[daily-operating] exact packet producer blocked; archive will fail closed or skip"
          fi
          SAME_CLOSE_READY=no
          if python tools/build_run287_same_close_target_books.py \
            --producer-status outputs/run287_exact_packet_producer/status.json \
            --valuation-date "$PAPER_AS_OF" \
            --output-dir "$SAME_CLOSE_DIR" \
            2>&1 | tee outputs/full_rebuild_logs/daily_run287_same_close_target_books.log; then
            SAME_CLOSE_READY=yes
            # A second same-session transaction is permitted only after the
            # suppressed mark and only when the target identity changed.  It
            # enqueues review-only orders eligible for the next NYSE close.
            python tools/run_daily_simulated_fill_ledger.py \
              --state-dir outputs/daily_simulated_fill_ledger \
              --price-cache cache_prices \
              --order-preview-root outputs/account_ledger_preview \
              --main-bootstrap-account outputs/daily_simulated_fill_ledger/bootstrap/main_account.json \
              --concentrated-bootstrap-account outputs/daily_simulated_fill_ledger/bootstrap/concentrated_account.json \
              --main-target "$SAME_CLOSE_DIR/same_close_main_target_book.csv" \
              --concentrated-target "$SAME_CLOSE_DIR/same_close_concentrated_target_book.csv" \
              --main-publish-target outputs/reports/operating_main_target_book.csv \
              --concentrated-publish-target outputs/reports/operating_concentrated_target_book.csv \
              --as-of-date "$PAPER_AS_OF" \
              --decision-time-utc "$RISK_AVAILABLE_FROM" \
              --security-lifecycle-events data_static/run287_exact_packet/security_lifecycle_events.csv \
              --cost-bps 25 \
              --max-fill-lag-days 7 \
              2>&1 | tee outputs/full_rebuild_logs/daily_simulated_fill_ledger.log
          else
            echo "[daily-operating] same-close selector blocked; prior fills/marks retained and zero new orders generated"
          fi
          export SAME_CLOSE_READY
          export SAME_CLOSE_DIR
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path("outputs/daily_operating_selection_refresh/summary.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8")) if summary_path.is_file() else {}
          status_path = Path(os.environ["SAME_CLOSE_DIR"]) / "status.json"
          status = json.loads(status_path.read_text(encoding="utf-8")) if status_path.is_file() else {}
          ready = os.environ.get("SAME_CLOSE_READY") == "yes" and status.get("status") == "READY_SAME_CLOSE_PAPER_TARGETS"
          summary.update(
              selection_status=status.get("status", "BLOCKED_SAME_CLOSE_SELECTOR"),
              same_close_selector_recomputed=bool(ready and status.get("same_close_selector_recomputed") is True),
              selector_decision_time_utc=status.get("selector_decision_time_utc"),
              target_effective_date=status.get("target_effective_date"),
              order_eligible_close_date=status.get("order_eligible_close_date"),
              same_close_decision_status=str(status_path),
              new_order_generation_allowed=bool(ready),
              live_trading_enabled=False,
              production_mutation_allowed=False,
          )
          summary_path.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Verify transactional forward paper snapshot
        id: paper_integrity
        if: steps.market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          python tools/run287_paper_ledger_integrity.py \
            --state-dir outputs/daily_simulated_fill_ledger \
            --require-integrity \
            --output outputs/full_rebuild_logs/daily_paper_snapshot_integrity.json
          echo "integrity_sha256=$(sha256sum outputs/daily_simulated_fill_ledger/snapshot_integrity.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Resolve append-only forward outcomes
        id: risk_outcomes
        if: steps.market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          PAPER_AS_OF="$LAST_NYSE_SESSION_DATE"
          DATE_TOKEN="${PAPER_AS_OF//-/}"
          ARCHIVE_ARGS=(
            --discover-root outputs/run287_exact_packet_discovery_disabled
            --allow-missing
            --valuation-date "$PAPER_AS_OF"
            --expected-contract-sha256 7cb0bd4a86493ae861f32338f13ff17fbf3997fc23657381d79005b750cfbdc2
            --output-dir outputs/run287_decision_observation_archive
          )
          if python -c 'import json; from pathlib import Path; p=Path("outputs/run287_exact_packet_producer/status.json"); x=json.loads(p.read_text()) if p.is_file() else {}; raise SystemExit(0 if x.get("exact_packet_ready") is True else 1)'; then
            ARCHIVE_ARGS+=(
              --selector-manifest "outputs/run287_current_selector_no_write_exact_close_${DATE_TOKEN}/manifest.json"
              --candidate-risk-summary "outputs/run287_candidate_risk_watch_exact_close_${DATE_TOKEN}/summary.json"
            )
          fi
          python tools/archive_run287_decision_observation.py "${ARCHIVE_ARGS[@]}" \
            2>&1 | tee outputs/full_rebuild_logs/daily_run287_decision_observation_archive.log
          RISK_OUTCOME_ARGS=(
            --decision-archive outputs/run287_decision_observation_archive
            --price-cache outputs/run287_risk_outcome_price_cache
            --output-dir outputs/run287_risk_outcome_archive
            --as-of-date "$PAPER_AS_OF"
          )
          python tools/resolve_run287_risk_outcomes.py "${RISK_OUTCOME_ARGS[@]}" \
            2>&1 | tee outputs/full_rebuild_logs/daily_run287_risk_outcomes.log
          if [ -s outputs/run287_risk_outcome_archive/price_universe.csv ]; then
            timeout 8m python tools/build_replay_price_cache.py \
              --books outputs/run287_risk_outcome_archive/price_universe.csv \
              --output-dir outputs/run287_risk_outcome_price_cache \
              --start 2026-07-13 \
              --required-tickers SPY \
              --refresh-stale-days 2 \
              --max-scored 0 \
              --max-tickers 150 \
              2>&1 | tee -a outputs/full_rebuild_logs/daily_run287_risk_outcomes.log
            python tools/resolve_run287_risk_outcomes.py "${RISK_OUTCOME_ARGS[@]}" \
              2>&1 | tee -a outputs/full_rebuild_logs/daily_run287_risk_outcomes.log
          fi
          test -s outputs/run287_risk_outcome_archive/summary.json
          echo "summary_sha256=$(sha256sum outputs/run287_risk_outcome_archive/summary.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if [ -s outputs/run287_risk_outcome_price_cache/replay_price_cache_manifest.json ]; then
            echo "price_cache_manifest_sha256=$(sha256sum outputs/run287_risk_outcome_price_cache/replay_price_cache_manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build runtime operating scorecard
        id: operating_scorecard
        if: steps.market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          rm -rf outputs/run287_operating_scorecard
          python tools/build_run287_operating_scorecard.py \
            --source-registry docs/run287_operating_scorecard_sources.json \
            --output-dir outputs/run287_operating_scorecard \
            2>&1 | tee outputs/full_rebuild_logs/daily_run287_operating_scorecard.log
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("outputs/run287_operating_scorecard/operating_scorecard.json")
          scorecard = json.loads(path.read_text(encoding="utf-8"))
          if scorecard.get("scorecard_trusted") is not True:
              raise SystemExit(
                  "runtime operating scorecard is not trusted: "
                  + ",".join(scorecard.get("scorecard_trust_blockers") or [])
              )
          PY
          echo "scorecard_sha256=$(sha256sum outputs/run287_operating_scorecard/operating_scorecard.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Evaluate single promotion and rollback gate
        id: promotion_gate
        if: steps.market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          rm -rf outputs/run287_promotion_gate
          PROMOTION_ANCHORS=(
            --expected-paper-integrity-sha256 "${{ steps.paper_integrity.outputs.integrity_sha256 }}"
            --expected-risk-outcome-summary-sha256 "${{ steps.risk_outcomes.outputs.summary_sha256 }}"
            --expected-scorecard-sha256 "${{ steps.operating_scorecard.outputs.scorecard_sha256 }}"
          )
          if [ -n "${{ steps.risk_outcomes.outputs.price_cache_manifest_sha256 }}" ]; then
            PROMOTION_ANCHORS+=(
              --expected-risk-price-cache-manifest-sha256 "${{ steps.risk_outcomes.outputs.price_cache_manifest_sha256 }}"
            )
          fi
          python tools/run_run287_promotion_gate.py \
            --contract data_static/run287_promotion_gate_contract.json \
            --state data_static/run287_promotion_state.json \
            --evidence data_static/run287_promotion_evidence_current.json \
            --latest-run outputs \
            --output-dir outputs/run287_promotion_gate \
            "${PROMOTION_ANCHORS[@]}" \
            2>&1 | tee outputs/full_rebuild_logs/daily_run287_promotion_gate.log
          test -s outputs/run287_promotion_gate/promotion_gate.json
          echo "promotion_gate_sha256=$(sha256sum outputs/run287_promotion_gate/promotion_gate.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build post-gate operating reports
        id: operating_review
        if: steps.market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          python tools/run_operating_snapshot.py --latest-run outputs --output-dir outputs/operating_snapshot 2>&1 | tee outputs/full_rebuild_logs/daily_operating_snapshot.log
          python tools/run_user_portfolio_reports.py --latest-run outputs --price-cache cache_prices --output-dir outputs/user_portfolio_reports 2>&1 | tee outputs/full_rebuild_logs/daily_user_portfolio_reports.log
          python tools/run_user_current_report.py --latest-run outputs --price-cache cache_prices --output-dir outputs/user_current --strict 2>&1 | tee outputs/full_rebuild_logs/daily_user_current_report.log
          mkdir -p outputs/user_current
          cat > outputs/user_current/DAILY_REVIEW_ONLY.md <<'EOF'
          # Daily Review-Only Current Output

          - daily_operating_refresh: `true`
          - review_only: `true`
          - canonical_production_sync: `false`
          - live_trading_enabled: `false`
          - production_mutation_allowed: `false`
          - human_approval_required: `true`
          - source_of_truth_level: `GITHUB_ARTIFACT`

          This directory was produced by `daily_operating_selection_refresh.yml`
          and is synced under `research_runs/`. It must not be treated as a
          canonical production output without a separate user-approved promotion.

          Required review-only user contract files:
          - `outputs/user_current/02_target_weights.csv`
          - `outputs/user_current/03_order_preview.csv`
          - `outputs/user_current/08_rebalance_decision.json`
          EOF
          python tools/build_daily_user_current_contract.py \
            --latest-run outputs \
            --output-dir outputs/user_current \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-commit-sha "${GITHUB_SHA}" \
            --source-branch "${GITHUB_REF_NAME}" \
            --source-artifact-name "daily-operating-selection-refresh-${GITHUB_RUN_ID}" \
            2>&1 | tee outputs/full_rebuild_logs/daily_user_current_contract.log

      - name: Verify accepted publication manifest
        id: accepted_publication
        if: steps.market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          rm -rf outputs/run287_accepted_publication
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --output outputs/run287_accepted_publication/manifest.json \
            --source-commit-sha "${GITHUB_SHA}" \
            --workflow-identity "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-promotion-gate-sha256 "${{ steps.promotion_gate.outputs.promotion_gate_sha256 }}" \
            2>&1 | tee outputs/full_rebuild_logs/daily_accepted_publication_manifest.log
          echo "manifest_sha256=$(sha256sum outputs/run287_accepted_publication/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload daily operating evidence artifact
        if: always() && steps.market.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: daily-operating-selection-refresh-${{ github.run_id }}
          path: |
            outputs/data_freshness_contract/
            outputs/daily_market_snapshot/
            outputs/daily_market_session_gate/
            outputs/daily_operating_selection_refresh/
            outputs/data_readiness/
            outputs/reports/operating_target_books_*
            outputs/holding_risk_watch/
            outputs/run287_exact_packet_upstream/
            outputs/run287_exact_packet_input_sources/
            outputs/run287_exact_packet_input_registry/
            outputs/run287_exact_packet_producer/
            outputs/run287_same_close_decision/*/status.json
            outputs/run287_current_selector_no_write_exact_close_*/
            outputs/run287_candidate_risk_watch_exact_close_*/
            outputs/run287_decision_observation_archive/
            outputs/run287_risk_outcome_archive/
            outputs/run287_risk_outcome_price_cache/replay_price_cache_manifest.json
            outputs/run287_operating_scorecard/
            outputs/run287_promotion_gate/
            outputs/run287_accepted_publication/
            outputs/sec_enriched_candidate_replay/
            outputs/portfolio_latest.csv
            outputs/concentrated_portfolio_latest.csv
            data_pit/macro/latest.json
            data_raw/free/macro/daily_snapshot/latest.json
            outputs/full_rebuild_logs/daily_*.log
            outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
            data_pit/free/market_snapshot/
            data_raw/free/market_snapshot/
            outputs/full_rebuild_logs/daily_user_current_contract.log
            outputs/full_rebuild_logs/daily_paper_bootstrap.log
            outputs/full_rebuild_logs/daily_simulated_fill_ledger_mark_only.log
            outputs/full_rebuild_logs/daily_holding_risk_watch.log
            outputs/full_rebuild_logs/daily_run287_exact_packet_upstream.log
            outputs/full_rebuild_logs/daily_run287_exact_packet_input_registry.log
            outputs/full_rebuild_logs/daily_run287_exact_packet_producer.log
            outputs/full_rebuild_logs/daily_run287_same_close_target_books.log
            outputs/full_rebuild_logs/daily_run287_decision_observation_archive.log
            outputs/full_rebuild_logs/daily_run287_risk_outcomes.log
            outputs/full_rebuild_logs/daily_run287_operating_scorecard.log
            outputs/full_rebuild_logs/daily_run287_promotion_gate.log
            outputs/full_rebuild_logs/daily_accepted_publication_manifest.log
            outputs/full_rebuild_logs/data_freshness_contract.log
            cache_prices/replay_price_cache_manifest.json
          retention-days: 45

      - name: Reverify accepted publication before GitHub publication
        id: accepted_publication_preflight
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success'
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"

      - name: Sync daily operating artifact to Google Drive
        if: always()
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[gdrive] not configured; skip daily operating sync"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-daily}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          DEST="${BASE}research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}/daily_operating_selection_refresh"
          for d in outputs/data_freshness_contract outputs/daily_market_snapshot outputs/daily_operating_selection_refresh outputs/data_readiness outputs/holding_risk_watch outputs/run287_exact_packet_upstream outputs/run287_exact_packet_input_sources outputs/run287_exact_packet_input_registry outputs/run287_exact_packet_producer outputs/run287_decision_observation_archive outputs/run287_risk_outcome_archive outputs/run287_operating_scorecard outputs/run287_promotion_gate outputs/sec_enriched_candidate_replay data_pit/free/market_snapshot data_raw/free/market_snapshot data_pit/macro data_raw/free/macro/daily_snapshot; do
            if [ -d "$d" ]; then
              rclone copy "$d" "$DEST/$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line || true
            fi
          done
          if [ -s cache_prices/replay_price_cache_manifest.json ]; then
            rclone copyto cache_prices/replay_price_cache_manifest.json "$DEST/cache_prices/replay_price_cache_manifest.json" || true
          fi

      - name: Persist validated forward paper ledger state
        id: paper_persist
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[gdrive] not configured; validated paper state remains in the GitHub cache/artifact"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          test -s outputs/daily_simulated_fill_ledger/summary.json
          test -s outputs/daily_simulated_fill_ledger/snapshot_integrity.json
          test -s outputs/holding_risk_watch/summary.json
          python tools/run287_paper_ledger_integrity.py \
            --state-dir outputs/daily_simulated_fill_ledger \
            --require-integrity
          RECOVERY="${BASE}paper_archive/recovery/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/run287_daily_simulated_fill_ledger"
          CANONICAL="${BASE}paper_archive/run287_daily_simulated_fill_ledger"
          HEADS="${BASE}paper_archive/run287_daily_simulated_fill_ledger_heads"
          PAPER_REMOTE_PERSIST_ANCHOR="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_persist_anchor"
          PAPER_REMOTE_CAS_CHECK="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_cas_check"
          PAPER_REMOTE_POSTCHECK="$RUNNER_TEMP/run287_daily_simulated_fill_ledger_postcheck"
          rm -rf "$PAPER_REMOTE_PERSIST_ANCHOR"
          mkdir -p "$PAPER_REMOTE_PERSIST_ANCHOR"
          rclone copy "$CANONICAL/" "$PAPER_REMOTE_PERSIST_ANCHOR/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          LOCAL_SNAPSHOT_HASH="$(python -c 'import json; print(json.load(open("outputs/daily_simulated_fill_ledger/snapshot_integrity.json", encoding="utf-8"))["snapshot_hash"])')"
          if ! [[ "$LOCAL_SNAPSHOT_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "[paper-ledger] BLOCKED: invalid local continuity hash"
            exit 2
          fi
          ANCHOR_SNAPSHOT_HASH=""
          assert_legacy_drive_source_matches() {
            local observed="$1"
            python - "$PAPER_REMOTE_PERSIST_ANCHOR" "$observed" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          def tree(root: Path) -> dict[str, str]:
              if (root / "snapshot_integrity.json").exists():
                  raise SystemExit("legacy Drive migration blocked: remote gained an unverified manifest")
              return {
                  path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.rglob("*")) if path.is_file()
              }

          anchor, observed = (Path(value) for value in sys.argv[1:])
          if tree(anchor) != tree(observed):
              raise SystemExit("legacy Drive migration blocked: Drive source changed during semantic attestation")
          PY
          }
          if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
            # A manifest-free source is not a continuity anchor.  It may be
            # replaced only after the in-job semantic attestation above and a
            # byte-for-byte compare against the original quarantined copy.
            assert_legacy_drive_source_matches "$RUNNER_TEMP/run287_daily_simulated_fill_ledger_remote"
            rclone copy "$PAPER_REMOTE_PERSIST_ANCHOR/" "$RECOVERY/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check "$PAPER_REMOTE_PERSIST_ANCHOR/" "$RECOVERY/" --checksum --one-way
          else
            test -s "$PAPER_REMOTE_PERSIST_ANCHOR/snapshot_integrity.json"
            python tools/run287_paper_ledger_integrity.py \
              --state-dir "$PAPER_REMOTE_PERSIST_ANCHOR" \
              --require-integrity
            python tools/run287_paper_ledger_integrity.py \
              --state-dir outputs/daily_simulated_fill_ledger \
              --require-integrity \
              --require-state-descends-from "$PAPER_REMOTE_PERSIST_ANCHOR"
            ANCHOR_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_PERSIST_ANCHOR/snapshot_integrity.json")"
            if ! [[ "$ANCHOR_SNAPSHOT_HASH" =~ ^[0-9a-f]{64}$ ]]; then
              echo "[paper-ledger] BLOCKED: invalid remote continuity hash"
              exit 2
            fi
            rclone copy outputs/daily_simulated_fill_ledger "$RECOVERY/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
            rclone check outputs/daily_simulated_fill_ledger "$RECOVERY/" --checksum --one-way
          fi
          rclone copy outputs/daily_simulated_fill_ledger "$HEADS/$LOCAL_SNAPSHOT_HASH/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          rclone check outputs/daily_simulated_fill_ledger "$HEADS/$LOCAL_SNAPSHOT_HASH/" --checksum
          rm -rf "$PAPER_REMOTE_CAS_CHECK"
          mkdir -p "$PAPER_REMOTE_CAS_CHECK"
          rclone copy "$CANONICAL/" "$PAPER_REMOTE_CAS_CHECK/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          if [ "${PAPER_LEGACY_MIGRATION_PENDING:-no}" = "yes" ]; then
            assert_legacy_drive_source_matches "$PAPER_REMOTE_CAS_CHECK"
          else
            python tools/run287_paper_ledger_integrity.py \
              --state-dir "$PAPER_REMOTE_CAS_CHECK" \
              --require-integrity
            CAS_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_CAS_CHECK/snapshot_integrity.json")"
            if [ "$CAS_SNAPSHOT_HASH" != "$ANCHOR_SNAPSHOT_HASH" ]; then
              echo "[paper-ledger] BLOCKED_CONTINUITY: canonical Drive head changed after preflight; immutable local head retained"
              exit 2
            fi
          fi
          rclone sync outputs/daily_simulated_fill_ledger "$CANONICAL/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          rclone check outputs/daily_simulated_fill_ledger "$CANONICAL/" --checksum
          rm -rf "$PAPER_REMOTE_POSTCHECK"
          mkdir -p "$PAPER_REMOTE_POSTCHECK"
          rclone copy "$CANONICAL/" "$PAPER_REMOTE_POSTCHECK/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          python tools/run287_paper_ledger_integrity.py \
            --state-dir "$PAPER_REMOTE_POSTCHECK" \
            --require-integrity
          POSTCHECK_SNAPSHOT_HASH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["snapshot_hash"])' "$PAPER_REMOTE_POSTCHECK/snapshot_integrity.json")"
          if [ "$POSTCHECK_SNAPSHOT_HASH" != "$LOCAL_SNAPSHOT_HASH" ]; then
            echo "[paper-ledger] BLOCKED_CONTINUITY: canonical Drive postcheck differs; immutable heads preserve both accepted states"
            exit 2
          fi
          if [ -n "$ANCHOR_SNAPSHOT_HASH" ] && [ "$LOCAL_SNAPSHOT_HASH" != "$ANCHOR_SNAPSHOT_HASH" ] && \
             rclone lsf "$HEADS/$ANCHOR_SNAPSHOT_HASH/" >/dev/null 2>&1; then
            rclone purge "$HEADS/$ANCHOR_SNAPSHOT_HASH"
          fi
          rclone copy outputs/holding_risk_watch "${BASE}paper_archive/run287_holding_risk_watch/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          if [ -s outputs/run287_decision_observation_archive/manifest.json ]; then
            rclone copy outputs/run287_decision_observation_archive "${BASE}paper_archive/run287_decision_observation_archive/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          if [ -s outputs/run287_risk_outcome_archive/summary.json ]; then
            rclone copy outputs/run287_risk_outcome_archive "${BASE}paper_archive/run287_risk_outcome_archive/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi
          if [ -d outputs/run287_risk_outcome_price_cache ]; then
            rclone copy outputs/run287_risk_outcome_price_cache "${BASE}paper_archive/run287_risk_outcome_price_cache/" --transfers 2 --checkers 4 --stats 30s --stats-one-line
          fi

      - name: Reverify accepted publication before refreshed cache
        id: accepted_refresh_preflight
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success'
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"

      - name: Upload accepted paper transaction artifact
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_transaction.outcome == 'success' && steps.paper_integrity.outcome == 'success' && steps.risk_outcomes.outcome == 'success' && steps.operating_scorecard.outcome == 'success' && steps.promotion_gate.outcome == 'success' && steps.operating_review.outcome == 'success' && steps.accepted_publication.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: accepted-paper-transaction-${{ github.run_id }}
          path: |
            outputs/reports/operating_*_target_book.csv
            outputs/operating_snapshot/
            outputs/user_current/
            outputs/user_portfolio_reports/
            outputs/account_ledger_preview/
            outputs/daily_simulated_fill_ledger/
            outputs/run287_same_close_decision/
            outputs/run287_decision_observation_archive/
            outputs/run287_risk_outcome_archive/
            outputs/run287_risk_outcome_price_cache/
            outputs/run287_operating_scorecard/
            outputs/run287_promotion_gate/
            outputs/run287_accepted_publication/
            outputs/full_rebuild_logs/daily_paper_snapshot_integrity.json
            outputs/full_rebuild_logs/daily_paper_legacy_drive_migration.json
          if-no-files-found: error
          retention-days: 45

      - name: Save validated forward paper state cache
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            outputs/daily_simulated_fill_ledger
            outputs/holding_risk_watch
            outputs/run287_exact_packet_upstream
            outputs/run287_exact_packet_input_sources
            outputs/run287_exact_packet_input_registry
            outputs/run287_decision_observation_archive
            outputs/run287_risk_outcome_archive
            outputs/run287_risk_outcome_price_cache
          key: daily-paper-ledger-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sync accepted paper transaction to Google Drive
        if: success() && steps.market.outputs.ready == 'yes' && steps.paper_transaction.outcome == 'success' && steps.paper_integrity.outcome == 'success' && steps.risk_outcomes.outcome == 'success' && steps.operating_scorecard.outcome == 'success' && steps.promotion_gate.outcome == 'success' && steps.operating_review.outcome == 'success' && steps.accepted_publication.outcome == 'success' && steps.paper_persist.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success'
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          python tools/build_run287_accepted_publication_manifest.py \
            --latest-run outputs \
            --verify-manifest outputs/run287_accepted_publication/manifest.json \
            --expected-manifest-sha256 "${{ steps.accepted_publication.outputs.manifest_sha256 }}"
          if [ "${GDRIVE_READY:-no}" != "yes" ] || ! command -v rclone >/dev/null 2>&1; then
            echo "[gdrive] not configured; accepted paper transaction remains in GitHub artifact/cache"
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          SAFE_BRANCH="$(printf '%s' "${GITHUB_REF_NAME:-daily}" | tr '/:@ ' '____' | tr -cd 'A-Za-z0-9._-')"
          DEST="${BASE}research_runs/${SAFE_BRANCH}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/accepted_paper_transaction"
          for d in outputs/operating_snapshot outputs/user_current outputs/user_portfolio_reports outputs/account_ledger_preview outputs/daily_simulated_fill_ledger outputs/run287_same_close_decision outputs/run287_decision_observation_archive outputs/run287_risk_outcome_archive outputs/run287_risk_outcome_price_cache outputs/run287_operating_scorecard outputs/run287_promotion_gate; do
            test -d "$d"
            rclone copy "$d" "$DEST/$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line
          done
          for f in outputs/reports/operating_main_target_book.csv outputs/reports/operating_concentrated_target_book.csv; do
            test -s "$f"
            rclone copyto "$f" "$DEST/$f"
          done
          # Publish the verified manifest last as the remote acceptance marker.
          test -s outputs/run287_accepted_publication/manifest.json
          rclone copy outputs/run287_accepted_publication "$DEST/outputs/run287_accepted_publication/" --transfers 2 --checkers 4 --stats 30s --stats-one-line

      - name: Save refreshed GitHub cache
        if: success() && steps.market.outputs.ready == 'yes' && steps.accepted_publication.outcome == 'success' && steps.accepted_refresh_preflight.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            cache_prices
            cache_macro
            models
            feature_store/scored_oos_latest.parquet
            data_raw/free
            data_pit/free
            data_pit/sec
            data_pit/etf_holdings
            data_pit/macro
            manifests/free_data
          key: daily-operating-selection-${{ runner.os }}-${{ github.run_id }}
