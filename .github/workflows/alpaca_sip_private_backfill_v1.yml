# A1 private historical research only: no broker or public original artifacts.
name: A1 Alpaca SIP Historical Private Backfill
on:
  pull_request:
    paths:
      - 'tools/alpaca_sip_private_backfill_v1.py'
      - 'tests/alpaca_sip_private_backfill_v1_smoke.py'
      - '.github/workflows/alpaca_sip_private_backfill_v1.yml'
      - 'data_static/iwb_holdings_seed.csv'
      - 'tools/twelve_private_capture.py'
      - 'tools/configure_macro_research_drive.py'
      - 'tools/macro_history_sources.py'
      - 'tests/api_credentials_check_smoke.py'
  workflow_dispatch:
    inputs:
      private_root_folder_id:
        description: Existing owner-only private research root Drive folder ID
        required: true
        type: string
      private_data_folder_id:
        description: Owner-only Alpaca subfolder directly beneath private root
        required: true
        type: string
      private_research_authorized:
        description: Approve private research collection only
        required: true
        type: boolean
        default: false
      noncommercial_terms_acknowledged:
        description: Confirm Alpaca terms for private noncommercial research
        required: true
        type: boolean
        default: false
      end_date:
        description: Exclusive end YYYY-MM-DD (historical, at least 15min old)
        required: true
        type: string
        default: '2026-10-10'
      max_new_symbols:
        description: New symbols per job (1-32; default 16)
        required: true
        type: number
        default: 16
      resume_file_id:
        description: Optional prior checkpoint ID
        type: string
        default: ''
      resume_sha256:
        description: Matching checkpoint SHA256
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: a1-private-research-single-writer
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data_static/iwb_holdings_seed.csv
            /tools/alpaca_sip_private_backfill_v1.py
            /tools/twelve_private_capture.py
            /tools/configure_macro_research_drive.py
            /tools/macro_history_sources.py
            /tests/alpaca_sip_private_backfill_v1_smoke.py
            /.github/workflows/alpaca_sip_private_backfill_v1.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline parser, request and privacy regression
        run: |
          python -m unittest discover -s tests -p alpaca_sip_private_backfill_v1_smoke.py -v
          python -O -m unittest discover -s tests -p alpaca_sip_private_backfill_v1_smoke.py -v
          python -m tools.alpaca_sip_private_backfill_v1 --help > /dev/null

  capture:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      MACRO_DRIVE_CONFIG: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
      A1_PRIVATE_RESEARCH_AUTHORIZED: ${{ inputs.private_research_authorized }}
      ALPACA_NONCOMMERCIAL_ACKNOWLEDGED: ${{ inputs.noncommercial_terms_acknowledged }}
      INPUT_PRIVATE_ROOT_FOLDER_ID: ${{ inputs.private_root_folder_id }}
      INPUT_PRIVATE_DATA_FOLDER_ID: ${{ inputs.private_data_folder_id }}
      INPUT_END_DATE: ${{ inputs.end_date }}
      INPUT_MAX_NEW_SYMBOLS: ${{ inputs.max_new_symbols }}
      INPUT_RESUME_FILE_ID: ${{ inputs.resume_file_id }}
      INPUT_RESUME_SHA256: ${{ inputs.resume_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data_static/iwb_holdings_seed.csv
            /tools/alpaca_sip_private_backfill_v1.py
            /tools/twelve_private_capture.py
            /tools/configure_macro_research_drive.py
            /tools/macro_history_sources.py
            /tests/alpaca_sip_private_backfill_v1_smoke.py
            /.github/workflows/alpaca_sip_private_backfill_v1.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded collector before data capture
        run: python -m unittest discover -s tests -p alpaca_sip_private_backfill_v1_smoke.py -v
      - name: Install reviewed rclone 1.75 transport
        env:
          MACRO_RCLONE_RELEASE: '1.75.0'
          MACRO_RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://downloads.rclone.org/v${MACRO_RCLONE_RELEASE}/rclone-v${MACRO_RCLONE_RELEASE}-linux-amd64.zip" \
            -o "$RUNNER_TEMP/alpaca-rclone.zip"
          printf '%s  %s\n' "$MACRO_RCLONE_SHA256" "$RUNNER_TEMP/alpaca-rclone.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/alpaca-rclone.zip" -d "$RUNNER_TEMP/rclone-bin"
          echo "MACRO_RCLONE_BIN=$RUNNER_TEMP/rclone-bin/rclone-v${MACRO_RCLONE_RELEASE}-linux-amd64/rclone" >> "$GITHUB_ENV"
      - name: Collect immutable owner-only Alpaca history
        run: |
          python -m tools.alpaca_sip_private_backfill_v1 \
            --private-root-folder-id "$INPUT_PRIVATE_ROOT_FOLDER_ID" \
            --private-data-folder-id "$INPUT_PRIVATE_DATA_FOLDER_ID" \
            --end "$INPUT_END_DATE" \
            --max-new-symbols "$INPUT_MAX_NEW_SYMBOLS" \
            --resume-file-id "$INPUT_RESUME_FILE_ID" \
            --resume-sha256 "$INPUT_RESUME_SHA256"
      # No raw provider bytes in logs, Actions artifacts or public GitHub.
