# A1 private historical research only: no broker or public original artifacts.
name: A1 Alpaca SIP Historical Private Backfill
run-name: a1-sip ${{ inputs.campaign_nonce || github.run_id }}${{ inputs.campaign_control && fromJSON(inputs.campaign_control).schema == 'a1-native-drive-read-39085031884-v1' && ' native-read39085031884' || '' }}${{ inputs.campaign_control && fromJSON(inputs.campaign_control).schema == 'a1-native-drive-read-39235028468-v1' && ' native-read39235028468' || '' }}
on:
  pull_request:
    paths:
      - 'tools/alpaca_sip_private_backfill_v1.py'
      - 'tools/alpaca_sip_campaign.py'
      - 'tests/alpaca_sip_campaign_smoke.py'
      - 'tests/alpaca_sip_private_backfill_v1_smoke.py'
      - '.github/workflows/alpaca_sip_private_backfill_v1.yml'
      - 'data_static/iwb_holdings_seed.csv'
      - 'tools/twelve_private_capture.py'
      - 'tools/configure_macro_research_drive.py'
      - 'tools/macro_history_sources.py'
      - 'tests/api_credentials_check_smoke.py'
  workflow_dispatch:
    inputs:
      private_root_folder_id:
        description: Existing owner-only private research root Drive folder ID
        required: true
        type: string
      private_data_folder_id:
        description: Owner-only Alpaca subfolder directly beneath private root
        required: true
        type: string
      private_research_authorized:
        description: Approve private research collection only
        required: true
        type: boolean
        default: false
      noncommercial_terms_acknowledged:
        description: Confirm Alpaca terms for private noncommercial research
        required: true
        type: boolean
        default: false
      end_date:
        description: Exclusive end YYYY-MM-DD (historical, at least 15min old)
        required: true
        type: string
        default: '2026-10-10'
      max_new_symbols:
        description: New symbols per job (1-32; default 16)
        required: true
        type: number
        default: 16
      resume_file_id:
        description: Optional prior checkpoint ID
        type: string
        default: ''
      resume_sha256:
        description: Matching checkpoint SHA256
        type: string
        default: ''
      campaign_control:
        description: Immutable authorized campaign control JSON; no credentials
        required: true
        type: string
      campaign_nonce:
        description: Single-use Work controller nonce
        required: true
        type: string
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: a1-private-research-single-writer
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data_static/iwb_holdings_seed.csv
            /tools/alpaca_sip_private_backfill_v1.py
            /tools/alpaca_sip_campaign.py
            /tools/alpaca_sip_source_revision.py
            /tests/alpaca_sip_campaign_smoke.py
            /tools/twelve_private_capture.py
            /tools/configure_macro_research_drive.py
            /tools/macro_history_sources.py
            /tests/alpaca_sip_private_backfill_v1_smoke.py
            /tests/api_credentials_check_smoke.py
            /.github/workflows/alpaca_sip_private_backfill_v1.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline parser, request and privacy regression
        run: |
          python -m unittest discover -s tests -p alpaca_sip_private_backfill_v1_smoke.py -v
          python -O -m unittest discover -s tests -p alpaca_sip_private_backfill_v1_smoke.py -v
          python -m tools.alpaca_sip_private_backfill_v1 --help > /dev/null

  capture:
    name: ${{ inputs.campaign_control && (fromJSON(inputs.campaign_control).schema == 'a1-native-drive-read-39085031884-v1' || fromJSON(inputs.campaign_control).schema == 'a1-native-drive-read-39235028468-v1') && 'reconcile' || 'capture' }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.campaign_control && (fromJSON(inputs.campaign_control).schema == 'a1-native-drive-read-39085031884-v1' || fromJSON(inputs.campaign_control).schema == 'a1-native-drive-read-39235028468-v1') && 5 || 120 }}
    env:
      A1_PRIVATE_RESEARCH_AUTHORIZED: ${{ inputs.private_research_authorized }}
      ALPACA_NONCOMMERCIAL_ACKNOWLEDGED: ${{ inputs.noncommercial_terms_acknowledged }}
      INPUT_PRIVATE_ROOT_FOLDER_ID: ${{ inputs.private_root_folder_id }}
      INPUT_PRIVATE_DATA_FOLDER_ID: ${{ inputs.private_data_folder_id }}
      INPUT_END_DATE: ${{ inputs.end_date }}
      INPUT_MAX_NEW_SYMBOLS: ${{ inputs.max_new_symbols }}
      INPUT_RESUME_FILE_ID: ${{ inputs.resume_file_id }}
      INPUT_RESUME_SHA256: ${{ inputs.resume_sha256 }}
      INPUT_CAMPAIGN_CONTROL: ${{ inputs.campaign_control }}
      INPUT_CAMPAIGN_NONCE: ${{ inputs.campaign_nonce }}
      INPUT_NATIVE_READ_ONLY: ${{ inputs.campaign_control && (fromJSON(inputs.campaign_control).schema == 'a1-native-drive-read-39085031884-v1' || fromJSON(inputs.campaign_control).schema == 'a1-native-drive-read-39235028468-v1') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data_static/iwb_holdings_seed.csv
            /tools/alpaca_sip_private_backfill_v1.py
            /tools/alpaca_sip_campaign.py
            /tools/alpaca_sip_source_revision.py
            /tests/alpaca_sip_campaign_smoke.py
            /tools/twelve_private_capture.py
            /tools/configure_macro_research_drive.py
            /tools/macro_history_sources.py
            /tests/alpaca_sip_private_backfill_v1_smoke.py
            /tests/api_credentials_check_smoke.py
            /.github/workflows/alpaca_sip_private_backfill_v1.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded collector before data capture
        run: python -m unittest discover -s tests -p alpaca_sip_private_backfill_v1_smoke.py -v
      - name: Prepare bounded control metadata before credentials
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.twelve_private_capture import decode, require
          from tools.alpaca_sip_campaign import atomic_json
          raw = os.environ['INPUT_CAMPAIGN_CONTROL'].encode()
          require(0 < len(raw) <= 16384, 'CAMPAIGN_CONTROL_SIZE')
          value = decode(raw)
          require(isinstance(value, dict) and ('schema' not in value or value['schema'] in (
              'a1-native-drive-read-39085031884-v1', 'a1-native-drive-read-39235028468-v1')),
              'CAMPAIGN_CONTROL_SCHEMA')
          atomic_json(Path(os.environ['RUNNER_TEMP']) / 'campaign_control.json', value)
          if os.environ['INPUT_NATIVE_READ_ONLY'] == 'true':
              from tools.alpaca_sip_campaign import native_read_route_control
              native_read_route_control(decode(raw))
          PY
      - name: Reconcile exact failed Drive POST with native metered reads
        if: env.INPUT_NATIVE_READ_ONLY == 'true'
        env:
          MACRO_DRIVE_CONFIG: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.alpaca_sip_campaign \
            --native-read-control "$RUNNER_TEMP/campaign_control.json" \
            --state-dir "$RUNNER_TEMP/native-read-state"
      - name: Preserve native read meter without original bytes or private IDs
        if: always() && env.INPUT_NATIVE_READ_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a1-native-drive-read-meter
          path: ${{ runner.temp }}/native-read-state/native_read_meter.json
          if-no-files-found: warn
          retention-days: 7
      - name: Collect immutable owner-only Alpaca history
        if: env.INPUT_NATIVE_READ_ONLY != 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          MACRO_DRIVE_CONFIG: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.alpaca_sip_private_backfill_v1 \
            --private-root-folder-id "$INPUT_PRIVATE_ROOT_FOLDER_ID" \
            --private-data-folder-id "$INPUT_PRIVATE_DATA_FOLDER_ID" \
            --end "$INPUT_END_DATE" \
            --max-new-symbols "$INPUT_MAX_NEW_SYMBOLS" \
            --resume-file-id "$INPUT_RESUME_FILE_ID" \
            --resume-sha256 "$INPUT_RESUME_SHA256" \
            --campaign-control-file "$RUNNER_TEMP/campaign_control.json"
      # Only typed counters/hash bindings, never provider bytes or private refs.
      - name: Preserve conservative meter even on failure
        if: always() && env.INPUT_NATIVE_READ_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a1-campaign-meter
          path: ${{ runner.temp }}/campaign_meter.json
          if-no-files-found: warn
          retention-days: 7
