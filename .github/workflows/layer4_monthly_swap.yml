name: Layer 4 Monthly Disabled Status

# RS-only swaps are retired. Scheduled runs publish only a disabled diagnostic.
# Legacy execute=true dispatches fail explicitly; no broker or history is touched.
on:
  schedule:
    - cron: '45 22 5 * *'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Retired action; true is rejected without execution'
        type: boolean
        default: false
      no_throttle:
        description: 'Retained for dispatch compatibility; no action is performed'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  layer4_swap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record disabled Layer 4 status
        env:
          EXECUTE_REQUESTED: ${{ inputs.execute || false }}
        run: |
          mkdir -p outputs/layer4_logs
          python - <<'PY_DIAGNOSTIC'
          import json, os
          from pathlib import Path
          requested = os.environ.get("EXECUTE_REQUESTED", "false").lower() == "true"
          payload = {
              "status": "BLOCKED" if requested else "DISABLED",
              "reason": "RS_ONLY_SWAP_DISABLED",
              "swap_suggestions": [],
              "execution_requested": requested,
              "execution_completed": False,
              "paper_ledger_mutated": False,
          }
          text = json.dumps(payload) + "\n"
          Path("outputs/layer4_logs/disabled.json").write_text(text)
          print(text, end="")
          raise SystemExit(2 if requested else 0)
          PY_DIAGNOSTIC
      - name: Upload disabled status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layer4-${{ github.run_id }}
          path: outputs/layer4_logs/disabled.json
          if-no-files-found: error
          retention-days: 90
