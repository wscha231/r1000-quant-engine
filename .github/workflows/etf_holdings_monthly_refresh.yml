name: ETF Holdings Monthly Refresh

on:
  workflow_dispatch:
    inputs:
      max_holdings:
        description: 'Top holdings per ETF'
        type: string
        default: '25'
      sleep_seconds:
        description: 'Sleep between ETF requests'
        type: string
        default: '0.25'
  schedule:
    # 08:55 KST on the first calendar day of each month.
    - cron: '55 23 1 * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: etf-holdings-monthly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  etf_holdings_monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore ETF cache
        uses: actions/cache@v4
        with:
          path: |
            data_raw/etf_holdings
            data_pit/etf_holdings
          key: etf-holdings-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            etf-holdings-${{ runner.os }}-

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore ETF data lake from Google Drive
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          for d in data_pit/etf_holdings outputs/etf_thematic_signals; do
            mkdir -p "$d"
            if rclone lsf "$BASE$d" >/dev/null 2>&1; then
              rclone copy "$BASE$d" "$d/"
            fi
          done

      - name: Refresh ETF holdings
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs
          python tools/run_etf_holdings_refresh.py \
            --max-holdings "${{ github.event.inputs.max_holdings || '25' }}" \
            --sleep "${{ github.event.inputs.sleep_seconds || '0.25' }}" \
            2>&1 | tee outputs/full_rebuild_logs/etf_holdings_refresh.log

      - name: Upload ETF holdings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-holdings-monthly-${{ github.run_id }}
          path: |
            data_pit/etf_holdings/
            outputs/etf_thematic_signals/
            outputs/full_rebuild_logs/etf_holdings_refresh.log
          retention-days: 30

      - name: Sync ETF holdings data lake to Google Drive
        if: always()
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          for d in data_pit/etf_holdings outputs/etf_thematic_signals; do
            if [ -d "$d" ]; then
              rclone copy "$d" "$BASE$d" --transfers 4 --checkers 8 --stats 30s --stats-one-line
            fi
          done
