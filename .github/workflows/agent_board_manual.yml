name: Agent Board (Manual)

# Artifact-only coordination layer for the multi-agent loop. It can inspect a
# downloaded full-rebuild artifact or the repository's latest committed/cloud
# result path, then uploads an Agent Board task queue and manual Pro packets.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional completed run id to download before building the board'
        type: string
        required: false
      latest_run:
        description: 'Artifact directory to inspect when source_run_id is empty'
        type: string
        default: 'cloud_results/full_rebuild/latest_global_alpha_universe'
      run_url:
        description: 'Optional GitHub Actions run URL to include in packets'
        type: string
        required: false
      bounded_research_intake:
        description: 'Optional offline A8 intake under latest_run; empty keeps the research adapter disabled'
        type: string
        required: false
        default: ''
      canonical_inputs:
        description: 'Optional separately refreshed canonical A0 intake path'
        type: string
        required: false
        default: ''
      evidence_root:
        description: 'Optional read-only materialization root for canonical A0 evidence'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read

jobs:
  agent_board:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Build Agent Board
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '' }}
          LATEST_RUN_INPUT: ${{ github.event.inputs.latest_run || 'cloud_results/full_rebuild/latest_global_alpha_universe' }}
          RUN_URL_INPUT: ${{ github.event.inputs.run_url || '' }}
          BOUNDED_RESEARCH_INTAKE: ${{ github.event.inputs.bounded_research_intake || '' }}
          CANONICAL_INPUTS: ${{ github.event.inputs.canonical_inputs || '' }}
          EVIDENCE_ROOT: ${{ github.event.inputs.evidence_root || '' }}
        run: |
          set -e
          mkdir -p outputs/full_rebuild_logs
          LATEST_RUN="$LATEST_RUN_INPUT"
          RUN_URL="$RUN_URL_INPUT"
          if [ -n "$SOURCE_RUN_ID" ]; then
            mkdir -p source_artifacts
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir source_artifacts
            SRC="$(find source_artifacts -type f \( -name official_metrics.json -o -name metrics.json -o -name backtest_metrics.json \) -print -quit | xargs -r dirname)"
            if [ -n "$SRC" ]; then
              case "$SRC" in
                */account_evaluation) LATEST_RUN="$(dirname "$SRC")" ;;
                */main|*/concentrated) LATEST_RUN="$(dirname "$(dirname "$SRC")")" ;;
                *) LATEST_RUN="$SRC" ;;
              esac
            fi
            if [ -z "$RUN_URL" ]; then
              RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
            fi
          fi
          echo "[agent-board] latest_run=$LATEST_RUN"
          RESEARCH_ARGS=()
          if [ -n "$BOUNDED_RESEARCH_INTAKE" ]; then
            set -o pipefail
            RESEARCH_ARGS=(--bounded-research-intake "$BOUNDED_RESEARCH_INTAKE")
          fi
          if [ -n "$CANONICAL_INPUTS" ]; then
            RESEARCH_ARGS+=(--canonical-inputs "$CANONICAL_INPUTS")
          fi
          if [ -n "$EVIDENCE_ROOT" ]; then
            RESEARCH_ARGS+=(--evidence-root "$EVIDENCE_ROOT")
          fi
          python tools/run_agent_board.py --latest-run "$LATEST_RUN" --output-dir outputs/agent_board --run-url "$RUN_URL" "${RESEARCH_ARGS[@]}" 2>&1 | tee outputs/full_rebuild_logs/agent_board.log

      - name: Upload Agent Board artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-board-${{ github.run_id }}
          path: |
            outputs/agent_board/
            outputs/full_rebuild_logs/agent_board.log
          retention-days: 14
