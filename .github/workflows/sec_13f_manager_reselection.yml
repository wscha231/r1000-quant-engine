name: SEC 13F Manager Reselection

on:
  workflow_dispatch:
    inputs:
      min_observations:
        description: 'Minimum repo manager-alpha observations before include/review recommendations'
        type: string
        default: '10'
      max_managers:
        description: 'Max reselection candidates to emit'
        type: string
        default: '40'
      review_interval_days:
        description: 'Next review interval in days'
        type: string
        default: '183'
  schedule:
    # Semiannual review after the May and November 13F filing windows.
    # Runs at 14:00 KST on June 5 and December 5.
    - cron: '0 5 5 6,12 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: sec-13f-manager-reselection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sec_13f_manager_reselection:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[gdrive] no auth configured; continuing without Drive restore/sync"
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore SEC evidence from Google Drive
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          for d in data_pit/sec outputs/sec_evidence_signal_audit outputs/sec_institutional_signals; do
            mkdir -p "$d"
            if rclone lsf "$BASE$d" >/dev/null 2>&1; then
              rclone copy "$BASE$d" "$d/"
            fi
          done

      - name: Build manager reselection candidates
        env:
          MIN_OBSERVATIONS: ${{ github.event.inputs.min_observations || '10' }}
          MAX_MANAGERS: ${{ github.event.inputs.max_managers || '40' }}
          REVIEW_INTERVAL_DAYS: ${{ github.event.inputs.review_interval_days || '183' }}
        run: |
          set -euo pipefail
          mkdir -p outputs/sec_institutional_signals outputs/full_rebuild_logs research/sec_13f_manager_universe_20260519
          python tools/run_sec_13f_manager_reselection.py \
            --manager-universe research/sec_13f_manager_universe_20260519/managers.csv \
            --manager-alpha outputs/sec_evidence_signal_audit/13f_manager_alpha.csv \
            --holdings data_pit/sec/institutional_13f_holdings.parquet \
            --output-dir outputs/sec_institutional_signals \
            --output-candidate-universe research/sec_13f_manager_universe_20260519/managers_candidate.csv \
            --min-observations "$MIN_OBSERVATIONS" \
            --max-managers "$MAX_MANAGERS" \
            --review-interval-days "$REVIEW_INTERVAL_DAYS" \
            2>&1 | tee outputs/full_rebuild_logs/sec_13f_manager_reselection.log

      - name: Upload manager reselection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-13f-manager-reselection-${{ github.run_id }}
          path: |
            outputs/sec_institutional_signals/manager_reselection_*
            research/sec_13f_manager_universe_20260519/managers_candidate.csv
            outputs/full_rebuild_logs/sec_13f_manager_reselection.log
          retention-days: 30

      - name: Sync manager reselection to Google Drive
        if: always()
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          if [ -d outputs/sec_institutional_signals ]; then
            timeout 8m rclone copy outputs/sec_institutional_signals "$BASEoutputs/sec_institutional_signals/" --transfers 4 --checkers 8 || true
          fi
          if [ -f research/sec_13f_manager_universe_20260519/managers_candidate.csv ]; then
            timeout 8m rclone copy research/sec_13f_manager_universe_20260519 "$BASEresearch/sec_13f_manager_universe_20260519/" --include managers_candidate.csv || true
          fi
