name: Run287 Risk Outcome Legacy Migration

on:
  workflow_dispatch:
    inputs:
      expected_master_sha:
        description: 'Exact reviewed remote master SHA to inspect'
        required: true
        type: string
      session_date:
        description: 'Exact latest completed NYSE session (YYYY-MM-DD)'
        required: true
        type: string

      allow_quarantined_legacy_outcome_parent:
        description: 'Separate user approval for one quarantined parent only'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Every authorized paper/outcome publisher must hold this same lock.
  group: daily-operating-selection-refresh
  cancel-in-progress: false

jobs:
  migration:
    environment: run287-paper-durable
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RCLONE_VERSION: 1.75.0
      RCLONE_ZIP_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa

    steps:
      - name: Checkout exact dispatch ref without credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact current master before secrets
        env:
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
          ALLOW_LEGACY: ${{ inputs.allow_quarantined_legacy_outcome_parent }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            echo "[recovery-preflight] BLOCKED: workflow_dispatch is required"
            exit 2
          fi
          if ! [[ "${EXPECTED_MASTER_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "[recovery-preflight] BLOCKED: expected master SHA is invalid"
            exit 2
          fi
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ] || \
             [ "${GITHUB_REF_NAME:-}" != "${DEFAULT_BRANCH:-}" ] || \
             [ "${GITHUB_SHA:-}" != "$EXPECTED_MASTER_SHA" ]; then
            echo "[recovery-preflight] BLOCKED: dispatch ref is not the exact requested default-branch head"
            exit 2
          fi
          test "$DEFAULT_BRANCH" = master
          test "$ALLOW_LEGACY" = true
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}" > "$RUNNER_TEMP/run287_repository.json"
          python -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["default_branch"] == "master" else 2)' \
            "$RUNNER_TEMP/run287_repository.json"
          REMOTE_REF="$RUNNER_TEMP/run287_remote_default_ref.json"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" \
            > "$REMOTE_REF"
          python - "$REMOTE_REF" "$EXPECTED_MASTER_SHA" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          observed = str((payload.get("object") or {}).get("sha") or "")
          if observed != sys.argv[2]:
              raise SystemExit(
                  "remote default branch moved before read-only preflight:"
                  f" expected={sys.argv[2]} observed={observed}"
              )
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_MASTER_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Prove exact latest completed NYSE session
        id: market
        env:
          REQUESTED_SESSION_DATE: ${{ inputs.session_date }}
        run: |
          set -euo pipefail
          mkdir -p outputs/run287_risk_outcome_legacy_migration
          python tools/run_daily_market_session_gate.py \
            --force \
            --session-date "$REQUESTED_SESSION_DATE" \
            --output outputs/run287_risk_outcome_legacy_migration/market_session_gate.json
          python - \
            outputs/run287_risk_outcome_legacy_migration/market_session_gate.json \
            "$REQUESTED_SESSION_DATE" <<'PY'
          import json
          import sys

          gate = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          if (
              gate.get("ready") is not True
              or gate.get("session_date") != expected
              or gate.get("latest_completed_session_date") != expected
              or gate.get("calendar") != "NYSE"
          ):
              raise SystemExit(
                  "requested session is not the exact latest completed NYSE session"
              )
          PY

      - name: Configure existing durable Drive environment
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.RUN287_DURABLE_GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RUN287_DURABLE_RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && \
             [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[recovery-preflight] BLOCKED: durable Drive read credential is unavailable"
            exit 2
          fi
          RCLONE_INSTALL="$RUNNER_TEMP/run287-rclone"
          RCLONE_ZIP="$RUNNER_TEMP/run287-rclone.zip"
          RCLONE_CONFIG_PATH="$RUNNER_TEMP/run287-rclone.conf"
          SERVICE_ACCOUNT_PATH="$RUNNER_TEMP/run287-service-account.json"
          RCLONE_BIN="$RCLONE_INSTALL/rclone-v${RCLONE_VERSION}-linux-amd64/rclone"
          export RCLONE_BIN
          export RCLONE_CONFIG="$RCLONE_CONFIG_PATH"
          export RUN287_SERVICE_ACCOUNT_PATH="$SERVICE_ACCOUNT_PATH"
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive
          {
            echo "RCLONE_BIN=$RCLONE_BIN"
            echo "RCLONE_CONFIG=$RCLONE_CONFIG_PATH"
            echo "RUN287_SERVICE_ACCOUNT_PATH=$SERVICE_ACCOUNT_PATH"
            echo "RCLONE_CONFIG_GDRIVE_SCOPE=drive"
          } >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip" \
            --output "$RCLONE_ZIP"
          printf '%s  %s\n' "$RCLONE_ZIP_SHA256" "$RCLONE_ZIP" \
            | sha256sum --check --strict
          mkdir -p "$RCLONE_INSTALL"
          unzip -q "$RCLONE_ZIP" -d "$RCLONE_INSTALL"
          test -x "$RCLONE_BIN"
          "$RCLONE_BIN" version | grep -Fx "rclone v${RCLONE_VERSION}"
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            printf '%s' "$RCLONE_CONFIG_GDRIVE" > "$RCLONE_CONFIG_PATH"
            grep -Eq '^\[gdrive\][[:space:]]*$' "$RCLONE_CONFIG_PATH"
          else
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > "$SERVICE_ACCOUNT_PATH"
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive'
              printf 'service_account_file = %s\n' "$SERVICE_ACCOUNT_PATH"
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              else
                printf '%s\n' 'shared_with_me = true'
              fi
            } > "$RCLONE_CONFIG_PATH"
          fi
          chmod 600 "$RCLONE_CONFIG_PATH"
          "$RCLONE_BIN" lsd gdrive: >/dev/null


      - name: Restore reverify and migrate only the quarantined root
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
          REQUESTED_SESSION_DATE: ${{ inputs.session_date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Stable absolute evidence paths permit exact receipt verification on reruns.
          ROOT=/tmp/run287-risk-outcome-legacy-migration
          test ! -e "$ROOT"
          mkdir -p "$ROOT" "$ROOT/accepted"
          BASE="gdrive:r1000_top30_institutional/"
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then BASE="gdrive:"; fi
          ARCHIVE="${BASE}paper_archive"
          ACCEPTED="$ARCHIVE/run287_risk_outcome_accepted_heads"
          BUILDER=tools/build_run287_risk_outcome_legacy_migration.py
          assert_master() {
            test "$(git rev-parse HEAD)" = "$EXPECTED_MASTER_SHA"
            curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}" > "$ROOT/repository.json"
            python -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["default_branch"] == "master" else 2)' \
              "$ROOT/repository.json"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" \
              > "$ROOT/master.json"
            python -c 'import json,sys; v=json.load(open(sys.argv[1])); sys.exit(0 if v["object"]["sha"] == sys.argv[2] else 2)' \
              "$ROOT/master.json" "$EXPECTED_MASTER_SHA"
          }
          discover() {
            # A successful parent listing proves namespace absence. A failed read never does.
            "$RCLONE_BIN" lsf "$ARCHIVE/" --dirs-only > "$ROOT/directories.txt"
            if grep -Fx 'run287_risk_outcome_accepted_heads/' "$ROOT/directories.txt" >/dev/null; then
              "$RCLONE_BIN" lsf "$ACCEPTED/" --recursive --files-only > "$ROOT/inventory.txt"
            else
              : > "$ROOT/inventory.txt"
            fi
            python "$BUILDER" inventory --root "$ROOT/inventory.txt"
          }
          copy_checked() {
            local remote="$1" destination="$2"
            mkdir -p "$destination"
            "$RCLONE_BIN" copy "$remote/" "$destination/" --transfers 2 --checkers 4
            "$RCLONE_BIN" check "$remote/" "$destination/" --checksum
          }
          BEFORE="$(discover)"
          copy_checked "$ARCHIVE/run287_daily_simulated_fill_ledger" "$ROOT/paper"
          copy_checked "$ARCHIVE/run287_daily_simulated_fill_ledger_heads" "$ROOT/paper_heads"
          copy_checked "$ARCHIVE/run287_risk_outcome_archive" "$ROOT/legacy"
          python tools/run287_paper_ledger_integrity.py \
            --select-immutable-heads-root "$ROOT/paper_heads" --output "$ROOT/selection.json"
          python tools/run287_paper_ledger_integrity.py \
            --state-dir "$ROOT/paper" --require-integrity \
            --immutable-head-selection "$ROOT/selection.json" \
            --verifier-receipt-output "$ROOT/verifier.json"
          if [ "$BEFORE" = EMPTY ]; then
            python tools/build_run287_risk_outcome_parent_preflight.py \
              --event-name "$GITHUB_EVENT_NAME" --source-commit-sha "$EXPECTED_MASTER_SHA" \
              --source-run-id "$GITHUB_RUN_ID" --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
              --source-job-key "$GITHUB_JOB" --session-date "$REQUESTED_SESSION_DATE" \
              --remote-head-discovery-confirmed --remote-committed-head-count 0 \
              --remote-legacy-outcome-state PRESENT_FETCHED \
              --legacy-summary "$ROOT/legacy/summary.json" \
              --legacy-event-log "$ROOT/legacy/risk_outcome_events.jsonl" \
              --paper-integrity "$ROOT/paper/snapshot_integrity.json" \
              --paper-integrity-verifier-receipt "$ROOT/verifier.json" \
              --paper-immutable-head-selection "$ROOT/selection.json" \
              --allow-quarantined-legacy-outcome-parent --output "$ROOT/preflight.json"
            HEAD_SHA="$(python "$BUILDER" build --root "$ROOT" --code-sha "$EXPECTED_MASTER_SHA")"
            STAGED="$ROOT/build/staged/$HEAD_SHA"
            python tools/manage_run287_risk_outcome_accepted_heads.py verify \
              --head-dir "$STAGED" --expected-manifest-sha256 "$HEAD_SHA"
            # Recheck source state before first durable write. Shared concurrency
            # serializes this writer with ordinary daily and later migration runs.
            assert_master
            "$RCLONE_BIN" check "$ARCHIVE/run287_daily_simulated_fill_ledger/" "$ROOT/paper/" --checksum
            "$RCLONE_BIN" check "$ARCHIVE/run287_daily_simulated_fill_ledger_heads/" "$ROOT/paper_heads/" --checksum
            "$RCLONE_BIN" check "$ARCHIVE/run287_risk_outcome_archive/" "$ROOT/legacy/" --checksum
            test "$(discover)" = EMPTY
            "$RCLONE_BIN" copy "$STAGED/" "$ACCEPTED/$HEAD_SHA/" \
              --exclude manifest.json --immutable --transfers 1
            # Only our two staged payloads may exist before the commit marker.
            "$RCLONE_BIN" lsf "$ACCEPTED/" --recursive --files-only > "$ROOT/precommit.txt"
            printf '%s\n' \
              "$HEAD_SHA/run287_risk_outcome_archive/risk_outcome_events.jsonl" \
              "$HEAD_SHA/run287_risk_outcome_archive/summary.json" | LC_ALL=C sort > "$ROOT/expected.txt"
            LC_ALL=C sort "$ROOT/precommit.txt" > "$ROOT/observed.txt"
            cmp "$ROOT/expected.txt" "$ROOT/observed.txt"
            "$RCLONE_BIN" check "$STAGED/" "$ACCEPTED/$HEAD_SHA/" --exclude manifest.json --checksum
            assert_master
            # Re-list immediately at the commit boundary; any new head blocks.
            "$RCLONE_BIN" lsf "$ACCEPTED/" --recursive --files-only | LC_ALL=C sort > "$ROOT/observed.txt"
            cmp "$ROOT/expected.txt" "$ROOT/observed.txt"
            "$RCLONE_BIN" copyto "$STAGED/manifest.json" "$ACCEPTED/$HEAD_SHA/manifest.json" --immutable
            BEFORE_COUNT=0
          else
            # Never rebuild using a new run ID: verify the original exact root.
            HEAD_SHA="$BEFORE"
            BEFORE_COUNT=1
          fi
          test "$(discover)" = "$HEAD_SHA"
          copy_checked "$ACCEPTED" "$ROOT/accepted"
          python "$BUILDER" verify --root "$ROOT" --head "$HEAD_SHA" --code-sha "$EXPECTED_MASTER_SHA"
          # Reconfirm authoritative state after readback, including verify-only runs.
          assert_master
          "$RCLONE_BIN" check "$ARCHIVE/run287_daily_simulated_fill_ledger/" "$ROOT/paper/" --checksum
          "$RCLONE_BIN" check "$ARCHIVE/run287_daily_simulated_fill_ledger_heads/" "$ROOT/paper_heads/" --checksum
          "$RCLONE_BIN" check "$ARCHIVE/run287_risk_outcome_archive/" "$ROOT/legacy/" --checksum
          test "$(discover)" = "$HEAD_SHA"
          python "$BUILDER" receipt --root "$ROOT" --head "$HEAD_SHA" \
            --code-sha "$EXPECTED_MASTER_SHA" --before "$BEFORE_COUNT"

      - name: Remove temporary credentials
        if: always()
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/run287-rclone.conf" "$RUNNER_TEMP/run287-service-account.json"

      - name: Upload immutable migration receipt and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run287-risk-outcome-legacy-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            outputs/run287_risk_outcome_legacy_migration/
            /tmp/run287-risk-outcome-legacy-migration/receipts/
            /tmp/run287-risk-outcome-legacy-migration/preflight.json
            /tmp/run287-risk-outcome-legacy-migration/inventory.txt
          if-no-files-found: error
          retention-days: 30
