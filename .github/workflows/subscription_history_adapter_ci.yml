name: Subscription History Adapter CI
on:
  pull_request:
    paths:
      - 'tools/subscription_manager/**'
      - 'tools/long_history_lake.py'
      - 'tools/macro_history_sources.py'
      - 'tools/macro_research_checkpoint.py'
      - 'tests/subscription_history_adapter_smoke.py'
      - 'tests/subscription_model_cycle_smoke.py'
      - '.github/workflows/subscription_history_adapter_ci.yml'
  push:
    branches: ['codex/subscription-history-adapter-20260914']
permissions:
  contents: read
concurrency:
  group: subscription-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/subscription_manager/
            /tools/long_history_lake.py
            /tools/macro_history_sources.py
            /tools/macro_research_checkpoint.py
            /tools/run_pr_validation.py
            /tests/subscription_history_adapter_smoke.py
            /tests/subscription_model_cycle_smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Registered focused contracts
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python tools/run_pr_validation.py --include subscription_history_adapter_smoke --include subscription_model_cycle_smoke --only subscription_history_adapter_smoke --only subscription_model_cycle_smoke
          python -O -W error::ResourceWarning tests/subscription_history_adapter_smoke.py
          python -O -W error::ResourceWarning tests/subscription_model_cycle_smoke.py
