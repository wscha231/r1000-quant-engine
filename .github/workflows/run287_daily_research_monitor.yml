name: Run287 Daily Research Monitor

on:
  schedule:
    - cron: '25 8 * * *'  # 17:25 Asia/Seoul; report latest settled US session.
  workflow_run:
    workflows: ['Free Data Daily Update', 'Daily Crisis Monitor']
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/run287_daily_research_monitor.yml'
      - 'tools/run_run287_daily_research_monitor.py'
      - 'tools/run287_etf_rotation.py'
      - 'tools/etf_leadership_snapshot.py'
      - '.github/workflows/after_close_daily.yml'
      - 'tools/theme_etf_source_bridge.py'
      - 'tools/theme_etf_upstream_admission.py'
      - 'tools/run_run287_exact_packet_upstream.py'
      - 'tests/theme_etf_source_bridge_smoke.py'
      - 'research/theme_etf_runtime_v1/**'
      - 'tools/run287_research_score_handoff.py'
      - 'tools/run287_research_report_html.py'
      - 'tools/run287_code_identity.py'
      - 'tests/run287_daily_research_monitor_smoke.py'
      - 'docs/run287_daily_research_monitor_contract.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: run287-research-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    # Only same-repository PRs receive the read-only Actions token.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            tests
            docs
            .github
            research/theme_etf_runtime_v1
            research/control_plane
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calendar dependencies
        run: python -m pip install 'pandas==2.2.3' 'pandas_market_calendars==4.6.1' 'jsonschema>=4.23,<5'
      - name: Validate monitor contracts
        run: python tests/run287_daily_research_monitor_smoke.py
      - name: Collect read-only daily research evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/run_run287_daily_research_monitor.py
          --output-dir outputs/daily_research_monitor/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish report summary
        if: always()
        env:
          REPORT: outputs/daily_research_monitor/${{ github.run_id }}-${{ github.run_attempt }}/report.md
        run: |
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Research monitor could not produce its report; inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only research handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run287-daily-research-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/daily_research_monitor/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 45
