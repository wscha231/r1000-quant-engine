name: SEC Form 4 Daily Refresh

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated issuer tickers used only when all_sec_tickers=false.'
        type: string
        default: ''
      all_sec_tickers:
        description: 'Monitor all SEC company_tickers issuers for fair Form 4 coverage.'
        type: boolean
        default: true
      shard_index:
        description: 'Stable issuer shard index for bounded all-SEC runs.'
        type: string
        default: '0'
      shard_count:
        description: 'Stable issuer shard count. Use 1 for all issuers in one run.'
        type: string
        default: '1'
      max_tickers:
        description: 'Optional cap after sharding. 0 means no cap.'
        type: string
        default: '0'
      max_filings:
        description: 'Max indexed Form 4 filings to parse in this shard'
        type: string
        default: '2500'
      safety_delay_hours:
        description: 'PIT safety delay after SEC accepted_at'
        type: string
        default: '0'
  schedule:
    # 08:20 KST Tue-Sat, after most prior US after-close Form 4 filings are visible.
    - cron: '20 23 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: sec-evidence-data-lake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sec_form4_daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Check recent GitHub Actions overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/full_rebuild_logs
          gh run list --repo "$GITHUB_REPOSITORY" --limit 20 --json databaseId,workflowName,status,conclusion,headBranch,createdAt,url \
            | tee outputs/full_rebuild_logs/actions_overlap_preflight.json
          gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --limit 20 || true

      - name: Restore SEC cache
        uses: actions/cache@v4
        with:
          path: |
            data_raw/sec
            data_pit/sec
          key: sec-form4-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sec-form4-daily-${{ runner.os }}-
            sec-evidence-${{ runner.os }}-

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[gdrive] no auth configured; continuing without Drive restore/sync"
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore SEC data lake from Google Drive
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          restore_dir() {
            local d="$1"
            local limit="${2:-6m}"
            mkdir -p "$d"
            if ! rclone lsf "$BASE$d" >/dev/null 2>&1; then
              echo "[gdrive] no restore source for $d"
              return 0
            fi
            echo "[gdrive] restore $d with timeout $limit"
            if ! timeout "$limit" rclone copy "$BASE$d" "$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line; then
              echo "[gdrive] warning: restore for $d timed out or failed; continuing with GitHub cache/artifacts"
            fi
          }
          restore_dir data_raw/sec 6m
          restore_dir data_pit/sec 6m
          restore_dir outputs/sec_ownership_signals 3m

      - name: Collect and score Form 4
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'R1000QuantEngine research andrewcha231@gmail.com' }}
          TICKERS: ${{ github.event.inputs.tickers || '' }}
          ALL_SEC_TICKERS: ${{ github.event.inputs.all_sec_tickers || 'true' }}
          SHARD_INDEX: ${{ github.event.inputs.shard_index || '0' }}
          SHARD_COUNT: ${{ github.event.inputs.shard_count || '1' }}
          MAX_TICKERS: ${{ github.event.inputs.max_tickers || '0' }}
          MAX_FILINGS: ${{ github.event.inputs.max_filings || '2500' }}
          SAFETY_DELAY_HOURS: ${{ github.event.inputs.safety_delay_hours || '0' }}
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs outputs/sec_ownership_signals data_pit/sec data_raw/sec
          COLLECT_ARGS=(
            --forms '4,4/A'
            --output-dir data_pit/sec/shards/daily_latest
            --raw-dir data_raw/sec
            --user-agent "$SEC_USER_AGENT"
            --sleep 0.12
            --safety-delay-hours "$SAFETY_DELAY_HOURS"
            --shard-index "$SHARD_INDEX"
            --shard-count "$SHARD_COUNT"
            --max-tickers "$MAX_TICKERS"
          )
          if [ "$ALL_SEC_TICKERS" = "true" ]; then
            COLLECT_ARGS+=(--all-sec-tickers)
          else
            COLLECT_ARGS+=(--tickers "$TICKERS" --universe-file ./.missing_universe.csv)
          fi
          echo "[form4] all_sec_tickers=$ALL_SEC_TICKERS shard=${SHARD_INDEX}/${SHARD_COUNT} max_tickers=$MAX_TICKERS max_filings=$MAX_FILINGS"
          python tools/run_sec_submissions_collector.py \
            "${COLLECT_ARGS[@]}" \
            2>&1 | tee outputs/full_rebuild_logs/sec_form4_submissions.log
          python tools/run_sec_form4_parser.py \
            --filings-index data_pit/sec/shards/daily_latest/sec_filings_index.parquet \
            --output-dir data_pit/sec/shards/daily_latest \
            --raw-dir data_raw/sec \
            --user-agent "$SEC_USER_AGENT" \
            --sleep 0.12 \
            --max-filings "$MAX_FILINGS" \
            2>&1 | tee outputs/full_rebuild_logs/sec_form4_parser.log
          python tools/run_sec_form4_merge_shards.py \
            --pit-root data_pit/sec \
            --output-dir outputs/sec_ownership_signals \
            --window-days 90 \
            2>&1 | tee outputs/full_rebuild_logs/sec_form4_signals.log

      - name: Upload SEC Form 4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-form4-daily-${{ github.run_id }}
          path: |
            data_pit/sec/sec_filings_index.*
            data_pit/sec/form4_transactions.*
            data_pit/sec/*summary.json
            outputs/sec_ownership_signals/
            outputs/full_rebuild_logs/sec_form4_*.log
          retention-days: 14

      - name: Sync SEC Form 4 data lake to Google Drive
        if: always()
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          sync_dir() {
            local src="$1"
            local dst="$2"
            echo "[gdrive] sync $src -> $dst"
            if ! timeout 8m rclone copy "$src" "$dst" --transfers 4 --checkers 8 --stats 30s --stats-one-line; then
              echo "[gdrive] warning: sync for $src timed out or failed; GitHub artifact remains available"
            fi
          }
          for d in data_raw/sec data_pit/sec outputs/sec_ownership_signals; do
            if [ -d "$d" ]; then
              sync_dir "$d" "$BASE$d/"
            fi
          done
