name: SEC Form 4 Daily Refresh

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated issuer tickers. Keep bounded for SEC fair access.'
        type: string
        default: 'AAPL,MSFT,NVDA,AMD,INTC,ARM,ASML,MU,TSM,AVGO,PLTR,TSLA,IONQ,RGTI,QBTS,ACHR,ASTS,RKLB,OKLO,SMR'
      max_filings:
        description: 'Max Form 4 filings to parse in this shard; use a larger value for historical shards'
        type: string
        default: '500'
      max_filings_per_ticker:
        description: 'Max indexed Form 4 filings to keep per issuer before parser; 0 = no per-ticker cap'
        type: string
        default: '0'
      backfill_years:
        description: '0 = daily/recent only; otherwise include older submissions archive files back this many years'
        type: string
        default: '0'
      all_sec_tickers:
        description: 'Backfill all SEC company_tickers entries instead of the bounded watchlist'
        type: boolean
        default: false
      include_archive_files:
        description: 'Fetch older submissions files listed under filings.files for long Form 4 backfills'
        type: boolean
        default: false
      append_existing:
        description: 'Merge with existing shard/canonical PIT files instead of replacing them'
        type: boolean
        default: true
      shard_index:
        description: 'Zero-based shard index for all-ticker Form 4 backfill'
        type: string
        default: '0'
      shard_count:
        description: 'Total shard count for all-ticker Form 4 backfill'
        type: string
        default: '1'
      merge_shards:
        description: 'Merge data_pit/sec/shards into canonical Form 4 PIT/signal files'
        type: boolean
        default: false
      safety_delay_hours:
        description: 'PIT safety delay after SEC accepted_at'
        type: string
        default: '0'
  schedule:
    # 08:20 KST Tue-Sat, after most prior US after-close Form 4 filings are visible.
    - cron: '20 23 * * 1-5'

permissions:
  contents: read
  actions: read

concurrency:
  group: sec-form4-${{ github.ref }}-${{ github.event.inputs.shard_index || 'daily' }}
  cancel-in-progress: false

jobs:
  sec_form4_daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Check recent GitHub Actions overlap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/full_rebuild_logs
          gh run list --repo "$GITHUB_REPOSITORY" --limit 20 --json databaseId,workflowName,status,conclusion,headBranch,createdAt,url \
            | tee outputs/full_rebuild_logs/actions_overlap_preflight.json
          gh run list --repo "$GITHUB_REPOSITORY" --status in_progress --limit 20 || true

      - name: Restore SEC cache
        uses: actions/cache@v4
        with:
          path: |
            data_raw/sec
            data_pit/sec
          key: sec-form4-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sec-form4-daily-${{ runner.os }}-
            sec-evidence-${{ runner.os }}-

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[gdrive] no auth configured; continuing without Drive restore/sync"
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore SEC data lake from Google Drive
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          for d in data_raw/sec data_pit/sec outputs/sec_ownership_signals; do
            mkdir -p "$d"
            if rclone lsf "$BASE$d" >/dev/null 2>&1; then
              if ! timeout 8m rclone copy "$BASE$d" "$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line; then
                echo "[gdrive] warning: restore for $d timed out or failed; continuing with GitHub cache/local files"
              fi
            fi
          done

      - name: Collect and score Form 4
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'R1000QuantEngine research andrewcha231@gmail.com' }}
          TICKERS: ${{ github.event.inputs.tickers || 'AAPL,MSFT,NVDA,AMD,INTC,ARM,ASML,MU,TSM,AVGO,PLTR,TSLA,IONQ,RGTI,QBTS,ACHR,ASTS,RKLB,OKLO,SMR' }}
          MAX_FILINGS: ${{ github.event.inputs.max_filings || '500' }}
          MAX_FILINGS_PER_TICKER: ${{ github.event.inputs.max_filings_per_ticker || '0' }}
          BACKFILL_YEARS: ${{ github.event.inputs.backfill_years || '0' }}
          ALL_SEC_TICKERS: ${{ github.event.inputs.all_sec_tickers || 'false' }}
          INCLUDE_ARCHIVE_FILES: ${{ github.event.inputs.include_archive_files || 'false' }}
          APPEND_EXISTING: ${{ github.event.inputs.append_existing || 'true' }}
          SHARD_INDEX: ${{ github.event.inputs.shard_index || '0' }}
          SHARD_COUNT: ${{ github.event.inputs.shard_count || '1' }}
          MERGE_SHARDS: ${{ github.event.inputs.merge_shards || 'false' }}
          SAFETY_DELAY_HOURS: ${{ github.event.inputs.safety_delay_hours || '0' }}
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs outputs/sec_ownership_signals data_pit/sec data_raw/sec
          PIT_OUT="data_pit/sec"
          if [ "${SHARD_COUNT:-1}" != "1" ]; then
            PIT_OUT="data_pit/sec/shards/shard_${SHARD_INDEX}_of_${SHARD_COUNT}"
          fi
          mkdir -p "$PIT_OUT"
          ARGS=(
            --forms '4,4/A'
            --output-dir "$PIT_OUT"
            --raw-dir data_raw/sec
            --user-agent "$SEC_USER_AGENT"
            --sleep 0.12
            --safety-delay-hours "$SAFETY_DELAY_HOURS"
            --max-filings-per-ticker "$MAX_FILINGS_PER_TICKER"
          )
          if [ "$ALL_SEC_TICKERS" = "true" ]; then
            ARGS+=(--all-sec-tickers --universe-file ./.missing_universe.csv)
          else
            ARGS+=(--tickers "$TICKERS" --universe-file ./.missing_universe.csv)
          fi
          if [ "${BACKFILL_YEARS:-0}" != "0" ]; then
            START_DATE="$(python -c "from datetime import date, timedelta; print((date.today() - timedelta(days=int(float('${BACKFILL_YEARS:-0}')*365.25))).isoformat())")"
            ARGS+=(--start-date "$START_DATE" --shard-index "$SHARD_INDEX" --shard-count "$SHARD_COUNT")
          fi
          if [ "$INCLUDE_ARCHIVE_FILES" = "true" ]; then
            ARGS+=(--include-archive-files)
          fi
          if [ "$APPEND_EXISTING" = "true" ]; then
            ARGS+=(--append-existing)
          fi
          python tools/run_sec_submissions_collector.py "${ARGS[@]}" 2>&1 | tee outputs/full_rebuild_logs/sec_form4_submissions.log
          python tools/run_sec_form4_parser.py \
            --filings-index "$PIT_OUT/sec_filings_index.parquet" \
            --output-dir "$PIT_OUT" \
            --raw-dir data_raw/sec \
            --user-agent "$SEC_USER_AGENT" \
            --sleep 0.12 \
            --max-filings "$MAX_FILINGS" \
            2>&1 | tee outputs/full_rebuild_logs/sec_form4_parser.log
          if [ "$MERGE_SHARDS" = "true" ]; then
            python tools/run_sec_form4_merge_shards.py \
              --pit-root data_pit/sec \
              --output-dir outputs/sec_ownership_signals \
              --window-days 90 \
              2>&1 | tee outputs/full_rebuild_logs/sec_form4_merge_shards.log
          fi
          SIGNAL_FORM4="$PIT_OUT/form4_transactions.parquet"
          if [ "$MERGE_SHARDS" = "true" ]; then
            SIGNAL_FORM4="data_pit/sec/form4_transactions.parquet"
          fi
          python tools/run_sec_ownership_signals.py \
            --form4 "$SIGNAL_FORM4" \
            --output-dir outputs/sec_ownership_signals \
            --lookback-days 90 \
            2>&1 | tee outputs/full_rebuild_logs/sec_form4_signals.log

      - name: Upload SEC Form 4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-form4-daily-${{ github.run_id }}
          path: |
            data_pit/sec/sec_filings_index.*
            data_pit/sec/form4_transactions.*
            data_pit/sec/sec_ownership_signals.*
            data_pit/sec/sec_form4_merge_manifest.json
            data_pit/sec/shards/**
            data_pit/sec/*summary.json
            outputs/sec_ownership_signals/
            outputs/full_rebuild_logs/sec_form4_*.log
          retention-days: 14

      - name: Sync SEC Form 4 data lake to Google Drive
        if: always()
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          sync_dir() {
            local src="$1"
            local dst="$2"
            echo "[gdrive] sync $src -> $dst"
            if ! timeout 8m rclone copy "$src" "$dst" --transfers 4 --checkers 8 --stats 30s --stats-one-line; then
              echo "[gdrive] warning: sync for $src timed out or failed; GitHub artifact remains available"
            fi
          }
          for d in data_raw/sec data_pit/sec outputs/sec_ownership_signals; do
            if [ -d "$d" ]; then
              sync_dir "$d" "$BASE$d/"
            fi
          done
