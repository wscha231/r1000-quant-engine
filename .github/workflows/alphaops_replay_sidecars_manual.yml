name: AlphaOps Replay Sidecars (Manual / Fast)

# Fast artifact-only replay. Use this after a successful full rebuild when the
# research question is portfolio accounting, weekly validation, broker ledger
# realism, theme concentration, or goal-search ranking. It does not run the
# collector, feature store, or walk-forward model rebuild.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed full_rebuild_manual run id to replay from'
        type: string
        required: true
      cost_bps:
        description: 'Per-side transaction cost for broker ledger/theme challenger'
        type: string
        default: '25'
      theme_cost_bps:
        description: 'Per-side transaction cost for top-3 theme concentration challenger'
        type: string
        default: '50'
      theme_top_n:
        description: 'Top names per winning theme'
        type: string
        default: '3'
      theme_single_name_cap:
        description: 'Single-name cap for theme concentration challenger'
        type: string
        default: '0.50'
      max_fill_lag_days:
        description: 'Max trading-day lag for next-close fills'
        type: string
        default: '7'
      portfolio_policy:
        description: 'Operating target policy to replay from the source artifact'
        type: choice
        options:
          - production_baseline
          - alphaops_vnext_production
        default: alphaops_vnext_production
      sync_replay_to_gdrive:
        description: 'Optionally copy compact replay summaries to Google Drive'
        type: boolean
        default: false
      run_extended_research_sidecars:
        description: 'Run slower research sidecars such as superperformance and integrated theme/leader/crisis replay'
        type: boolean
        default: false
      leader_gate_enabled:
        description: 'A/B: enable concentrated leader-tier production gate'
        type: boolean
        default: false
      cycle_leadership_mask_enabled:
        description: 'A/B: require benchmark-relative leadership for concentrated cycle-recovery score'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  replay_sidecars:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: |
            cache_prices
            cache_macro
            cache_misc
            aggressive/cache/bars
            outputs/macro
          key: replay-price-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            collector-cache--${{ runner.os }}-
            collector-cache-${{ runner.os }}-
            replay-price-cache-${{ runner.os }}-

      - name: Download source full rebuild artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for tool in tools/build_replay_price_cache.py tools/build_operating_target_books.py tools/run_alphaops_vnext_policy_replay.py tools/build_event_target_books.py tools/build_weekly_leader_target_books.py tools/archive_target_snapshots.py tools/audit_data_readiness.py tools/run_dataset_coverage_audit.py tools/run_position_risk_weekly_validation.py tools/run_broker_ledger_replay.py tools/run_broker_position_risk_replay.py tools/run_broker_execution_policy_replay.py tools/run_operating_event_backtest.py tools/run_broker_gap_attribution.py tools/validate_target_book_cash_contract.py tools/run_fast_full_drift_audit.py tools/run_broker_trade_journal.py tools/run_account_order_preview.py tools/run_live_trading_safety_audit.py tools/run_live_trading_risk_controls.py tools/run_monster_recommendation_bridge.py tools/run_operating_snapshot.py tools/run_user_portfolio_reports.py tools/run_user_current_report.py tools/run_position_cleanup_review.py tools/run_patch_application_manifest.py tools/run_theme_leadership_tape.py tools/run_theme_concentration_challenger.py tools/run_concentrated_policy_replay.py tools/run_portfolio_goal_search.py tools/run_account_evaluation.py tools/run_metric_hygiene_report.py tools/run_portfolio_system_guard.py tools/create_healthy_baseline_lock.py tools/run_sec_enriched_candidate_replay.py tools/run_superperformance_trader_replay.py tools/run_integrated_theme_leader_crisis_replay.py tools/run_strategy_logic_ledger.py; do
            if [ ! -f "$tool" ]; then
              echo "[replay] ERROR: missing $tool. Run this workflow from a branch that contains the AlphaOps replay tools."
              exit 4
            fi
          done
          mkdir -p source_artifacts outputs/full_rebuild_logs
          gh run download "${{ inputs.source_run_id }}" --repo "$GITHUB_REPOSITORY" --dir source_artifacts
          BASE_SRC="$(find source_artifacts -type f -name backtest_metrics.json -print -quit | xargs -r dirname)"
          SOURCE_REPORT_CANDIDATE_BOOK="$(find source_artifacts -type f -path '*/reports/candidate_replay_book.csv' -print -quit)"
          SOURCE_ENRICHED_CANDIDATE_BOOK="$(find source_artifacts -type f -path '*/sec_enriched_candidate_replay/candidate_replay_book_sec_enriched.csv' -print -quit)"
          REPO_FALLBACK_CANDIDATE_BOOK="$(find cloud_results/full_rebuild/failed_runs -type f -path "*/${{ inputs.source_run_id }}_*/reports/candidate_replay_book.csv" -print -quit 2>/dev/null || true)"
          CANDIDATE_BOOK="${SOURCE_ENRICHED_CANDIDATE_BOOK:-${SOURCE_REPORT_CANDIDATE_BOOK:-$REPO_FALLBACK_CANDIDATE_BOOK}}"
          if [ -n "$BASE_SRC" ]; then
            echo "[replay] base source=$BASE_SRC"
            cp -R "$BASE_SRC"/. outputs/
          fi
          if [ -n "$CANDIDATE_BOOK" ]; then
            CANDIDATE_SRC="$(dirname "$(dirname "$CANDIDATE_BOOK")")"
            cp -R "$CANDIDATE_SRC"/. outputs/
            SRC="$CANDIDATE_SRC"
            echo "[replay] selected source with replay candidate=$CANDIDATE_BOOK"
          else
            SRC="$BASE_SRC"
            echo "[replay] WARNING: no candidate replay book found in source artifacts or repo fallback; policy replay may restore archived target books"
          fi
          if [ -z "$SRC" ]; then
            echo "[replay] ERROR: could not locate backtest_metrics.json in source artifacts"
            find source_artifacts -maxdepth 3 -type f | head -100
            exit 2
          fi
          echo "[replay] source=$SRC"
          echo "SOURCE_ARTIFACT_DIR=$SRC" >> "$GITHUB_ENV"
          test -s outputs/reports/main_monthly_weights.csv
          test -s outputs/reports/regime_by_month.csv
          PRICE_FILES="$(find cache_prices aggressive/cache/bars -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "[replay] restored price cache files=$PRICE_FILES"
          echo "[replay] refreshing missing/stale replay price cache from target books + top scored names"
          python tools/build_replay_price_cache.py \
            --books outputs/reports/main_monthly_weights.csv outputs/reports/concentrated_strategy_holdings.csv \
            --scored outputs/scored_latest.csv \
            --max-scored 250 \
            --required-tickers SPY QQQ \
            --output-dir cache_prices \
            --batch-size 40 \
            --refresh-stale-days 2
          PRICE_FILES="$(find cache_prices aggressive/cache/bars -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "[replay] price cache files after refresh=$PRICE_FILES"
          if [ "${PRICE_FILES:-0}" -lt 10 ]; then
            echo "[replay] ERROR: price cache refresh did not produce enough files."
            exit 3
          fi

      - name: Restore evidence overlays from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: "r1000_top30_institutional"
        run: |
          set -euo pipefail
          mkdir -p outputs/full_rebuild_logs outputs/sec_institutional_signals outputs/sec_ownership_signals outputs/etf_thematic_signals data_pit/sec data_pit/etf_holdings data_pit/macro
          MANIFEST="outputs/full_rebuild_logs/sec_evidence_restore_manifest.json"
          python - <<'PY' > "$MANIFEST"
          import json
          print(json.dumps({"gdrive_ready": False, "restored": [], "missing": [], "errors": []}, indent=2))
          PY

          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[sec-restore] no Google Drive auth configured; vNext will use source artifact evidence only"
            exit 0
          fi

          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -qo /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone

          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi

          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi

          RESTORED=""
          MISSING=""
          ERRORS=""
          restore_dir() {
            local d="$1"
            mkdir -p "$d"
            if rclone lsf "$BASE$d" >/dev/null 2>&1; then
              if timeout 5m rclone copy "$BASE$d" "$d/" --transfers 4 --checkers 8 --stats 30s --stats-one-line; then
                RESTORED="${RESTORED}${d}"$'\n'
              else
                ERRORS="${ERRORS}${d}"$'\n'
                echo "[sec-restore] warning: restore for $d failed or timed out"
              fi
            else
              MISSING="${MISSING}${d}"$'\n'
              echo "[sec-restore] no Drive path for $d"
            fi
          }

          restore_dir outputs/sec_institutional_signals
          restore_dir outputs/sec_ownership_signals
          restore_dir data_pit/sec
          restore_dir outputs/etf_thematic_signals
          restore_dir data_pit/etf_holdings
          restore_dir data_pit/macro

          python - <<PY > "$MANIFEST"
          import json
          from pathlib import Path
          import pandas as pd
          restored = [x for x in """$RESTORED""".splitlines() if x]
          missing = [x for x in """$MISSING""".splitlines() if x]
          errors = [x for x in """$ERRORS""".splitlines() if x]
          def table_stats(path, ticker_col="ticker", date_col="latest_available_from"):
              p = Path(path)
              out = {"exists": p.exists(), "rows": 0, "ticker_count": 0, "latest_available_from": ""}
              if not p.exists():
                  return out
              try:
                  if p.suffix == ".parquet":
                      df = pd.read_parquet(p)
                  else:
                      df = pd.read_csv(p, low_memory=False)
                  out["rows"] = int(len(df))
                  if ticker_col in df.columns:
                      out["ticker_count"] = int(df[ticker_col].astype(str).str.upper().str.strip().replace("", pd.NA).nunique(dropna=True))
                  if date_col in df.columns:
                      dt = pd.to_datetime(df[date_col], errors="coerce", utc=True)
                      out["latest_available_from"] = dt.max().isoformat() if dt.notna().any() else ""
              except Exception as exc:
                  out["error"] = str(exc)
              return out
          checks = {
              "institutional_13f_latest": Path("outputs/sec_institutional_signals/13f_latest.csv").exists() or Path("outputs/sec_institutional_signals/13f_latest.parquet").exists(),
              "institutional_signals_latest": Path("outputs/sec_institutional_signals/signals_latest.csv").exists() or Path("outputs/sec_institutional_signals/signals_latest.parquet").exists(),
              "ownership_form4_latest": Path("outputs/sec_ownership_signals/form4_latest.csv").exists() or Path("outputs/sec_ownership_signals/form4_latest.parquet").exists(),
              "ownership_signals_latest": Path("outputs/sec_ownership_signals/signals_latest.csv").exists() or Path("outputs/sec_ownership_signals/signals_latest.parquet").exists(),
              "data_pit_sec_ownership_signals": Path("data_pit/sec/sec_ownership_signals.parquet").exists(),
              "data_pit_13f_holdings": Path("data_pit/sec/institutional_13f_holdings.parquet").exists(),
              "etf_thematic_latest": Path("outputs/etf_thematic_signals/etf_latest.csv").exists() or Path("outputs/etf_thematic_signals/etf_latest.parquet").exists(),
              "data_pit_etf_holdings": Path("data_pit/etf_holdings/etf_holdings.parquet").exists(),
              "data_pit_macro": Path("data_pit/macro").exists() and any(Path("data_pit/macro").glob("*")),
          }
          stats = {
              "form4_latest_csv": table_stats("outputs/sec_ownership_signals/form4_latest.csv"),
              "form4_canonical_signals": table_stats("data_pit/sec/sec_ownership_signals.parquet"),
              "form4_transactions": table_stats("data_pit/sec/form4_transactions.parquet", ticker_col="issuer_ticker", date_col="available_from"),
              "institutional_latest_csv": table_stats("outputs/sec_institutional_signals/13f_latest.csv"),
              "institutional_holdings": table_stats("data_pit/sec/institutional_13f_holdings.parquet", ticker_col="ticker_mapped", date_col="available_from"),
              "etf_latest_csv": table_stats("outputs/etf_thematic_signals/etf_latest.csv"),
              "etf_holdings": table_stats("data_pit/etf_holdings/etf_holdings.parquet", ticker_col="holding_ticker", date_col="available_from"),
          }
          print(json.dumps({
              "gdrive_ready": bool(restored or missing or errors),
              "restored": restored,
              "missing": missing,
              "errors": errors,
              "checks": checks,
              "stats": stats,
          }, indent=2, sort_keys=True))
          PY
          cat "$MANIFEST"

      - name: Run fast replay sidecars
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          COST_BPS: ${{ inputs.cost_bps }}
          THEME_COST_BPS: ${{ inputs.theme_cost_bps }}
          THEME_TOP_N: ${{ inputs.theme_top_n }}
          THEME_SINGLE_NAME_CAP: ${{ inputs.theme_single_name_cap }}
          MAX_FILL_LAG_DAYS: ${{ inputs.max_fill_lag_days }}
          PORTFOLIO_POLICY: ${{ inputs.portfolio_policy }}
          RUN_EXTENDED_RESEARCH_SIDECARS: ${{ inputs.run_extended_research_sidecars }}
          PHASE_LEADER_GATE_ENABLED: ${{ inputs.leader_gate_enabled && '1' || '0' }}
          PHASE_CYCLE_LEADERSHIP_MASK_ENABLED: ${{ inputs.cycle_leadership_mask_enabled && '1' || '0' }}
        run: |
          set -e
          set -o pipefail
          mkdir -p outputs/replay_integrity
          if [ "$PORTFOLIO_POLICY" = "alphaops_vnext_production" ]; then
            cp outputs/alphaops_vnext/official_main_target_book.csv outputs/replay_integrity/source_vnext_official_main_target_book.csv 2>/dev/null || true
            cp outputs/alphaops_vnext/official_concentrated_target_book.csv outputs/replay_integrity/source_vnext_official_concentrated_target_book.csv 2>/dev/null || true
          fi
          python tools/build_operating_target_books.py --latest-run outputs --price-cache cache_prices --output-dir outputs/reports 2>&1 | tee outputs/full_rebuild_logs/operating_target_books.log
          if [ "$PORTFOLIO_POLICY" = "alphaops_vnext_production" ]; then
            BASE_CANDIDATE_BOOK="outputs/reports/candidate_replay_book.csv"
            ENRICHED_CANDIDATE_BOOK="outputs/sec_enriched_candidate_replay/candidate_replay_book_sec_enriched.csv"
            if [ -s "$BASE_CANDIDATE_BOOK" ] || [ -s "$ENRICHED_CANDIDATE_BOOK" ]; then
              if [ -s "$ENRICHED_CANDIDATE_BOOK" ]; then
                ALPHAOPS_CANDIDATE_BOOK="$ENRICHED_CANDIDATE_BOOK"
                echo "[replay] using restored enriched candidate book for vNext: $ALPHAOPS_CANDIDATE_BOOK"
              else
                ALPHAOPS_CANDIDATE_BOOK="$BASE_CANDIDATE_BOOK"
                echo "[replay] using base candidate book for vNext: $ALPHAOPS_CANDIDATE_BOOK"
                if [ -s data_pit/sec/form4_transactions.parquet ] || [ -s data_pit/sec/institutional_13f_holdings.parquet ] || [ -s data_pit/etf_holdings/etf_holdings.parquet ]; then
                  python tools/run_sec_enriched_candidate_replay.py --candidate-book "$ALPHAOPS_CANDIDATE_BOOK" --output-dir outputs/sec_enriched_candidate_replay 2>&1 | tee outputs/full_rebuild_logs/sec_enriched_candidate_replay_for_vnext.log || true
                  if [ -s "$ENRICHED_CANDIDATE_BOOK" ]; then
                    ALPHAOPS_CANDIDATE_BOOK="$ENRICHED_CANDIDATE_BOOK"
                    echo "[replay] built enriched candidate book for vNext: $ALPHAOPS_CANDIDATE_BOOK"
                  else
                    echo "[replay] enriched candidate book unavailable for vNext; using base candidate book"
                  fi
                else
                  echo "[replay] SEC/ETF PIT stores unavailable; using base candidate book for vNext"
                fi
              fi
              python tools/run_alphaops_vnext_policy_replay.py --latest-run outputs --candidate-book "$ALPHAOPS_CANDIDATE_BOOK" --price-cache cache_prices --output-dir outputs/alphaops_vnext --portfolio-kind both --main-target-n 15 --concentrated-target-n 5 --production-output-mode replace_operating --skip-broker-replay --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/alphaops_vnext_policy_replay.log
            elif [ -s outputs/replay_integrity/source_vnext_official_main_target_book.csv ] && [ -s outputs/replay_integrity/source_vnext_official_concentrated_target_book.csv ]; then
              echo "[replay] candidate_replay_book missing; restoring archived vNext official operating target books" | tee outputs/full_rebuild_logs/alphaops_vnext_policy_replay.log
              cp outputs/replay_integrity/source_vnext_official_main_target_book.csv outputs/reports/operating_main_target_book.csv
              cp outputs/replay_integrity/source_vnext_official_concentrated_target_book.csv outputs/reports/operating_concentrated_target_book.csv
            else
              echo "[replay] ERROR: alphaops_vnext_production requires candidate_replay_book or archived official vNext target books" | tee outputs/full_rebuild_logs/alphaops_vnext_policy_replay.log
              exit 2
            fi
          fi
          python tools/archive_target_snapshots.py --latest-run outputs --price-cache cache_prices --output-dir outputs/target_snapshots 2>&1 | tee outputs/full_rebuild_logs/target_snapshot_archive.log
          python tools/run_position_risk_weekly_validation.py --holdings outputs/reports/main_monthly_weights.csv --period-map outputs/reports/regime_by_month.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/position_risk_weekly_validation/main 2>&1 | tee outputs/full_rebuild_logs/position_risk_weekly_validation_main.log
          if [ -s outputs/main_v2_backtest/monthly_holdings.csv ]; then
            python tools/run_position_risk_weekly_validation.py --holdings outputs/main_v2_backtest/monthly_holdings.csv --period-map outputs/reports/regime_by_month.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/position_risk_weekly_validation/main_v2 2>&1 | tee outputs/full_rebuild_logs/position_risk_weekly_validation_main_v2.log || true
          fi
          python tools/run_position_risk_weekly_validation.py --holdings outputs/reports/concentrated_strategy_holdings.csv --period-map outputs/reports/concentrated_strategy_monthly.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/position_risk_weekly_validation/concentrated 2>&1 | tee outputs/full_rebuild_logs/position_risk_weekly_validation_concentrated.log || true
          python tools/run_broker_ledger_replay.py --target-book outputs/reports/operating_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/broker_replay/main --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/broker_ledger_replay_main.log
          python tools/run_broker_ledger_replay.py --target-book outputs/reports/operating_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/broker_replay/concentrated --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/broker_ledger_replay_concentrated.log
          if [ -s outputs/reports/main_monthly_weights.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/main_monthly_weights.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/legacy_monthly_broker_replay/main --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/legacy_monthly_broker_replay_main.log || true
          fi
          if [ -s outputs/reports/concentrated_strategy_holdings.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/concentrated_strategy_holdings.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/legacy_monthly_broker_replay/concentrated --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/legacy_monthly_broker_replay_concentrated.log || true
          fi
          python tools/build_event_target_books.py --latest-run outputs --price-cache cache_prices --output-dir outputs/event_target_books --reports-dir outputs/reports 2>&1 | tee outputs/full_rebuild_logs/event_target_books.log || true
          if [ -s outputs/reports/event_main_target_book.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/event_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/event_broker_replay/main --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/event_broker_replay_main.log || true
          fi
          if [ -s outputs/reports/event_concentrated_target_book.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/event_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/event_broker_replay/concentrated --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/event_broker_replay_concentrated.log || true
          fi
          python tools/build_weekly_leader_target_books.py --latest-run outputs --price-cache cache_prices --output-dir outputs/weekly_leader_snapshots --reports-dir outputs/reports 2>&1 | tee outputs/full_rebuild_logs/weekly_leader_target_books.log || true
          if [ -s outputs/reports/weekly_leader_main_target_book.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/weekly_leader_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/weekly_leader_broker_replay/main --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/weekly_leader_broker_replay_main.log || true
          fi
          if [ -s outputs/reports/weekly_leader_concentrated_target_book.csv ]; then
            python tools/run_broker_ledger_replay.py --target-book outputs/reports/weekly_leader_concentrated_target_book.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/weekly_leader_broker_replay/concentrated --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" 2>&1 | tee outputs/full_rebuild_logs/weekly_leader_broker_replay_concentrated.log || true
          fi
          if [ -s outputs/reports/operating_main_target_book.csv ]; then
            python tools/run_cost_sensitivity_sidecar.py --target-book outputs/reports/operating_main_target_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/cost_sensitivity/main --cost-bps-list 25 50 75 100 --baseline-cost-bps 25 2>&1 | tee outputs/full_rebuild_logs/cost_sensitivity_main.log || true
          fi
