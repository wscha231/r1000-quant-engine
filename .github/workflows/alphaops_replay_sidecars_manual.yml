          python tools/run_broker_replacement_swap_replay.py --target-book outputs/reports/operating_main_target_book.csv --candidate-book outputs/reports/candidate_replay_book.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/broker_replacement_swap_replay/main --fill-mode next_close --cost-bps "$COST_BPS" --max-fill-lag-days "$MAX_FILL_LAG_DAYS" --max-swaps-per-date 2 --min-score-advantage 0.20 2>&1 | tee outputs/full_rebuild_logs/broker_replacement_swap_replay_main.log || true
