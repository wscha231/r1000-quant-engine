          python tools/run_account_order_preview.py --account-state outputs/broker_replay/main/account_state_latest.json --target outputs/portfolio_latest.csv --price-cache cache_prices --portfolio-kind main --output-dir outputs/account_ledger_preview/main --cost-bps "$COST_BPS" 2>&1 | tee outputs/full_rebuild_logs/account_order_preview_main.log || true
          python tools/run_account_order_preview.py --account-state outputs/broker_replay/concentrated/account_state_latest.json --target outputs/concentrated_portfolio_latest.csv --price-cache cache_prices --portfolio-kind concentrated --output-dir outputs/account_ledger_preview/concentrated --cost-bps "$COST_BPS" 2>&1 | tee outputs/full_rebuild_logs/account_order_preview_concentrated.log || true
