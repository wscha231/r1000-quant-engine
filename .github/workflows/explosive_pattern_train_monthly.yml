name: Explosive Pattern Training (Monthly)

# Phase 17 v3 Layer 11 (2026-04-29) — monthly retrain of the dual entry/exit
# XGBoost classifiers used by r1000_features.compute_explosion_likelihood_score.
#
# Pipeline:
#   1. tools/build_explosive_pattern_db.py   — mine yfinance R3000 history,
#                                               emit events.parquet
#   2. tools/train_explosion_classifier.py   — train 6 binary classifiers
#                                               (entry T-12/-6/-3, exit T0/+3/+6)
#   3. Upload models + cv_metrics.json
#   4. Commit cloud_results/explosive_pattern_db/ snapshot

on:
  schedule:
    # 15th of each month, 16:00 UTC = 01:00 KST 16th (off-market hours)
    - cron: '0 16 15 * *'
  workflow_dispatch:
    inputs:
      years:
        description: 'years of yfinance history to mine'
        type: string
        default: '8'
      limit:
        description: 'limit ticker count (debug; 0 = all)'
        type: string
        default: '0'
      neg_per_pos:
        description: 'negative-sample multiplier for entry models'
        type: string
        default: '4'

permissions:
  contents: write   # commit cloud_results/explosive_pattern_db/

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt
          pip install xgboost>=2.0 yfinance>=0.2 pyyaml

      - name: Smoke pre-flight
        run: python tests/smoke_test.py --quick

      - name: Mine historical explosions
        run: |
          mkdir -p outputs/explosive_pattern_db
          YEARS="${{ github.event.inputs.years || '8' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          ARGS="--years $YEARS"
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi
          python tools/build_explosive_pattern_db.py $ARGS

      - name: Train dual entry/exit classifiers
        run: |
          NEG="${{ github.event.inputs.neg_per_pos || '4' }}"
          python tools/train_explosion_classifier.py --neg-per-pos "$NEG" --cv-folds 5

      - name: Upload models + metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explosive-pattern-models-${{ github.run_id }}
          path: outputs/explosive_pattern_db/
          retention-days: 730

      - name: Stage snapshot for commit
        if: always()
        run: |
          mkdir -p cloud_results/explosive_pattern_db
          # only commit lightweight artifacts (models JSON + metrics CSV/JSON)
          cp -v outputs/explosive_pattern_db/models/*.json cloud_results/explosive_pattern_db/ 2>/dev/null || true
          cp -v outputs/explosive_pattern_db/models/cv_metrics.json cloud_results/explosive_pattern_db/ 2>/dev/null || true
          cp -v outputs/explosive_pattern_db/models/feature_importance.csv cloud_results/explosive_pattern_db/ 2>/dev/null || true
          cp -v outputs/explosive_pattern_db/events.csv cloud_results/explosive_pattern_db/ 2>/dev/null || true

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          git add cloud_results/explosive_pattern_db/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): explosive pattern monthly retrain $(date +%Y-%m) [skip ci]"
          for i in 1 2 3 4; do
            if git push; then
              break
            fi
            sleep $((2 ** i))
          done
