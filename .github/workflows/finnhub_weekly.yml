name: Finnhub Weekly Collection

# Runs Monday 13:30 UTC = 22:30 KST (before Monday US market open)
# Full metric + recommendations + insider + earnings refresh for R1000 (~70 min)

on:
  schedule:
    - cron: '30 13 * * 1'    # 13:30 UTC Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finnhub_full:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore Finnhub cache
        uses: actions/cache@v4
        with:
          path: |
            aggressive/cache/finnhub
            aggressive/state/finnhub
          key: finnhub-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            finnhub-cache-${{ runner.os }}-

      - name: Full Finnhub collection
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          python aggressive/finnhub_collector.py --mode full

      - name: Upload parquet artifact
        uses: actions/upload-artifact@v4
        with:
          name: finnhub-features-${{ github.run_id }}
          path: aggressive/state/finnhub/r1000_features.parquet
          retention-days: 30

      - name: Telegram success alert
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          tok = os.environ['TELEGRAM_BOT_TOKEN']
          chat = os.environ['TELEGRAM_CHAT_ID']
          msg = 'Finnhub weekly collection complete. 1008 tickers refreshed.'
          requests.post(f'https://api.telegram.org/bot{tok}/sendMessage',
                        json={'chat_id':chat,'text':msg}, timeout=5)
          "

      - name: Telegram failure alert
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import os, requests
          tok = os.environ['TELEGRAM_BOT_TOKEN']
          chat = os.environ['TELEGRAM_CHAT_ID']
          msg = '[ALERT] Finnhub weekly collection FAILED. Check GitHub Actions logs.'
          requests.post(f'https://api.telegram.org/bot{tok}/sendMessage',
                        json={'chat_id':chat,'text':msg}, timeout=5)
          "

      - name: Commit parquet
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          git add -f aggressive/state/finnhub/r1000_features.parquet 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): finnhub weekly $(date +%Y-%m-%d) [skip ci]"
          git push || true
