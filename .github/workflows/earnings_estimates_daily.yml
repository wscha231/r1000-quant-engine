name: Earnings Estimates Daily Archive

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers to archive. Leave default for bounded smoke-size daily archive.'
        type: string
        default: 'AAPL,MSFT,NVDA,AMD,AVGO,MU,PLTR,TSLA,GOOGL,META,AMZN,MSFT,ASML,TSM,ARM,SMH,SOXX'
      universe_file:
        description: 'Optional CSV with ticker column. Manual use only for broader archives.'
        type: string
        default: ''
      universe_shard_file:
        description: 'Optional shard CSV from outputs/forward_estimate_universe_plan_20260709/shards. Overrides universe_file when supplied.'
        type: string
        default: ''
      auto_universe_shard:
        description: 'Rotate one broad-universe shard from the checked-in plan. Always enabled on schedule.'
        type: boolean
        default: false
      catchup_all_universe_shards:
        description: 'Manual catch-up: combine all checked-in universe shards in one run. Uses materially more free API quota.'
        type: boolean
        default: false
      incremental_universe_addons:
        description: 'Use the durable exact-universe queue. Always enabled on schedule.'
        type: boolean
        default: false
      collection_universe_file:
        description: 'Optional exact current-universe coverage CSV used to seed/update the durable 993-row canonical snapshot.'
        type: string
        default: 'outputs/free_historical_data_coverage/universe_coverage.csv'
      collection_stale_after_days:
        description: 'Refresh a successful forward snapshot when this many calendar days have elapsed.'
        type: string
        default: '7'
      max_new_universe_tickers:
        description: 'Cap newly added universe tickers per run; 0 disables this lane.'
        type: string
        default: '100'
      max_missing_universe_tickers:
        description: 'Cap never-observed exact-universe tickers per run; 0 disables this lane.'
        type: string
        default: '100'
      max_known_covered_tickers:
        description: 'Cap stale successful estimate tickers refreshed per run; 0 disables this lane.'
        type: string
        default: '300'
      max_uncovered_retry_tickers:
        description: 'Cap slow rotating uncovered retries per run; 0 disables this lane.'
        type: string
        default: '50'
      ticker_limit:
        description: 'Optional cap after combining tickers/universe file. 0 means no cap.'
        type: string
        default: '0'
      collector_max_errors:
        description: 'Optional collector error cap. Blank uses 100 normally and 5000 for all-shards catch-up; 0 disables the cap.'
        type: string
        default: ''
      fetch_date:
        description: 'PIT archive date. Defaults to UTC today.'
        type: string
        default: ''
      vendor_order:
        description: 'Comma-separated vendor order. Default pauses Alpha Vantage until key rotation is confirmed.'
        type: string
        default: 'fmp,finnhub'
  schedule:
    # 09:35 KST Tue-Sat, after most US after-close earnings data is visible.
    - cron: '35 0 * * 2-6'

permissions:
  contents: read
  actions: read

concurrency:
  # The archive, canonical universe, and queue checkpoint share one durable
  # Google Drive path across refs, so every writer must be serialized globally.
  group: earnings-estimates-daily-durable-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            cloud_results/full_rebuild/latest_global_alpha_universe
            data_static
            outputs/forward_estimate_universe_plan_20260709
            tools
          sparse-checkout-cone-mode: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt

      - name: Restore earnings estimate archive cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data_pit/events/earnings_estimates
            data_pit/events/earnings_revision_signals.parquet
            cache_prices_forward_paper
            outputs/free_data_forward_paper_ledger
            outputs/free_data_selection_overlay
          key: earnings-estimates-daily-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            earnings-estimates-daily-${{ runner.os }}-

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          RCLONE_CONFIG_GDRIVE: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_GDRIVE:-}" ] && [ -z "${GOOGLE_SERVICE_ACCOUNT_KEY:-}" ]; then
            echo "[gdrive] no auth configured; continuing cache/artifact only"
            echo "GDRIVE_READY=no" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -sLo /tmp/rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q /tmp/rclone.zip -d /tmp/
          sudo mv /tmp/rclone-*/rclone /usr/local/bin/rclone
          chmod +x /usr/local/bin/rclone
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG_GDRIVE:-}" ]; then
            echo "$RCLONE_CONFIG_GDRIVE" > ~/.config/rclone/rclone.conf
          else
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > /tmp/sa.json
            {
              printf '%s\n' '[gdrive]' 'type = drive' 'scope = drive' 'service_account_file = /tmp/sa.json'
              if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
                printf 'root_folder_id = %s\n' "$GDRIVE_ROOT_FOLDER_ID"
              fi
            } > ~/.config/rclone/rclone.conf
          fi
          echo "GDRIVE_READY=yes" >> "$GITHUB_ENV"

      - name: Restore earnings estimate archive from Google Drive
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          mkdir -p data_pit/events
          if rclone lsf "$BASE""data_pit/events/earnings_estimates" >/dev/null 2>&1; then
            timeout 8m rclone copy "$BASE""data_pit/events/earnings_estimates" data_pit/events/earnings_estimates/ \
              --transfers 4 --checkers 8 --stats 30s --stats-one-line || true
          fi
          if rclone lsf "$BASE""data_pit/events/earnings_revision_signals.parquet" >/dev/null 2>&1; then
            timeout 3m rclone copyto "$BASE""data_pit/events/earnings_revision_signals.parquet" \
              data_pit/events/earnings_revision_signals.parquet || true
          fi
          mkdir -p data_pit/free outputs/free_data_forward_paper_ledger \
            outputs/free_data_selection_overlay_previous cache_prices_forward_paper
          if rclone lsf "$BASE""data_pit/free/av_listing_status.parquet" >/dev/null 2>&1; then
            timeout 2m rclone copyto "$BASE""data_pit/free/av_listing_status.parquet" \
              data_pit/free/av_listing_status.parquet || true
          fi
          if rclone lsf "$BASE""data_pit/events/earnings_calendar_history.parquet" >/dev/null 2>&1; then
            timeout 2m rclone copyto "$BASE""data_pit/events/earnings_calendar_history.parquet" \
              data_pit/events/earnings_calendar_history.parquet || true
          fi
          if rclone lsf "$BASE""research_state/free_data_forward_paper_ledger" >/dev/null 2>&1; then
            timeout 3m rclone copy "$BASE""research_state/free_data_forward_paper_ledger" \
              outputs/free_data_forward_paper_ledger/ || true
          fi
          if rclone lsf "$BASE""research_state/free_data_selection_overlay" >/dev/null 2>&1; then
            timeout 3m rclone copy "$BASE""research_state/free_data_selection_overlay" \
              outputs/free_data_selection_overlay_previous/ || true
          fi
          if rclone lsf "$BASE""research_state/free_data_forward_paper_price_cache" >/dev/null 2>&1; then
            timeout 5m rclone copy "$BASE""research_state/free_data_forward_paper_price_cache" \
              cache_prices_forward_paper/ --transfers 4 --checkers 8 || true
          fi

      - name: Resolve ticker set and universe shard
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TICKERS: ${{ github.event.inputs.tickers || '' }}
          INPUT_UNIVERSE_FILE: ${{ github.event.inputs.universe_file || '' }}
          INPUT_UNIVERSE_SHARD_FILE: ${{ github.event.inputs.universe_shard_file || '' }}
          INPUT_TICKER_LIMIT: ${{ github.event.inputs.ticker_limit || '0' }}
          INPUT_COLLECTOR_MAX_ERRORS: ${{ github.event.inputs.collector_max_errors || '' }}
          INPUT_AUTO_UNIVERSE_SHARD: ${{ github.event.inputs.auto_universe_shard || 'false' }}
          INPUT_CATCHUP_ALL_UNIVERSE_SHARDS: ${{ github.event.inputs.catchup_all_universe_shards || 'false' }}
          INPUT_INCREMENTAL_UNIVERSE_ADDONS: ${{ github.event.inputs.incremental_universe_addons || 'false' }}
          INPUT_COLLECTION_UNIVERSE_FILE: ${{ github.event.inputs.collection_universe_file || 'outputs/free_historical_data_coverage/universe_coverage.csv' }}
          INPUT_COLLECTION_STALE_AFTER_DAYS: ${{ github.event.inputs.collection_stale_after_days || '7' }}
          INPUT_MAX_NEW_UNIVERSE_TICKERS: ${{ github.event.inputs.max_new_universe_tickers || '100' }}
          INPUT_MAX_MISSING_UNIVERSE_TICKERS: ${{ github.event.inputs.max_missing_universe_tickers || '100' }}
          INPUT_MAX_KNOWN_COVERED_TICKERS: ${{ github.event.inputs.max_known_covered_tickers || '300' }}
          INPUT_MAX_UNCOVERED_RETRY_TICKERS: ${{ github.event.inputs.max_uncovered_retry_tickers || '50' }}
          DEFAULT_TICKERS: AAPL,MSFT,NVDA,AMD,AVGO,MU,PLTR,TSLA,GOOGL,META,AMZN,ASML,TSM,ARM,SMH,SOXX
          SHARD_DIR: outputs/forward_estimate_universe_plan_20260709/shards
        run: |
          set -euo pipefail
          TICKERS="${INPUT_TICKERS:-}"
          UNIVERSE_FILE="${INPUT_UNIVERSE_FILE:-}"
          TICKER_LIMIT="${INPUT_TICKER_LIMIT:-0}"
          MAX_ERRORS="${INPUT_COLLECTOR_MAX_ERRORS:-}"
          SHARD_ID=""
          SHARD_FILE=""
          SHARD_MODE="manual_or_watchlist_only"
          ENABLE_INCREMENTAL_ADDONS="${INPUT_INCREMENTAL_UNIVERSE_ADDONS:-false}"
          QUEUE_RESOLVED="false"
          COLLECTION_REQUIRED="true"
          if [ "${EVENT_NAME}" = "schedule" ]; then
            ENABLE_INCREMENTAL_ADDONS="true"
          fi

          if [ -n "${INPUT_UNIVERSE_SHARD_FILE:-}" ]; then
            UNIVERSE_FILE="${INPUT_UNIVERSE_SHARD_FILE}"
            SHARD_FILE="${INPUT_UNIVERSE_SHARD_FILE}"
            SHARD_ID="$(basename "${INPUT_UNIVERSE_SHARD_FILE}" .csv)"
            SHARD_MODE="manual_shard"
          fi

          if [ "${INPUT_CATCHUP_ALL_UNIVERSE_SHARDS}" = "true" ]; then
            if [ ! -d "${SHARD_DIR}" ]; then
              echo "::error::missing shard dir ${SHARD_DIR}"
              exit 2
            fi
            mkdir -p outputs/earnings_estimates_daily
            python tools/build_forward_estimate_catchup_universe.py \
              --shard-dir "${SHARD_DIR}" \
              --output outputs/earnings_estimates_daily/catchup_all_shards_universe.csv \
              --summary outputs/earnings_estimates_daily/catchup_universe_summary.json \
              --include-tickers "${DEFAULT_TICKERS}" \
              --max-tickers "${TICKER_LIMIT}"
            UNIVERSE_FILE="outputs/earnings_estimates_daily/catchup_all_shards_universe.csv"
            SHARD_ID="all_shards"
            SHARD_FILE="${UNIVERSE_FILE}"
            SHARD_MODE="all_shards_catchup"
            TICKER_LIMIT="0"
            if [ -z "${MAX_ERRORS}" ]; then
              MAX_ERRORS="5000"
            fi
          elif [ "${EVENT_NAME}" = "schedule" ] || [ "${INPUT_AUTO_UNIVERSE_SHARD}" = "true" ]; then
            if [ ! -d "${SHARD_DIR}" ]; then
              echo "::error::missing shard dir ${SHARD_DIR}"
              exit 2
            fi
            SHARD_COUNT="$(find "${SHARD_DIR}" -maxdepth 1 -name 'shard_*.csv' | wc -l | tr -d ' ')"
            if [ "${SHARD_COUNT}" = "0" ]; then
              echo "::error::no shard csv files under ${SHARD_DIR}"
              exit 2
            fi
            DAY_INDEX="$(( $(date -u +%s) / 86400 ))"
            SHARD_INDEX="$(( DAY_INDEX % SHARD_COUNT ))"
            SHARD_ID="$(printf 'shard_%03d' "${SHARD_INDEX}")"
            SHARD_FILE="${SHARD_DIR}/${SHARD_ID}.csv"
            if [ ! -s "${SHARD_FILE}" ]; then
              echo "::error::resolved shard is empty or missing: ${SHARD_FILE}"
              exit 2
            fi
            UNIVERSE_FILE="${SHARD_FILE}"
            TICKER_LIMIT="0"
            SHARD_MODE="rotating_shard"
          fi

          if [ "${INPUT_CATCHUP_ALL_UNIVERSE_SHARDS}" != "true" ] && [ "${ENABLE_INCREMENTAL_ADDONS}" = "true" ]; then
            mkdir -p outputs/earnings_estimates_daily
            python tools/build_forward_estimate_incremental_universe.py \
              --shard-dir "${SHARD_DIR}" \
              --snapshot-dir data_pit/events/earnings_estimates \
              --coverage-file "${INPUT_COLLECTION_UNIVERSE_FILE}" \
              --latest-run cloud_results/full_rebuild/latest_global_alpha_universe \
              --canonical-universe data_pit/events/earnings_estimates/collection_universe.csv \
              --checkpoint data_pit/events/earnings_estimates/collection_checkpoint.json \
              --output outputs/earnings_estimates_daily/incremental_universe.csv \
              --queue-output outputs/earnings_estimates_daily/collection_queue.csv \
              --summary outputs/earnings_estimates_daily/incremental_universe_summary.json \
              --report outputs/earnings_estimates_daily/collection_queue_report.md \
              --include-tickers "${TICKERS:-${DEFAULT_TICKERS}}" \
              --include-file "${UNIVERSE_FILE:-}" \
              --expected-universe-count 993 \
              --stale-after-days "${INPUT_COLLECTION_STALE_AFTER_DAYS:-7}" \
              --max-new-tickers "${INPUT_MAX_NEW_UNIVERSE_TICKERS:-100}" \
              --max-missing-tickers "${INPUT_MAX_MISSING_UNIVERSE_TICKERS:-100}" \
              --max-covered-tickers "${INPUT_MAX_KNOWN_COVERED_TICKERS:-300}" \
              --max-retry-tickers "${INPUT_MAX_UNCOVERED_RETRY_TICKERS:-50}"
            UNIVERSE_FILE="outputs/earnings_estimates_daily/incremental_universe.csv"
            SHARD_FILE="${UNIVERSE_FILE}"
            TICKERS=""
            QUEUE_RESOLVED="true"
            SELECTED_COUNT="$(( $(wc -l < "${UNIVERSE_FILE}") - 1 ))"
            if [ "${SELECTED_COUNT}" -le 0 ]; then
              COLLECTION_REQUIRED="false"
            fi
            if [ "${SHARD_MODE}" = "manual_or_watchlist_only" ]; then
              SHARD_MODE="incremental_addons"
            else
              SHARD_MODE="${SHARD_MODE}_incremental_addons"
            fi
            TICKER_LIMIT="0"
          fi

          if [ -z "${MAX_ERRORS}" ]; then
            MAX_ERRORS="100"
          fi

          if [ -z "${TICKERS}" ] && [ "${QUEUE_RESOLVED}" != "true" ]; then
            TICKERS="${DEFAULT_TICKERS}"
          fi
          if [ "${EVENT_NAME}" = "schedule" ] && [ -z "${SHARD_ID}" ]; then
            echo "::error::scheduled archive must resolve a broad-universe shard"
            exit 2
          fi

          {
            echo "RESOLVED_TICKERS=${TICKERS}"
            echo "RESOLVED_UNIVERSE_FILE=${UNIVERSE_FILE}"
            echo "RESOLVED_TICKER_LIMIT=${TICKER_LIMIT}"
            echo "RESOLVED_SHARD_ID=${SHARD_ID}"
            echo "RESOLVED_SHARD_FILE=${SHARD_FILE}"
            echo "RESOLVED_SHARD_MODE=${SHARD_MODE}"
            echo "RESOLVED_MAX_ERRORS=${MAX_ERRORS}"
            echo "RESOLVED_COLLECTION_REQUIRED=${COLLECTION_REQUIRED}"
          } >> "$GITHUB_ENV"
          echo "[archive] tickers=${TICKERS}"
          echo "[archive] universe_file=${UNIVERSE_FILE:-<none>}"
          echo "[archive] ticker_limit=${TICKER_LIMIT}"
          echo "[archive] shard_id=${SHARD_ID:-<manual_or_watchlist_only>}"
          echo "[archive] shard_mode=${SHARD_MODE}"
          echo "[archive] max_errors=${MAX_ERRORS}"
          echo "[archive] collection_required=${COLLECTION_REQUIRED}"

      - name: Collect forward-only estimate archive
        if: env.RESOLVED_COLLECTION_REQUIRED == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ESTIMATE_VENDOR_ORDER: ${{ github.event.inputs.vendor_order || 'fmp,finnhub' }}
          FETCH_DATE: ${{ github.event.inputs.fetch_date || '' }}
        run: |
          set -euo pipefail
          mkdir -p outputs/earnings_estimates_daily data_pit/events/earnings_estimates
          DATE_ARG=()
          if [ -n "${FETCH_DATE:-}" ]; then
            DATE_ARG=(--fetch-date "$FETCH_DATE")
          fi
          python tools/collect_earnings_estimates_finnhub.py \
            --tickers "${RESOLVED_TICKERS}" \
            --universe-file "${RESOLVED_UNIVERSE_FILE}" \
            --ticker-limit "${RESOLVED_TICKER_LIMIT}" \
            "${DATE_ARG[@]}" \
            --snapshot-dir data_pit/events/earnings_estimates \
            --signals-output data_pit/events/earnings_revision_signals.parquet \
            --summary outputs/earnings_estimates_daily/summary.json \
            --collection-checkpoint data_pit/events/earnings_estimates/collection_checkpoint.json \
            --collection-queue outputs/earnings_estimates_daily/collection_queue.csv \
            --vendor-order "$ESTIMATE_VENDOR_ORDER" \
            --sleep-seconds 1.1 \
            --max-errors "${RESOLVED_MAX_ERRORS:-100}" \
            --entitlement-circuit-threshold 3 \
            2>&1 | tee outputs/earnings_estimates_daily/collector.log

      - name: Build earnings estimate archive manifest
        id: build_manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p outputs/earnings_estimates_daily data_pit/events/earnings_estimates
          python tools/build_earnings_estimate_archive_manifest.py \
            --snapshot-dir data_pit/events/earnings_estimates \
            --signals data_pit/events/earnings_revision_signals.parquet \
            --summary outputs/earnings_estimates_daily/summary.json \
            --collector-log outputs/earnings_estimates_daily/collector.log \
            --manifest outputs/earnings_estimates_daily/archive_manifest.json \
            --index data_pit/events/earnings_estimates/archive_index.jsonl \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --head-sha "${GITHUB_SHA}" \
            --ref "${GITHUB_REF_NAME}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --artifact-name "earnings-estimates-daily-${GITHUB_RUN_ID}" \
            --shard-id "${RESOLVED_SHARD_ID:-}" \
            --shard-file "${RESOLVED_SHARD_FILE:-}" \
            --shard-mode "${RESOLVED_SHARD_MODE:-}" \
            --queue-summary outputs/earnings_estimates_daily/incremental_universe_summary.json \
            --queue-checkpoint data_pit/events/earnings_estimates/collection_checkpoint.json \
            --queue-csv outputs/earnings_estimates_daily/collection_queue.csv \
            --queue-report outputs/earnings_estimates_daily/collection_queue_report.md

      - name: Resolve completed NYSE session for forward paper archive
        id: forward_market
        if: always()
        run: |
          set -euo pipefail
          mkdir -p outputs/free_data_forward_paper_ledger
          python tools/run_daily_market_session_gate.py \
            --output outputs/free_data_forward_paper_ledger/market_session_gate.json \
            --min-close-age-minutes 90 \
            --max-close-age-hours 36

      - name: Append bounded forward paper cohorts and resolve elapsed outcomes
        if: steps.forward_market.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          LATEST="cloud_results/full_rebuild/latest_global_alpha_universe"
          BASELINE_ARGS=()
          if [ -s outputs/free_data_selection_overlay_previous/ranked_universe.csv ]; then
            BASELINE_ARGS=(--baseline-ranked outputs/free_data_selection_overlay_previous/ranked_universe.csv)
          elif [ -s outputs/free_data_selection_overlay/ranked_universe.csv ]; then
            BASELINE_ARGS=(--baseline-ranked outputs/free_data_selection_overlay/ranked_universe.csv)
          fi
          python tools/run_free_data_selection_overlay.py \
            --scored "$LATEST/scored_latest.csv" \
            --estimate-signals data_pit/events/earnings_revision_signals.parquet \
            --listing-status data_pit/free/av_listing_status.parquet \
            --earnings-calendar data_pit/events/earnings_calendar_history.parquet \
            --decision-date "$LAST_NYSE_SESSION_DATE" \
            "${BASELINE_ARGS[@]}" \
            --top-n 30 \
            --output-dir outputs/free_data_selection_overlay
          python tools/build_forward_paper_price_universe.py \
            --ranked-universe outputs/free_data_selection_overlay/ranked_universe.csv \
            --current-status outputs/free_data_forward_paper_ledger/current_status.csv \
            --output outputs/free_data_forward_paper_ledger/price_universe.csv \
            --summary outputs/free_data_forward_paper_ledger/price_universe_summary.json \
            --benchmark SPY
          python tools/build_replay_price_cache.py \
            --books outputs/free_data_forward_paper_ledger/price_universe.csv \
            --output-dir cache_prices_forward_paper \
            --start 2026-07-01 \
            --refresh-stale-days 1 \
            --batch-size 40
          python tools/run_free_data_forward_paper_ledger.py \
            --candidates outputs/free_data_selection_overlay/selected_candidates.csv \
            --ranked-universe outputs/free_data_selection_overlay/ranked_universe.csv \
            --overlay-summary outputs/free_data_selection_overlay/summary.json \
            --price-cache cache_prices_forward_paper \
            --output-dir outputs/free_data_forward_paper_ledger \
            --benchmark SPY \
            --as-of-date "$LAST_NYSE_SESSION_DATE"

      - name: Save earnings estimate archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data_pit/events/earnings_estimates
            data_pit/events/earnings_revision_signals.parquet
            cache_prices_forward_paper
            outputs/free_data_forward_paper_ledger
            outputs/free_data_selection_overlay
          key: earnings-estimates-daily-${{ runner.os }}-${{ github.run_id }}

      - name: Upload earnings estimate artifact
        if: ${{ always() && steps.build_manifest.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: earnings-estimates-daily-${{ github.run_id }}
          path: |
            data_pit/events/earnings_estimates/
            data_pit/events/earnings_revision_signals.parquet
            outputs/earnings_estimates_daily/
            outputs/free_data_selection_overlay/
            outputs/free_data_forward_paper_ledger/
            cache_prices_forward_paper/replay_price_cache_manifest.json
          retention-days: 30

      - name: Sync earnings estimate archive to Google Drive
        if: ${{ always() && steps.build_manifest.outcome == 'success' }}
        env:
          GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_FOLDER_NAME: r1000_top30_institutional
        run: |
          set -euo pipefail
          if [ "${GDRIVE_READY:-no}" != "yes" ]; then
            exit 0
          fi
          if [ -n "${GDRIVE_ROOT_FOLDER_ID:-}" ]; then
            BASE="gdrive:"
          else
            BASE="gdrive:${GDRIVE_FOLDER_NAME}/"
          fi
          if [ -d data_pit/events/earnings_estimates ]; then
            timeout 8m rclone copy data_pit/events/earnings_estimates "$BASE""data_pit/events/earnings_estimates/" \
              --transfers 4 --checkers 8 --stats 30s --stats-one-line || true
          fi
          if [ -s data_pit/events/earnings_revision_signals.parquet ]; then
            timeout 3m rclone copyto data_pit/events/earnings_revision_signals.parquet \
              "$BASE""data_pit/events/earnings_revision_signals.parquet" || true
          fi
          if [ -d outputs/earnings_estimates_daily ]; then
