              or health.get("research_only") is not True
              or health.get("review_only") is not True
              or any(health.get(field) is not False for field in required_false)
              or health.get("contract_failures") != failures
              or set(gates) != expected_gates
              or any(gates.get(name) is not False for name in expected_gates)
          ):
              raise SystemExit("BLOCKED challenger operation health is unsafe")
          PY

      - name: Upload sector leadership research artifact
        id: artifact_upload
        if: >-
          always() && !cancelled() &&
          ((steps.artifacts.outputs.catchup == 'yes' &&
            steps.verify_catchup.outcome == 'success') ||
           (steps.artifacts.outputs.eligible == 'yes' &&
            steps.challenger.outcome == 'success' &&
            steps.verify_ready.outcome == 'success') ||
           (steps.artifacts.outputs.eligible == 'yes' &&
            steps.challenger.outcome == 'failure' &&
            steps.verify_blocked.outcome == 'success'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: run287-sector-leadership-research-${{ steps.source.outputs.run_id }}
          path: outputs/run287_sector_leadership_research
          if-no-files-found: error
          retention-days: 45

      - name: Fail after publishing BLOCKED challenger diagnostics
        if: >-
          always() && !cancelled() &&
          steps.artifacts.outputs.eligible == 'yes' &&
          steps.challenger.outcome == 'failure' &&
          steps.verify_blocked.outcome == 'success' &&
          steps.artifact_upload.outcome == 'success'
        run: |
          echo "[sector-leadership] BLOCKED diagnostics were verified and retained"
          exit 1
