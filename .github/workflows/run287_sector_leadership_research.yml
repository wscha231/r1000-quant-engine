name: Run287 Sector Leadership Research

# Research-only downstream consumer. It may read one accepted daily operating
# run, but it cannot publish or mutate portfolio, paper, or trading state.
on:
  workflow_run:
    workflows:
      - Daily Operating Selection Refresh
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Daily Operating Selection Refresh run id
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: run287-sector-leadership-research-${{ github.event.workflow_run.id || inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  research:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.source_run_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve and verify successful default-branch source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "${REQUESTED_SOURCE_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "[sector-leadership] BLOCKED: source_run_id must be a positive integer"
            exit 2
          fi
          gh api "repos/${GITHUB_REPOSITORY}" > "$RUNNER_TEMP/source-repository.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/daily_operating_selection_refresh.yml" \
            > "$RUNNER_TEMP/source-workflow.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_SOURCE_RUN_ID}" \
            > "$RUNNER_TEMP/source-run.json"
          python - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          repo = json.loads(
              Path(os.environ["RUNNER_TEMP"], "source-repository.json").read_text(
                  encoding="utf-8"
              )
          )
          workflow = json.loads(
              Path(os.environ["RUNNER_TEMP"], "source-workflow.json").read_text(
                  encoding="utf-8"
              )
          )
          run = json.loads(
              Path(os.environ["RUNNER_TEMP"], "source-run.json").read_text(
                  encoding="utf-8"
              )
          )
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          expected_repo = os.environ["GITHUB_REPOSITORY"]
          requested = int(os.environ["REQUESTED_SOURCE_RUN_ID"])
          workflow_path = ".github/workflows/daily_operating_selection_refresh.yml"
          default_branch = str(repo.get("default_branch") or "")
          run_path = str(run.get("path") or "").split("@", 1)[0]
          failures = []
          if repo.get("full_name") != expected_repo:
              failures.append("repository_identity")
          if default_branch != "master":
              failures.append("repository_default_branch")
          if (
              os.environ.get("GITHUB_REF_TYPE") != "branch"
              or os.environ.get("GITHUB_REF_NAME") != default_branch
              or re.fullmatch(
                  r"[0-9a-f]{40}",
                  str(os.environ.get("GITHUB_SHA") or "").lower(),
              )
              is None
          ):
              failures.append("research_workflow_default_branch")
          if (
              workflow.get("path") != workflow_path
              or workflow.get("state") != "active"
              or int(workflow.get("id") or 0) <= 0
          ):
              failures.append("workflow_identity")
          if int(run.get("id") or 0) != requested:
              failures.append("run_id")
          if int(run.get("workflow_id") or 0) != int(workflow.get("id") or 0):
              failures.append("run_workflow_id")
          if run_path != workflow_path:
              failures.append("run_workflow_path")
          if (run.get("repository") or {}).get("full_name") != expected_repo:
              failures.append("run_repository")
          if (run.get("head_repository") or {}).get("full_name") != expected_repo:
              failures.append("run_head_repository")
          if run.get("head_branch") != default_branch:
              failures.append("run_default_branch")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              failures.append("run_not_successful")
          head_sha = str(run.get("head_sha") or "").lower()
          if re.fullmatch(r"[0-9a-f]{40}", head_sha) is None:
              failures.append("run_head_sha")
          if str(os.environ.get("GITHUB_SHA") or "").lower() != head_sha:
              failures.append("research_execution_sha_mismatch")
          attempt = run.get("run_attempt")
          if type(attempt) is not int or attempt <= 0:
              failures.append("run_attempt")
          for label in ("created_at", "updated_at"):
              if not str(run.get(label) or "").endswith("Z"):
                  failures.append(f"run_{label}")
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_run":
              event_run = event.get("workflow_run") or {}
              if (
                  int(event_run.get("id") or 0) != requested
                  or event_run.get("conclusion") != "success"
                  or event_run.get("head_branch") != default_branch
                  or event_run.get("head_sha") != head_sha
                  or (event_run.get("head_repository") or {}).get("full_name")
                  != expected_repo
              ):
                  failures.append("workflow_run_event_identity")
          if failures:
              raise SystemExit(
                  "source run verification failed: " + ",".join(sorted(set(failures)))
              )
          values = {
              "run_id": str(requested),
              "run_attempt": str(attempt),
              "head_sha": head_sha,
              "default_branch": default_branch,
              "workflow_path": workflow_path,
              "workflow_identity": (
                  expected_repo
                  + "/"
                  + workflow_path
                  + "@refs/heads/"
                  + default_branch
              ),
              "created_at": str(run["created_at"]),
              "updated_at": str(run["updated_at"]),
          }
          with out.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe source output: {key}")
                  handle.write(f"{key}={value}\n")
          PY

      - name: Checkout research implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install bounded research dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements_github.txt

      - name: Resolve and download exact source artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p inputs/source
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/source-artifacts.json"
          python - "$GITHUB_OUTPUT" "$RUNNER_TEMP/selected-source-artifacts.json" <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          selected_path = Path(sys.argv[2])
          # Recent July 2026 daily/catch-up archives were at most 1.73 MiB.
          # Keep ample growth room without accepting an unbounded download.
          max_source_archive_bytes = 64 * 1024**2
          payload = json.loads(
              Path(os.environ["RUNNER_TEMP"], "source-artifacts.json").read_text(
                  encoding="utf-8"
              )
          )
          if int(payload.get("total_count") or 0) > 100:
              raise SystemExit("source artifact selection exceeded the bounded page")
          run_id = os.environ["SOURCE_RUN_ID"]
          source_head_sha = os.environ["SOURCE_HEAD_SHA"]
          expected_names = (
              f"daily-operating-selection-refresh-{run_id}",
              f"accepted-paper-transaction-{run_id}",
          )
          artifacts = payload.get("artifacts") or []
          exact = {
              name: [item for item in artifacts if item.get("name") == name]
              for name in expected_names
          }
          catchup = [
              item
              for item in artifacts
              if re.fullmatch(
                  rf"accepted-paper-catchup-\d{{4}}-\d{{2}}-\d{{2}}-{run_id}",
                  str(item.get("name") or ""),
              )
              and item.get("expired") is False
          ]
          if all(len(exact[name]) == 0 for name in expected_names) and len(catchup) == 1:
              artifact = catchup[0]
              name = str(artifact.get("name") or "")
              matched = re.fullmatch(
                  rf"accepted-paper-catchup-(\d{{4}}-\d{{2}}-\d{{2}})-{run_id}",
                  name,
              )
              digest = str(artifact.get("digest") or "").lower()
              size = artifact.get("size_in_bytes")
              artifact_run = artifact.get("workflow_run") or {}
              try:
                  catchup_date = (
                      dt.date.fromisoformat(matched.group(1))
                      if matched is not None
                      else None
                  )
              except ValueError:
                  catchup_date = None
              if (
                  catchup_date is None
                  or type(artifact.get("id")) is not int
                  or int(artifact["id"]) <= 0
                  or type(size) is not int
                  or size <= 0
                  or size > max_source_archive_bytes
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                  or int(artifact_run.get("id") or 0) != int(run_id)
                  or str(artifact_run.get("head_sha") or "").lower()
                  != source_head_sha
              ):
                  raise SystemExit("catch-up artifact metadata is invalid")
              with out.open("a", encoding="utf-8") as handle:
                  handle.write("eligible=no\n")
                  handle.write("catchup=yes\n")
                  handle.write("skip_reason=chronological_catchup_has_no_normal_artifacts\n")
                  handle.write(f"catchup_session_date={catchup_date.isoformat()}\n")
                  handle.write(f"catchup_artifact_name={name}\n")
                  handle.write(
                      "catchup_artifact_digest="
                      + digest.removeprefix("sha256:")
                      + "\n"
                  )
              selected_path.write_text(
                  json.dumps(
                      {
                          "catchup": {
                              "id": int(artifact["id"]),
                              "name": name,
                              "digest": digest,
                              "size_in_bytes": size,
                              "session_date": catchup_date.isoformat(),
                          }
                      },
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)
          if any(len(exact[name]) != 1 for name in expected_names):
              raise SystemExit(
                  "exact daily and accepted source artifacts are both required"
              )
          selected = {}
          for name in expected_names:
              artifact = exact[name][0]
              digest = str(artifact.get("digest") or "").lower()
              size = artifact.get("size_in_bytes")
              artifact_run = artifact.get("workflow_run") or {}
              if (
                  artifact.get("expired") is not False
                  or type(artifact.get("id")) is not int
                  or int(artifact["id"]) <= 0
                  or type(size) is not int
                  or size <= 0
                  or size > max_source_archive_bytes
                  or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None
                  or int(artifact_run.get("id") or 0) != int(run_id)
                  or str(artifact_run.get("head_sha") or "").lower()
                  != source_head_sha
              ):
                  raise SystemExit(f"source artifact metadata invalid: {name}")
              selected[name] = {
                  "id": int(artifact["id"]),
                  "digest": digest,
                  "name": name,
                  "size_in_bytes": size,
              }
          selected_path.write_text(
              json.dumps(selected, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with out.open("a", encoding="utf-8") as handle:
              handle.write("eligible=yes\n")
              handle.write(
                  "daily_digest="
                  + selected[expected_names[0]]["digest"].removeprefix("sha256:")
                  + "\n"
              )
              handle.write(
                  "accepted_digest="
                  + selected[expected_names[1]]["digest"].removeprefix("sha256:")
                  + "\n"
              )
          PY
          if ! grep -qx 'eligible=yes' "$GITHUB_OUTPUT"; then
            echo "[sector-leadership] SKIPPED: catch-up has no normal accepted inputs"
            exit 0
          fi
          readarray -t ARTIFACT_ROWS < <(
            python - "$RUNNER_TEMP/selected-source-artifacts.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          selected = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for name in sorted(selected):
              item = selected[name]
              print(
                  f"{item['id']}\t{item['digest']}\t"
                  f"{item['size_in_bytes']}\t{name}"
              )
          PY
          )
          for row in "${ARTIFACT_ROWS[@]}"; do
            IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_DIGEST ARTIFACT_SIZE ARTIFACT_NAME <<<"$row"
            if [[ "$ARTIFACT_NAME" == daily-operating-selection-refresh-* ]]; then
              DESTINATION="inputs/source/daily"
              ARCHIVE="$RUNNER_TEMP/daily-operating-source.zip"
            else
              DESTINATION="inputs/source/accepted"
              ARCHIVE="$RUNNER_TEMP/accepted-paper-source.zip"
            fi
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > "$ARCHIVE"
            python - "$ARCHIVE" "$ARTIFACT_DIGEST" "$ARTIFACT_SIZE" "$ARTIFACT_NAME" "$DESTINATION" <<'PY'
          import hashlib
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          expected = sys.argv[2].removeprefix("sha256:")
          expected_size = int(sys.argv[3])
          artifact_name = sys.argv[4]
          destination = Path(sys.argv[5])
          max_archive_bytes = 64 * 1024**2
          if artifact_name.startswith("daily-operating-selection-refresh-"):
              max_member_bytes = 512 * 1024**2
          elif artifact_name.startswith("accepted-paper-transaction-"):
              max_member_bytes = 256 * 1024**2
          else:
              raise SystemExit("unexpected source artifact name")
          archive_size = archive.stat().st_size
          if (
              archive_size <= 0
              or archive_size > max_archive_bytes
              or archive_size != expected_size
          ):
              raise SystemExit("GitHub artifact archive size mismatch")
          digest = hashlib.sha256()
          with archive.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          if actual != expected:
              raise SystemExit("GitHub artifact archive digest mismatch")
          destination.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(archive) as bundle:
              infos = bundle.infolist()
              if len(infos) > 20000:
                  raise SystemExit("artifact entry count exceeds bound")
              if sum(info.file_size for info in infos) > 512 * 1024**2:
                  raise SystemExit("artifact expanded size exceeds bound")
              member_types = {}
              for info in infos:
                  pure = PurePosixPath(info.filename)
                  mode = info.external_attr >> 16
                  normalized = pure.as_posix()
                  is_directory = info.is_dir()
                  if (
                      pure.is_absolute()
                      or ".." in pure.parts
                      or "\\" in info.filename
                      or stat.S_ISLNK(mode)
                      or not pure.parts
                      or normalized in {"", "."}
                      or info.flag_bits & 1
                      or info.file_size < 0
                      or info.file_size > max_member_bytes
                      or (is_directory and info.file_size != 0)
                  ):
                      raise SystemExit("unsafe artifact archive member")
                  if normalized in member_types:
                      raise SystemExit("duplicate normalized artifact archive member")
                  for index in range(1, len(pure.parts)):
                      ancestor = "/".join(pure.parts[:index])
                      if member_types.get(ancestor) is False:
                          raise SystemExit("artifact archive file-directory collision")
                  if not is_directory and any(
                      existing.startswith(normalized + "/")
                      for existing in member_types
                  ):
                      raise SystemExit("artifact archive file-directory collision")
                  member_types[normalized] = is_directory
                  target = destination.joinpath(*pure.parts)
                  if is_directory:
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.open(info) as source, target.open("wb") as sink:
                      shutil.copyfileobj(source, sink)
          PY
          done

      - name: Emit observable catch-up research skip
        if: steps.artifacts.outputs.catchup == 'yes'
        run: |
          set -euo pipefail
          rm -rf outputs/run287_sector_leadership_research
          python tools/run_run287_sector_leadership_challenger.py \
            --emit-catchup-skip \
            --source-run-id "${{ steps.source.outputs.run_id }}" \
            --source-run-attempt "${{ steps.source.outputs.run_attempt }}" \
            --source-commit-sha "${{ steps.source.outputs.head_sha }}" \
            --source-session-date "${{ steps.artifacts.outputs.catchup_session_date }}" \
            --source-workflow "${{ steps.source.outputs.workflow_identity }}" \
            --output-dir outputs/run287_sector_leadership_research

      - name: Verify observable catch-up research skip
        id: verify_catchup
        if: steps.artifacts.outputs.catchup == 'yes'
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_COMMIT_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_SESSION_DATE: ${{ steps.artifacts.outputs.catchup_session_date }}
          SOURCE_WORKFLOW: ${{ steps.source.outputs.workflow_identity }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          status = "SKIPPED_CATCHUP_NO_PIT_SCORE_SNAPSHOT"
          root = Path("outputs/run287_sector_leadership_research")
          required = {
              "source_manifest.json",
              "feature_manifest.json",
              "experiment_ledger.json",
              "sector_leadership.csv",
              "subsector_leadership.csv",
              "leadership_transitions.csv",
              "candidate_ranking.csv",
              "operation_health.json",
              "summary.json",
              "report.md",
          }
          if not root.is_dir():
              raise SystemExit("catch-up research skip output is missing")
          entries = list(root.iterdir())
          observed = {path.name for path in entries}
          if observed != required or any(not path.is_file() for path in entries):
              raise SystemExit(
                  f"catch-up research skip file contract mismatch: {sorted(observed)}"
              )
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("catch-up research skip may not contain symlinks")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          source = summary.get("source_identity") or {}
          required_false = (
              "production_activation_allowed",
              "live_trading_enabled",
              "target_books_mutated",
              "orders_generated",
              "automatic_promotion_allowed",
              "automatic_champion_replacement_allowed",
              "production_mutation_allowed",
              "portfolio_weights_written",
              "weights_mutated",
              "cash_allocator_written",
              "accounts_written",
              "account_state_mutated",
              "operating_ledgers_written",
              "operating_ledger_mutated",
              "backtest_executed",
              "fullrun_executed",
          )
          if (
              summary.get("schema_version")
              != "run287-sector-leadership-summary-v1"
              or summary.get("status") != status
              or summary.get("research_only") is not True
              or summary.get("review_only") is not True
              or any(summary.get(field) is not False for field in required_false)
              or str(source.get("run_id") or "") != os.environ["SOURCE_RUN_ID"]
              or str(source.get("run_attempt") or "")
              != os.environ["SOURCE_RUN_ATTEMPT"]
              or str(source.get("commit_sha") or "")
              != os.environ["SOURCE_COMMIT_SHA"]
              or str(source.get("session_date") or "")
              != os.environ["SOURCE_SESSION_DATE"]
              or str(source.get("workflow") or "")
              != os.environ["SOURCE_WORKFLOW"]
              or summary.get("contract_failures")
              != ["catchup_has_no_pit_score_snapshot"]
          ):
              raise SystemExit(
                  "catch-up research skip safety or source identity mismatch"
              )
          artifact_hashes = summary.get("artifact_hashes") or {}
          expected_hashed = required.difference({"summary.json"})
          if set(artifact_hashes) != expected_hashed:
              raise SystemExit(
                  "catch-up research skip artifact hash set mismatch"
              )
          for name in sorted(expected_hashed):
              record = artifact_hashes.get(name) or {}
              path = root / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if (
                  re.fullmatch(
                      r"[0-9a-f]{64}",
                      str(record.get("sha256") or ""),
                  )
                  is None
                  or record.get("sha256") != digest
                  or record.get("bytes") != path.stat().st_size
              ):
                  raise SystemExit(
                      f"catch-up research skip hash mismatch: {name}"
                  )
          health = json.loads(
              (root / "operation_health.json").read_text(encoding="utf-8")
          )
          expected_gates = {
              "accepted_publication_bound",
              "source_identity_bound",
              "scored_outputs_hash_bound",
              "benchmark_cache_hash_bound",
              "full_source_exact_close_coverage_100pct",
              "eligible_exact_close_coverage_100pct",
              "exact_stock_close_coverage_100pct",
              "taxonomy_coverage_at_least_98pct",
              "all_11_canonical_sectors_represented",
              "exact_spy_qqq_smh",
              "no_future_rows",
              "safe_to_review",
          }
          gates = health.get("gates") or {}
          if (
              health.get("status") != "SKIPPED"
              or health.get("challenger_status") != status
              or health.get("research_only") is not True
              or health.get("review_only") is not True
              or any(health.get(field) is not False for field in required_false)
              or set(gates) != expected_gates
              or any(gates.get(name) is not False for name in expected_gates)
              or health.get("contract_failures")
              != ["catchup_has_no_pit_score_snapshot"]
          ):
              raise SystemExit("catch-up research skip health is unsafe")
          PY

      - name: Restore exact source price cache
        id: source_cache
        if: steps.artifacts.outputs.eligible == 'yes'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            cache_prices
            cache_macro
            models
            feature_store/scored_oos_latest.parquet
            data_raw/free
            data_pit/free
            data_pit/sec
            data_pit/etf_holdings
            data_pit/macro
            manifests/free_data
          key: daily-operating-selection-${{ runner.os }}-${{ steps.source.outputs.run_id }}
          fail-on-cache-miss: true

      - name: Verify source identities and locate hash-bound inputs
        id: inputs
        if: steps.artifacts.outputs.eligible == 'yes'
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          SOURCE_COMMIT_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_WORKFLOW_PATH: ${{ steps.source.outputs.workflow_path }}
          DAILY_ARTIFACT_DIGEST: ${{ steps.artifacts.outputs.daily_digest }}
          ACCEPTED_ARTIFACT_DIGEST: ${{ steps.artifacts.outputs.accepted_digest }}
        run: |
          set -euo pipefail
          readarray -t SOURCE_ROOTS < <(
            python - <<'PY'
          import os
          from pathlib import Path

          repository_name = os.environ["GITHUB_REPOSITORY"].split("/", 1)[1]
          daily_archive = Path("inputs/source/daily")
          accepted_archive = Path("inputs/source/accepted")

          daily_candidates = (
              daily_archive,
              daily_archive / repository_name,
              daily_archive / repository_name / repository_name,
          )
          daily_matches = [
              path
              for path in daily_candidates
              if (
                  path
                  / "outputs/run287_exact_packet_upstream/attempts"
