name: Durable financial and macro history
on:
  push:
    branches: ['master']
    paths:
      - 'tools/long_history_lake.py'
      - 'tools/macro_history_sources.py'
      - 'tools/macro_technical_study.py'
      - 'tools/macro_research_cycle.py'
      - 'tools/macro_research_checkpoint.py'
      - 'tools/configure_macro_research_drive.py'
      - 'tools/research_data_access.py'
      - 'tools/run_data_freshness_contract.py'
      - 'tools/prepare_a1_reader_generation.py'
      - 'tools/alpaca_sip_private_backfill_v1.py'
      - 'tools/twelve_private_capture.py'
      - 'tools/alpaca_sip_source_revision.py'
      - 'tools/alpaca_sip_managed_refresh.py'
      - 'tools/alpaca_sip_campaign.py'
      - 'tools/prepare_a1_managed_ohlcv.py'
      - 'tools/run_daily_market_session_gate.py'
      - 'r1000_legacy_input_guard.py'
      - 'tests/research_data_access_smoke.py'
      - 'tests/a1_reader_generation_binding_smoke.py'
      - 'tests/alpaca_sip_private_backfill_v1_smoke.py'
      - 'data_static/research_dataset_registry_v1.json'
      - 'docs/research_dataset_generation_v1.schema.json'
      - 'docs/research_data_access.json'
      - 'docs/macro_indicator_registry.json'
      - 'tests/long_history_lake_smoke.py'
      - 'tests/macro_technical_evidence_smoke.py'
      - 'tests/macro_research_cycle_smoke.py'
      - 'tools/macro_survey_research.py'
      - 'tools/free_market_context.py'
      - 'tests/macro_survey_research_smoke.py'
      - 'tests/__init__.py'
      - 'docs/macro_survey_research_contract.json'
      - '.github/workflows/long_history_research.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 6 * * 2-6'
permissions:
  contents: read
  actions: read
jobs:
  history:
    # A code merge must not implicitly launch a provider collection. Existing
    # manual and scheduled producer runs keep their original execution boundary.
    if: github.repository == 'wscha231/r1000-quant-engine' && github.ref == 'refs/heads/master' && github.event_name != 'push'
    concurrency:
      group: durable-long-history-single-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/long_history_research.yml
            /tools/long_history_lake.py
            /tools/macro_history_sources.py
            /tools/macro_technical_study.py
            /tools/macro_survey_research.py
            /tools/free_market_context.py
            /tools/macro_research_cycle.py
            /tools/macro_research_checkpoint.py
            /tools/configure_macro_research_drive.py
            /tools/research_data_access.py
            /tools/run_data_freshness_contract.py
            /tools/prepare_a1_reader_generation.py
            /tools/alpaca_sip_private_backfill_v1.py
            /tools/twelve_private_capture.py
            /tools/alpaca_sip_source_revision.py
            /tools/alpaca_sip_managed_refresh.py
            /tools/alpaca_sip_campaign.py
            /tools/prepare_a1_managed_ohlcv.py
            /tools/run_daily_market_session_gate.py
            /r1000_legacy_input_guard.py
            /tests/research_data_access_smoke.py
            /tests/a1_reader_generation_binding_smoke.py
            /tests/alpaca_sip_private_backfill_v1_smoke.py
            /data_static/research_dataset_registry_v1.json
            /docs/research_dataset_generation_v1.schema.json
            /docs/research_data_access.json
            /tests/long_history_lake_smoke.py
            /tests/macro_technical_evidence_smoke.py
            /tests/macro_survey_research_smoke.py
            /tests/__init__.py
            /tests/macro_research_cycle_smoke.py
            /docs/macro_indicator_registry.json
            /docs/macro_survey_research_contract.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install 'numpy==2.2.6' 'pandas==2.3.3' 'scipy==1.15.3' 'pandas-market-calendars==5.1.1' 'PyYAML==6.0.3'
      - name: Offline regressions before source or Drive access
        run: |
          python tests/long_history_lake_smoke.py
          python tests/macro_technical_evidence_smoke.py
          python tests/macro_research_cycle_smoke.py
      - name: Install verified research transport
        env:
          MACRO_RCLONE_RELEASE: 1.75.0
          MACRO_RCLONE_SHA256: aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://downloads.rclone.org/v${MACRO_RCLONE_RELEASE}/rclone-v${MACRO_RCLONE_RELEASE}-linux-amd64.zip" -o "$RUNNER_TEMP/history-rclone.zip"
          printf '%s  %s\n' "$MACRO_RCLONE_SHA256" "$RUNNER_TEMP/history-rclone.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/history-rclone.zip" -d "$RUNNER_TEMP/history-rclone-bin"
          echo "MACRO_RCLONE_BIN=$RUNNER_TEMP/history-rclone-bin/rclone-v${MACRO_RCLONE_RELEASE}-linux-amd64/rclone" >> "$GITHUB_ENV"
      - name: Configure isolated history namespace
        env:
          # A fixed research lane shared by pilot and scheduled continuation.
          # PR413's original small macro checkpoint is a separate lane.
          MACRO_RESEARCH_LANE: scheduled
          MACRO_DRIVE_CONFIG: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
          MACRO_DRIVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MACRO_DRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_ROOT_FOLDER_ID || secrets.GDRIVE_ROOT_FOLDER_ID }}
        run: python tools/configure_macro_research_drive.py
      - name: Restore durable cohort if already archived
        id: cohort
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.long_history_lake import Lake,RcloneTransport,PREFIX,verified_cohort_source
          remote=RcloneTransport(os.environ['MACRO_RESEARCH_REMOTE'])
          remote.call('mkdir',remote.path(PREFIX+'/commits'))
          lake=Lake(remote,Path(os.environ['RUNNER_TEMP'])/'history-cohort-restore')
          old=lake.catalog['datasets'].get('universe/cohort')
          found=old is not None
          if found:
              raw,_,_=verified_cohort_source(lake)
              root=Path(os.environ['RUNNER_TEMP'])/'history-cohort'; root.mkdir(exist_ok=True)
              (root/'all_us_relative_strength.json').write_bytes(raw)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('restored='+str(found).lower()+'\n')
          PY
      - name: Bootstrap exact whole-cohort artifact once
        if: steps.cohort.outputs.restored != 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34541821739
          name: us-research-results-34541821739-1
          path: ${{ runner.temp }}/history-cohort
      - name: Collect full history, persist changes, verify clean consumption
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python tools/long_history_lake.py \
            --remote "$MACRO_RESEARCH_REMOTE" \
            --workspace "$RUNNER_TEMP/long-history" \
            --cohort "$RUNNER_TEMP/history-cohort/all_us_relative_strength.json" \
            --run-id "history-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --macro-start 1996-01-01 --financial-start 2016-01-01 \
            --report-dir "$RUNNER_TEMP/history-reports"
      - name: Publish derived diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-history-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/history-reports/
          retention-days: 30
          if-no-files-found: warn
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/macro-rclone.conf" "$RUNNER_TEMP/macro-drive-account.json"
