name: Quarterly Trade Insights

# Phase 18b (2026-04-30) — runs tools/trade_insights.py against the
# latest trade journal to produce IC-by-regime matrix + pattern
# clustering + SHAP attribution. Outputs feed Phase 18c (auto feature
# gating).

on:
  schedule:
    # 1st of Jan / Apr / Jul / Oct at 05:00 UTC = 14:00 KST
    - cron: '0 5 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      trades_path:
        description: 'override trades.parquet path'
        type: string
        default: ''
      clusters:
        description: 'k-means cluster count'
        type: string
        default: '8'

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_github.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_github.txt
          pip install "xgboost>=2.0" "scikit-learn>=1.4" shap

      - name: Locate trades.parquet
        id: locate
        run: |
          OVERRIDE="${{ github.event.inputs.trades_path }}"
          if [ -n "$OVERRIDE" ] && [ -f "$OVERRIDE" ]; then
            echo "path=$OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for p in \
            outputs/trade_journal/trades.parquet \
            cloud_results/trade_journal/trades.parquet \
            cloud_results/full/trade_journal/trades.parquet
          do
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "path=" >> "$GITHUB_OUTPUT"

      - name: Run insights
        if: steps.locate.outputs.path != ''
        run: |
          mkdir -p outputs/trade_journal/insights
          ARGS="--trades ${{ steps.locate.outputs.path }} --clusters ${{ github.event.inputs.clusters || '8' }}"
          python tools/trade_insights.py $ARGS

      - name: Telegram digest
        if: steps.locate.outputs.path != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request, pathlib
          tok = os.getenv("TELEGRAM_BOT_TOKEN")
          chat = os.getenv("TELEGRAM_CHAT_ID")
          if not (tok and chat):
              print("no telegram creds; skipping")
              raise SystemExit(0)
          p = pathlib.Path("outputs/trade_journal/insights/summary.md")
          if not p.exists():
              print("no summary; skipping")
              raise SystemExit(0)
          body = p.read_text()
          msg = "[trade-insights]\n" + body[:3500]
          url = f"https://api.telegram.org/bot{tok}/sendMessage"
          data = urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=15).read()
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-insights-${{ github.run_id }}
          path: outputs/trade_journal/insights/
          retention-days: 730

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"
          mkdir -p cloud_results/trade_journal/insights
          cp -v outputs/trade_journal/insights/* cloud_results/trade_journal/insights/ 2>/dev/null || true
          git add cloud_results/trade_journal/insights/ 2>/dev/null || true
          git diff --cached --quiet || \
            git commit -m "chore(bot): trade insights $(date +%Y-Q%q) [skip ci]"
          for i in 1 2 3 4; do
            if git push; then
              break
            fi
            sleep $((2 ** i))
          done
