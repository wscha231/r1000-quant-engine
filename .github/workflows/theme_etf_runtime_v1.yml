name: Theme ETF Runtime V1 Research Check

on:
  pull_request:
    paths:
      - 'research/theme_etf_runtime_v1/**'
      - 'tools/run_theme_etf_runtime_v1.py'
      - 'tests/theme_etf_runtime_v1_smoke.py'
      - '.github/workflows/theme_etf_runtime_v1.yml'
      - 'docs/THEME_ETF_RUNTIME_V1_20260915.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile research/theme_etf_runtime_v1/runtime.py research/theme_etf_runtime_v1/strict.py research/theme_etf_runtime_v1/__init__.py tools/run_theme_etf_runtime_v1.py tests/theme_etf_runtime_v1_smoke.py
      - name: Focused regression
        run: |
          python -W error::ResourceWarning tests/theme_etf_runtime_v1_smoke.py
          python -O -W error::ResourceWarning tests/theme_etf_runtime_v1_smoke.py
