# adr_universe.yaml — Curated top-mcap ADRs trading on NYSE/NASDAQ.
#
# Why a separate file (not themes.yaml):
#   - themes.yaml is taxonomy (one ticker can be in many themes)
#   - adr_universe.yaml is whitelist (canonical "is this ADR in our scan universe?")
#   - update cadence differs: themes change weekly, ADR list changes ~quarterly
#
# Inclusion criteria (2026-04-25 baseline):
#   - Listed on NYSE or NASDAQ as ADR (not foreign exchange — Alpaca paper requirement)
#   - Market cap >= $30B (liquidity floor)
#   - Daily price history >= 5 years (backtest viability — 84mo target)
#   - Finnhub fundamentals available (synthetic-row score path)
#
# Data path expectation (per ticker):
#   - Alpaca daily bars            ✅ all ADRs (US exchange)
#   - Finnhub fundamentals          ✅ for top-mcap ADRs
#   - SEC EDGAR companyfacts        ⚠️  may parse 20-F partially (foreign issuers
#                                       file 20-F annually + 6-K interim)
#                                   if no clean parse → ticker auto-falls into
#                                   unified_universe.py finnhub_synthetic path
#
# KNOWN LIMITATION (2026-04-27 audit):
#   The pipeline `add_core_fundamental_minimum_flags` gate (r1000_pipeline.py:477)
#   reads from CORE_FUNDAMENTAL_MINIMUM_FIELDS (revenues_ttm/op_income_ttm/
#   net_income_ttm/assets/liabilities) which are populated from SEC companyfacts,
#   NOT from the finnhub_synthetic path (r1000_unified_universe.py:170 only
#   produces forward_pe / peg / earnings_growth / sales_growth_yoy / op_margin).
#   Result: ADRs without clean SEC 20-F parsing fail the gate's full_pass and
#   fall back to partial_scout / sector_adjusted lanes — or are dropped.
#
#   This means the cloud Phase 14 SHIP run (r1000+adr universe, CAGR 23.48%)
#   may have effectively run on R1000-only when ADR companyfacts coverage was
#   poor. To get true ADR exposure, either (a) enrich finnhub_synthetic to
#   populate the CORE fields, or (b) add an `is_adr` carve-out that exempts
#   ADRs from the gate denominator. Filed as follow-up work.
#
# Future ADR watch (track listings, add when they list on US exchange):
#   - SK Hynix (Korean memory chipmaker) — expected Oct 2026 ADR listing per
#     2026-04 reporting. Add to semi_memory + adr_universe when symbol confirmed.
#   - Samsung Electronics — currently OTC pink-sheet (SSNLF), not ADR. Skip until
#     full ADR conversion (no firm timeline).
#   - Reliance Industries (India) — periodic rumors, no firm filing yet.

