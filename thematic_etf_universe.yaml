# thematic_etf_universe.yaml — curated thematic ETF top-holdings overlay
#
# Purpose:
#   Keep important small/mid-cap thematic names visible to scoring even
#   though they are outside R1000 / ADR universes. Curated from the top
#   holdings of category ETFs (QTUM for quantum, ARKX for space, ARKG for
#   genomics, etc.). Treated like leader-rescue + strategic_global_hardware
#   rows: latest-month only by default (PIT-safe under latest_only mode).
#
# Refresh policy:
#   For v1, this file is MANUAL. tools/refresh_etf_top_holdings.py (planned)
#   will rotate top-5 per ETF monthly with a 5-tier fallback (yfinance ->
#   issuer CSV -> stockanalysis -> nasdaq -> previous month). Until that
#   ships, edit by hand based on quarterly ETF holdings reviews.
#
# Inclusion criteria (curator's heuristic):
#   - Names NOT already in R1000 / adr_whitelist / strategic_global_hardware
#     (no duplicate coverage)
#   - Liquidity floor: dollar_vol_20d > $30M (engine will recheck)
#   - Multi-year structural theme exposure
#   - Avoid pure micro-cap pumps (mktcap > $500M recommended)
#
# Theme alignment:
#   Each ticker carries a primary `theme` tag matching the active themes
#   listed in themes.yaml. The short_extension_risk_penalty's structural
#   exemption will fire when theme_horizon='structural_growth' is tagged
#   on that theme.

thematic_etf_universe:
