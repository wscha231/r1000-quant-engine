# Purpose:
#   Keep important AI hardware, semiconductor, memory/storage, equipment,
#   networking, and optical candidates visible to diagnostics and latest
#   scoring. This is a universe overlay only; it is NOT a buy list and does
#   not bypass liquidity, market-cap, scoring, stale-leader, or risk gates.
#
# PIT safety:
#   Rows that enter only through this current curated overlay are treated like
#   leader-rescue rows by the backtest-mode filter. The default latest_only
#   mode keeps them out of historical OOS months; use full_proxy only for
#   explicitly biased research coverage tests.

