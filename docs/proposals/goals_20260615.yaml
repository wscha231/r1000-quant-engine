risk_register:
  - risk_id: R-1
    description: "8-year bootstrap cannot prove PIT-safe universe and price coverage back to 2018-06-12."
    likelihood: medium
    impact: high
    mitigation: "Keep all sub-8-year metrics non-official; run research A/B only with explicit label and no promotion."
  - risk_id: R-2
    description: "Bull-floor improves headline CAGR by adding OOS exposure but leaves IS-CAGR near 21%."
    likelihood: medium
    impact: high
    mitigation: "Require IS-CAGR target and OOS/IS <= 3.0x before any promotion."
  - risk_id: R-3
    description: "Era-aware challenger overfits sparse 2022 bear or 2025+ samples."
    likelihood: high
    impact: medium
    mitigation: "Keep sidecar review-only; require ChatGPT Pro methodology review before implementation in production path."
  - risk_id: R-4
    description: "Self-correction queue dispatches stale or duplicate A/Bs and wastes full rebuild budget."
    likelihood: medium
    impact: medium
    mitigation: "Add duplicate suppression and closure status before expanding auto-queue usage."
  - risk_id: R-5
    description: "Target contract drift between PR64 temporary 30/-25, 50/-28 and CLAUDE.md immutable 35/-25, 50/-25 causes inconsistent acceptance."
    likelihood: high
    impact: high
    mitigation: "Use CLAUDE.md mission targets for goal-setting; ask user/ChatGPT Pro to resolve code target constants separately."

anti_goals:
  - "Do not redefine the CLAUDE.md mission targets."
  - "Do not use full-period CAGR or OOS-only CAGR as a primary success target."
  - "Do not propose any goal without source fields, deadline, failure criteria, and fallback."
  - "Do not set production_activation_allowed=true outside an approved gate."
  - "Do not dispatch or trust any A/B without explicit portfolio_policy=alphaops_vnext_production."
  - "Do not directly edit cloud_results/performance_ledger/ledger.jsonl."
  - "Do not add live broker order automation."
  - "Do not auto-edit adr_universe.yaml from scanner output."
  - "Do not add selection, sizing, cash, or risk rules to compensate for missing data."
  - "Do not add feature columns without PHASE_*_COLUMNS and keep_cols survival tests."

acceptance_protocol:
  who_reviews:
    strategic_goals: "chatgpt_pro then user"
    tactical_goals: "chatgpt_pro advisory; user approval for workflow spend or merge"
    operational_goals: "dispatcher or Claude Code after dependencies and user approval where required"
  review_sla_hours: 48
  pr_title_required: "proposal(goals): 2026-W24/W25 targets — 8y evidence and IS-CAGR recovery"
  pr_body_must_include:
    - "KPI source field validity"
    - "current_state reproducibility from source_data_checked"
    - "automatic detection path for each failure_criteria"
    - "ChatGPT Pro review request"
  rejection_handling: >
    On rejection, Codex rewrites this YAML within 24 hours using reviewer
    feedback. Maximum two rewrite rounds; a third round escalates to the user.
  promotion_rule: >
    Tactical goal Achieved requires KPI pass and committed evidence. Strategic
    goal Achieved requires all tactical children achieved plus at least a two-run
    non-regressing official ledger streak. Mission achieved requires user
    acceptance and must not be declared by Codex.
