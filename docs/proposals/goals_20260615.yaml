mission:
  source: CLAUDE.md
  immutable: true
  targets:
    main:
      cagr: 0.35
      max_dd: -0.25
    concentrated:
      cagr: 0.50
      max_dd: -0.25
  metric_mode: broker_ledger_next_close
  window_years_required: 8.0
  primary_quality_anchor: IS-CAGR and Tier-2 strengthened gates

strategic_goals:
  - id: SG-2026Q3-01
    title: Close the IS-CAGR honesty gap without accepting OOS lottery results
    horizon: "2026-Q3 (2026-07-01 to 2026-09-30)"
    contributes_to: mission.targets
    success_kpis:
      - kpi: main_is_cagr
        baseline: 0.21451935628911056
        target: 0.28
        source: "cloud_results/performance_ledger/ledger.jsonl -> portfolios.main.is_cagr"
      - kpi: conc_is_cagr
        baseline: 0.21288533192198789
        target: 0.32
        source: "cloud_results/performance_ledger/ledger.jsonl -> portfolios.concentrated.is_cagr"
      - kpi: oos_is_ratio_main
        baseline: 3.53
        target_max: 3.0
        source: "account_evaluation official_metrics -> tier2_gates.oos_is_cagr_ratio_max"
      - kpi: oos_is_ratio_concentrated
        baseline: 6.08
        target_max: 3.0
        source: "account_evaluation official_metrics -> tier2_gates.oos_is_cagr_ratio_max"
    failure_criteria:
      - "main_is_cagr < 0.24 at 2026-Q3 end"
      - "conc_is_cagr < 0.25 at 2026-Q3 end"
      - "ledger trend REGRESSING for 3 consecutive official 8-year runs"
      - "any promoted result has OOS/IS ratio > 3.0x"
    probability_estimate: 0.50
    probability_reasoning: >
      The available evidence says the current IS engine is near 21-22%, while
      mission-level full CAGR targets need 35/50. Concentrated bull underinvestment
      in 2021 and 2023 gives a plausible sizing lever, but Main appears to need
      a selection-IC or era-model lever. The 8-year bootstrap is mechanical but
      does not by itself guarantee alpha. This is feasible only if the bull-floor
      and era-aware challenger produce IS gains, not OOS-only gains.
    dependencies:
      - TG-WK24-01
      - TG-WK24-02
      - TG-WK25-01
    decomposes_into: [TG-WK24-01, TG-WK24-02, TG-WK25-01, TG-WK25-02]

  - id: SG-2026Q3-02
    title: Turn the integrated loop into review-only, dependency-safe self-correction
    horizon: "2026-Q3 (2026-07-01 to 2026-09-30)"
    contributes_to: mission.targets
    success_kpis:
      - kpi: closed_loop_chain_count
        baseline: 2
        target: 4
        source: "SYSTEM_INTEGRATION_ANALYSIS_20260615.md + system_acceptance_audit summary"
      - kpi: queued_experiment_duplicate_rate
        baseline: null
        target_max: 0.0
        source: "outputs/self_correction_router/router_queue.json"
      - kpi: review_dispatcher_dry_run_count
        baseline: 2
        target_min: 2
        source: "outputs/review_dispatcher*/summary.json"
      - kpi: unsafe_dispatch_count
        baseline: 0
        target: 0
        source: "outputs/system_acceptance_audit/summary.json"
    failure_criteria:
      - "any workflow_dispatch command with unmet dependencies is uncommented"
      - "any self-correction dispatcher summary has execute_requested=true without user approval"
      - "production_activation_allowed=true appears without P1.2 gate evidence"
    probability_estimate: 0.70
    probability_reasoning: >
      PR64 already introduced router payload validation, dependency-blocked
      commands, and dispatcher dry-run preservation. The remaining work is mostly
      queue hygiene, duplicate suppression, and post-run closure reporting.
    dependencies:
      - TG-WK24-03
      - TG-WK25-03
    decomposes_into: [TG-WK24-03, TG-WK25-03]

tactical_goals:
  - id: TG-WK24-01
    title: Publish the bull-floor A/B verdict and next A/B decision
    horizon: "2026-W24 (2026-06-15 to 2026-06-21)"
    contributes_to: SG-2026Q3-01
    parent_dependencies: []
    success_kpis:
      - kpi: ledger_row_count
        baseline: 2
        target_min: 3
        source: "cloud_results/performance_ledger/ledger.jsonl"
      - kpi: a_b_verdict_published
        target: true
        source: "CHANGELOG.md 2026-06-15 or newer"
      - kpi: conc_is_cagr_delta_from_27498401423
        baseline: 0.0
        target_min: 0.03
        source: "ledger.portfolios.concentrated.is_cagr - 0.21288533192198789"
      - kpi: main_is_cagr_regression
        baseline: 0.21451935628911056
        target_min: 0.20451935628911055
        source: "cloud_results/performance_ledger/ledger.jsonl"
    failure_criteria:
      - "bull-floor A/B produces conc_is_cagr < 0.23"
      - "bull-floor A/B worsens main_is_cagr by more than 1.0pp"
      - "bull-floor A/B worsens either portfolio MDD below -0.28"
    probability_estimate: 0.90
    probability_reasoning: "Mostly mechanical: the run either appears in ledger or remains missing. Performance improvement probability is lower, but verdict publication probability is high."
    operational_breakdown: [OG-AB27516-READ, OG-AB27516-DECIDE]

  - id: TG-WK24-02
    title: Complete 8-year data bootstrap and official 8-year rebuild chain
    horizon: "2026-W24 (2026-06-15 to 2026-06-21)"
    contributes_to: SG-2026Q3-01
    parent_dependencies: []
    success_kpis:
      - kpi: broker_window_years
        baseline: 7.025325119780972
        target_min: 8.0
        source: "broker_replay/<portfolio>/metrics.json -> years"
      - kpi: broker_start_date
        baseline: "2019-06-03"
        target_max_date: "2018-06-12"
        source: "broker_replay/<portfolio>/metrics.json -> start_date"
      - kpi: system_acceptance_status
        baseline: missing
        target: production_evidence_ready
        source: "outputs/system_acceptance_audit/summary.json -> status"
    failure_criteria:
      - "price cache cannot provide required start date for selected target-book tickers"
      - "target-book coverage remains after 2018-06-12 after bootstrap"
      - "data_readiness reports any hard blocker for official rebuild"
    probability_estimate: 0.80
    probability_reasoning: "This is mostly deterministic data restoration, but free data PIT coverage and older universe labels can still block official evidence."
    operational_breakdown: [OG-8Y-BOOTSTRAP, OG-8Y-OFFICIAL-REBUILD]

  - id: TG-WK24-03
    title: Keep self-correction dispatcher review-only and dependency-safe
    horizon: "2026-W24 (2026-06-15 to 2026-06-21)"
    contributes_to: SG-2026Q3-02
    parent_dependencies: []
    success_kpis:
      - kpi: unsafe_self_correction_dispatcher_count
        baseline: 0
        target: 0
        source: "outputs/system_acceptance_audit/summary.json -> self_correction_router_queue.evidence"
      - kpi: dependency_bypass_count
        baseline: 0
        target: 0
        source: "outputs/review_dispatcher*/summary.json"
      - kpi: duplicate_plan_id_count
        baseline: null
        target: 0
        source: "outputs/self_correction_router/router_queue.json"
    failure_criteria:
      - "review_dispatcher_self_correction summary missing when dispatch_payload_count > 0"
      - "execute_requested=true or dispatched_count>0 in a dry-run dispatcher artifact"
