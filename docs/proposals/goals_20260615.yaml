    probability_estimate: 0.85
    probability_reasoning: "PR64 already hard-gates the core unsafe cases; duplicate and stale queue handling remains to be implemented."
    operational_breakdown: [OG-QUEUE-HEALTH]

  - id: TG-WK25-01
    title: Evaluate era-aware challenger without replacing production target books
    horizon: "2026-W25 (2026-06-22 to 2026-06-28)"
    contributes_to: SG-2026Q3-01
    parent_dependencies: [TG-WK24-02]
    success_kpis:
      - kpi: era_factor_ic_coverage
        baseline: sidecar_exists
        target: all_4_era_buckets
        source: "outputs/era_leadership/summary.json"
      - kpi: era_challenger_broker_replay_status
        baseline: review_only
        target: completed
        source: "outputs/era_aware_scoring_challenger/summary.json"
      - kpi: production_target_book_replaced_by_challenger
        baseline: false
        target: false
        source: "outputs/era_aware_scoring_challenger/summary.json -> production_activation_allowed"
    failure_criteria:
      - "challenger uses different dates, costs, universe, or portfolio_policy than baseline"
      - "challenger target books replace outputs/reports/operating_*_target_book.csv"
      - "era result lacks per-era attribution for 2019_2021, 2022, 2023_2024, and 2025_plus"
    probability_estimate: 0.65
    probability_reasoning: "The sidecar exists, but making it statistically comparable without overfitting small era buckets requires careful review."
    operational_breakdown: [OG-ERA-CHALLENGER-VERIFY]

  - id: TG-WK25-02
    title: Run dependency-gated Concentrated 50% recovery A/B set
    horizon: "2026-W25 (2026-06-22 to 2026-06-28)"
    contributes_to: SG-2026Q3-01
    parent_dependencies: [TG-WK24-02]
    success_kpis:
      - kpi: concentrated_full_cagr
        baseline: 0.4456994566932744
        target_min: 0.50
        source: "candidate account_evaluation/official_metrics.json -> portfolios.concentrated.cagr"
      - kpi: concentrated_max_dd
        baseline: -0.25878262050008727
        target_min: -0.25
        source: "candidate account_evaluation/official_metrics.json -> portfolios.concentrated.max_dd"
      - kpi: concentrated_is_cagr
        baseline: 0.21288533192198789
        target_min: 0.30
        source: "candidate account_evaluation/official_metrics.json -> portfolios.concentrated.is_cagr"
      - kpi: candidate_ab_verifier_verdict
        target: promote_candidate_review_only
        source: "tools/run_ab_result_verifier.py output"
    failure_criteria:
      - "candidate has any system_acceptance hard blocker"
      - "candidate increases OOS/IS ratio above 3.0x"
      - "candidate worsens MDD below -0.25 even if CAGR improves"
      - "candidate lacks explicit portfolio_policy=alphaops_vnext_production"
    probability_estimate: 0.45
    probability_reasoning: "The known gap is large: Concentrated needs roughly 5.4pp headline CAGR and about 8.7pp IS-CAGR improvement. Bull exposure fixes may help, but false positives from multiple A/Bs are likely."
    operational_breakdown: [OG-CONC-AB-BULL-FLOOR, OG-CONC-AB-CONTINUATION, OG-CONC-AB-THEME, OG-CONC-AB-CAP]

  - id: TG-WK25-03
    title: Add queue closure status to the self-correction loop
    horizon: "2026-W25 (2026-06-22 to 2026-06-28)"
    contributes_to: SG-2026Q3-02
    parent_dependencies: [TG-WK24-03]
    success_kpis:
      - kpi: queued_experiments_with_status
        baseline: 0
        target_ratio: 1.0
        source: "outputs/self_correction_router/router_queue.json"
      - kpi: closed_loop_chain_count
        baseline: 2
        target_min: 3
        source: "system acceptance + router closure status"
    failure_criteria:
      - "router cannot distinguish queued, dispatched, measured, rejected, and ready_for_human_review"
      - "router writes or rewrites ledger rows"
    probability_estimate: 0.75
    probability_reasoning: "This is mostly artifact bookkeeping and should not require model or data changes."
    operational_breakdown: [OG-QUEUE-CLOSURE-STATUS]

