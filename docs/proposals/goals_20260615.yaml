mission:
  source: CLAUDE.md
  immutable: true
  targets:
    main:
      cagr: 0.35
      max_dd: -0.25
    concentrated:
      cagr: 0.50
      max_dd: -0.25
  metric_mode: broker_ledger_next_close
  official_promotion_window_years_required: 8.0
  primary_quality_anchor: IS-CAGR and Tier-2 strengthened gates
  target_contract_conflict:
    status: unresolved_user_decision_required
    canonical_mission:
      main: "35% CAGR / -25% MaxDD"
      concentrated: "50% CAGR / -25% MaxDD"
    pr64_interim_operating_gate:
      main: "30% CAGR / -25% MaxDD"
      concentrated: "50% CAGR / -28% MaxDD"
    rule: "Do not mutate or describe official mission gates as changed until the user explicitly approves a target-contract change."
  evidence_caveat: "8-year coverage is an official-promotion evidence gate, not an alpha lever. Clean 7-year broker-ledger evidence may drive Alpha Plane audit/A-B research; Tier 0 evidence may not. IS-CAGR recovery must be measured separately from data-window expansion."
  evidence_tiers:
    tier0_do_not_use: "data_readiness=false, starved universe, missing official broker metric, invalid current/order preview, or legacy/proxy-only metric"
    tier1_research_7y: "clean 7-year broker_ledger_next_close, data readiness pass, universe healthy; audit/A-B only"
    tier2_operating_candidate: "Tier 1 plus stable daily refresh, valid current/target/order preview, and cash_trap=false; ready_for_human_review only"
    tier3_robust_candidate: "clean 8-year official or clean 7-year plus proxy_10y robustness pass; proxy_10y remains proxy-labelled"
    tier4_official_promotion: "8-year official or user-approved alternative evidence contract plus IS/OOS, CAGR/MDD, cash trap, and human approval"

strategic_goals:
  - id: SG-2026Q3-01
    title: Close the IS-CAGR honesty gap without accepting OOS lottery results
    horizon: "2026-Q3 (2026-07-01 to 2026-09-30)"
    contributes_to: mission.targets
    success_kpis:
      - kpi: main_is_cagr
        baseline: 0.22902418871351027
        target: 0.28
        source: "cloud_results/performance_ledger/ledger.jsonl -> portfolios.main.is_cagr"
      - kpi: conc_is_cagr
        baseline: 0.2240682162164802
        target: 0.32
        source: "cloud_results/performance_ledger/ledger.jsonl -> portfolios.concentrated.is_cagr"
      - kpi: oos_is_ratio_main
        baseline: 3.53
        target_max: 3.0
        source: "account_evaluation official_metrics -> tier2_gates.oos_is_cagr_ratio_max"
      - kpi: oos_is_ratio_concentrated
        baseline: 6.08
        target_max: 3.0
        source: "account_evaluation official_metrics -> tier2_gates.oos_is_cagr_ratio_max"
    failure_criteria:
      - "main_is_cagr < 0.24 at 2026-Q3 end"
      - "conc_is_cagr < 0.25 at 2026-Q3 end"
      - "ledger trend REGRESSING for 3 consecutive official 8-year runs"
      - "any promoted result has OOS/IS ratio > 3.0x"
    probability_estimate: 0.33
    probability_reasoning: >
      The bull-floor A/B row 27516185696 lifted Main IS-CAGR by 1.45pp and
      Concentrated IS-CAGR by 1.12pp, which is useful but not enough to close
      the mission gap. The remaining distance is about 5.10pp Main IS-CAGR and
      9.59pp Concentrated IS-CAGR, while both books still fail is_cagr_min and
      oos_is_cagr_ratio_max. A single sizing fix is therefore not a credible
      path to SG-2026Q3-01; the goal likely requires era-aware sub-model or
      leader lifecycle breakthroughs plus 8-year evidence. The probability is
      reduced from 0.50 to 0.33 until those gates are proven.
    dependencies:
      - TG-WK24-01
      - TG-WK24-02
      - TG-WK25-01
    decomposes_into: [TG-WK24-01, TG-WK24-02, TG-WK25-01, TG-WK25-02]

  - id: SG-2026Q3-02
    title: Turn the integrated loop into review-only, dependency-safe self-correction
    horizon: "2026-Q3 (2026-07-01 to 2026-09-30)"
    contributes_to: mission.targets
    success_kpis:
      - kpi: closed_loop_chain_count
        baseline: 2
        target: 4
        source: "SYSTEM_INTEGRATION_ANALYSIS_20260615.md + system_acceptance_audit summary"
      - kpi: queued_experiment_duplicate_rate
        baseline: null
        target_max: 0.0
        source: "outputs/self_correction_router/router_queue.json"
      - kpi: review_dispatcher_dry_run_count
        baseline: 2
        target_min: 2
        source: "outputs/review_dispatcher*/summary.json"
      - kpi: unsafe_dispatch_count
        baseline: 0
        target: 0
        source: "outputs/system_acceptance_audit/summary.json"
    failure_criteria:
      - "any workflow_dispatch command with unmet dependencies is uncommented"
      - "any self-correction dispatcher summary has execute_requested=true without user approval"
      - "production_activation_allowed=true appears without P1.2 gate evidence"
    probability_estimate: 0.70
    probability_reasoning: >
      PR64 already introduced router payload validation, dependency-blocked
      commands, and dispatcher dry-run preservation. The remaining work is mostly
      queue hygiene, duplicate suppression, and post-run closure reporting.
    dependencies:
      - TG-WK24-03
      - TG-WK25-03
    decomposes_into: [TG-WK24-03, TG-WK25-03]

